name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Spec and unit tests on the current Home Assistant (documents/TESTS.md)
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: pytest --cov --cov-report=term-missing --cov-fail-under=95

  # The same suites on Home Assistant 2026.6, before 2026.11 (ENT-HA-2, ENT-HA-3, tests/integration/compat)
  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/integration/compat/requirements.txt
      - run: pip install -r tests/integration/compat/requirements.txt
      - run: pytest
