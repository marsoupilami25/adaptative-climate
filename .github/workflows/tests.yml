name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Spec and unit tests on the current Home Assistant (documents/TESTS.md)
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: pytest --cov --cov-report=term-missing --cov-fail-under=95

  # The same suites on Home Assistant 2026.6, before 2026.11 (ENT-HA-2, ENT-HA-3, tests/integration/compat)
  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/integration/compat/requirements.txt
      - run: pip install -r tests/integration/compat/requirements.txt
      - run: pytest

  # The tests of the card (documents/CARD_TESTS.md), apart from those of the integration
  card:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      # What the card needs from the frontend exists in Home Assistant 2026.6 (CARD_TESTS.md §4)
      - uses: actions/cache@v4
        with:
          path: frontend/.cache
          key: ha-frontend-${{ hashFiles('frontend/ha-source.json') }}
      - run: python3 scripts/compat-scan.py
      - run: python3 tests/card/rule_coverage.py
        working-directory: .
