        swing_horizontal_modes: >
          {{ state_attr('input_select.swing_horizontal_dry_manuel', 'options')
             if is_state('input_boolean.swing_horizontal_actif_dry_manuel', 'on') else [] }}
        swing_horizontal_mode: >
          {{ states('input_select.swing_horizontal_dry_manuel')
             if is_state('input_boolean.swing_horizontal_actif_dry_manuel', 'on') else none }}
        set_temperature:
          action: input_number.set_value
          target:
            entity_id: input_number.consigne_dry_manuel
          data:
            value: "{{ temperature }}"
        set_hvac_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.mode_dry_manuel
          data:
            option: "{{ hvac_mode }}"
        set_fan_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.fan_dry_manuel
          data:
            option: "{{ fan_mode }}"
        set_swing_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.swing_dry_manuel
          data:
