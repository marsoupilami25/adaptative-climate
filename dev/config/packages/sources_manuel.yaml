      - name: ALL Virtuel (manuel)
        default_entity_id: climate.all_virtuel_manuel
        hvac_modes: '{{ ["off", "heat", "cool", "heat_cool", "auto", "dry", "fan_only"] }}'
        min_temperature: 8
        max_temperature: 32
        availability: "{{ is_state('input_boolean.dispo_all_manuel', 'on') }}"
        current_temperature: "{{ states('input_number.temperature_all_manuel') }}"
        target_temperature: "{{ states('input_number.consigne_all_manuel') }}"
        target_temperature_low: "{{ states('input_number.consigne_all_basse_manuel') }}"
        target_temperature_high: "{{ states('input_number.consigne_all_haute_manuel') }}"
        hvac_mode: "{{ states('input_select.mode_all_manuel') }}"
        hvac_action: >
          {% set m = states('input_select.mode_all_manuel') %}
          {% set t = states('input_number.temperature_all_manuel') | float(0) %}
          {% set c = states('input_number.consigne_all_manuel') | float(0) %}
          {% set lo = states('input_number.consigne_all_basse_manuel') | float(0) %}
          {% set hi = states('input_number.consigne_all_haute_manuel') | float(0) %}
          {% if m == 'off' %}off
          {% elif m == 'dry' %}drying
          {% elif m == 'fan_only' %}fan
          {% elif m == 'heat_cool' %}{{ 'heating' if t < lo else 'cooling' if t > hi else 'idle' }}
          {% elif m == 'heat' %}{{ 'heating' if t < c else 'idle' }}
          {% elif m == 'cool' %}{{ 'cooling' if t > c else 'idle' }}
          {% else %}{{ 'heating' if t < c else 'cooling' if t > c else 'idle' }}
          {% endif %}
        fan_modes: >
          {{ state_attr('input_select.fan_all_manuel', 'options')
             if is_state('input_boolean.fan_actif_all_manuel', 'on') else [] }}
