          {% set c = states('input_number.consigne_cool_manuel') | float(0) %}
          {% if is_state('input_select.mode_cool_manuel', 'off') %}off
          {% elif t > c %}cooling{% else %}idle{% endif %}
        fan_modes: >
          {{ state_attr('input_select.fan_cool_manuel', 'options')
             if is_state('input_boolean.fan_actif_cool_manuel', 'on') else [] }}
        fan_mode: >
          {{ states('input_select.fan_cool_manuel')
