# Virtual sources for the "Tests manuels" dashboard only: every entity id ends with _manuel,
# so tests on another dashboard never move these sources.
#
# Virtual source climate entities for manual tests, built with the
# Home Assistant template integration (climate platform).
#
# Each source has its own target temperature, mode, fan, swing, horizontal
# swing and "available" switch, so the dashboard shows which source receives
# each command. Fan and swings can be turned on or off on every source
# (input_boolean.fan_actif_<mode>, swing_actif_<mode>,
# swing_horizontal_actif_<mode>): when off, the source lists no option, like a
# device without them.
# Each source reads its own room temperature (input_number.temperature_<mode>_manuel),
# so the dashboard shows which source the entity reads.
# hvac_action is computed from the mode and the room vs target temperature.
#
# Option names differ between sources, to test the case-insensitive sync:
# HEAT is capitalized and has a Turbo fan speed, DRY is upper case without
# medium, the others are lower case. The first option is always auto / off.

# Each source has its own temperature range (heat 5-30, cool 16-32, dry 18-30,
# fan_only 10-35, auto 10-30, all 8-32), so ranges differ between modes.
template:
  # Room temperature sensor, for the temperature_sensor option. It has its own
  # value (input_number.temperature_capteur_manuel), apart from the room
  # temperature the sources read, to tell them apart.
  - sensor:
      - name: Capteur pièce (manuel)
        default_entity_id: sensor.capteur_piece_manuel
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: "{{ is_state('input_boolean.dispo_capteur_manuel', 'on') }}"
        state: "{{ states('input_number.temperature_capteur_manuel') }}"
  - climate:
      - name: HEAT Virtuel (manuel)
        default_entity_id: climate.heat_virtuel_manuel
        hvac_modes: '{{ ["off", "heat"] }}'
        min_temperature: 5
        max_temperature: 30
        availability: "{{ is_state('input_boolean.dispo_heat_manuel', 'on') }}"
        current_temperature: "{{ states('input_number.temperature_heat_manuel') }}"
        target_temperature: "{{ states('input_number.consigne_heat_manuel') }}"
        hvac_mode: "{{ states('input_select.mode_heat_manuel') }}"
        hvac_action: >
          {% set t = states('input_number.temperature_heat_manuel') | float(0) %}
          {% set c = states('input_number.consigne_heat_manuel') | float(0) %}
          {% if is_state('input_select.mode_heat_manuel', 'off') %}off
          {% elif t < c %}heating{% else %}idle{% endif %}
        fan_modes: >
          {{ state_attr('input_select.fan_heat_manuel', 'options')
             if is_state('input_boolean.fan_actif_heat_manuel', 'on') else [] }}
        fan_mode: >
          {{ states('input_select.fan_heat_manuel')
             if is_state('input_boolean.fan_actif_heat_manuel', 'on') else none }}
        swing_modes: >
          {{ state_attr('input_select.swing_heat_manuel', 'options')
             if is_state('input_boolean.swing_actif_heat_manuel', 'on') else [] }}
        swing_mode: >
          {{ states('input_select.swing_heat_manuel')
             if is_state('input_boolean.swing_actif_heat_manuel', 'on') else none }}
        swing_horizontal_modes: >
          {{ state_attr('input_select.swing_horizontal_heat_manuel', 'options')
             if is_state('input_boolean.swing_horizontal_actif_heat_manuel', 'on') else [] }}
        swing_horizontal_mode: >
          {{ states('input_select.swing_horizontal_heat_manuel')
             if is_state('input_boolean.swing_horizontal_actif_heat_manuel', 'on') else none }}
        set_temperature:
          action: input_number.set_value
          target:
            entity_id: input_number.consigne_heat_manuel
          data:
            value: "{{ temperature }}"
        set_hvac_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.mode_heat_manuel
          data:
            option: "{{ hvac_mode }}"
        set_fan_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.fan_heat_manuel
          data:
            option: "{{ fan_mode }}"
        set_swing_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.swing_heat_manuel
          data:
            option: "{{ swing_mode }}"
        set_swing_horizontal_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.swing_horizontal_heat_manuel
          data:
            option: "{{ swing_horizontal_mode }}"

      - name: COOL Virtuel (manuel)
        default_entity_id: climate.cool_virtuel_manuel
        hvac_modes: '{{ ["off", "cool"] }}'
        min_temperature: 16
        max_temperature: 32
        availability: "{{ is_state('input_boolean.dispo_cool_manuel', 'on') }}"
        current_temperature: "{{ states('input_number.temperature_cool_manuel') }}"
        target_temperature: "{{ states('input_number.consigne_cool_manuel') }}"
