          target:
            entity_id: input_select.swing_horizontal_cool_manuel
          data:
            option: "{{ swing_horizontal_mode }}"

      - name: DRY Virtuel (manuel)
        default_entity_id: climate.dry_virtuel_manuel
        hvac_modes: '{{ ["off", "dry"] }}'
        min_temperature: 18
        max_temperature: 30
        availability: "{{ is_state('input_boolean.dispo_dry_manuel', 'on') }}"
        current_temperature: "{{ states('input_number.temperature_dry_manuel') }}"
        target_temperature: "{{ states('input_number.consigne_dry_manuel') }}"
