      - name: FAN_ONLY Virtuel (manuel)
        default_entity_id: climate.fan_only_virtuel_manuel
        hvac_modes: '{{ ["off", "fan_only"] }}'
        min_temperature: 10
        max_temperature: 35
        availability: "{{ is_state('input_boolean.dispo_fan_only_manuel', 'on') }}"
        current_temperature: "{{ states('input_number.temperature_fan_only_manuel') }}"
        target_temperature: "{{ states('input_number.consigne_fan_only_manuel') }}"
        hvac_mode: "{{ states('input_select.mode_fan_only_manuel') }}"
        hvac_action: >
          {% if is_state('input_select.mode_fan_only_manuel', 'off') %}off{% else %}fan{% endif %}
        fan_modes: >
          {{ state_attr('input_select.fan_fan_only_manuel', 'options')
             if is_state('input_boolean.fan_actif_fan_only_manuel', 'on') else [] }}
        fan_mode: >
          {{ states('input_select.fan_fan_only_manuel')
             if is_state('input_boolean.fan_actif_fan_only_manuel', 'on') else none }}
        swing_modes: >
          {{ state_attr('input_select.swing_fan_only_manuel', 'options')
