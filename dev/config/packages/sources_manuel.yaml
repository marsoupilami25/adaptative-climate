script:
  reset_sources_test_manuel:
    alias: Réinitialiser les sources (manuel)
    icon: mdi:restore
    sequence:
      - action: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.dispo_heat_manuel
            - input_boolean.dispo_cool_manuel
            - input_boolean.dispo_dry_manuel
            - input_boolean.dispo_fan_only_manuel
            - input_boolean.dispo_auto_manuel
            - input_boolean.dispo_all_manuel
            - input_boolean.fan_actif_heat_manuel
            - input_boolean.fan_actif_cool_manuel
            - input_boolean.fan_actif_dry_manuel
            - input_boolean.fan_actif_fan_only_manuel
            - input_boolean.fan_actif_auto_manuel
            - input_boolean.fan_actif_all_manuel
            - input_boolean.swing_actif_heat_manuel
            - input_boolean.swing_actif_cool_manuel
            - input_boolean.swing_actif_dry_manuel
            - input_boolean.swing_actif_fan_only_manuel
            - input_boolean.swing_actif_auto_manuel
            - input_boolean.swing_actif_all_manuel
            - input_boolean.swing_horizontal_actif_heat_manuel
            - input_boolean.swing_horizontal_actif_cool_manuel
            - input_boolean.swing_horizontal_actif_dry_manuel
            - input_boolean.swing_horizontal_actif_fan_only_manuel
            - input_boolean.swing_horizontal_actif_auto_manuel
            - input_boolean.swing_horizontal_actif_all_manuel
      - action: input_select.select_option
        target:
          entity_id:
            - input_select.mode_heat_manuel
            - input_select.mode_cool_manuel
            - input_select.mode_dry_manuel
            - input_select.mode_fan_only_manuel
            - input_select.mode_auto_manuel
            - input_select.mode_all_manuel
        data:
          option: "off"
      - action: input_select.select_first
        target:
          entity_id:
            - input_select.fan_heat_manuel
            - input_select.fan_cool_manuel
            - input_select.fan_dry_manuel
            - input_select.fan_fan_only_manuel
            - input_select.fan_auto_manuel
            - input_select.fan_all_manuel
      - action: input_select.select_first
        target:
          entity_id:
            - input_select.swing_heat_manuel
            - input_select.swing_cool_manuel
            - input_select.swing_dry_manuel
            - input_select.swing_fan_only_manuel
            - input_select.swing_auto_manuel
            - input_select.swing_all_manuel
      - action: input_select.select_first
        target:
          entity_id:
            - input_select.swing_horizontal_heat_manuel
            - input_select.swing_horizontal_cool_manuel
            - input_select.swing_horizontal_dry_manuel
            - input_select.swing_horizontal_fan_only_manuel
            - input_select.swing_horizontal_auto_manuel
            - input_select.swing_horizontal_all_manuel
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.temperature_heat_manuel
            - input_number.temperature_cool_manuel
            - input_number.temperature_dry_manuel
            - input_number.temperature_fan_only_manuel
            - input_number.temperature_auto_manuel
            - input_number.temperature_all_manuel
        data:
          value: 20
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.consigne_heat_manuel
        data:
          value: 20
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.consigne_cool_manuel
        data:
          value: 20
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.consigne_dry_manuel
            - input_number.consigne_fan_only_manuel
            - input_number.consigne_auto_manuel
            - input_number.consigne_all_manuel
        data:
          value: 20
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.consigne_all_basse_manuel
        data:
          value: 19
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.consigne_all_haute_manuel
        data:
          value: 25
      - action: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.dispo_capteur_manuel
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.temperature_capteur_manuel
        data:
          value: 20
