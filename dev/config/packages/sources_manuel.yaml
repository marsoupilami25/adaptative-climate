             if is_state('input_boolean.fan_actif_all_manuel', 'on') else none }}
        swing_modes: >
          {{ state_attr('input_select.swing_all_manuel', 'options')
             if is_state('input_boolean.swing_actif_all_manuel', 'on') else [] }}
        swing_mode: >
          {{ states('input_select.swing_all_manuel')
             if is_state('input_boolean.swing_actif_all_manuel', 'on') else none }}
        swing_horizontal_modes: >
          {{ state_attr('input_select.swing_horizontal_all_manuel', 'options')
             if is_state('input_boolean.swing_horizontal_actif_all_manuel', 'on') else [] }}
        swing_horizontal_mode: >
          {{ states('input_select.swing_horizontal_all_manuel')
             if is_state('input_boolean.swing_horizontal_actif_all_manuel', 'on') else none }}
        # In heat_cool, HA sends target_temp_low/high instead of temperature.
        set_temperature:
          - if: "{{ temperature is not none }}"
            then:
              - action: input_number.set_value
                target:
                  entity_id: input_number.consigne_all_manuel
                data:
                  value: "{{ temperature }}"
          - if: "{{ target_temp_low is not none }}"
            then:
              - action: input_number.set_value
                target:
                  entity_id: input_number.consigne_all_basse_manuel
                data:
                  value: "{{ target_temp_low }}"
          - if: "{{ target_temp_high is not none }}"
            then:
              - action: input_number.set_value
                target:
                  entity_id: input_number.consigne_all_haute_manuel
                data:
                  value: "{{ target_temp_high }}"
        set_hvac_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.mode_all_manuel
          data:
            option: "{{ hvac_mode }}"
        set_fan_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.fan_all_manuel
          data:
            option: "{{ fan_mode }}"
        set_swing_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.swing_all_manuel
          data:
            option: "{{ swing_mode }}"
        set_swing_horizontal_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.swing_horizontal_all_manuel
          data:
            option: "{{ swing_horizontal_mode }}"

