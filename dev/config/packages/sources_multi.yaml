        hvac_action: >
          {% if is_state('input_select.mode_dry_multi', 'off') %}off{% else %}drying{% endif %}
        fan_modes: >
          {{ state_attr('input_select.fan_dry_multi', 'options')
             if is_state('input_boolean.fan_actif_dry_multi', 'on') else [] }}
        fan_mode: >
