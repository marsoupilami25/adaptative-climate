script:
  sources_indisponibles_multi:
    alias: Rendre toutes les sources indisponibles (multi)
    icon: mdi:power-plug-off
    sequence:
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.dispo_heat_multi
            - input_boolean.dispo_cool_multi
            - input_boolean.dispo_dry_multi
            - input_boolean.dispo_fan_only_multi
            - input_boolean.dispo_auto_multi

  sources_disponibles_multi:
    alias: Rendre toutes les sources disponibles (multi)
    icon: mdi:power-plug
    sequence:
      - action: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.dispo_heat_multi
            - input_boolean.dispo_cool_multi
            - input_boolean.dispo_dry_multi
            - input_boolean.dispo_fan_only_multi
            - input_boolean.dispo_auto_multi

  reset_sources_test_multi:
    alias: Réinitialiser les sources (multi)
    icon: mdi:restore
    sequence:
      - action: input_boolean.turn_off
        target:
