input_select:
  mode_heat_multi:
    name: Mode HEAT
    options: ["off", "heat"]
  mode_cool_multi:
    name: Mode COOL
    options: ["off", "cool"]
  mode_dry_multi:
    name: Mode DRY
    options: ["off", "dry"]
  mode_fan_only_multi:
    name: Mode FAN_ONLY
    options: ["off", "fan_only"]
  mode_auto_multi:
    name: Mode AUTO
    options: ["off", "auto"]
  fan_heat_multi:
    name: Fan HEAT
    options: ["Auto", "Low", "Medium", "High", "Turbo"]
  fan_cool_multi:
    name: Fan COOL
    options: ["auto", "low", "medium", "high"]
  fan_dry_multi:
    name: Fan DRY
    options: ["AUTO", "LOW", "HIGH"]
  fan_fan_only_multi:
    name: Fan FAN_ONLY
    options: ["auto", "low", "medium", "high"]
  fan_auto_multi:
    name: Fan AUTO
    options: ["auto", "low", "medium", "high"]
  swing_heat_multi:
    name: Swing HEAT
    options: ["Off", "On", "Vertical", "Horizontal", "Both"]
  swing_cool_multi:
    name: Swing COOL
    options: ["off", "on", "vertical", "horizontal", "both"]
  swing_dry_multi:
    name: Swing DRY
    options: ["off", "on", "vertical", "horizontal", "both"]
  swing_fan_only_multi:
    name: Swing FAN_ONLY
    options: ["off", "on", "vertical", "horizontal", "both"]
  swing_auto_multi:
    name: Swing AUTO
    options: ["off", "on", "vertical", "horizontal", "both"]
  swing_horizontal_heat_multi:
    name: Swing horizontal HEAT
    options: ["Off", "On", "Left", "Center", "Right", "Wide"]
  swing_horizontal_cool_multi:
    name: Swing horizontal COOL
    options: ["off", "on", "left", "center", "right", "wide"]
  swing_horizontal_dry_multi:
    name: Swing horizontal DRY
    options: ["off", "on", "left", "center", "right", "wide"]
  swing_horizontal_fan_only_multi:
    name: Swing horizontal FAN_ONLY
    options: ["off", "on", "left", "center", "right", "wide"]
  swing_horizontal_auto_multi:
