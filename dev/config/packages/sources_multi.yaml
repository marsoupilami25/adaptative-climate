# Virtual sources for the "Tests multi-sources" dashboard only: every entity id ends with _multi,
# so tests on another dashboard never move these sources.
#
# Virtual source climate entities for manual tests, built with the
# Home Assistant template integration (climate platform).
#
# Each source has its own target temperature, mode, fan, swing, horizontal
# swing and "available" switch, so the dashboard shows which source receives
# each command. Fan and swings can be turned on or off on every source
# (input_boolean.fan_actif_<mode>, swing_actif_<mode>,
# swing_horizontal_actif_<mode>): when off, the source lists no option, like a
# device without them.
# Each source reads its own room temperature (input_number.temperature_<mode>_multi),
# so the dashboard shows which source the entity reads.
# hvac_action is computed from the mode and the room vs target temperature.
#
# Option names differ between sources, to test the case-insensitive sync:
# HEAT is capitalized and has a Turbo fan speed, DRY is upper case without
# medium, the others are lower case. The first option is always auto / off.

# Each source has its own temperature range (heat 5-30, cool 16-32, dry 18-30,
# fan_only 10-35, auto 10-30, all 8-32), so ranges differ between modes.
template:
  # Room temperature sensor, for the temperature_sensor option. It has its own
  # value (input_number.temperature_capteur_multi), apart from the room
  # temperature the sources read, to tell them apart.
  - sensor:
      - name: Capteur pièce (multi)
        default_entity_id: sensor.capteur_piece_multi
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: "{{ is_state('input_boolean.dispo_capteur_multi', 'on') }}"
        state: "{{ states('input_number.temperature_capteur_multi') }}"
  - climate:
      - name: HEAT Virtuel (multi)
        default_entity_id: climate.heat_virtuel_multi
        hvac_modes: '{{ ["off", "heat"] }}'
        min_temperature: 5
        max_temperature: 30
        availability: "{{ is_state('input_boolean.dispo_heat_multi', 'on') }}"
        current_temperature: "{{ states('input_number.temperature_heat_multi') }}"
        target_temperature: "{{ states('input_number.consigne_heat_multi') }}"
        hvac_mode: "{{ states('input_select.mode_heat_multi') }}"
        hvac_action: >
          {% set t = states('input_number.temperature_heat_multi') | float(0) %}
          {% set c = states('input_number.consigne_heat_multi') | float(0) %}
          {% if is_state('input_select.mode_heat_multi', 'off') %}off
          {% elif t < c %}heating{% else %}idle{% endif %}
        fan_modes: >
          {{ state_attr('input_select.fan_heat_multi', 'options')
             if is_state('input_boolean.fan_actif_heat_multi', 'on') else [] }}
        fan_mode: >
          {{ states('input_select.fan_heat_multi')
             if is_state('input_boolean.fan_actif_heat_multi', 'on') else none }}
        swing_modes: >
          {{ state_attr('input_select.swing_heat_multi', 'options')
             if is_state('input_boolean.swing_actif_heat_multi', 'on') else [] }}
        swing_mode: >
          {{ states('input_select.swing_heat_multi')
             if is_state('input_boolean.swing_actif_heat_multi', 'on') else none }}
        swing_horizontal_modes: >
          {{ state_attr('input_select.swing_horizontal_heat_multi', 'options')
             if is_state('input_boolean.swing_horizontal_actif_heat_multi', 'on') else [] }}
        swing_horizontal_mode: >
          {{ states('input_select.swing_horizontal_heat_multi')
             if is_state('input_boolean.swing_horizontal_actif_heat_multi', 'on') else none }}
        # "Panne HEAT" on: the target is refused too (lost command).
        set_temperature:
          - if: "{{ is_state('input_boolean.panne_heat_multi', 'on') }}"
            then:
              - action: input_select.select_option
                target:
                  entity_id: input_select.mode_heat_multi
                data:
                  option: injoignable
          - action: input_number.set_value
            target:
              entity_id: input_number.consigne_heat_multi
            data:
              value: "{{ temperature }}"
        # "Panne HEAT" on: the source refuses every mode, like a device
        # that cannot be reached (an option the select does not have raises).
        set_hvac_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.mode_heat_multi
          data:
            option: >
              {{ 'injoignable' if is_state('input_boolean.panne_heat_multi', 'on')
                 else hvac_mode }}
        set_fan_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.fan_heat_multi
          data:
            option: "{{ fan_mode }}"
        set_swing_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.swing_heat_multi
          data:
            option: "{{ swing_mode }}"
        set_swing_horizontal_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.swing_horizontal_heat_multi
          data:
            option: "{{ swing_horizontal_mode }}"

      - name: COOL Virtuel (multi)
        default_entity_id: climate.cool_virtuel_multi
        hvac_modes: '{{ ["off", "cool"] }}'
        min_temperature: 16
        max_temperature: 32
        # 1 °C step (the others have none): the target sent to it is rounded.
        target_temperature_step: 1
        availability: "{{ is_state('input_boolean.dispo_cool_multi', 'on') }}"
        current_temperature: "{{ states('input_number.temperature_cool_multi') }}"
        target_temperature: "{{ states('input_number.consigne_cool_multi') }}"
        hvac_mode: "{{ states('input_select.mode_cool_multi') }}"
        hvac_action: >
          {% set t = states('input_number.temperature_cool_multi') | float(0) %}
          {% set c = states('input_number.consigne_cool_multi') | float(0) %}
          {% if is_state('input_select.mode_cool_multi', 'off') %}off
          {% elif t > c %}cooling{% else %}idle{% endif %}
        fan_modes: >
          {{ state_attr('input_select.fan_cool_multi', 'options')
             if is_state('input_boolean.fan_actif_cool_multi', 'on') else [] }}
        fan_mode: >
          {{ states('input_select.fan_cool_multi')
             if is_state('input_boolean.fan_actif_cool_multi', 'on') else none }}
        swing_modes: >
          {{ state_attr('input_select.swing_cool_multi', 'options')
             if is_state('input_boolean.swing_actif_cool_multi', 'on') else [] }}
        swing_mode: >
          {{ states('input_select.swing_cool_multi')
             if is_state('input_boolean.swing_actif_cool_multi', 'on') else none }}
        swing_horizontal_modes: >
          {{ state_attr('input_select.swing_horizontal_cool_multi', 'options')
             if is_state('input_boolean.swing_horizontal_actif_cool_multi', 'on') else [] }}
        swing_horizontal_mode: >
          {{ states('input_select.swing_horizontal_cool_multi')
             if is_state('input_boolean.swing_horizontal_actif_cool_multi', 'on') else none }}
        # "Panne COOL" on: the target is refused too (lost command).
        set_temperature:
          - if: "{{ is_state('input_boolean.panne_cool_multi', 'on') }}"
            then:
              - action: input_select.select_option
                target:
                  entity_id: input_select.mode_cool_multi
                data:
                  option: injoignable
          - action: input_number.set_value
            target:
              entity_id: input_number.consigne_cool_multi
            data:
              value: "{{ temperature }}"
        # "Panne COOL" on: the source refuses every mode, like a device
        # that cannot be reached (an option the select does not have raises).
        set_hvac_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.mode_cool_multi
          data:
            option: >
              {{ 'injoignable' if is_state('input_boolean.panne_cool_multi', 'on')
                 else hvac_mode }}
        set_fan_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.fan_cool_multi
          data:
            option: "{{ fan_mode }}"
        set_swing_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.swing_cool_multi
          data:
            option: "{{ swing_mode }}"
        set_swing_horizontal_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.swing_horizontal_cool_multi
          data:
            option: "{{ swing_horizontal_mode }}"

      - name: DRY Virtuel (multi)
        default_entity_id: climate.dry_virtuel_multi
        hvac_modes: '{{ ["off", "dry"] }}'
        min_temperature: 18
        max_temperature: 30
        availability: "{{ is_state('input_boolean.dispo_dry_multi', 'on') }}"
        current_temperature: "{{ states('input_number.temperature_dry_multi') }}"
        target_temperature: "{{ states('input_number.consigne_dry_multi') }}"
