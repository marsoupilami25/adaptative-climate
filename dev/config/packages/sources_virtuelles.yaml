          {% set c = states('input_number.consigne_cool') | float(0) %}
          {% if is_state('input_select.mode_cool', 'off') %}off
          {% elif t > c %}cooling{% else %}idle{% endif %}
        fan_modes: >
          {{ state_attr('input_select.fan_cool', 'options')
             if is_state('input_boolean.fan_actif_cool', 'on') else [] }}
        fan_mode: >
          {{ states('input_select.fan_cool')
             if is_state('input_boolean.fan_actif_cool', 'on') else none }}
        swing_modes: >
          {{ state_attr('input_select.swing_cool', 'options')
             if is_state('input_boolean.swing_actif_cool', 'on') else [] }}
        swing_mode: >
          {{ states('input_select.swing_cool')
             if is_state('input_boolean.swing_actif_cool', 'on') else none }}
        swing_horizontal_modes: >
          {{ state_attr('input_select.swing_horizontal_cool', 'options')
