        swing_horizontal_mode: >
          {{ states('input_select.swing_horizontal_cool')
             if is_state('input_boolean.swing_horizontal_actif_cool', 'on') else none }}
        set_temperature:
          action: input_number.set_value
          target:
            entity_id: input_number.consigne_cool
          data:
            value: "{{ temperature }}"
        set_hvac_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.mode_cool
          data:
            option: "{{ hvac_mode }}"
        set_fan_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.fan_cool
          data:
            option: "{{ fan_mode }}"
        set_swing_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.swing_cool
          data:
            option: "{{ swing_mode }}"
        set_swing_horizontal_mode:
