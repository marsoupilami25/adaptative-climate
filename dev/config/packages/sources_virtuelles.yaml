        hvac_modes: '{{ ["off", "dry"] }}'
        min_temperature: 0
        max_temperature: 50
        availability: "{{ is_state('input_boolean.dispo_dry', 'on') }}"
        current_temperature: "{{ states('input_number.temperature_courante') }}"
        target_temperature: "{{ states('input_number.consigne_dry') }}"
        hvac_mode: "{{ states('input_select.mode_dry') }}"
        hvac_action: >
          {% if is_state('input_select.mode_dry', 'off') %}off{% else %}drying{% endif %}
        fan_modes: >
          {{ state_attr('input_select.fan_dry', 'options')
             if is_state('input_boolean.fan_actif_dry', 'on') else [] }}
        fan_mode: >
          {{ states('input_select.fan_dry')
             if is_state('input_boolean.fan_actif_dry', 'on') else none }}
        swing_modes: >
          {{ state_attr('input_select.swing_dry', 'options')
             if is_state('input_boolean.swing_actif_dry', 'on') else [] }}
        swing_mode: >
          {{ states('input_select.swing_dry')
             if is_state('input_boolean.swing_actif_dry', 'on') else none }}
        swing_horizontal_modes: >
          {{ state_attr('input_select.swing_horizontal_dry', 'options')
             if is_state('input_boolean.swing_horizontal_actif_dry', 'on') else [] }}
        swing_horizontal_mode: >
          {{ states('input_select.swing_horizontal_dry')
             if is_state('input_boolean.swing_horizontal_actif_dry', 'on') else none }}
        set_temperature:
          action: input_number.set_value
          target:
            entity_id: input_number.consigne_dry
          data:
            value: "{{ temperature }}"
        set_hvac_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.mode_dry
          data:
            option: "{{ hvac_mode }}"
        set_fan_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.fan_dry
          data:
            option: "{{ fan_mode }}"
        set_swing_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.swing_dry
          data:
            option: "{{ swing_mode }}"
        set_swing_horizontal_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.swing_horizontal_dry
          data:
            option: "{{ swing_horizontal_mode }}"

      - name: FAN_ONLY Virtuel
        default_entity_id: climate.fan_only_virtuel
        hvac_modes: '{{ ["off", "fan_only"] }}'
        min_temperature: 0
        max_temperature: 50
        availability: "{{ is_state('input_boolean.dispo_fan_only', 'on') }}"
        current_temperature: "{{ states('input_number.temperature_courante') }}"
        target_temperature: "{{ states('input_number.consigne_fan_only') }}"
        hvac_mode: "{{ states('input_select.mode_fan_only') }}"
        hvac_action: >
          {% if is_state('input_select.mode_fan_only', 'off') %}off{% else %}fan{% endif %}
        fan_modes: >
          {{ state_attr('input_select.fan_fan_only', 'options')
             if is_state('input_boolean.fan_actif_fan_only', 'on') else [] }}
        fan_mode: >
          {{ states('input_select.fan_fan_only')
             if is_state('input_boolean.fan_actif_fan_only', 'on') else none }}
        swing_modes: >
          {{ state_attr('input_select.swing_fan_only', 'options')
             if is_state('input_boolean.swing_actif_fan_only', 'on') else [] }}
        swing_mode: >
          {{ states('input_select.swing_fan_only')
             if is_state('input_boolean.swing_actif_fan_only', 'on') else none }}
        swing_horizontal_modes: >
          {{ state_attr('input_select.swing_horizontal_fan_only', 'options')
             if is_state('input_boolean.swing_horizontal_actif_fan_only', 'on') else [] }}
        swing_horizontal_mode: >
          {{ states('input_select.swing_horizontal_fan_only')
             if is_state('input_boolean.swing_horizontal_actif_fan_only', 'on') else none }}
        set_temperature:
          action: input_number.set_value
          target:
            entity_id: input_number.consigne_fan_only
          data:
            value: "{{ temperature }}"
        set_hvac_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.mode_fan_only
          data:
            option: "{{ hvac_mode }}"
        set_fan_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.fan_fan_only
          data:
            option: "{{ fan_mode }}"
        set_swing_mode:
          action: input_select.select_option
          target:
