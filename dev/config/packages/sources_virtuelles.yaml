          target:
            entity_id: input_select.fan_auto
          data:
            option: "{{ fan_mode }}"
        set_swing_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.swing_auto
          data:
            option: "{{ swing_mode }}"
        set_swing_horizontal_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.swing_horizontal_auto
          data:
            option: "{{ swing_horizontal_mode }}"

      # One source for every mode, to test a source shared by several modes.
      - name: ALL Virtuel
        default_entity_id: climate.all_virtuel
        hvac_modes: '{{ ["off", "heat", "cool", "heat_cool", "auto", "dry", "fan_only"] }}'
        min_temperature: 0
        max_temperature: 50
        availability: "{{ is_state('input_boolean.dispo_all', 'on') }}"
        current_temperature: "{{ states('input_number.temperature_courante') }}"
        target_temperature: "{{ states('input_number.consigne_all') }}"
        target_temperature_low: "{{ states('input_number.consigne_all_basse') }}"
        target_temperature_high: "{{ states('input_number.consigne_all_haute') }}"
        hvac_mode: "{{ states('input_select.mode_all') }}"
        hvac_action: >
          {% set m = states('input_select.mode_all') %}
          {% set t = states('input_number.temperature_courante') | float(0) %}
          {% set c = states('input_number.consigne_all') | float(0) %}
          {% set lo = states('input_number.consigne_all_basse') | float(0) %}
          {% set hi = states('input_number.consigne_all_haute') | float(0) %}
          {% if m == 'off' %}off
          {% elif m == 'dry' %}drying
          {% elif m == 'fan_only' %}fan
          {% elif m == 'heat_cool' %}{{ 'heating' if t < lo else 'cooling' if t > hi else 'idle' }}
          {% elif m == 'heat' %}{{ 'heating' if t < c else 'idle' }}
          {% elif m == 'cool' %}{{ 'cooling' if t > c else 'idle' }}
          {% else %}{{ 'heating' if t < c else 'cooling' if t > c else 'idle' }}
          {% endif %}
        fan_modes: >
          {{ state_attr('input_select.fan_all', 'options')
             if is_state('input_boolean.fan_actif_all', 'on') else [] }}
        fan_mode: >
          {{ states('input_select.fan_all')
             if is_state('input_boolean.fan_actif_all', 'on') else none }}
        swing_modes: >
          {{ state_attr('input_select.swing_all', 'options')
             if is_state('input_boolean.swing_actif_all', 'on') else [] }}
        swing_mode: >
          {{ states('input_select.swing_all')
             if is_state('input_boolean.swing_actif_all', 'on') else none }}
        swing_horizontal_modes: >
          {{ state_attr('input_select.swing_horizontal_all', 'options')
             if is_state('input_boolean.swing_horizontal_actif_all', 'on') else [] }}
        swing_horizontal_mode: >
          {{ states('input_select.swing_horizontal_all')
             if is_state('input_boolean.swing_horizontal_actif_all', 'on') else none }}
        # In heat_cool, HA sends target_temp_low/high instead of temperature.
        set_temperature:
          - if: "{{ temperature is not none }}"
            then:
              - action: input_number.set_value
                target:
                  entity_id: input_number.consigne_all
                data:
                  value: "{{ temperature }}"
          - if: "{{ target_temp_low is not none }}"
            then:
              - action: input_number.set_value
                target:
                  entity_id: input_number.consigne_all_basse
                data:
                  value: "{{ target_temp_low }}"
          - if: "{{ target_temp_high is not none }}"
            then:
              - action: input_number.set_value
                target:
                  entity_id: input_number.consigne_all_haute
                data:
                  value: "{{ target_temp_high }}"
        set_hvac_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.mode_all
          data:
            option: "{{ hvac_mode }}"
        set_fan_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.fan_all
          data:
            option: "{{ fan_mode }}"
        set_swing_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.swing_all
          data:
            option: "{{ swing_mode }}"
        set_swing_horizontal_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.swing_horizontal_all
          data:
            option: "{{ swing_horizontal_mode }}"

input_select:
  mode_heat:
    name: Mode HEAT
    options: ["off", "heat"]
  mode_cool:
    name: Mode COOL
    options: ["off", "cool"]
  mode_dry:
    name: Mode DRY
    options: ["off", "dry"]
  mode_fan_only:
    name: Mode FAN_ONLY
    options: ["off", "fan_only"]
  mode_auto:
    name: Mode AUTO
    options: ["off", "auto"]
  mode_all:
    name: Mode ALL
    options: ["off", "heat", "cool", "heat_cool", "auto", "dry", "fan_only"]

  fan_heat:
    name: Fan HEAT
    options: &fan_modes ["auto", "low", "medium", "high"]
  fan_cool:
    name: Fan COOL
    options: *fan_modes
  fan_dry:
    name: Fan DRY
    options: *fan_modes
  fan_fan_only:
    name: Fan FAN_ONLY
    options: *fan_modes
  fan_auto:
    name: Fan AUTO
    options: *fan_modes
  fan_all:
    name: Fan ALL
    options: *fan_modes

  swing_heat:
    name: Swing HEAT
    options: &swing_modes ["off", "on", "vertical", "horizontal", "both"]
  swing_cool:
    name: Swing COOL
    options: *swing_modes
  swing_dry:
    name: Swing DRY
    options: *swing_modes
  swing_fan_only:
    name: Swing FAN_ONLY
    options: *swing_modes
  swing_auto:
    name: Swing AUTO
    options: *swing_modes
  swing_all:
    name: Swing ALL
    options: *swing_modes

  swing_horizontal_heat:
    name: Swing horizontal HEAT
    options: &swing_horizontal_modes ["off", "on", "left", "center", "right", "wide"]
  swing_horizontal_cool:
    name: Swing horizontal COOL
    options: *swing_horizontal_modes
  swing_horizontal_dry:
    name: Swing horizontal DRY
    options: *swing_horizontal_modes
  swing_horizontal_fan_only:
    name: Swing horizontal FAN_ONLY
    options: *swing_horizontal_modes
  swing_horizontal_auto:
    name: Swing horizontal AUTO
    options: *swing_horizontal_modes
  swing_horizontal_all:
    name: Swing horizontal ALL
    options: *swing_horizontal_modes

