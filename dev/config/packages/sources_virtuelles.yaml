        set_swing_horizontal_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.swing_horizontal_fan_only
          data:
            option: "{{ swing_horizontal_mode }}"

      - name: AUTO Virtuel
        default_entity_id: climate.auto_virtuel
        hvac_modes: '{{ ["off", "auto"] }}'
        min_temperature: 0
        max_temperature: 50
        availability: "{{ is_state('input_boolean.dispo_auto', 'on') }}"
        current_temperature: "{{ states('input_number.temperature_courante') }}"
        target_temperature: "{{ states('input_number.consigne_auto') }}"
        hvac_mode: "{{ states('input_select.mode_auto') }}"
        hvac_action: >
          {% set t = states('input_number.temperature_courante') | float(0) %}
          {% set c = states('input_number.consigne_auto') | float(0) %}
          {% if is_state('input_select.mode_auto', 'off') %}off
          {% elif t < c %}heating{% elif t > c %}cooling{% else %}idle{% endif %}
        fan_modes: >
          {{ state_attr('input_select.fan_auto', 'options')
             if is_state('input_boolean.fan_actif_auto', 'on') else [] }}
        fan_mode: >
          {{ states('input_select.fan_auto')
             if is_state('input_boolean.fan_actif_auto', 'on') else none }}
        swing_modes: >
          {{ state_attr('input_select.swing_auto', 'options')
             if is_state('input_boolean.swing_actif_auto', 'on') else [] }}
        swing_mode: >
          {{ states('input_select.swing_auto')
             if is_state('input_boolean.swing_actif_auto', 'on') else none }}
        swing_horizontal_modes: >
          {{ state_attr('input_select.swing_horizontal_auto', 'options')
             if is_state('input_boolean.swing_horizontal_actif_auto', 'on') else [] }}
        swing_horizontal_mode: >
          {{ states('input_select.swing_horizontal_auto')
             if is_state('input_boolean.swing_horizontal_actif_auto', 'on') else none }}
        set_temperature:
          action: input_number.set_value
          target:
            entity_id: input_number.consigne_auto
