# Virtual source climate entities for manual tests, built with the
# Home Assistant template integration (climate platform).
#
# Each source has its own target temperature, mode, fan, swing, horizontal
# swing and "available" switch, so the dashboard shows which source receives
# each command. Fan and swings can be turned on or off on every source
# (input_boolean.fan_actif_<mode>, swing_actif_<mode>,
# swing_horizontal_actif_<mode>): when off, the source lists no option, like a
# device without them.
# All sources read the same room temperature (input_number.temperature_courante).
# hvac_action is computed from the mode and the room vs target temperature.

template:
  - climate:
      - name: HEAT Virtuel
        default_entity_id: climate.heat_virtuel
        hvac_modes: '{{ ["off", "heat"] }}'
        min_temperature: 0
        max_temperature: 50
        availability: "{{ is_state('input_boolean.dispo_heat', 'on') }}"
        current_temperature: "{{ states('input_number.temperature_courante') }}"
        target_temperature: "{{ states('input_number.consigne_heat') }}"
        hvac_mode: "{{ states('input_select.mode_heat') }}"
        hvac_action: >
          {% set t = states('input_number.temperature_courante') | float(0) %}
          {% set c = states('input_number.consigne_heat') | float(0) %}
          {% if is_state('input_select.mode_heat', 'off') %}off
          {% elif t < c %}heating{% else %}idle{% endif %}
        fan_modes: >
          {{ state_attr('input_select.fan_heat', 'options')
             if is_state('input_boolean.fan_actif_heat', 'on') else [] }}
        fan_mode: >
          {{ states('input_select.fan_heat')
             if is_state('input_boolean.fan_actif_heat', 'on') else none }}
        swing_modes: >
          {{ state_attr('input_select.swing_heat', 'options')
             if is_state('input_boolean.swing_actif_heat', 'on') else [] }}
        swing_mode: >
          {{ states('input_select.swing_heat')
             if is_state('input_boolean.swing_actif_heat', 'on') else none }}
        swing_horizontal_modes: >
          {{ state_attr('input_select.swing_horizontal_heat', 'options')
             if is_state('input_boolean.swing_horizontal_actif_heat', 'on') else [] }}
        swing_horizontal_mode: >
          {{ states('input_select.swing_horizontal_heat')
             if is_state('input_boolean.swing_horizontal_actif_heat', 'on') else none }}
        set_temperature:
          action: input_number.set_value
          target:
            entity_id: input_number.consigne_heat
          data:
            value: "{{ temperature }}"
        set_hvac_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.mode_heat
          data:
            option: "{{ hvac_mode }}"
        set_fan_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.fan_heat
          data:
            option: "{{ fan_mode }}"
        set_swing_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.swing_heat
          data:
            option: "{{ swing_mode }}"
        set_swing_horizontal_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.swing_horizontal_heat
          data:
            option: "{{ swing_horizontal_mode }}"

