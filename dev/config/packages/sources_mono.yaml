          {% if is_state('input_select.mode_clim_mono', 'off') %}off
          {% elif t > c %}cooling{% else %}idle{% endif %}
        fan_modes: "{{ state_attr('input_select.fan_clim_mono', 'options') }}"
        fan_mode: "{{ states('input_select.fan_clim_mono') }}"
        set_temperature:
          action: input_number.set_value
          target:
            entity_id: input_number.consigne_clim_mono
          data:
            value: "{{ temperature }}"
        set_hvac_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.mode_clim_mono
          data:
            option: "{{ hvac_mode }}"
        set_fan_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.fan_clim_mono
          data:
            option: "{{ fan_mode }}"

input_select:
  mode_heat_cool_mono:
    name: Mode HEAT_COOL
    options: ["off", "heat_cool"]
  mode_radiateur_mono:
    name: Mode RADIATEUR
    options: ["off", "heat"]
  mode_clim_mono:
    name: Mode CLIM
    options: ["off", "cool"]
  fan_clim_mono:
    name: Fan CLIM
    options: ["auto", "low", "high"]
  mode_heat_mono:
    name: Mode HEAT
    options: ["off", "heat"]
  mode_cool_mono:
    name: Mode COOL
    options: ["off", "cool"]
  mode_dry_mono:
    name: Mode DRY
    options: ["off", "dry"]
  mode_fan_only_mono:
    name: Mode FAN_ONLY
    options: ["off", "fan_only"]
  mode_auto_mono:
    name: Mode AUTO
    options: ["off", "auto"]
  fan_heat_mono:
    name: Fan HEAT
    options: ["auto", "low", "medium", "high"]
  fan_cool_mono:
    name: Fan COOL
    options: ["auto", "low", "medium", "high"]
  fan_dry_mono:
    name: Fan DRY
    options: ["auto", "low", "medium", "high"]
  fan_fan_only_mono:
