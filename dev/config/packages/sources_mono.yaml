          target:
            entity_id: input_select.swing_cool_mono
          data:
            option: "{{ swing_mode }}"
        set_swing_horizontal_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.swing_horizontal_cool_mono
          data:
            option: "{{ swing_horizontal_mode }}"

      - name: DRY Virtuel (mono)
