        set_hvac_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.mode_fan_only_mono
          data:
            option: "{{ hvac_mode }}"
        set_fan_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.fan_fan_only_mono
          data:
            option: "{{ fan_mode }}"
        set_swing_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.swing_fan_only_mono
          data:
            option: "{{ swing_mode }}"
        set_swing_horizontal_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.swing_horizontal_fan_only_mono
          data:
            option: "{{ swing_horizontal_mode }}"

      - name: AUTO Virtuel (mono)
        default_entity_id: climate.auto_virtuel_mono
        hvac_modes: '{{ ["off", "auto"] }}'
        min_temperature: 10
        max_temperature: 30
        availability: "{{ is_state('input_boolean.dispo_auto_mono', 'on') }}"
        current_temperature: "{{ states('input_number.temperature_courante_mono') }}"
        target_temperature: "{{ states('input_number.consigne_auto_mono') }}"
        hvac_mode: "{{ states('input_select.mode_auto_mono') }}"
        hvac_action: >
          {% set t = states('input_number.temperature_courante_mono') | float(0) %}
          {% set c = states('input_number.consigne_auto_mono') | float(0) %}
          {% if is_state('input_select.mode_auto_mono', 'off') %}off
          {% elif t < c %}heating{% elif t > c %}cooling{% else %}idle{% endif %}
        fan_modes: >
          {{ state_attr('input_select.fan_auto_mono', 'options')
             if is_state('input_boolean.fan_actif_auto_mono', 'on') else [] }}
        fan_mode: >
          {{ states('input_select.fan_auto_mono')
             if is_state('input_boolean.fan_actif_auto_mono', 'on') else none }}
        swing_modes: >
          {{ state_attr('input_select.swing_auto_mono', 'options')
             if is_state('input_boolean.swing_actif_auto_mono', 'on') else [] }}
        swing_mode: >
          {{ states('input_select.swing_auto_mono')
             if is_state('input_boolean.swing_actif_auto_mono', 'on') else none }}
        swing_horizontal_modes: >
          {{ state_attr('input_select.swing_horizontal_auto_mono', 'options')
             if is_state('input_boolean.swing_horizontal_actif_auto_mono', 'on') else [] }}
        swing_horizontal_mode: >
          {{ states('input_select.swing_horizontal_auto_mono')
             if is_state('input_boolean.swing_horizontal_actif_auto_mono', 'on') else none }}
        set_temperature:
          action: input_number.set_value
          target:
            entity_id: input_number.consigne_auto_mono
          data:
            value: "{{ temperature }}"
        set_hvac_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.mode_auto_mono
          data:
            option: "{{ hvac_mode }}"
        set_fan_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.fan_auto_mono
          data:
            option: "{{ fan_mode }}"
        set_swing_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.swing_auto_mono
          data:
            option: "{{ swing_mode }}"
        set_swing_horizontal_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.swing_horizontal_auto_mono
          data:
            option: "{{ swing_horizontal_mode }}"

      # heat_cool source of Adaptative HEAT_COOL: low/high targets only, 10-30 °C.
      - name: HEAT_COOL Virtuel (mono)
        default_entity_id: climate.heat_cool_virtuel_mono
        hvac_modes: '{{ ["off", "heat_cool"] }}'
        min_temperature: 10
        max_temperature: 30
        availability: "{{ is_state('input_boolean.dispo_heat_cool_mono', 'on') }}"
        current_temperature: "{{ states('input_number.temperature_courante_mono') }}"
        target_temperature_low: "{{ states('input_number.consigne_heat_cool_basse_mono') }}"
        target_temperature_high: "{{ states('input_number.consigne_heat_cool_haute_mono') }}"
        hvac_mode: "{{ states('input_select.mode_heat_cool_mono') }}"
        hvac_action: >
          {% set t = states('input_number.temperature_courante_mono') | float(0) %}
          {% set lo = states('input_number.consigne_heat_cool_basse_mono') | float(0) %}
          {% set hi = states('input_number.consigne_heat_cool_haute_mono') | float(0) %}
          {% if is_state('input_select.mode_heat_cool_mono', 'off') %}off
          {% elif t < lo %}heating{% elif t > hi %}cooling{% else %}idle{% endif %}
        set_temperature:
          - if: "{{ target_temp_low is not none }}"
            then:
              - action: input_number.set_value
                target:
                  entity_id: input_number.consigne_heat_cool_basse_mono
                data:
                  value: "{{ target_temp_low }}"
          - if: "{{ target_temp_high is not none }}"
            then:
              - action: input_number.set_value
                target:
                  entity_id: input_number.consigne_heat_cool_haute_mono
                data:
                  value: "{{ target_temp_high }}"
        set_hvac_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.mode_heat_cool_mono
          data:
            option: "{{ hvac_mode }}"

      # Heat and cool sources of Adaptative COMBINE (heat_cool without its own
      # source), apart from HEAT/COOL Virtuel so the other views do not move.
      - name: RADIATEUR Virtuel (mono)
        default_entity_id: climate.radiateur_virtuel_mono
        hvac_modes: '{{ ["off", "heat"] }}'
        min_temperature: 5
        max_temperature: 30
