# Virtual sources for the "Tests mono-mode" dashboard only: every entity id ends with _mono,
# so tests on another dashboard never move these sources.
#
# Virtual source climate entities for manual tests, built with the
# Home Assistant template integration (climate platform).
#
# Each source has its own target temperature, mode, fan, swing, horizontal
# swing and "available" switch, so the dashboard shows which source receives
# each command. Fan and swings can be turned on or off on every source
# (input_boolean.fan_actif_<mode>, swing_actif_<mode>,
# swing_horizontal_actif_<mode>): when off, the source lists no option, like a
# device without them.
# All sources read the same room temperature (input_number.temperature_courante_mono).
# Except RADIATEUR and CLIM, which read their own (input_number.temperature_<source>_mono).
# hvac_action is computed from the mode and the room vs target temperature.

# Each source has its own temperature range (heat 5-30, cool 16-32, dry 18-30,
# fan_only 10-35, auto 10-30, all 8-32), so ranges differ between modes.
template:
  - climate:
      - name: HEAT Virtuel (mono)
        default_entity_id: climate.heat_virtuel_mono
        hvac_modes: '{{ ["off", "heat"] }}'
        min_temperature: 5
        max_temperature: 30
        availability: "{{ is_state('input_boolean.dispo_heat_mono', 'on') }}"
        current_temperature: "{{ states('input_number.temperature_courante_mono') }}"
        target_temperature: "{{ states('input_number.consigne_heat_mono') }}"
        hvac_mode: "{{ states('input_select.mode_heat_mono') }}"
        hvac_action: >
          {% set t = states('input_number.temperature_courante_mono') | float(0) %}
          {% set c = states('input_number.consigne_heat_mono') | float(0) %}
          {% if is_state('input_select.mode_heat_mono', 'off') %}off
          {% elif t < c %}heating{% else %}idle{% endif %}
        fan_modes: >
          {{ state_attr('input_select.fan_heat_mono', 'options')
             if is_state('input_boolean.fan_actif_heat_mono', 'on') else [] }}
        fan_mode: >
          {{ states('input_select.fan_heat_mono')
             if is_state('input_boolean.fan_actif_heat_mono', 'on') else none }}
        swing_modes: >
          {{ state_attr('input_select.swing_heat_mono', 'options')
             if is_state('input_boolean.swing_actif_heat_mono', 'on') else [] }}
        swing_mode: >
          {{ states('input_select.swing_heat_mono')
             if is_state('input_boolean.swing_actif_heat_mono', 'on') else none }}
        swing_horizontal_modes: >
          {{ state_attr('input_select.swing_horizontal_heat_mono', 'options')
             if is_state('input_boolean.swing_horizontal_actif_heat_mono', 'on') else [] }}
        swing_horizontal_mode: >
          {{ states('input_select.swing_horizontal_heat_mono')
             if is_state('input_boolean.swing_horizontal_actif_heat_mono', 'on') else none }}
        set_temperature:
          action: input_number.set_value
          target:
            entity_id: input_number.consigne_heat_mono
          data:
            value: "{{ temperature }}"
        set_hvac_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.mode_heat_mono
          data:
            option: "{{ hvac_mode }}"
        set_fan_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.fan_heat_mono
          data:
            option: "{{ fan_mode }}"
        set_swing_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.swing_heat_mono
          data:
            option: "{{ swing_mode }}"
        set_swing_horizontal_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.swing_horizontal_heat_mono
          data:
            option: "{{ swing_horizontal_mode }}"

      - name: COOL Virtuel (mono)
