        hvac_modes: '{{ ["off", "dry"] }}'
        min_temperature: 18
        max_temperature: 30
        availability: "{{ is_state('input_boolean.dispo_dry_mono', 'on') }}"
        current_temperature: "{{ states('input_number.temperature_courante_mono') }}"
        target_temperature: "{{ states('input_number.consigne_dry_mono') }}"
