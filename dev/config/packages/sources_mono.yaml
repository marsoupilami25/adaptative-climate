    options: ["auto", "low", "medium", "high"]
  swing_heat_mono:
    name: Swing HEAT
    options: ["off", "on", "vertical", "horizontal", "both"]
  swing_cool_mono:
    name: Swing COOL
    options: ["off", "on", "vertical", "horizontal", "both"]
  swing_dry_mono:
    name: Swing DRY
    options: ["off", "on", "vertical", "horizontal", "both"]
  swing_fan_only_mono:
    name: Swing FAN_ONLY
    options: ["off", "on", "vertical", "horizontal", "both"]
  swing_auto_mono:
    name: Swing AUTO
    options: ["off", "on", "vertical", "horizontal", "both"]
  swing_horizontal_heat_mono:
    name: Swing horizontal HEAT
    options: ["off", "on", "left", "center", "right", "wide"]
  swing_horizontal_cool_mono:
    name: Swing horizontal COOL
    options: ["off", "on", "left", "center", "right", "wide"]
  swing_horizontal_dry_mono:
    name: Swing horizontal DRY
    options: ["off", "on", "left", "center", "right", "wide"]
  swing_horizontal_fan_only_mono:
    name: Swing horizontal FAN_ONLY
    options: ["off", "on", "left", "center", "right", "wide"]
  swing_horizontal_auto_mono:
    name: Swing horizontal AUTO
    options: ["off", "on", "left", "center", "right", "wide"]

