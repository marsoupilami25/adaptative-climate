            entity_id: input_number.consigne_radiateur_mono
          data:
            value: "{{ temperature }}"
        set_hvac_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.mode_radiateur_mono
          data:
            option: "{{ hvac_mode }}"

      # 16-32 °C with a 1 °C step and a fan.
      - name: CLIM Virtuel (mono)
        default_entity_id: climate.clim_virtuel_mono
        hvac_modes: '{{ ["off", "cool"] }}'
        min_temperature: 16
        max_temperature: 32
        target_temperature_step: 1
        availability: "{{ is_state('input_boolean.dispo_clim_mono', 'on') }}"
        current_temperature: "{{ states('input_number.temperature_clim_mono') }}"
        target_temperature: "{{ states('input_number.consigne_clim_mono') }}"
        hvac_mode: "{{ states('input_select.mode_clim_mono') }}"
        hvac_action: >
          {% set t = states('input_number.temperature_clim_mono') | float(0) %}
