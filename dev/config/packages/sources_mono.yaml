        hvac_action: >
          {% if is_state('input_select.mode_dry_mono', 'off') %}off{% else %}drying{% endif %}
        fan_modes: >
          {{ state_attr('input_select.fan_dry_mono', 'options')
             if is_state('input_boolean.fan_actif_dry_mono', 'on') else [] }}
        fan_mode: >
          {{ states('input_select.fan_dry_mono')
             if is_state('input_boolean.fan_actif_dry_mono', 'on') else none }}
        swing_modes: >
          {{ state_attr('input_select.swing_dry_mono', 'options')
             if is_state('input_boolean.swing_actif_dry_mono', 'on') else [] }}
        swing_mode: >
          {{ states('input_select.swing_dry_mono')
             if is_state('input_boolean.swing_actif_dry_mono', 'on') else none }}
        swing_horizontal_modes: >
          {{ state_attr('input_select.swing_horizontal_dry_mono', 'options')
             if is_state('input_boolean.swing_horizontal_actif_dry_mono', 'on') else [] }}
        swing_horizontal_mode: >
          {{ states('input_select.swing_horizontal_dry_mono')
             if is_state('input_boolean.swing_horizontal_actif_dry_mono', 'on') else none }}
        set_temperature:
          action: input_number.set_value
          target:
            entity_id: input_number.consigne_dry_mono
          data:
            value: "{{ temperature }}"
        set_hvac_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.mode_dry_mono
          data:
            option: "{{ hvac_mode }}"
        set_fan_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.fan_dry_mono
          data:
            option: "{{ fan_mode }}"
        set_swing_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.swing_dry_mono
          data:
            option: "{{ swing_mode }}"
        set_swing_horizontal_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.swing_horizontal_dry_mono
          data:
            option: "{{ swing_horizontal_mode }}"

      - name: FAN_ONLY Virtuel (mono)
        default_entity_id: climate.fan_only_virtuel_mono
        hvac_modes: '{{ ["off", "fan_only"] }}'
        min_temperature: 10
        max_temperature: 35
        availability: "{{ is_state('input_boolean.dispo_fan_only_mono', 'on') }}"
        current_temperature: "{{ states('input_number.temperature_courante_mono') }}"
        target_temperature: "{{ states('input_number.consigne_fan_only_mono') }}"
        hvac_mode: "{{ states('input_select.mode_fan_only_mono') }}"
        hvac_action: >
          {% if is_state('input_select.mode_fan_only_mono', 'off') %}off{% else %}fan{% endif %}
        fan_modes: >
          {{ state_attr('input_select.fan_fan_only_mono', 'options')
             if is_state('input_boolean.fan_actif_fan_only_mono', 'on') else [] }}
        fan_mode: >
          {{ states('input_select.fan_fan_only_mono')
             if is_state('input_boolean.fan_actif_fan_only_mono', 'on') else none }}
        swing_modes: >
          {{ state_attr('input_select.swing_fan_only_mono', 'options')
             if is_state('input_boolean.swing_actif_fan_only_mono', 'on') else [] }}
        swing_mode: >
          {{ states('input_select.swing_fan_only_mono')
             if is_state('input_boolean.swing_actif_fan_only_mono', 'on') else none }}
        swing_horizontal_modes: >
          {{ state_attr('input_select.swing_horizontal_fan_only_mono', 'options')
             if is_state('input_boolean.swing_horizontal_actif_fan_only_mono', 'on') else [] }}
        swing_horizontal_mode: >
          {{ states('input_select.swing_horizontal_fan_only_mono')
             if is_state('input_boolean.swing_horizontal_actif_fan_only_mono', 'on') else none }}
        set_temperature:
          action: input_number.set_value
          target:
            entity_id: input_number.consigne_fan_only_mono
          data:
