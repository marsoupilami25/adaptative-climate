script:
  reset_sources_test_mono:
    alias: Réinitialiser les sources (mono)
    icon: mdi:restore
    sequence:
      - action: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.dispo_heat_mono
            - input_boolean.dispo_cool_mono
            - input_boolean.dispo_dry_mono
            - input_boolean.dispo_fan_only_mono
            - input_boolean.dispo_auto_mono
            - input_boolean.fan_actif_heat_mono
            - input_boolean.fan_actif_cool_mono
            - input_boolean.fan_actif_dry_mono
            - input_boolean.fan_actif_fan_only_mono
            - input_boolean.fan_actif_auto_mono
            - input_boolean.swing_actif_heat_mono
            - input_boolean.swing_actif_cool_mono
            - input_boolean.swing_actif_dry_mono
            - input_boolean.swing_actif_fan_only_mono
            - input_boolean.swing_actif_auto_mono
            - input_boolean.swing_horizontal_actif_heat_mono
            - input_boolean.swing_horizontal_actif_cool_mono
            - input_boolean.swing_horizontal_actif_dry_mono
            - input_boolean.swing_horizontal_actif_fan_only_mono
            - input_boolean.swing_horizontal_actif_auto_mono
      - action: input_select.select_option
        target:
          entity_id:
            - input_select.mode_heat_mono
            - input_select.mode_cool_mono
            - input_select.mode_dry_mono
            - input_select.mode_fan_only_mono
            - input_select.mode_auto_mono
        data:
          option: "off"
      - action: input_select.select_option
        target:
          entity_id:
            - input_select.fan_heat_mono
            - input_select.fan_cool_mono
            - input_select.fan_dry_mono
            - input_select.fan_fan_only_mono
            - input_select.fan_auto_mono
        data:
          option: auto
      - action: input_select.select_option
        target:
          entity_id:
            - input_select.swing_heat_mono
            - input_select.swing_cool_mono
            - input_select.swing_dry_mono
            - input_select.swing_fan_only_mono
            - input_select.swing_auto_mono
        data:
          option: "off"
      - action: input_select.select_option
        target:
          entity_id:
            - input_select.swing_horizontal_heat_mono
            - input_select.swing_horizontal_cool_mono
            - input_select.swing_horizontal_dry_mono
            - input_select.swing_horizontal_fan_only_mono
            - input_select.swing_horizontal_auto_mono
        data:
          option: "off"
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.temperature_courante_mono
            - input_number.temperature_radiateur_mono
            - input_number.temperature_clim_mono
        data:
          value: 20
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.consigne_heat_mono
        data:
          value: 20
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.consigne_cool_mono
        data:
          value: 20
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.consigne_dry_mono
            - input_number.consigne_fan_only_mono
            - input_number.consigne_auto_mono
        data:
          value: 20
      - action: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.dispo_heat_cool_mono
            - input_boolean.dispo_radiateur_mono
            - input_boolean.dispo_clim_mono
      - action: input_select.select_option
        target:
          entity_id:
            - input_select.mode_heat_cool_mono
            - input_select.mode_radiateur_mono
            - input_select.mode_clim_mono
        data:
          option: "off"
      - action: input_select.select_option
        target:
          entity_id:
            - input_select.fan_clim_mono
        data:
          option: auto
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.consigne_heat_cool_basse_mono
        data:
          value: 19
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.consigne_heat_cool_haute_mono
        data:
          value: 25
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.consigne_radiateur_mono
        data:
          value: 20
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.consigne_clim_mono
        data:
          value: 20
