          target:
            entity_id: input_select.mode_cool_mono
          data:
            option: "{{ hvac_mode }}"
        set_fan_mode:
          action: input_select.select_option
          target:
            entity_id: input_select.fan_cool_mono
          data:
            option: "{{ fan_mode }}"
        set_swing_mode:
