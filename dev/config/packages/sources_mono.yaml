             if is_state('input_boolean.swing_horizontal_actif_cool_mono', 'on') else none }}
        set_temperature:
          action: input_number.set_value
          target:
            entity_id: input_number.consigne_cool_mono
          data:
            value: "{{ temperature }}"
        set_hvac_mode:
