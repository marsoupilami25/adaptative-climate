          {% if is_state('input_select.mode_cool_mono', 'off') %}off
          {% elif t > c %}cooling{% else %}idle{% endif %}
        fan_modes: >
          {{ state_attr('input_select.fan_cool_mono', 'options')
             if is_state('input_boolean.fan_actif_cool_mono', 'on') else [] }}
        fan_mode: >
          {{ states('input_select.fan_cool_mono')
             if is_state('input_boolean.fan_actif_cool_mono', 'on') else none }}
        swing_modes: >
          {{ state_attr('input_select.swing_cool_mono', 'options')
             if is_state('input_boolean.swing_actif_cool_mono', 'on') else [] }}
        swing_mode: >
          {{ states('input_select.swing_cool_mono')
             if is_state('input_boolean.swing_actif_cool_mono', 'on') else none }}
        swing_horizontal_modes: >
