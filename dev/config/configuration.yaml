# Home Assistant configuration for manual testing of Adaptative Climate.
# Linked into a dev config folder by dev/link_config.sh (see dev/README.md).

# Loads default set of integrations. Do not remove.
default_config:

homeassistant:
  # Virtual source entities and their helpers.
  packages: !include_dir_named packages

frontend:
  themes: !include_dir_merge_named themes

lovelace:
  dashboards:
    tests-mono:
      mode: yaml
      filename: dashboards/mono_mode.yaml
      title: Tests mono-mode
      icon: mdi:numeric-1-box-outline
      show_in_sidebar: true
    tests-multi:
      mode: yaml
      filename: dashboards/multi_sources.yaml
      title: Tests multi-sources
      icon: mdi:view-grid-outline
      show_in_sidebar: true
    tests-all:
      mode: yaml
      filename: dashboards/source_unique.yaml
      title: Tests source unique
      icon: mdi:checkbox-blank-outline
      show_in_sidebar: true
    tests-manuel:
      mode: yaml
      filename: dashboards/manuel.yaml
      title: Tests manuels
      icon: mdi:hand-back-right-outline
      show_in_sidebar: true

# Entities under test, imported as config entries at startup.
# Each case has its own virtual sources (packages/sources_<case>.yaml).
adaptative_climate:
  # Case 1: one entity per mode, with the matching single-mode source.
  - name: Adaptative HEAT
    heat_entity: climate.heat_virtuel_mono
    # Limit: the source goes up to 30, the entity stops at 25.
    max_temp: 25
  - name: Adaptative COOL
    cool_entity: climate.cool_virtuel_mono
  - name: Adaptative DRY
    dry_entity: climate.dry_virtuel_mono
  # Dry and auto on a source without target temperature: no target, like
  # fan only.
  - name: Adaptative DESHUM
    dry_entity: climate.deshum_virtuel_mono
    auto_entity: climate.deshum_virtuel_mono
  - name: Adaptative FAN_ONLY
    fan_only_entity: climate.fan_only_virtuel_mono
  - name: Adaptative AUTO
    auto_entity: climate.auto_virtuel_mono
  - name: Adaptative HEAT_COOL
    heat_cool_entity: climate.heat_cool_virtuel_mono
  # heat_cool without its own source: switches between a radiator and an AC,
  # with the room temperature of the sources (no sensor).
  - name: Adaptative COMBINE
    heat_entity: climate.radiateur_virtuel_mono
    cool_entity: climate.clim_virtuel_mono
    # The low target stays at least 2 degrees below the high one.
    min_gap: 2
    # Switches phase at once, to test the contradicting sources quickly
    # (the minimum phase duration is tested on MULTI).
    min_phase_duration: 0
    # A gap between the two sources is a problem at once (after 15 minutes
    # by default), for manual tests.
    monitoring_duration: 0
  # Temperature offset: the heat pump reads 2 degrees warmer than the room
  # in heat; dry has no offset. The limit applies to the room target.
  - name: Adaptative OFFSET
    heat_entity: climate.pac_virtuel_mono
    heat_offset: 2
    dry_entity: climate.pac_virtuel_mono
    max_temp: 26
  # External sensor: the valve regulates with the temperature the entity
  # writes from its room sensor. Its offset is then ignored.
  - name: Adaptative TRV
    heat_entity: climate.trv_virtuel_mono
    heat_offset: 3
    heat_external_sensor: input_number.temperature_externe_trv_mono
    temperature_sensor: sensor.capteur_piece_trv_mono

  # Case 2: every mode, one single-mode source per mode.
  - name: Adaptative MULTI
    heat_entity: climate.heat_virtuel_multi
    cool_entity: climate.cool_virtuel_multi
    dry_entity: climate.dry_virtuel_multi
    fan_only_entity: climate.fan_only_virtuel_multi
    auto_entity: climate.auto_virtuel_multi
    # No heat_cool source: heat_cool switches between heat and cool, with
    # the room temperature of this sensor.
    temperature_sensor: sensor.capteur_piece_multi
    # A phase lasts at least 1 minute (10 by default) before switching by
    # itself: short enough for manual tests.
    min_phase_duration: 1
    # Monitoring: a gap above 2 degrees (default) is a problem after 1 minute
    # (15 by default), short enough for manual tests.
    monitoring_duration: 1
    # Heat, cool and dry share their fan and swing settings.
    sync_modes: [heat, cool, dry]

  # Case 3: every mode on the multi-mode source.
  - name: Adaptative ALL
    heat_entity: climate.all_virtuel_unique
    cool_entity: climate.all_virtuel_unique
    heat_cool_entity: climate.all_virtuel_unique
    dry_entity: climate.all_virtuel_unique
    fan_only_entity: climate.all_virtuel_unique
    auto_entity: climate.all_virtuel_unique
    # Heat, cool and dry share their fan and swing settings, as on multi.
    sync_modes: [heat, cool, dry]

logger:
  default: warning
  logs:
    custom_components.adaptative_climate: debug

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
