          {% endif %}
          {% set active = state_attr('climate.adaptative_heat_cool', 'active_entity_id') %}
          | Source | Mode | Basse | Haute | Min | Max | Action | |
          |:--|:--|--:|--:|--:|--:|:--|:-:|
          {% for label, e in [('HEAT_COOL', 'climate.heat_cool_virtuel_mono')] %}
          | {{ label }} | {{ states(e) }} | {{ state_attr(e, 'target_temp_low') }} | {{ state_attr(e, 'target_temp_high') }} | {{ state_attr(e, 'min_temp') }} | {{ state_attr(e, 'max_temp') }} | {{ state_attr(e, 'hvac_action') }} | {{ '◀' if e == active else '' }} |
