        entities:
        - entity: script.reset_sources_test_mono
          name: Tout remettre à zéro
  - type: markdown
    content: |
      <small>

      ## Scénarios

      DESHUM Virtuel est une source *dry* et *auto* sans consigne de température : dans ces deux
      modes, Adaptative DESHUM se comporte alors comme en *fan_only*. Partir de **Tout remettre à zéro**.

      1. **Pas de consigne** : en *dry*, en *auto* et éteint, Adaptative DESHUM n'affiche aucune consigne (*Consigne* vide, le thermostat ne propose pas de régler une température).
      2. **Marche / arrêt** : passer Adaptative DESHUM en *dry* puis en *auto* : DESHUM Virtuel suit ; éteindre, il repasse à *off*.
      3. **Changement externe** : Adaptative DESHUM éteint, régler DESHUM Virtuel sur *dry* depuis sa carte, puis sur *auto*. Adaptative DESHUM suit, toujours sans consigne.
      4. **Fan** : en *dry*, changer le fan d'Adaptative DESHUM. *Fan DESHUM* suit.
      5. **Source indisponible** : couper *DESHUM disponible*. Adaptative DESHUM devient indisponible.

      </small>
