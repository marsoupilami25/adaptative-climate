      - type: thermostat
        entity: climate.radiateur_virtuel_mono
      - type: thermostat
        entity: climate.clim_virtuel_mono
      - type: entities
        entities:
        - input_select.mode_radiateur_mono
        - input_number.temperature_radiateur_mono
        - input_number.consigne_radiateur_mono
        - input_boolean.dispo_radiateur_mono
