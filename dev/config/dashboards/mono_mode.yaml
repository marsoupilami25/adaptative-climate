          {% if states.climate.adaptative_trv is none %}
          > ⚠️ **`climate.adaptative_trv` introuvable.** Vérifier la section `adaptative_climate:` de
          > `dev/config/configuration.yaml` et les journaux, puis redémarrer.

          {% endif %}
          | Pièce (capteur) | Externe TRV | TRV lit | Consigne TRV | Adaptative lit | Consigne Adaptative |
          |--:|--:|--:|--:|--:|--:|
          | {{ states('sensor.capteur_piece_trv_mono') }} | {{ states('input_number.temperature_externe_trv_mono') }} | {{ state_attr('climate.trv_virtuel_mono', 'current_temperature') }} | {{ state_attr('climate.trv_virtuel_mono', 'temperature') }} | {{ state_attr('climate.adaptative_trv', 'current_temperature') }} | {{ state_attr('climate.adaptative_trv', 'temperature') }} |

          Dernière écriture de *Température externe TRV* : {{ relative_time(states.input_number.temperature_externe_trv_mono.last_changed) if states.input_number.temperature_externe_trv_mono else '?' }}
      - type: entities
        entities:
