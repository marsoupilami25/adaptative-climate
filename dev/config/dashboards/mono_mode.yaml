          > ⚠️ **`climate.adaptative_deshum` introuvable.** Vérifier la section `adaptative_climate:` de
          > `dev/config/configuration.yaml` et les journaux, puis redémarrer.

          {% endif %}
          {% set active = state_attr('climate.adaptative_deshum', 'active_entity_id') %}
          | Source | Mode | Consigne | Fan | Action | |
          |:--|:--|--:|:--|:--|:-:|
          {% for label, e in [('DESHUM', 'climate.deshum_virtuel_mono')] %}
          | {{ label }} | {{ states(e) }} | {{ state_attr(e, 'temperature') }} | {{ state_attr(e, 'fan_mode') }} | {{ state_attr(e, 'hvac_action') }} | {{ '◀' if e == active else '' }} |
          {% endfor %}
