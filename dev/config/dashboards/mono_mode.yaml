        - input_boolean.dispo_capteur_trv_mono
        - entity: script.reset_sources_test_mono
          name: Tout remettre à zéro
  - type: markdown
    content: |
      <small>

      ## Scénarios

      Partir de **Tout remettre à zéro** (pièce, externe et consigne TRV à 20 °C, TRV éteinte).
      TRV Virtuel régule avec *Température externe TRV* (`heat_external_sensor`), qu'Adaptative TRV
      remplit avec son capteur de pièce (*Température pièce TRV*). Écriture au plus toutes les minutes,
      et de nouveau toutes les 30 min même sans changement. `heat_offset: 3` est ignoré.

      1. **Écriture** : *Température pièce TRV* à 18 : *Température externe TRV* passe à 18 (tout de suite si la dernière écriture date de plus d'1 min, sinon à la fin de la minute). TRV Virtuel lit 18.
      2. **Au plus une fois par minute** : *Température pièce TRV* à 19 puis 17 en quelques secondes : *Température externe TRV* passe à 19, puis à 17 une minute après.
      3. **Offset ignoré** : passer en *heat*, consigne 21 : *Consigne TRV* passe à 21 (pas 24). Adaptative TRV affiche la température du capteur de pièce.
      4. **Capteur indisponible** : couper *Capteur pièce TRV disponible*, changer *Température pièce TRV* : *Température externe TRV* ne bouge plus. Le rallumer : elle prend la température de la pièce.
      5. **Hors plage** : *Température pièce TRV* à 45 : *Température externe TRV* ne bouge pas (maximum 40), un warning « out of the range » est dans les journaux.
      6. **Renvoi** (long) : mettre *Température externe TRV* à 10 à la main : elle revient à la température de la pièce au plus 30 min après la dernière écriture.
      7. **Démarrage** : changer *Température externe TRV*, redémarrer Home Assistant : elle reprend la température de la pièce au démarrage.

      </small>
    view_layout:
      position: sidebar
