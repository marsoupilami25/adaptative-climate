    - type: vertical-stack
      cards:
      - type: heading
        heading: État
      - type: markdown
        content: |
          {% if states.climate.adaptative_offset is none %}
          > ⚠️ **`climate.adaptative_offset` introuvable.** Vérifier la section `adaptative_climate:` de
          > `dev/config/configuration.yaml` et les journaux, puis redémarrer.

          {% endif %}
          {% set e = 'climate.pac_virtuel_mono' %}
          {% set a = 'climate.adaptative_offset' %}
          | | Mode | Temp. | Consigne | Min | Max |
          |:--|:--|--:|--:|--:|--:|
          | PAC | {{ states(e) }} | {{ state_attr(e, 'current_temperature') }} | {{ state_attr(e, 'temperature') }} | {{ state_attr(e, 'min_temp') }} | {{ state_attr(e, 'max_temp') }} |
          | Adaptative | {{ states(a) }} | {{ state_attr(a, 'current_temperature') }} | {{ state_attr(a, 'temperature') }} | {{ state_attr(a, 'min_temp') }} | {{ state_attr(a, 'max_temp') }} |
      - type: entities
        entities:
        - input_number.temperature_pac_mono
        - entity: script.reset_sources_test_mono
          name: Tout remettre à zéro
  - type: markdown
    content: |
      <small>

      ## Scénarios

      Partir de **Tout remettre à zéro** (PAC éteinte, température et consigne à 20 °C).
      PAC Virtuel sert *heat* et *dry*. En *heat*, elle lit 2 °C de plus que la pièce (`heat_offset: 2`) :
      elle reçoit la consigne + 2, et Adaptative OFFSET affiche sa consigne et sa température − 2.
      *dry* n'a pas d'offset. Limite `max_temp: 26`, sur la consigne de la pièce.

      1. **Modes et plage** : modes *off*, *heat*, *dry*. Éteint, Min/Max 3–26 (PAC 5–30 : 3–28 en *heat*, 5–30 en *dry*, limité à 26). Température 18 (PAC 20 − 2).
      2. **Consigne envoyée + offset** : passer en *heat*, consigne 21 : *Consigne PAC* passe à 23, Adaptative OFFSET affiche 21. Min/Max 3–26. Température 18.
      3. **Température − offset** : *Température PAC* à 23 : Adaptative OFFSET lit 21. Remettre à 20.
      4. **Changement sur la source** : attendre 12 s, mettre *Consigne PAC* à 24 depuis sa carte : Adaptative OFFSET affiche 22, *Consigne PAC* reste à 24 (rien n'est renvoyé).
      5. **Limite** : consigne 26 (le maximum) : *Consigne PAC* passe à 28.
      6. **Offset par mode** : passer en *dry*, consigne 21 : *Consigne PAC* passe à 21, Température 20 (pas d'offset). Repasser en *heat* : *Consigne PAC* reprend 28 (26 + 2).
      7. **Allumée ailleurs** : éteindre, mettre *Consigne PAC* à 25, puis *Mode PAC* à *heat* depuis sa carte : Adaptative OFFSET passe en *heat* avec la consigne 23, et rien n'est envoyé à la PAC.

      </small>
    view_layout:
      position: sidebar
