  - type: markdown
    content: |
      <small>

      ## Scénarios

      Partir de **Tout remettre à zéro** (consignes et températures de RADIATEUR et CLIM à 20 °C ; CLIM au pas de 1 °C).
      Pas de source *heat_cool* : Adaptative COMBINE allume RADIATEUR Virtuel ou CLIM Virtuel.
      Consigne basse vers RADIATEUR, haute vers CLIM ; entre les deux, la source allumée est gardée.
      Écart minimal de 2 °C (`min_gap: 2`) entre la basse et la haute.
      Pas de capteur : chaque source a sa température (*Température RADIATEUR*, *Température CLIM*).
      Adaptative COMBINE affiche celle de la source active ; éteint, celle de RADIATEUR (la première source).
      Il ne bascule que si les deux sources sont d'accord (toutes deux sous la basse, ou au-dessus de la haute) ;
      si elles se contredisent, la source allumée est gardée. Bascule immédiate (`min_phase_duration: 0`).

      1. **Modes proposés** : *off*, *heat*, *cool* et *heat_cool*.
      2. **Entrée** : *Température RADIATEUR* à 15, passer en *heat_cool* : RADIATEUR passe en *heat*. Régler la plage à 19–25 : *Consigne RADIATEUR* passe à 19. Adaptative COMBINE affiche *heat_cool*, source active RADIATEUR, Température 15.
      3. **Bascules** : *Température CLIM* à 30 : rien ne change (RADIATEUR lit 15, les sources se contredisent). *Température RADIATEUR* à 26 : les deux sont au-dessus de 25, CLIM passe en *cool*, RADIATEUR s'éteint, *Consigne CLIM* à 25 ; Adaptative COMBINE reste en *heat_cool* et lit maintenant 30. *Température CLIM* à 18 : CLIM reste allumée (RADIATEUR lit encore 26). *Température RADIATEUR* à 18 : retour sur RADIATEUR. Remettre *Température RADIATEUR* à 20 : il reste allumé (entre les deux).
      4. **Départ au plus proche** : éteindre (plage 19–25 gardée), *Température CLIM* à 22. *Température RADIATEUR* à 24, passer en *heat_cool* : CLIM s'allume (la moyenne des deux, 23, est plus près de 25). Éteindre, *Température RADIATEUR* à 20, passer en *heat_cool* : RADIATEUR s'allume.
      5. **Arrondi et bornes** : Min/Max en *heat_cool* : 5–32 °C. Sur RADIATEUR (*Température RADIATEUR* à 18, *Température CLIM* à 22), plage 19–24,5, puis *Température CLIM* et *Température RADIATEUR* à 26 : bascule sur CLIM, *Consigne CLIM* à 25 (pas de 1 °C). Plage 10–14 : *Consigne CLIM* passe à 16 (son minimum), Adaptative COMBINE affiche 10–16.
      6. **Changement sur la source** : sur RADIATEUR, attendre 12 s, puis mettre *Consigne RADIATEUR* à 20 : la consigne basse d'Adaptative COMBINE passe à 20.
      7. **Source éteinte ailleurs** : sur RADIATEUR, l'éteindre depuis sa carte : Adaptative COMBINE passe à *off*. *Température RADIATEUR* à 30 : rien ne s'allume.
      8. **Autre mode allumé ailleurs** : sur RADIATEUR, allumer CLIM depuis sa carte : RADIATEUR s'éteint, Adaptative COMBINE passe en *cool* (plus en *heat_cool*). *Température CLIM* à 15 : CLIM reste allumée.
      9. **Source indisponible** : couper *CLIM disponible* : *heat_cool* apparaît dans *Modes indisponibles*, et le choisir est refusé, sans rien éteindre.
      10. **Consigne simple et fan** : en *cool*, consigne 23 (c'est la consigne haute) et fan *high*. *Température RADIATEUR* à 15, *Température CLIM* à 22, passer en *heat_cool* : la plage affichée finit à 23 et *Consigne RADIATEUR* prend la consigne basse. *Température CLIM* puis *Température RADIATEUR* à 30 : CLIM reprend le fan *high* et la consigne haute, 23. Repasser en *cool* : *Consigne CLIM* est toujours 23.
      11. **Marche / arrêt et redémarrage** : en *heat_cool*, éteindre puis rallumer : *heat_cool* revient. Redémarrer Home Assistant en *heat_cool* : il y est toujours, avec sa plage.
      12. **Écart minimal** : plage 19–25. En *heat*, consigne 24 : la consigne haute passe à 26 (*Consigne CLIM* y passe à l'entrée en *cool*). En *cool*, consigne 20 : la consigne basse passe à 18. En *heat_cool*, régler la plage à 20–21 : Adaptative COMBINE affiche 20–22. Changer *Consigne RADIATEUR* depuis sa carte (après 12 s en *heat*) à 25 : Adaptative COMBINE prend 25 sans corriger la haute (la source a la main).
      13. **Sources contradictoires** : plage 19–25, *Température RADIATEUR* et *Température CLIM* à 18, passer en *heat_cool* : RADIATEUR s'allume. *Température RADIATEUR* à 26 (près du radiateur il fait chaud) : RADIATEUR reste allumé, CLIM lit 18. *Température CLIM* à 22 : toujours RADIATEUR. *Température CLIM* à 26 : bascule sur CLIM. *Température CLIM* à 18 : CLIM reste allumée (RADIATEUR lit 26).
      14. **Mode non géré** : CLIM offre aussi *fan_only*, qu'Adaptative COMBINE n'utilise pas. Passer en *heat*, puis mettre *Mode CLIM* à *fan_only* : RADIATEUR reste en *heat*, Adaptative COMBINE reste en *heat* (source active RADIATEUR) et *Modes non gérés* montre `climate.clim_virtuel_mono: fan_only` ; un warning « runs in the fan_only mode » est dans le journal. Éteindre Adaptative COMBINE : RADIATEUR et CLIM s'éteignent, *Modes non gérés* est vide. Mettre *Mode CLIM* à *fan_only* : Adaptative COMBINE reste *off*. L'allumer : il passe en *heat*, CLIM s'éteint.

      </small>
    view_layout:
      position: sidebar
