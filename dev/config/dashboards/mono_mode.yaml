      ## Scénarios

      Partir de **Tout remettre à zéro** (HEAT_COOL Virtuel à 19–25 °C).
      HEAT_COOL Virtuel n'a qu'une plage (basse–haute), pas de consigne simple.

      1. **Marche / arrêt** : allumer Adaptative HEAT_COOL. HEAT_COOL Virtuel passe en *heat_cool* ; éteindre, il repasse à *off*.
      2. **Modes proposés** : seuls *off* et *heat_cool* sont proposés. Allumé ou éteint, le thermostat montre une plage.
      3. **Plage** : régler la plage d'Adaptative HEAT_COOL à 20–24. *Consigne HEAT_COOL basse* et *haute* suivent.
      4. **Changement externe** : Adaptative HEAT_COOL éteint, mettre *Consigne HEAT_COOL basse* à 17 (Adaptative HEAT_COOL ne bouge pas), puis régler HEAT_COOL Virtuel sur *heat_cool* depuis sa carte. Adaptative HEAT_COOL s'allume en *heat_cool* et prend la consigne basse 17 ; *Consigne HEAT_COOL basse* reste à 17 (rien n'est envoyé).
      5. **Changement sur la source** : allumé, attendre 12 s, puis mettre *Consigne HEAT_COOL haute* à 26. Adaptative HEAT_COOL affiche 20–26.
      6. **Plage changée juste après le mode** : éteindre puis rallumer : la source a déjà la plage, rien ne confirme le mode. Dans les 12 s, mettre *Consigne HEAT_COOL basse* à 15 : Adaptative HEAT_COOL affiche toujours sa plage. Au bout des 12 s, la consigne basse y revient.
      7. **Action** : allumé, plage 19–25 (la pièce est à 20) : *idle*. Pièce à 18 : *heating* ; pièce à 26 : *cooling*.
      8. **Bornes** : Min/Max affichent 10–30 °C, ceux de la source.
      9. **Source indisponible** : couper *HEAT_COOL disponible*. Adaptative HEAT_COOL devient indisponible.
      10. **Après un redémarrage** : allumé, plage 21–23, puis **Tout remettre à zéro** (source à 19–25). Redémarrer Home Assistant, allumer : la source passe à 21–23.

      </small>
    view_layout:
      position: sidebar
