# Case 1: one Adaptative Climate per mode, each with the matching single-mode source.
# YAML dashboard: after editing this file, refresh the page in the browser.
title: Tests mono-mode
views:
- title: HEAT
  path: heat
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Adaptative HEAT
    - type: thermostat
      entity: climate.adaptative_heat
      features:
      - type: climate-hvac-modes
      grid_options:
        columns: full
    - type: entities
      entities:
      - entity: climate.adaptative_heat
        type: attribute
        attribute: hvac_action
        name: Action
      - entity: climate.adaptative_heat
        type: attribute
        attribute: active_entity_id
        name: Source active
      - entity: climate.adaptative_heat
        type: attribute
        attribute: temperature
        name: Consigne
        suffix: °C
      - entity: climate.adaptative_heat
        type: attribute
        attribute: min_temp
        name: Min
        suffix: °C
      - entity: climate.adaptative_heat
        type: attribute
        attribute: max_temp
        name: Max
        suffix: °C
      grid_options:
        columns: full
    - type: tile
      entity: climate.adaptative_heat
      name: Marche / arrêt
      icon_tap_action:
        action: toggle
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Source HEAT Virtuel
    - type: thermostat
      entity: climate.heat_virtuel
      grid_options:
        columns: full
    - type: entities
      entities:
      - input_select.mode_heat
      - input_number.consigne_heat
      - input_boolean.dispo_heat
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: État
    - type: markdown
      content: |
        {% if states.climate.adaptative_heat is none %}
        > ⚠️ **`climate.adaptative_heat` introuvable.** Vérifier la section `adaptative_climate:` de
        > `dev/config/configuration.yaml` et les journaux, puis redémarrer.

        {% endif %}
        {% set active = state_attr('climate.adaptative_heat', 'active_entity_id') %}
        | Source | Mode | Consigne | Action | |
        |:--|:--|--:|:--|:-:|
        {% for label, e in [('HEAT', 'climate.heat_virtuel')] %}
        | {{ label }} | {{ states(e) }} | {{ state_attr(e, 'temperature') }} | {{ state_attr(e, 'hvac_action') }} | {{ '◀' if e == active else '' }} |
        {% endfor %}

        Pièce : **{{ states('input_number.temperature_courante') }} °C**
      grid_options:
        columns: full
    - type: entities
      entities:
      - input_number.temperature_courante
      - entity: script.reset_sources_test
        name: Tout remettre à zéro
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: markdown
      content: |
        ## Scénarios

        Partir de **Tout remettre à zéro**.

        1. **Marche / arrêt** : allumer Adaptative HEAT. HEAT Virtuel passe en *heat* ; éteindre, il repasse à *off*.
        2. **Modes proposés** : seuls *off* et *heat* sont proposés.
        3. **Consigne** : changer la consigne d'Adaptative HEAT. *Consigne HEAT* suit.
        4. **Changement externe** : régler HEAT Virtuel sur *heat* depuis sa carte. Adaptative HEAT suit.
        5. **Action** : faire varier la température de la pièce autour de la consigne et suivre l'action.
        6. **Source indisponible** : couper *HEAT disponible*. Adaptative HEAT devient indisponible.
      grid_options:
        columns: full
