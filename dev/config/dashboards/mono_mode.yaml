      4. **Changement externe** : Adaptative AUTO éteint, mettre *Consigne AUTO* à une autre valeur (Adaptative AUTO ne bouge pas), puis régler AUTO Virtuel sur *auto* depuis sa carte. Adaptative AUTO suit et *Consigne AUTO* revient à la consigne d'Adaptative AUTO.
      5. **Action** : allumer Adaptative AUTO, consigne 20 (la pièce est à 20) : *idle*. Pièce à 18 : *heating* ; pièce à 22 : *cooling*.
      6. **Source indisponible** : couper *AUTO disponible*. Adaptative AUTO devient indisponible.
      7. **Fan et swing** : allumer Adaptative AUTO, puis changer son fan, son swing et son swing horizontal. *Fan AUTO*, *Swing AUTO* et *Swing horizontal AUTO* suivent.
      8. **Fan/swing absents** : couper *Fan AUTO actif*. Le fan disparaît d'Adaptative AUTO, le swing reste ; le rallumer, il revient. Idem avec *Swing AUTO actif* et *Swing horizontal AUTO actif*. Éteint, Adaptative AUTO n'affiche ni fan ni swing.
    view_layout:
      position: sidebar
