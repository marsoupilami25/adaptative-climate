# Case 1: one Adaptative Climate per mode, each with the matching single-mode source.
# YAML dashboard: after editing this file, refresh the page in the browser.
# Views with scenarios use the sidebar layout: scenarios on the right, controls in the main area.
title: Tests mono-mode
views:
- title: HEAT
  path: heat
  type: sidebar
  cards:
  - type: grid
    columns: 2
    square: false
    cards:
    - type: vertical-stack
      cards:
      - type: heading
        heading: Adaptative HEAT
      - type: thermostat
        entity: climate.adaptative_heat
        features:
        - type: climate-hvac-modes
        - type: climate-fan-modes
        - type: climate-swing-modes
        - type: climate-swing-horizontal-modes
      - type: entities
        entities:
        - entity: climate.adaptative_heat
          type: attribute
          attribute: hvac_action
          name: Action
        - entity: climate.adaptative_heat
          type: attribute
          attribute: active_entity_id
          name: Source active
        - entity: climate.adaptative_heat
          type: attribute
          attribute: temperature
          name: Consigne
          suffix: °C
        - entity: climate.adaptative_heat
          type: attribute
          attribute: saved_targets
          name: Consignes enregistrées
        - entity: climate.adaptative_heat
          type: attribute
          attribute: saved_settings
          name: Réglages enregistrés
        - entity: climate.adaptative_heat
          type: attribute
          attribute: fan_mode
          name: Fan
        - entity: climate.adaptative_heat
          type: attribute
          attribute: swing_mode
          name: Swing
        - entity: climate.adaptative_heat
          type: attribute
          attribute: swing_horizontal_mode
          name: Swing horizontal
        - entity: climate.adaptative_heat
          type: attribute
          attribute: min_temp
          name: Min
          suffix: °C
        - entity: climate.adaptative_heat
          type: attribute
          attribute: max_temp
          name: Max
          suffix: °C
      - type: tile
        entity: climate.adaptative_heat
        name: Marche / arrêt
        icon_tap_action:
          action: toggle
    - type: vertical-stack
      cards:
      - type: heading
        heading: Source HEAT Virtuel
      - type: thermostat
        entity: climate.heat_virtuel_mono
      - type: entities
        entities:
        - input_select.mode_heat_mono
        - input_number.consigne_heat_mono
        - input_select.fan_heat_mono
        - input_select.swing_heat_mono
        - input_select.swing_horizontal_heat_mono
        - input_boolean.dispo_heat_mono
        - input_boolean.fan_actif_heat_mono
        - input_boolean.swing_actif_heat_mono
        - input_boolean.swing_horizontal_actif_heat_mono
    - type: vertical-stack
      cards:
      - type: heading
        heading: État
      - type: markdown
        content: |
          {% if states.climate.adaptative_heat is none %}
          > ⚠️ **`climate.adaptative_heat` introuvable.** Vérifier la section `adaptative_climate:` de
          > `dev/config/configuration.yaml` et les journaux, puis redémarrer.

          {% endif %}
          {% set active = state_attr('climate.adaptative_heat', 'active_entity_id') %}
          | Source | Mode | Consigne | Min | Max | Fan | Swing | Swing H | Action | |
          |:--|:--|--:|--:|--:|:--|:--|:--|:--|:-:|
          {% for label, e in [('HEAT', 'climate.heat_virtuel_mono')] %}
          | {{ label }} | {{ states(e) }} | {{ state_attr(e, 'temperature') }} | {{ state_attr(e, 'min_temp') }} | {{ state_attr(e, 'max_temp') }} | {{ state_attr(e, 'fan_mode') }} | {{ state_attr(e, 'swing_mode') }} | {{ state_attr(e, 'swing_horizontal_mode') }} | {{ state_attr(e, 'hvac_action') }} | {{ '◀' if e == active else '' }} |
          {% endfor %}

          Pièce : **{{ states('input_number.temperature_courante_mono') }} °C**
      - type: entities
        entities:
        - input_number.temperature_courante_mono
        - entity: script.reset_sources_test_mono
          name: Tout remettre à zéro
  - type: markdown
    content: |
      <small>

      ## Scénarios

      Partir de **Tout remettre à zéro**.

      1. **Marche / arrêt** : allumer Adaptative HEAT. HEAT Virtuel passe en *heat* ; éteindre, il repasse à *off*.
      2. **Modes proposés** : seuls *off* et *heat* sont proposés. Allumé ou éteint, le thermostat montre une seule consigne, pas de plage basse–haute.
      3. **Consigne** : Adaptative HEAT éteint, changer sa consigne : *Consigne HEAT* ne bouge pas, *Consignes enregistrées* prend la valeur. L'allumer : *Consigne HEAT* la prend. Changer à nouveau la consigne : *Consigne HEAT* suit.
      4. **Changement externe** : Adaptative HEAT éteint, mettre *Consigne HEAT* à une autre valeur (Adaptative HEAT ne bouge pas), puis régler HEAT Virtuel sur *heat* depuis sa carte. Adaptative HEAT s'allume en *heat* et prend la consigne de HEAT Virtuel ; *Consigne HEAT* garde sa valeur (rien n'est envoyé).
      5. **Action** : allumer Adaptative HEAT, consigne 20 (la pièce est à 20) : *idle*. Pièce à 18 : *heating* ; pièce à 22 : *idle*.
      6. **Source indisponible** : couper *HEAT disponible*. Adaptative HEAT devient indisponible.
      7. **Fan et swing** : allumer Adaptative HEAT, puis changer son fan, son swing et son swing horizontal. *Fan HEAT*, *Swing HEAT* et *Swing horizontal HEAT* suivent.
      8. **Fan/swing absents** : couper *Fan HEAT actif*. Le fan disparaît d'Adaptative HEAT, le swing reste ; le rallumer, il revient. Idem avec *Swing HEAT actif* et *Swing horizontal HEAT actif*. Éteint, Adaptative HEAT n'affiche ni fan ni swing.
      9. **Bornes** : HEAT Virtuel va de 5 à 30 °C, mais Adaptative HEAT a `max_temp: 25`.
         - Min/Max d'Adaptative HEAT affichent 5–25 °C, et son thermostat ne monte pas au-delà de 25.
         - Allumer Adaptative HEAT. Dans *Outils de développement > Actions*, en mode YAML, lancer :
           `action: climate.set_temperature`, `target: {entity_id: climate.adaptative_heat}`, `data: {temperature: 28}`.
           Home Assistant refuse avec une erreur (plage acceptée 5 à 25), écrite deux fois dans le journal (`websocket_api_script` et `websocket_api.http.connection`) : c'est normal, Home Assistant journalise ainsi toute action refusée lancée depuis les outils de développement. *Consigne HEAT* et la consigne d'Adaptative HEAT ne bougent pas.
      10. **Consigne au-delà de la borne sur la source** : allumer Adaptative HEAT, attendre 12 s, puis mettre *Consigne HEAT* à 28. La source a la main : *Consigne HEAT* reste à 28 et Adaptative HEAT affiche 28.

      </small>
    view_layout:
      position: sidebar
