          {% endif %}
          {% set active = state_attr('climate.adaptative_combine', 'active_entity_id') %}
          | Source | Mode | Temp. | Consigne | Min | Max | Fan | Action | |
          |:--|:--|--:|--:|--:|--:|:--|:--|:-:|
          {% for label, e in [('RADIATEUR', 'climate.radiateur_virtuel_mono'), ('CLIM', 'climate.clim_virtuel_mono')] %}
          | {{ label }} | {{ states(e) }} | {{ state_attr(e, 'current_temperature') }} | {{ state_attr(e, 'temperature') }} | {{ state_attr(e, 'min_temp') }} | {{ state_attr(e, 'max_temp') }} | {{ state_attr(e, 'fan_mode') }} | {{ state_attr(e, 'hvac_action') }} | {{ '◀' if e == active else '' }} |
