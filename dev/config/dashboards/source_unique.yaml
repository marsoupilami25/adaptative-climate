      - type: heading
        heading: État
      - type: markdown
        content: |
          {% if states.climate.adaptative_all is none %}
          > ⚠️ **`climate.adaptative_all` introuvable.** Vérifier la section `adaptative_climate:` de
          > `dev/config/configuration.yaml` et les journaux, puis redémarrer.

          {% endif %}
          {% set active = state_attr('climate.adaptative_all', 'active_entity_id') %}
          | Source | Mode | Consigne | Basse | Haute | Min | Max | Fan | Swing | Swing H | Action | |
          |:--|:--|--:|--:|--:|--:|--:|:--|:--|:--|:--|:-:|
          {% for label, e in [('ALL', 'climate.all_virtuel_unique')] %}
          | {{ label }} | {{ states(e) }} | {{ state_attr(e, 'temperature') }} | {{ state_attr(e, 'target_temp_low') }} | {{ state_attr(e, 'target_temp_high') }} | {{ state_attr(e, 'min_temp') }} | {{ state_attr(e, 'max_temp') }} | {{ state_attr(e, 'fan_mode') }} | {{ state_attr(e, 'swing_mode') }} | {{ state_attr(e, 'swing_horizontal_mode') }} | {{ state_attr(e, 'hvac_action') }} | {{ '◀' if e == active else '' }} |
