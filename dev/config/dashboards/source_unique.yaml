      - type: entities
        entities:
        - input_number.temperature_courante_unique
        - entity: script.reset_sources_test_unique
          name: Tout remettre à zéro
  - type: markdown
    content: |
      ## Scénarios (1/2) : base et mémoire des réglages

      Partir de **Tout remettre à zéro**.

      ### Base

      1. **Changement de mode** : passer de *heat* à *cool* puis *dry*. ALL Virtuel change de mode sans passer par *off*.
      2. **heat_cool** : passer en *heat_cool*. ALL Virtuel passe en *heat_cool* ; le thermostat d'Adaptative ALL montre une plage (basse–haute) au lieu de la consigne.
      3. **Changement externe** : éteindre, puis mettre ALL Virtuel en *heat_cool* depuis sa carte. Adaptative ALL passe en *heat_cool*.
      4. **Consigne** : changer la consigne. *Consigne ALL* suit.
      5. **Marche / arrêt** : éteindre puis rallumer. Le dernier mode utilisé revient.
      6. **Source indisponible** : couper *ALL disponible*. Adaptative ALL devient indisponible.
      7. **Fan et swing** : changer le fan, le swing et le swing horizontal d'Adaptative ALL. *Fan ALL*, *Swing ALL* et *Swing horizontal ALL* suivent.
      8. **Fan/swing absents** : couper *Fan ALL actif*. Le fan disparaît dans tous les modes ; le rallumer, il revient. Idem avec *Swing ALL actif* et *Swing horizontal ALL actif*.

      ### Mémoire des réglages

      *heat*, *cool* et *dry* sont synchronisés ; *fan_only* et *auto* ont chacun leur mémoire.
      Une seule source, donc une seule liste d'options : toutes les valeurs sont communes
      (la casse et les valeurs propres à une source se testent dans *Tests multi-sources*).
      **Tout remettre à zéro** n'efface pas la mémoire : elle appartient à Adaptative ALL.

      1. **Mémoire par mode** : en *fan_only*, fan *high*. En *auto*, fan *low*. Repasser en *fan_only* : *Fan ALL* revient à *high* ; puis en *auto* : *low*.
      2. **Changement pendant l'arrêt** : éteindre, mettre *Fan ALL* à *auto*, passer en *fan_only* : le fan revient à *high*.
      3. **Synchronisation** : en *cool*, fan *medium*. Passer en *fan_only* (*high*), puis en *heat* : le fan revient à *medium*. Passer en *dry* : toujours *medium*.
      4. **Modes séparés** : en *heat*, fan *high*. Passer en *auto* : *low* (sa propre mémoire). Y mettre *medium*, repasser en *cool* : *high*.
      5. **Changement sur la source** : en *dry*, mettre *Fan ALL* à *medium* depuis sa carte. Passer en *fan_only*, puis en *heat* : *medium*.
      6. **Swing synchronisé** : en *heat*, swing *on* et swing horizontal *left*. Passer en *fan_only*, puis en *cool* : *on* et *left* reviennent.
      7. **Après un redémarrage** : en *cool*, fan *high*, puis passer en *auto* : *medium*. Redémarrer Home Assistant, passer en *heat* : le fan revient à *high*.
    view_layout:
      position: sidebar
- title: Consignes
  path: consignes
  type: sidebar
  cards:
  - *pilotage
  - type: markdown
    content: |
      ## Scénarios (2/2) : consignes et plage basse/haute

      Partir de **Tout remettre à zéro**.

      ### Consigne

      Adaptative ALL garde deux consignes, chauffage et refroidissement (la basse et la haute de *heat_cool*),
      et une consigne simple pour *dry* ; *fan_only* n'en a pas, *auto* utilise la plage basse/haute (ALL Virtuel l'a). ALL Virtuel n'a qu'une consigne : elle reçoit celle du mode
      (les bornes et l'arrondi se testent dans *Tests multi-sources*).

      1. **Consigne par mode** : en *heat*, consigne 22 ; en *cool*, 26 ; en *dry*, 21. Passer de l'un à l'autre : *Consigne ALL* prend 22, 26 ou 21 à chaque entrée, et chaque mode retrouve la sienne.
      2. **Source allumée ailleurs** : éteindre, mettre *Consigne ALL* à 23 : Adaptative ALL ne bouge pas. Mettre ALL Virtuel en *heat* depuis sa carte : la source a la main, Adaptative ALL passe en *heat* et affiche 23, *Consigne ALL* reste à 23. Remettre la consigne d'Adaptative ALL à 22 pour la suite.
      3. **Changement sur la source** : en *cool*, attendre 12 s, puis mettre *Consigne ALL* à 24 depuis sa carte. Adaptative ALL affiche 24 ; passer en *heat* : 22 ; en *dry* : 21 ; de retour en *cool* : 24.
      4. **Consigne changée juste après le mode** : régler *heat* et *cool* à 24. En *heat*, passer en *cool* : la source est déjà à la consigne, rien ne confirme le mode. Dans les 12 s, mettre *Consigne ALL* à 27 depuis sa carte : Adaptative ALL affiche toujours sa consigne. Au bout des 12 s, *Consigne ALL* y revient, même sans changer de mode.
      5. **fan_only sans consigne** : en *dry*, consigne 21. Passer en *fan_only* : Adaptative ALL n'affiche aucune consigne ni plage, *Consigne ALL* reste à 21. Attendre 12 s, la mettre à 30 depuis sa carte : Adaptative ALL n'affiche toujours rien. Repasser en *dry* : *Consigne ALL* revient à 21.

      ### Consignes basse/haute

      ALL Virtuel est aussi la source de *heat_cool* et d'*auto* : elle y reçoit la plage d'Adaptative ALL
      (*Consigne ALL basse* et *haute*), la même dans les deux modes. La plage appartient à Adaptative ALL, comme les consignes,
      et n'est affichée qu'en *heat_cool*, en *auto* et à l'arrêt (en *heat* la basse est la consigne, en *cool* la haute). **Tout remettre à zéro** met la source à 19–25.

      1. **Plage envoyée** : en *heat_cool*, régler la plage à 20–24 : *Consigne ALL basse* et *haute* suivent. Passer en *heat* : *Consigne ALL* prend la consigne basse, 20 ; la plage de la source ne bouge pas. Revenir en *heat_cool* : toujours 20–24. Éteindre : le thermostat montre la plage.
      2. **Plage ignorée hors heat_cool** : en *heat*, mettre *Consigne ALL basse* à 17 depuis sa carte : Adaptative ALL ne la reprend pas. Passer en *heat_cool* : *Consigne ALL basse* revient à 20.
      3. **Changement sur la source** : en *heat_cool*, attendre 12 s, puis mettre *Consigne ALL basse* à 18 depuis sa carte : Adaptative ALL affiche 18–24. Passer en *heat*, puis revenir en *heat_cool* : toujours 18–24.
      4. **Plage changée juste après le mode** : en *heat_cool*, plage 20–24, éteindre, puis repasser en *heat_cool* : la source a déjà la plage, rien ne confirme le mode. Dans les 12 s, mettre *Consigne ALL haute* à 28 depuis sa carte : Adaptative ALL affiche toujours 20–24. Au bout des 12 s, *Consigne ALL haute* revient à 24.
      5. **Après un redémarrage** : en *heat_cool*, plage 21–23, puis **Tout remettre à zéro** (source à 19–25). Redémarrer Home Assistant, passer en *heat_cool* : la source passe à 21–23.
      6. **auto comme heat_cool** : en *auto*, Adaptative ALL montre une plage, pas de consigne simple. La régler à 21–23 : *Consigne ALL basse* et *haute* suivent, *Consigne ALL* ne bouge pas. Passer en *heat* : *Consigne ALL* prend 21 ; en *cool* : 23 ; en *heat_cool* : toujours 21–23.
      7. **Changement sur la source en auto** : en *auto*, attendre 12 s, puis mettre *Consigne ALL haute* à 26 depuis sa carte : Adaptative ALL affiche 21–26. Passer en *cool* : *Consigne ALL* prend 26 ; en *heat_cool* : 21–26.
    view_layout:
      position: sidebar
