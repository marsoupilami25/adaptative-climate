# Manual case: every virtual source, plus one Adaptative Climate created by hand from the UI.
# YAML dashboard: after editing this file, refresh the page in the browser.
title: Tests manuels
views:
- title: Sources
  path: sources
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Capteur
    - type: entities
      entities:
      - input_number.temperature_capteur_manuel
      - input_boolean.dispo_capteur_manuel
      - entity: script.reset_sources_test_manuel
        name: Tout remettre à zéro
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: HEAT Virtuel
    - type: thermostat
      entity: climate.heat_virtuel_manuel
      features:
      - type: climate-hvac-modes
      - type: climate-fan-modes
      - type: climate-swing-modes
      - type: climate-swing-horizontal-modes
      grid_options:
        columns: full
    - type: entities
      state_color: true
      entities:
      - input_select.mode_heat_manuel
      - input_number.temperature_heat_manuel
      - input_number.consigne_heat_manuel
      - input_select.fan_heat_manuel
      - input_select.swing_heat_manuel
      - input_select.swing_horizontal_heat_manuel
      - input_boolean.dispo_heat_manuel
      - input_boolean.fan_actif_heat_manuel
      - input_boolean.swing_actif_heat_manuel
      - input_boolean.swing_horizontal_actif_heat_manuel
