- title: Adaptative
  path: adaptative
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Adaptative Manuel
    - type: markdown
      content: |
        {% if states.climate.adaptative_manuel is none %}
        > ⚠️ **`climate.adaptative_manuel` introuvable.** Le créer depuis l'interface :
        > [Ajouter un Adaptative Climate](/_my_redirect/config_flow_start?domain=adaptative_climate),
        > nommé **Adaptative Manuel**, avec les sources de son choix.

        {% else %}
        Modifier les sources : [Adaptative Climate](/config/integrations/integration/adaptative_climate).
        {% endif %}
      grid_options:
        columns: full
    - type: thermostat
      entity: climate.adaptative_manuel
      features:
      - type: climate-hvac-modes
      - type: climate-fan-modes
      - type: climate-swing-modes
      - type: climate-swing-horizontal-modes
      grid_options:
        columns: full
    - type: entities
      entities:
      - entity: climate.adaptative_manuel
        type: attribute
        attribute: hvac_action
        name: Action
      - entity: climate.adaptative_manuel
        type: attribute
        attribute: active_entity_id
        name: Source active
      - entity: climate.adaptative_manuel
        type: attribute
        attribute: current_temperature
        name: Température
        suffix: °C
      - entity: climate.adaptative_manuel
        type: attribute
        attribute: temperature
        name: Consigne
        suffix: °C
      - entity: climate.adaptative_manuel
        type: attribute
        attribute: target_temp_low
        name: Consigne basse
        suffix: °C
      - entity: climate.adaptative_manuel
        type: attribute
        attribute: target_temp_high
        name: Consigne haute
        suffix: °C
      - entity: climate.adaptative_manuel
        type: attribute
        attribute: saved_targets
        name: Consignes enregistrées
      - entity: climate.adaptative_manuel
        type: attribute
        attribute: fan_mode
        name: Fan
      - entity: climate.adaptative_manuel
        type: attribute
        attribute: swing_mode
        name: Swing
      - entity: climate.adaptative_manuel
        type: attribute
        attribute: swing_horizontal_mode
        name: Swing horizontal
      - entity: climate.adaptative_manuel
        type: attribute
        attribute: min_temp
        name: Min
        suffix: °C
      - entity: climate.adaptative_manuel
        type: attribute
        attribute: max_temp
        name: Max
        suffix: °C
      grid_options:
        columns: full
    - type: tile
      entity: climate.adaptative_manuel
      name: Marche / arrêt
      icon_tap_action:
        action: toggle
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: État des sources
    - type: markdown
      content: |
        {% set active = state_attr('climate.adaptative_manuel', 'active_entity_id') %}
        | Source | Mode | Temp. | Consigne | Min | Max | Fan | Swing | Swing H | Action | |
        |:--|:--|--:|--:|--:|--:|:--|:--|:--|:--|:-:|
        {% for label, e in [('HEAT', 'climate.heat_virtuel_manuel'), ('COOL', 'climate.cool_virtuel_manuel'), ('DRY', 'climate.dry_virtuel_manuel'), ('FAN_ONLY', 'climate.fan_only_virtuel_manuel'), ('AUTO', 'climate.auto_virtuel_manuel'), ('ALL', 'climate.all_virtuel_manuel')] %}
        | {{ label }} | {{ states(e) }} | {{ state_attr(e, 'current_temperature') }} | {{ state_attr(e, 'temperature') }} | {{ state_attr(e, 'min_temp') }} | {{ state_attr(e, 'max_temp') }} | {{ state_attr(e, 'fan_mode') }} | {{ state_attr(e, 'swing_mode') }} | {{ state_attr(e, 'swing_horizontal_mode') }} | {{ state_attr(e, 'hvac_action') }} | {{ '◀' if e == active else '' }} |
        {% endfor %}

        Capteur : **{{ states('sensor.capteur_piece_manuel') }} °C**
      grid_options:
        columns: full
    - type: entities
      entities:
      - input_number.temperature_capteur_manuel
      - input_boolean.dispo_capteur_manuel
      - entity: script.reset_sources_test_manuel
        name: Tout remettre à zéro
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Tous les Adaptative Climate
    - type: markdown
      content: |
        | Entité | Mode | Consigne | Source active |
        |:--|:--|--:|:--|
        {% for e in integration_entities('adaptative_climate') | sort %}
        | {{ state_attr(e, 'friendly_name') or e }} | {{ states(e) }} | {{ state_attr(e, 'temperature') }} | {{ state_attr(e, 'active_entity_id') }} |
        {% endfor %}
      grid_options:
        columns: full
