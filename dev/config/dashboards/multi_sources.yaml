# Case 2: one Adaptative Climate with every mode, one single-mode source per mode.
# YAML dashboard: after editing this file, refresh the page in the browser.
# Views with scenarios use the sidebar layout: scenarios on the right, controls in the main area.
title: Tests multi-sources
views:
- title: Base et mémoire
  path: pilotage
  type: sidebar
  cards:
  - &pilotage
    type: grid
    columns: 2
    square: false
    cards:
    - type: vertical-stack
      cards:
      - type: heading
        heading: Adaptative MULTI
      - type: thermostat
        entity: climate.adaptative_multi
        features:
        - type: climate-hvac-modes
        - type: climate-fan-modes
        - type: climate-swing-modes
        - type: climate-swing-horizontal-modes
      - type: entities
        entities:
        - entity: climate.adaptative_multi
          type: attribute
          attribute: hvac_action
          name: Action
        - entity: climate.adaptative_multi
          type: attribute
          attribute: active_entity_id
          name: Source active
        - entity: climate.adaptative_multi
          type: attribute
          attribute: current_temperature
          name: Température
          suffix: °C
        - entity: climate.adaptative_multi
          type: attribute
          attribute: temperature
          name: Consigne
          suffix: °C
        - entity: climate.adaptative_multi
          type: attribute
          attribute: target_temp_low
          name: Consigne basse
          suffix: °C
        - entity: climate.adaptative_multi
          type: attribute
          attribute: target_temp_high
          name: Consigne haute
          suffix: °C
        - entity: climate.adaptative_multi
          type: attribute
          attribute: saved_targets
          name: Consignes enregistrées
        - entity: climate.adaptative_multi
          type: attribute
          attribute: saved_settings
          name: Réglages enregistrés
        - entity: climate.adaptative_multi
          type: attribute
          attribute: unavailable_modes
          name: Modes indisponibles
        - entity: climate.adaptative_multi
          type: attribute
          attribute: fan_mode
          name: Fan
        - entity: climate.adaptative_multi
          type: attribute
          attribute: swing_mode
          name: Swing
        - entity: climate.adaptative_multi
          type: attribute
          attribute: swing_horizontal_mode
          name: Swing horizontal
        - entity: climate.adaptative_multi
          type: attribute
          attribute: min_temp
          name: Min
          suffix: °C
        - entity: climate.adaptative_multi
          type: attribute
          attribute: max_temp
          name: Max
          suffix: °C
      - type: tile
        entity: climate.adaptative_multi
        name: Marche / arrêt
        icon_tap_action:
          action: toggle
    - type: vertical-stack
      cards:
      - type: heading
        heading: État
      - type: markdown
        content: |
          {% if states.climate.adaptative_multi is none %}
          > ⚠️ **`climate.adaptative_multi` introuvable.** Vérifier la section `adaptative_climate:` de
          > `dev/config/configuration.yaml` et les journaux, puis redémarrer.

          {% endif %}
          {% set active = state_attr('climate.adaptative_multi', 'active_entity_id') %}
          | Source | Mode | Temp. | Consigne | Min | Max | Fan | Swing | Swing H | Action | |
          |:--|:--|--:|--:|--:|--:|:--|:--|:--|:--|:-:|
          {% for label, e in [('HEAT', 'climate.heat_virtuel_multi'), ('COOL', 'climate.cool_virtuel_multi'), ('DRY', 'climate.dry_virtuel_multi'), ('FAN_ONLY', 'climate.fan_only_virtuel_multi'), ('AUTO', 'climate.auto_virtuel_multi')] %}
          | {{ label }} | {{ states(e) }} | {{ state_attr(e, 'current_temperature') }} | {{ state_attr(e, 'temperature') }} | {{ state_attr(e, 'min_temp') }} | {{ state_attr(e, 'max_temp') }} | {{ state_attr(e, 'fan_mode') }} | {{ state_attr(e, 'swing_mode') }} | {{ state_attr(e, 'swing_horizontal_mode') }} | {{ state_attr(e, 'hvac_action') }} | {{ '◀' if e == active else '' }} |
          {% endfor %}

          Capteur : **{{ states('sensor.capteur_piece_multi') }} °C** · Adaptative MULTI lit : **{{ state_attr('climate.adaptative_multi', 'current_temperature') }} °C**
      - type: entities
        entities:
        - input_number.temperature_heat_multi
        - input_number.temperature_cool_multi
        - input_number.temperature_dry_multi
        - input_number.temperature_fan_only_multi
        - input_number.temperature_auto_multi
        - input_number.temperature_capteur_multi
        - input_boolean.dispo_capteur_multi
        - entity: script.reset_sources_test_multi
          name: Tout remettre à zéro
        - entity: script.sources_indisponibles_multi
          name: Toutes les sources indisponibles
        - entity: script.sources_disponibles_multi
          name: Toutes les sources disponibles
  - type: markdown
    content: |
      <small>

      ## Scénarios (1/3) : base et mémoire des réglages

      Partir de **Tout remettre à zéro**.

      ### Base

      1. **Changement de mode** : passer en *heat*, puis en *cool*. COOL Virtuel passe à *cool*, puis HEAT Virtuel repasse à *off*.
      2. **Consigne** : en *cool*, changer la consigne. Seule *Consigne COOL* bouge.
      3. **Changement externe** : éteint, régler la plage d'Adaptative MULTI à 23–26. Allumer HEAT Virtuel depuis sa carte (vue Sources). Adaptative MULTI passe en *heat* et prend la consigne de la source : il affiche 20, *Consigne HEAT* reste à 20 (rien n'est envoyé).
      4. **Deuxième source allumée** : HEAT Virtuel allumé (scénario 3), allumer aussi COOL Virtuel à la main. HEAT Virtuel s'éteint et Adaptative MULTI passe en *cool* : la dernière source allumée l'emporte.
      5. **Marche / arrêt** : éteindre puis rallumer. Le dernier mode utilisé revient.
      6. **Source indisponible** : couper *HEAT disponible*. *heat* n'est plus détecté ; l'entité reste disponible tant qu'une autre source l'est. **Toutes les sources indisponibles** : l'entité devient indisponible ; **Toutes les sources disponibles** les rétablit.
      7. **Bornes** : Min/Max suivent la source du mode actif. En *heat* : 5–30 °C, en *cool* : 16–32 °C, en *dry* : 18–30 °C, en *fan_only* : 10–35 °C, en *auto* : 10–30 °C. Éteint : la plage la plus large, 5–35 °C.
      8. **Fan et swing par source** : en *fan_only*, changer le fan. Seul *Fan FAN_ONLY* bouge. Passer en *auto* : le fan affiché est celui d'AUTO Virtuel.
      9. **Fan/swing absents** : couper *Fan HEAT actif*, *Swing HEAT actif* et *Swing horizontal HEAT actif*. En *heat*, fan et swing restent affichés mais vides (aucune option, la carte garde sa taille) ; choisir un fan depuis *Outils de développement > Actions* est refusé avec « Le mode heat ne propose pas ce réglage ». En *cool*, leurs options reviennent. Éteint : affichés, vides. Couper *COOL disponible* (seule source restante avec fan et swing) : ils restent affichés.
      10. **Source en panne à l'allumage** : en *heat*, activer *Panne COOL* (vue Sources), passer en *cool* : une erreur s'affiche, HEAT Virtuel reste en *heat* et Adaptative MULTI aussi. Désactiver *Panne COOL*.
      11. **Source qui ne s'éteint pas** : en *heat*, activer *Panne HEAT*, passer en *cool* : pas d'erreur, COOL Virtuel passe en *cool*, Adaptative MULTI aussi, HEAT Virtuel reste en *heat*. Dans le journal, un seul warning « climate.heat_virtuel_multi (heat) does not turn off while climate.cool_virtuel_multi runs » (et un problème *exclusivity* dans la vue Monitoring). Attendre 1 min : pas de nouveau warning (HEAT Virtuel est retenté, toujours en panne). Désactiver *Panne HEAT* : dans la minute, HEAT Virtuel passe à *off* et une info « no longer runs along with another source » est dans le journal.
      12. **Source bloquée éteinte à la main** : refaire le 11 jusqu'au warning, puis remettre *Mode HEAT* à *off* à la main : l'info « no longer runs along with another source » arrive tout de suite. Désactiver *Panne HEAT*.
      13. **Retour de la source active** : en *heat*, consigne 22, attendre 12 s. Couper *HEAT disponible* : Adaptative MULTI passe à *off*. Mettre *Consigne HEAT* à 16 (comme un appareil qui redémarre avec sa propre consigne), rallumer *HEAT disponible* : Adaptative MULTI repasse en *heat* et *Consigne HEAT* revient à 22.
      14. **Retour éteint** : en *heat*, couper *HEAT disponible*, mettre *Mode HEAT* à *off*, rallumer *HEAT disponible* : Adaptative MULTI reste *off*. Mettre *Consigne HEAT* à 18 puis *Mode HEAT* à *heat* (allumage à la télécommande) : Adaptative MULTI passe en *heat* et prend 18.
      15. **Autre mode pendant l'absence** : en *heat*, couper *HEAT disponible*, passer Adaptative MULTI en *cool*. Rallumer *HEAT disponible* (*Mode HEAT* est resté à *heat*) : HEAT Virtuel est éteint aussitôt, Adaptative MULTI reste en *cool*.

      ### Mémoire des réglages

      *heat*, *cool* et *dry* sont synchronisés ; *fan_only* et *auto* ont chacun leur mémoire.
      Les sources n'écrivent pas leurs options pareil : HEAT en *Capitales* avec *Turbo* en plus,
      DRY en *MAJUSCULES* sans *medium*, les autres en minuscules.
      **Tout remettre à zéro** n'efface pas la mémoire : elle appartient à Adaptative MULTI.

      1. **Mémoire par mode** : en *fan_only*, fan *high*. En *auto*, fan *low*. Repasser en *fan_only* : *Fan FAN_ONLY* revient à *high* ; puis en *auto* : *Fan AUTO* revient à *low*.
      2. **Changement pendant l'arrêt** : éteindre, mettre *Fan FAN_ONLY* à *auto* (vue Sources), passer en *fan_only* : le fan revient à *high*.
      3. **Synchronisation et casse** : en *cool*, fan *high*. Passer en *heat* : *Fan HEAT* passe à *High*. Passer en *dry* : *Fan DRY* passe à *HIGH*.
      4. **Valeur propre à une source** : en *heat*, la liste propose *Turbo*. Le choisir : HEAT Virtuel passe en *Turbo*. Passer en *cool* : le fan revient à *high*, *Turbo* n'est pas retenu. Même chose avec *Medium* (absent de DRY).
      5. **Changement sur la source** : en *cool*, mettre *Fan COOL* à *low* depuis la vue Sources. Passer en *heat* : *Fan HEAT* passe à *Low*.
      6. **Swing synchronisé** : en *heat*, swing *On* et swing horizontal *Left*. Passer en *cool*, puis en *dry* : *on* et *left* partout.
      7. **Après un redémarrage** : en *cool*, fan *high*, puis éteindre et mettre *Fan HEAT* à *Auto* (vue Sources). Redémarrer Home Assistant, passer en *heat* : *Fan HEAT* passe à *High*.

      </small>
    view_layout:
      position: sidebar
- title: Consigne
  path: consigne
  type: sidebar
  cards:
  - *pilotage
  - type: markdown
    content: |
      <small>

      ## Scénarios (2/3) : consignes

      Partir de **Tout remettre à zéro**.

      ### Consigne

      Adaptative MULTI garde deux consignes : chauffage et refroidissement. Celle de *heat* est la
      consigne basse de *heat_cool*, celle de *cool* la consigne haute. *dry* et *auto* ont une
      consigne simple à part ; *fan_only* n'en a pas. Chaque source reçoit la sienne en entrant dans son mode, et la basse
      reste au moins à l'écart minimal sous la haute (aucun ici : elles peuvent être égales).
      Sources : HEAT 5–30 °C, COOL 16–32 °C au pas de 1 °C, DRY 18–30 °C.
      **Tout remettre à zéro** remet les consignes des sources à 20 °C, pas celles d'Adaptative MULTI.

      1. **Consigne par mode** : en *heat*, consigne 18 : *Consigne HEAT* passe à 18. Passer en *cool* : Adaptative MULTI affiche sa consigne de refroidissement (20 la première fois), *Consigne COOL* reste à 20. La régler à 26 : *Consigne COOL* passe à 26. Passer en *dry*, régler 24 : seule *Consigne DRY* bouge. Repasser en *heat* : 18 ; en *cool* : 26.
      2. **Les consignes se poussent** : en *heat*, consigne 28 : la consigne de refroidissement monte aussi à 28 (*Consigne COOL* passe à 28 à l'entrée en *cool*). En *cool*, consigne 17 : la consigne de chauffage descend à 17.
      3. **Source allumée ailleurs** : éteindre : le thermostat montre la plage (basse–haute). La régler à 18–26, puis mettre *Consigne HEAT* à 22 (vue Sources) : Adaptative MULTI ne bouge pas. Allumer HEAT Virtuel depuis sa carte : la source a la main, Adaptative MULTI passe en *heat* et affiche 22, *Consigne HEAT* reste à 22. Même chose avec COOL Virtuel : mettre *Consigne COOL* à 25, l'allumer depuis sa carte : Adaptative MULTI passe en *cool* et affiche 25. Éteindre : la plage est 22–25.
      4. **Changement sur la source** : en *heat*, attendre 12 s, puis mettre *Consigne HEAT* à 19 (vue Sources). Adaptative MULTI affiche 19. Passer en *cool* : sa consigne de refroidissement ne change pas. Repasser en *heat* : 19.
      5. **Consigne tardive de la source** : éteint, régler la plage à 18–20 (20 est la consigne de COOL Virtuel après la remise à zéro), passer en *cool* : rien n'est envoyé, la source est déjà à 20. Dans les 12 s, mettre *Consigne COOL* à 27 (comme un appareil qui renvoie sa propre consigne après le mode) : Adaptative MULTI affiche toujours 20. Au bout des 12 s, *Consigne COOL* revient à 20. Ensuite, mettre *Consigne COOL* à 26 : Adaptative MULTI suit.
      6. **Consigne confirmée** : en *cool*, consigne 25. Passer en *heat*, mettre *Consigne COOL* à 22 (vue Sources) : Adaptative MULTI ne bouge pas. Repasser en *cool* : *Consigne COOL* passe à 25, ce qui confirme le mode. Tout de suite après, mettre *Consigne COOL* à 24 : Adaptative MULTI suit sans attendre 12 s.
      7. **Bornes** : chaque consigne reste dans la plage de sa source. En *cool*, consigne 32 (maximum) ; en *dry*, 30 (maximum de DRY) ; de retour en *cool*, 32. En *heat*, consigne 5 (minimum de HEAT) : la consigne de refroidissement ne bouge pas.
      8. **Arrondi** : en *cool*, consigne 21,5 : *Consigne COOL* passe à 22 (pas de 1 °C) et Adaptative MULTI affiche 22.
      9. **Consignes réglées éteint** : éteindre, régler la plage d'Adaptative MULTI à 18–24. Aucune source ne bouge. Passer en *heat* : *Consigne HEAT* passe de 20 à 18. Éteindre, passer en *cool* : *Consigne COOL* passe à 24.
      10. **Après un redémarrage** : en *heat*, consigne 18 ; en *cool*, consigne 25 ; éteindre, puis **Tout remettre à zéro**. Redémarrer Home Assistant, passer en *heat* : *Consigne HEAT* passe à 18 ; en *cool* : *Consigne COOL* passe à 25.
      11. **fan_only sans consigne** : en *dry*, consigne 24. Passer en *fan_only* : Adaptative MULTI n'affiche aucune consigne et *Consigne FAN_ONLY* reste à 20. Attendre 12 s, mettre *Consigne FAN_ONLY* à 27 (vue Sources) : Adaptative MULTI n'affiche toujours rien. Depuis *Outils de développement > Actions*, appeler `climate.set_temperature` sur Adaptative MULTI avec `temperature: 22` : aucune source ne bouge. Passer en *dry* : *Consigne DRY* passe à 22.

      </small>
    view_layout:
      position: sidebar
- title: heat_cool
  path: heat-cool
  type: sidebar
  cards:
  - *pilotage
  - type: markdown
    content: |
      <small>

      ## Scénarios (3/3) : heat_cool avec HEAT et COOL

      Partir de **Tout remettre à zéro**.

      ### heat_cool avec HEAT et COOL

      Pas de source *heat_cool* : Adaptative MULTI allume HEAT Virtuel ou COOL Virtuel selon
      *Température du capteur*. Sous la consigne basse, HEAT chauffe vers la consigne basse ;
      au-dessus de la haute, COOL refroidit vers la consigne haute ; entre les deux, la source
      allumée est gardée. Sans capteur, les températures de HEAT et COOL doivent être d'accord pour basculer.
      Une bascule faite d'elle-même attend que la phase ait duré 1 min (`min_phase_duration: 1`) ;
      un changement de plage bascule tout de suite.
      La plage appartient à Adaptative MULTI et n'est affichée qu'en *heat_cool*.

      1. **Entrée** : capteur à 15, passer en *heat_cool* : HEAT Virtuel passe en *heat*. Régler la plage à 19–25 : *Consigne HEAT* passe à 19. Adaptative MULTI affiche *heat_cool*, source active HEAT, Température 15 (le capteur).
      2. **Bascule vers COOL** : suite du 1, capteur à 26 : rien pendant 1 min après l'entrée, puis COOL Virtuel passe en *cool*, HEAT Virtuel s'éteint et *Consigne COOL* passe à 25 (la consigne haute). Adaptative MULTI reste en *heat_cool*, source active COOL.
      3. **Entre les consignes** : suite du 2, capteur à 22 : COOL Virtuel reste allumé. Capteur à 18 : retour sur HEAT Virtuel (1 min après la bascule du 2), *Consigne HEAT* à 19.
      4. **Départ au plus proche** : éteindre, plage 19–25 gardée. Capteur à 24, passer en *heat_cool* : COOL Virtuel s'allume (24 est plus près de 25). Éteindre, capteur à 20, passer en *heat_cool* : HEAT Virtuel s'allume.
      5. **Plage qui bascule** : en *heat_cool* sur HEAT Virtuel (capteur à 18), régler la plage à 15–17 : bascule sur COOL Virtuel, *Consigne COOL* à 17.
      6. **Bornes** : en *heat_cool*, Min/Max couvrent HEAT et COOL : 5–32 °C. Sur COOL Virtuel (capteur à 30), plage 10–14 : *Consigne COOL* passe à 16 (son minimum) et la consigne haute d'Adaptative MULTI devient 16, même en remettant 14 une deuxième fois : elle ne sert qu'à COOL. Capteur à 5 : bascule sur HEAT Virtuel (après 1 min). Capteur à 15 : HEAT reste allumé (15 est entre 10 et 16). Capteur à 17 : bascule sur COOL Virtuel (après 1 min).
      7. **Changement sur la source** : en *heat_cool* sur HEAT Virtuel, attendre 12 s, puis mettre *Consigne HEAT* à 20 (vue Sources) : la consigne basse d'Adaptative MULTI passe à 20.
      8. **Source éteinte ailleurs** : en *heat_cool* sur HEAT Virtuel, éteindre HEAT Virtuel depuis sa carte (vue Sources) : Adaptative MULTI passe à *off*. Capteur à 30 : rien ne s'allume.
      9. **Autre mode allumé ailleurs** : en *heat_cool* sur HEAT Virtuel, allumer COOL Virtuel depuis sa carte : HEAT Virtuel s'éteint, Adaptative MULTI passe en *cool* (plus en *heat_cool*). Capteur à 15 : COOL Virtuel reste allumé.
      10. **Capteur indisponible** : chaque source a sa propre température (*Température HEAT*, *COOL*...), toutes à 20. Éteint, couper *Capteur disponible* : Adaptative MULTI lit la première source disponible, HEAT Virtuel. *Température HEAT* à 15 : il affiche 15 ; *Température COOL* à 30 : rien ne change. Passer en *heat_cool* (plage 19–25) : HEAT Virtuel s'allume (15 < 19). *Température HEAT* à 26 : HEAT et COOL sont au-dessus de 25, bascule sur COOL Virtuel (après 1 min) ; Adaptative MULTI lit maintenant *Température COOL* (30) et reste sur COOL. Rallumer le capteur (20) : il reprend la main, COOL reste allumé (20 est entre 19 et 25).
      11. **Source indisponible** : couper *COOL disponible* : *heat_cool* apparaît dans *Modes indisponibles*, et le choisir est refusé avec un message, sans rien éteindre.
      12. **Consigne simple = basse ou haute** : plage 19–25. En *heat*, Adaptative MULTI affiche 19 et aucune plage ; la régler à 22 : la basse passe à 22. Passer en *cool* : elle affiche 25 ; la régler à 26 : la haute passe à 26. Passer en *heat_cool* : plage 22–26, pas de consigne simple.
      13. **Marche / arrêt** : en *heat_cool*, éteindre puis rallumer : *heat_cool* revient.
      14. **Après un redémarrage** : en *heat_cool* sur HEAT Virtuel, plage 19–25. Redémarrer Home Assistant : Adaptative MULTI est toujours en *heat_cool*, avec la plage 19–25.
      15. **Durée minimale** : plage 19–25, capteur à 15, passer en *heat_cool* : HEAT Virtuel s'allume. Capteur à 26 : HEAT reste allumé ; 1 min après l'entrée, sans toucher au capteur, bascule sur COOL Virtuel. Aussitôt, capteur à 15 puis à 22 avant la fin de la minute : COOL reste allumé (22 est entre les deux). Capteur à 15, la minute passée : bascule tout de suite sur HEAT. Aussitôt, capteur à 26 : HEAT attend sa minute ; régler la plage à 10–14 pendant ce temps : bascule tout de suite sur COOL (changement de plage).
      16. **Source indisponible en heat_cool** : plage 19–25, capteur à 15, passer en *heat_cool* : HEAT Virtuel s'allume. Couper *HEAT disponible* (vue Sources) : Adaptative MULTI reste en *heat_cool* (avant, il passait à *off*). Mettre *Consigne HEAT* à 16, rallumer *HEAT disponible* : toujours *heat_cool* sur HEAT Virtuel, *Consigne HEAT* revient à 19.
      17. **Retour éteint en heat_cool** : refaire le 16 jusqu'à couper *HEAT disponible*, mettre *Mode HEAT* à *off*, rallumer *HEAT disponible* : Adaptative MULTI passe à *off*.
      18. **Bascule pendant l'absence** : refaire le 16 jusqu'à couper *HEAT disponible*, puis capteur à 26 : 1 min après l'entrée, COOL Virtuel passe en *cool*, Adaptative MULTI reste en *heat_cool* sur COOL. Rallumer *HEAT disponible* (*Mode HEAT* encore à *heat*) : HEAT Virtuel est éteint aussitôt, Adaptative MULTI reste en *heat_cool* sur COOL.

      </small>
    view_layout:
      position: sidebar

- title: Monitoring
  path: monitoring
  type: sidebar
  badges:
  - type: entity
    entity: binary_sensor.adaptative_multi_monitoring
    show_name: true
    visibility:
    - condition: state
      entity: binary_sensor.adaptative_multi_monitoring
      state: "on"
  cards:
  - *pilotage
  - type: vertical-stack
    cards:
    - type: heading
      heading: Monitoring
    - type: tile
      entity: binary_sensor.adaptative_multi_monitoring
    - type: markdown
      content: |
        {% set m = 'binary_sensor.adaptative_multi_monitoring' %}
        {% if states[m] is none %}
        > ⚠️ **`{{ m }}` introuvable.** Vérifier la section `adaptative_climate:` et redémarrer.
        {% else %}
        État : **{{ states(m) }}** · écart max : {{ state_attr(m, 'max_gap') }} °C

        | Type | Détail |
        |:--|:--|
        {% for p in state_attr(m, 'problems') or [] %}
        {% if p.type in ['sensor', 'sources'] %}
        | {{ p.type }} | écart {{ p.gap }}{{ ' · capteur ' ~ p.sensor_temperature if p.sensor_temperature is defined else '' }} · {% for s in p.sources %}{{ s.entity_id }} ({{ s.modes | join(',') }}) : {{ s.temperature }}{{ ' · ' if not loop.last else '' }}{% endfor %} |
        {% elif p.type == 'target' %}
        | target | {{ p.entity_id }} ({{ p.mode }}) · {{ p.attribute }} attendu {{ p.expected }}, lu {{ p.actual }} |
        {% else %}
        | {{ p.type }} | {{ p.entity_id }} ({{ p.mode }}) tourne avec {{ p.running }} · {{ p.error }} |
        {% endif %}
        {% endfor %}
        {% endif %}
  - type: markdown
    content: |
      <small>

      ## Scénarios : monitoring

      Partir de **Tout remettre à zéro** (capteur et sources à 20 °C).
      *Monitoring* (`binary_sensor.adaptative_multi_monitoring`) compare le capteur à chaque source,
      et les sources entre elles. Un écart de plus de 2 °C est un problème après 1 min
      (`monitoring_duration: 1`). Il signale aussi une consigne que la source active n'affiche pas
      (après 1 min), et une source qui ne s'éteint pas (tout de suite). Le badge en haut n'apparaît
      qu'en cas de problème. Pour voir les événements : Outils de développement > Événements,
      écouter `adaptative_climate_problem`.
      Les températures des sources se règlent dans la carte État (*Température HEAT*...).

      1. **Écart d'une source** : *Température HEAT* à 23 : rien pendant 1 min, puis *Monitoring* passe à *Problème*. Problèmes : *sensor* pour HEAT (3), et *sources* entre HEAT et chacune des quatre autres (3).
      2. **Retour** : *Température HEAT* à 21 : *Monitoring* repasse aussitôt à *OK*, plus de problème.
      3. **Seuil** : *Température HEAT* à 22 : écart de 2, pas un problème, même après 1 min.
      4. **Capteur** : *Température HEAT* à 20, *Température du capteur* à 17 : après 1 min, cinq problèmes *sensor* (un par source, écart 3), aucun *sources*.
      5. **Écart interrompu** : capteur à 20. Capteur à 17, puis à 20 avant la minute, puis à 17 : il faut encore 1 min complète avant le problème.
      6. **Capteur indisponible** : suite du 5, couper *Capteur disponible* : plus de problème (les sources sont d'accord). Rallumer le capteur.
      7. **Source indisponible** : capteur à 20, *Température COOL* à 25, attendre le problème. Couper *COOL disponible* (vue Sources) : plus de problème. La rallumer : 1 min avant le problème.
      8. **Consigne non appliquée** : passer en *heat*, attendre 12 s. Activer *Panne HEAT* (vue Sources), régler la consigne d'Adaptative MULTI à 23 : *Consigne HEAT* reste à 20 ; 5 s après (nouvel essai, refusé aussi), un warning « Could not set temperature 23.0 on climate.heat_virtuel_multi ». Après 1 min, *Monitoring* passe à *Problème* : *target*, climate.heat_virtuel_multi (heat), temperature attendu 23, lu 20 ; warning « climate.heat_virtuel_multi (heat) shows temperature 20.0 instead of 23.0 for 1 min » et événement *started*. Désactiver *Panne HEAT*, mettre *Consigne HEAT* à 23 à la main : le problème disparaît, info « shows the temperature sent to it again » et événement *ended*.
      9. **Reprise sur la source** : en *heat*, mettre *Consigne HEAT* à 25 à la main : Adaptative MULTI prend 25, aucun problème *target*, même après 1 min.
      10. **Pendant les 12 s** : éteint, activer *Panne HEAT*, passer en *heat* : erreur, rien ne s'allume, aucun problème. Désactiver *Panne HEAT*, passer en *heat*, et dans les 12 s mettre *Consigne HEAT* à 27 : pas de problème *target* (la source peut renvoyer sa consigne), et *Consigne HEAT* revient à la consigne d'Adaptative MULTI à la fin des 12 s.
      11. **Source qui ne s'éteint pas** : en *heat*, activer *Panne HEAT*, passer en *cool* : *Monitoring* passe tout de suite à *Problème* : *exclusivity*, climate.heat_virtuel_multi (heat) tourne avec climate.cool_virtuel_multi ; warning « does not turn off while climate.cool_virtuel_multi runs (...); tried again every minute » et événement *started*. Attendre 1 min : rien de nouveau. Désactiver *Panne HEAT* : dans la minute, HEAT Virtuel s'éteint, le problème disparaît, info « no longer runs along with another source » et événement *ended*.
      12. **Consigne réessayée** : en *heat*, attendre 12 s. Activer *Panne HEAT*, régler la consigne d'Adaptative MULTI à 24, et désactiver *Panne HEAT* dans les 5 s : *Consigne HEAT* passe à 24 au nouvel essai, aucun warning « Could not set », aucun problème.
      13. **Resynchro** : refaire le 8 jusqu'au problème *target*, puis désactiver *Panne HEAT* sans toucher à *Consigne HEAT* : au plus 30 min après l'activation d'Adaptative MULTI (puis toutes les 30 min), *Consigne HEAT* passe à 23 tout seul, le problème disparaît. Ensuite, mettre *Consigne HEAT* à 25 à la main : Adaptative MULTI prend 25, rien n'est renvoyé à la resynchro suivante.

      </small>
    view_layout:
      position: sidebar

