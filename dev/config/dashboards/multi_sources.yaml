      - type: markdown
        content: |
          {% if states.climate.adaptative_multi is none %}
          > ⚠️ **`climate.adaptative_multi` introuvable.** Vérifier la section `adaptative_climate:` de
          > `dev/config/configuration.yaml` et les journaux, puis redémarrer.

          {% endif %}
          {% set active = state_attr('climate.adaptative_multi', 'active_entity_id') %}
          | Source | Mode | Temp. | Consigne | Min | Max | Fan | Swing | Swing H | Action | |
          |:--|:--|--:|--:|--:|--:|:--|:--|:--|:--|:-:|
          {% for label, e in [('HEAT', 'climate.heat_virtuel_multi'), ('COOL', 'climate.cool_virtuel_multi'), ('DRY', 'climate.dry_virtuel_multi'), ('FAN_ONLY', 'climate.fan_only_virtuel_multi'), ('AUTO', 'climate.auto_virtuel_multi')] %}
          | {{ label }} | {{ states(e) }} | {{ state_attr(e, 'current_temperature') }} | {{ state_attr(e, 'temperature') }} | {{ state_attr(e, 'min_temp') }} | {{ state_attr(e, 'max_temp') }} | {{ state_attr(e, 'fan_mode') }} | {{ state_attr(e, 'swing_mode') }} | {{ state_attr(e, 'swing_horizontal_mode') }} | {{ state_attr(e, 'hvac_action') }} | {{ '◀' if e == active else '' }} |
