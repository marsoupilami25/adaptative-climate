# Case 2: one Adaptative Climate with every mode, one single-mode source per mode.
# YAML dashboard: after editing this file, refresh the page in the browser.
title: Tests multi-sources
views:
- title: Pilotage
  path: pilotage
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Adaptative MULTI
    - type: thermostat
      entity: climate.adaptative_multi
      features:
      - type: climate-hvac-modes
      grid_options:
        columns: full
    - type: entities
      entities:
      - entity: climate.adaptative_multi
        type: attribute
        attribute: hvac_action
        name: Action
      - entity: climate.adaptative_multi
        type: attribute
        attribute: active_entity_id
        name: Source active
      - entity: climate.adaptative_multi
        type: attribute
        attribute: temperature
        name: Consigne
        suffix: °C
      - entity: climate.adaptative_multi
        type: attribute
        attribute: min_temp
        name: Min
        suffix: °C
      - entity: climate.adaptative_multi
        type: attribute
        attribute: max_temp
        name: Max
        suffix: °C
      grid_options:
        columns: full
    - type: tile
      entity: climate.adaptative_multi
      name: Marche / arrêt
      icon_tap_action:
        action: toggle
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: État
    - type: markdown
      content: |
        {% if states.climate.adaptative_multi is none %}
        > ⚠️ **`climate.adaptative_multi` introuvable.** Vérifier la section `adaptative_climate:` de
        > `dev/config/configuration.yaml` et les journaux, puis redémarrer.

        {% endif %}
        {% set active = state_attr('climate.adaptative_multi', 'active_entity_id') %}
        | Source | Mode | Consigne | Action | |
        |:--|:--|--:|:--|:-:|
        {% for label, e in [('HEAT', 'climate.heat_virtuel'), ('COOL', 'climate.cool_virtuel'), ('DRY', 'climate.dry_virtuel'), ('FAN_ONLY', 'climate.fan_only_virtuel'), ('AUTO', 'climate.auto_virtuel')] %}
        | {{ label }} | {{ states(e) }} | {{ state_attr(e, 'temperature') }} | {{ state_attr(e, 'hvac_action') }} | {{ '◀' if e == active else '' }} |
        {% endfor %}

        Pièce : **{{ states('input_number.temperature_courante') }} °C**
      grid_options:
        columns: full
    - type: entities
      entities:
      - input_number.temperature_courante
      - entity: script.reset_sources_test
        name: Tout remettre à zéro
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: markdown
      content: |
        ## Scénarios

        Partir de **Tout remettre à zéro**.

        1. **Changement de mode** : passer en *heat*, puis en *cool*. HEAT Virtuel repasse à *off* avant que COOL Virtuel passe à *cool*.
        2. **Consigne** : en *cool*, changer la consigne. Seule *Consigne COOL* bouge.
        3. **Changement externe** : allumer HEAT Virtuel depuis sa carte (vue Sources). Adaptative MULTI passe en *heat*.
        4. **Deux sources allumées** : allumer aussi COOL Virtuel à la main. Adaptative MULTI affiche le premier mode dans l'ordre heat, cool, auto, dry, fan_only.
        5. **Marche / arrêt** : éteindre puis rallumer. Le dernier mode utilisé revient.
        6. **Source indisponible** : couper *HEAT disponible*. *heat* n'est plus détecté ; l'entité reste disponible tant qu'une autre source l'est. Tout couper : l'entité devient indisponible.
        7. **Bornes** : Min/Max suivent la source affichée, sans dépasser 7–35 °C.
      grid_options:
        columns: full
- title: Sources
  path: sources
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Source HEAT Virtuel
    - type: thermostat
      entity: climate.heat_virtuel
      grid_options:
        columns: full
    - type: entities
      entities:
      - input_select.mode_heat
      - input_number.consigne_heat
      - input_boolean.dispo_heat
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Source COOL Virtuel
    - type: thermostat
      entity: climate.cool_virtuel
      grid_options:
        columns: full
    - type: entities
      entities:
      - input_select.mode_cool
      - input_number.consigne_cool
      - input_select.fan_cool
      - input_select.swing_cool
      - input_boolean.dispo_cool
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Source DRY Virtuel
    - type: thermostat
      entity: climate.dry_virtuel
      grid_options:
        columns: full
    - type: entities
      entities:
      - input_select.mode_dry
      - input_number.consigne_dry
      - input_select.fan_dry
      - input_select.swing_dry
      - input_boolean.dispo_dry
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Source FAN_ONLY Virtuel
    - type: thermostat
      entity: climate.fan_only_virtuel
      grid_options:
        columns: full
    - type: entities
      entities:
      - input_select.mode_fan_only
      - input_number.consigne_fan_only
      - input_select.fan_fan_only
      - input_select.swing_fan_only
      - input_boolean.dispo_fan_only
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Source AUTO Virtuel
    - type: thermostat
      entity: climate.auto_virtuel
      grid_options:
        columns: full
    - type: entities
      entities:
      - input_select.mode_auto
      - input_number.consigne_auto
      - input_boolean.dispo_auto
      grid_options:
        columns: full
