  - type: markdown
    content: |
      ## Scénarios (1/3) : base et mémoire des réglages

      Partir de **Tout remettre à zéro**.

      ### Base

      1. **Changement de mode** : passer en *heat*, puis en *cool*. HEAT Virtuel repasse à *off* avant que COOL Virtuel passe à *cool*.
      2. **Consigne** : en *cool*, changer la consigne. Seule *Consigne COOL* bouge.
      3. **Changement externe** : éteint, régler la plage d'Adaptative MULTI à 23–26. Allumer HEAT Virtuel depuis sa carte (vue Sources). Adaptative MULTI passe en *heat* et *Consigne HEAT* passe de 20 à 23.
      4. **Deuxième source allumée** : HEAT Virtuel allumé (scénario 3), allumer aussi COOL Virtuel à la main. HEAT Virtuel s'éteint et Adaptative MULTI passe en *cool* : la dernière source allumée l'emporte.
      5. **Marche / arrêt** : éteindre puis rallumer. Le dernier mode utilisé revient.
      6. **Source indisponible** : couper *HEAT disponible*. *heat* n'est plus détecté ; l'entité reste disponible tant qu'une autre source l'est. **Toutes les sources indisponibles** : l'entité devient indisponible ; **Toutes les sources disponibles** les rétablit.
      7. **Bornes** : Min/Max suivent la source du mode actif. En *heat* : 5–30 °C, en *cool* : 16–32 °C, en *dry* : 18–30 °C, en *fan_only* : 10–35 °C, en *auto* : 10–30 °C. Éteint : la plage la plus large, 5–35 °C.
      8. **Fan et swing par source** : en *fan_only*, changer le fan. Seul *Fan FAN_ONLY* bouge. Passer en *auto* : le fan affiché est celui d'AUTO Virtuel.
      9. **Fan/swing absents** : couper *Fan HEAT actif*, *Swing HEAT actif* et *Swing horizontal HEAT actif*. En *heat*, ni fan ni swing ; en *cool*, ils reviennent. Éteint : ni fan ni swing.

      ### Mémoire des réglages

      *heat*, *cool* et *dry* sont synchronisés ; *fan_only* et *auto* ont chacun leur mémoire.
      Les sources n'écrivent pas leurs options pareil : HEAT en *Capitales* avec *Turbo* en plus,
      DRY en *MAJUSCULES* sans *medium*, les autres en minuscules.
      **Tout remettre à zéro** n'efface pas la mémoire : elle appartient à Adaptative MULTI.

      1. **Mémoire par mode** : en *fan_only*, fan *high*. En *auto*, fan *low*. Repasser en *fan_only* : *Fan FAN_ONLY* revient à *high* ; puis en *auto* : *Fan AUTO* revient à *low*.
      2. **Changement pendant l'arrêt** : éteindre, mettre *Fan FAN_ONLY* à *auto* (vue Sources), passer en *fan_only* : le fan revient à *high*.
      3. **Synchronisation et casse** : en *cool*, fan *high*. Passer en *heat* : *Fan HEAT* passe à *High*. Passer en *dry* : *Fan DRY* passe à *HIGH*.
      4. **Valeur propre à une source** : en *heat*, la liste propose *Turbo*. Le choisir : HEAT Virtuel passe en *Turbo*. Passer en *cool* : le fan revient à *high*, *Turbo* n'est pas retenu. Même chose avec *Medium* (absent de DRY).
      5. **Changement sur la source** : en *cool*, mettre *Fan COOL* à *low* depuis la vue Sources. Passer en *heat* : *Fan HEAT* passe à *Low*.
      6. **Swing synchronisé** : en *heat*, swing *On* et swing horizontal *Left*. Passer en *cool*, puis en *dry* : *on* et *left* partout.
      7. **Après un redémarrage** : en *cool*, fan *high*, puis éteindre et mettre *Fan HEAT* à *Auto* (vue Sources). Redémarrer Home Assistant, passer en *heat* : *Fan HEAT* passe à *High*.
    view_layout:
      position: sidebar
- title: Consigne
  path: consigne
  type: sidebar
  cards:
  - *pilotage
  - type: markdown
    content: |
      ## Scénarios (2/3) : consignes

      Partir de **Tout remettre à zéro**.

      ### Consigne

      Adaptative MULTI garde deux consignes : chauffage et refroidissement. Celle de *heat* est la
      consigne basse de *heat_cool*, celle de *cool* la consigne haute. *dry* et *auto* ont une
      consigne simple à part ; *fan_only* n'en a pas. Chaque source reçoit la sienne en entrant dans son mode, et la basse
      reste au moins à l'écart minimal sous la haute (aucun ici : elles peuvent être égales).
      Sources : HEAT 5–30 °C, COOL 16–32 °C au pas de 1 °C, DRY 18–30 °C.
      **Tout remettre à zéro** remet les consignes des sources à 20 °C, pas celles d'Adaptative MULTI.

      1. **Consigne par mode** : en *heat*, consigne 18 : *Consigne HEAT* passe à 18. Passer en *cool* : Adaptative MULTI affiche sa consigne de refroidissement (20 la première fois), *Consigne COOL* reste à 20. La régler à 26 : *Consigne COOL* passe à 26. Passer en *dry*, régler 24 : seule *Consigne DRY* bouge. Repasser en *heat* : 18 ; en *cool* : 26.
      2. **Les consignes se poussent** : en *heat*, consigne 28 : la consigne de refroidissement monte aussi à 28 (*Consigne COOL* passe à 28 à l'entrée en *cool*). En *cool*, consigne 17 : la consigne de chauffage descend à 17.
      3. **Source allumée ailleurs** : éteindre : le thermostat montre la plage (basse–haute). La régler à 18–26, puis mettre *Consigne HEAT* à 22 (vue Sources) : Adaptative MULTI ne bouge pas. Allumer HEAT Virtuel depuis sa carte : *Consigne HEAT* revient à 18. Même chose avec COOL Virtuel : *Consigne COOL* passe à 26.
      4. **Changement sur la source** : en *heat*, attendre 12 s, puis mettre *Consigne HEAT* à 19 (vue Sources). Adaptative MULTI affiche 19. Passer en *cool* : sa consigne de refroidissement ne change pas. Repasser en *heat* : 19.
      5. **Consigne tardive de la source** : éteint, régler la plage à 18–20 (20 est la consigne de COOL Virtuel après la remise à zéro), passer en *cool* : rien n'est envoyé, la source est déjà à 20. Dans les 12 s, mettre *Consigne COOL* à 27 (comme un appareil qui renvoie sa propre consigne après le mode) : Adaptative MULTI affiche toujours 20. Au bout des 12 s, *Consigne COOL* revient à 20. Ensuite, mettre *Consigne COOL* à 26 : Adaptative MULTI suit.
      6. **Consigne confirmée** : en *cool*, consigne 25. Passer en *heat*, mettre *Consigne COOL* à 22 (vue Sources) : Adaptative MULTI ne bouge pas. Repasser en *cool* : *Consigne COOL* passe à 25, ce qui confirme le mode. Tout de suite après, mettre *Consigne COOL* à 24 : Adaptative MULTI suit sans attendre 12 s.
      7. **Bornes** : chaque consigne reste dans la plage de sa source. En *cool*, consigne 32 (maximum) ; en *dry*, 30 (maximum de DRY) ; de retour en *cool*, 32. En *heat*, consigne 5 (minimum de HEAT) : la consigne de refroidissement ne bouge pas.
      8. **Arrondi** : en *cool*, consigne 21,5 : *Consigne COOL* passe à 22 (pas de 1 °C) et Adaptative MULTI affiche 22.
      9. **Consignes réglées éteint** : éteindre, régler la plage d'Adaptative MULTI à 18–24. Aucune source ne bouge. Passer en *heat* : *Consigne HEAT* passe de 20 à 18. Éteindre, passer en *cool* : *Consigne COOL* passe à 24.
      10. **Après un redémarrage** : en *heat*, consigne 18 ; en *cool*, consigne 25 ; éteindre, puis **Tout remettre à zéro**. Redémarrer Home Assistant, passer en *heat* : *Consigne HEAT* passe à 18 ; en *cool* : *Consigne COOL* passe à 25.
      11. **fan_only sans consigne** : en *dry*, consigne 24. Passer en *fan_only* : Adaptative MULTI n'affiche aucune consigne et *Consigne FAN_ONLY* reste à 20. Attendre 12 s, mettre *Consigne FAN_ONLY* à 27 (vue Sources) : Adaptative MULTI n'affiche toujours rien. Depuis *Outils de développement > Actions*, appeler `climate.set_temperature` sur Adaptative MULTI avec `temperature: 22` : aucune source ne bouge. Passer en *dry* : *Consigne DRY* passe à 22.
    view_layout:
      position: sidebar
- title: heat_cool
  path: heat-cool
  type: sidebar
  cards:
  - *pilotage
  - type: markdown
    content: |
      ## Scénarios (3/3) : heat_cool avec HEAT et COOL

      Partir de **Tout remettre à zéro**.

      ### heat_cool avec HEAT et COOL

      Pas de source *heat_cool* : Adaptative MULTI allume HEAT Virtuel ou COOL Virtuel selon
      *Température du capteur*. Sous la consigne basse, HEAT chauffe vers la consigne basse ;
      au-dessus de la haute, COOL refroidit vers la consigne haute ; entre les deux, la source
      allumée est gardée. Sans capteur, c'est la température de la source active qui compte.
      La plage appartient à Adaptative MULTI et n'est affichée qu'en *heat_cool*.

      1. **Entrée** : capteur à 15, passer en *heat_cool* : HEAT Virtuel passe en *heat*. Régler la plage à 19–25 : *Consigne HEAT* passe à 19. Adaptative MULTI affiche *heat_cool*, source active HEAT, Température 15 (le capteur).
      2. **Bascule vers COOL** : suite du 1, capteur à 26 : HEAT Virtuel s'éteint, COOL Virtuel passe en *cool* et *Consigne COOL* à 25 (la consigne haute). Adaptative MULTI reste en *heat_cool*, source active COOL.
      3. **Entre les consignes** : suite du 2, capteur à 22 : COOL Virtuel reste allumé. Capteur à 18 : retour sur HEAT Virtuel, *Consigne HEAT* à 19.
      4. **Départ au plus proche** : éteindre, plage 19–25 gardée. Capteur à 24, passer en *heat_cool* : COOL Virtuel s'allume (24 est plus près de 25). Éteindre, capteur à 20, passer en *heat_cool* : HEAT Virtuel s'allume.
      5. **Plage qui bascule** : en *heat_cool* sur HEAT Virtuel (capteur à 18), régler la plage à 15–17 : bascule sur COOL Virtuel, *Consigne COOL* à 17.
      6. **Bornes** : en *heat_cool*, Min/Max couvrent HEAT et COOL : 5–32 °C. Sur COOL Virtuel (capteur à 30), plage 10–14 : *Consigne COOL* passe à 16 (son minimum) et la consigne haute d'Adaptative MULTI devient 16, même en remettant 14 une deuxième fois : elle ne sert qu'à COOL. Capteur à 5 : bascule sur HEAT Virtuel. Capteur à 15 : HEAT reste allumé (15 est entre 10 et 16). Capteur à 17 : bascule sur COOL Virtuel.
      7. **Changement sur la source** : en *heat_cool* sur HEAT Virtuel, attendre 12 s, puis mettre *Consigne HEAT* à 20 (vue Sources) : la consigne basse d'Adaptative MULTI passe à 20.
      8. **Source éteinte ailleurs** : en *heat_cool* sur HEAT Virtuel, éteindre HEAT Virtuel depuis sa carte (vue Sources) : Adaptative MULTI passe à *off*. Capteur à 30 : rien ne s'allume.
      9. **Autre mode allumé ailleurs** : en *heat_cool* sur HEAT Virtuel, allumer COOL Virtuel depuis sa carte : HEAT Virtuel s'éteint, Adaptative MULTI passe en *cool* (plus en *heat_cool*). Capteur à 15 : COOL Virtuel reste allumé.
      10. **Capteur indisponible** : chaque source a sa propre température (*Température HEAT*, *COOL*...), toutes à 20. Éteint, couper *Capteur disponible* : Adaptative MULTI lit la première source disponible, HEAT Virtuel. *Température HEAT* à 15 : il affiche 15 ; *Température COOL* à 30 : rien ne change. Passer en *heat_cool* (plage 19–25) : HEAT Virtuel s'allume (15 < 19). *Température HEAT* à 26 : bascule sur COOL Virtuel ; Adaptative MULTI lit maintenant *Température COOL* (30) et reste sur COOL. Rallumer le capteur (20) : il reprend la main, COOL reste allumé (20 est entre 19 et 25).
      11. **Source indisponible** : couper *COOL disponible* : *heat_cool* apparaît dans *Modes indisponibles*, et le choisir est refusé avec un message, sans rien éteindre.
      12. **Consigne simple = basse ou haute** : plage 19–25. En *heat*, Adaptative MULTI affiche 19 et aucune plage ; la régler à 22 : la basse passe à 22. Passer en *cool* : elle affiche 25 ; la régler à 26 : la haute passe à 26. Passer en *heat_cool* : plage 22–26, pas de consigne simple.
      13. **Marche / arrêt** : en *heat_cool*, éteindre puis rallumer : *heat_cool* revient.
      14. **Après un redémarrage** : en *heat_cool* sur HEAT Virtuel, plage 19–25. Redémarrer Home Assistant : Adaptative MULTI est toujours en *heat_cool*, avec la plage 19–25.
    view_layout:
      position: sidebar

