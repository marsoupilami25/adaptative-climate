# Home Assistant configuration for the manual tests of Adaptative Climate.
# Linked into a dev config folder by dev/manual/link_config.sh (see dev/manual/README.md).

# Loads default set of integrations. Do not remove.
default_config:

homeassistant:
  # Virtual source entities and their helpers, one package per case.
  packages: !include_dir_named packages

lovelace:
  dashboards:
    tests-mono:
      mode: yaml
      filename: dashboards/mono.yaml
      title: Tests mono-mode
      icon: mdi:numeric-1-box-outline
      show_in_sidebar: true
    tests-bi:
      mode: yaml
      filename: dashboards/bi.yaml
      title: Tests bi-source
      icon: mdi:sun-snowflake-variant
      show_in_sidebar: true
    tests-multi:
      mode: yaml
      filename: dashboards/multi.yaml
      title: Tests multi-sources
      icon: mdi:view-grid-outline
      show_in_sidebar: true
    tests-unique:
      mode: yaml
      filename: dashboards/unique.yaml
      title: Tests source unique
      icon: mdi:checkbox-blank-outline
      show_in_sidebar: true
    tests-surv:
      mode: yaml
      filename: dashboards/surv.yaml
      title: Tests monitoring
      icon: mdi:alert-circle-outline
      show_in_sidebar: true
    tests-manuel:
      mode: yaml
      filename: dashboards/manuel.yaml
      title: Tests manuels
      icon: mdi:hand-back-right-outline
      show_in_sidebar: true

# Entities under test, imported as config entries at startup (spec §3.2).
# Each case has its own virtual sources (packages/sources_<case>.yaml).
# The delays are short, for manual tests (defaults: monitoring 900 s...).
adaptative_climate:
  # --- Case mono: one entity per mode, each with its own source ----------------------
  - name: Adaptative HEAT
    heat_entity: climate.heat_virtuel_mono
    max_temp: 25
    request_retry_timer: 60
    monitoring_delay_timer: 60
  - name: Adaptative COOL
    cool_entity: climate.cool_virtuel_mono
    monitoring_delay_timer: 60
  - name: Adaptative DESHUM
    dry_entity: climate.deshum_virtuel_mono
  - name: Adaptative FAN_ONLY
    fan_only_entity: climate.fan_only_virtuel_mono
  - name: Adaptative AUTO
    auto_entity: climate.auto_virtuel_mono
  - name: Adaptative HEAT_COOL
    heat_cool_entity: climate.heat_cool_virtuel_mono
    min_gap: 2
  # The heat pump reads 2 degrees warmer than the room, in both modes (CFG-SENS-4).
  - name: Adaptative OFFSET
    heat_entity: climate.pac_virtuel_mono
    dry_entity: climate.pac_virtuel_mono
    heat_offset: 2
    dry_offset: 2
    max_temp: 26
  # The valve gets the room temperature (its offset is then 0, CFG-SENS-2).
  - name: Adaptative TRV
    heat_entity: climate.trv_virtuel_mono
    temperature_sensor: sensor.capteur_piece_mono
    heat_external_sensor: input_number.temperature_externe_mono
    external_sensor_resend_timer: 60
    monitoring_delay_timer: 60

  # --- Case bi: heat_cool on two sources -------------------------------------------
  - name: Adaptative BI
    heat_entity: climate.radiateur_virtuel_bi
    cool_entity: climate.clim_virtuel_bi
    temperature_sensor: sensor.capteur_piece_bi
    min_gap: 2
    monitoring_delay_timer: 60

  # --- Case multi: one source per mode ----------------------------------------------
  - name: Adaptative MULTI
    heat_entity: climate.heat_virtuel_multi
    cool_entity: climate.cool_virtuel_multi
    dry_entity: climate.dry_virtuel_multi
    fan_only_entity: climate.fan_only_virtuel_multi
    auto_entity: climate.auto_virtuel_multi
    temperature_sensor: sensor.capteur_piece_multi
    sync_modes: [heat, cool, dry]
    removal_confirmation_timer: 30
    monitoring_delay_timer: 60

  # --- Case unique: every mode on one source ------------------------------------------
  - name: Adaptative ALL
    heat_entity: climate.all_virtuel_unique
    cool_entity: climate.all_virtuel_unique
    heat_cool_entity: climate.all_virtuel_unique
    auto_entity: climate.all_virtuel_unique
    dry_entity: climate.all_virtuel_unique
    fan_only_entity: climate.all_virtuel_unique
    sync_modes: [heat, cool, dry]

  # --- Case surv: the monitoring -----------------------------------------------------
  - name: Adaptative SURV
    heat_entity: climate.radiateur_virtuel_surv
    cool_entity: climate.clim_virtuel_surv
    temperature_sensor: sensor.capteur_piece_surv
    monitoring_delay_timer: 30
    request_confirmation_timer: 10
    request_retry_timer: 30
  # A source that never exists (MON-SRC-5).
  - name: Adaptative FANTOME
    heat_entity: climate.fantome_surv
    monitoring_delay_timer: 30

  # --- Case manuel: created from the UI (dashboard "Tests manuels") ----------------

logger:
  default: warning
  logs:
    custom_components.adaptative_climate: debug

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
