# Virtual sources of the case "surv" (Tests monitoring).
# Generated once, then edited by hand. Every entity id ends with _surv.
#
# Each source shows the state of its helpers; the service calls of Home
# Assistant change them, when the source obeys (see dev/manual/README.md).

template:
  - climate:
      - name: RADIATEUR Virtuel (surv)
        unique_id: radiateur_virtuel_surv
        default_entity_id: climate.radiateur_virtuel_surv
        # Off: offers no mode but off (a served mode lost, SRC-UNUS-2)
        hvac_modes: >-
          {{ ['off', 'heat'] if is_state('input_boolean.mode_offert_radiateur_surv', 'on') else ['off'] }}
        # Inconnu: the state is unknown
        hvac_mode: >-
          {{ none if is_state('input_boolean.inconnu_radiateur_surv', 'on') else states('input_select.mode_radiateur_surv') }}
        availability: "{{ is_state('input_boolean.dispo_radiateur_surv', 'on') }}"
        min_temperature: 5
        max_temperature: 30
        current_temperature: "{{ states('input_number.temperature_radiateur_surv') | float(none) }}"
        target_temperature: "{{ states('input_number.consigne_radiateur_surv') | float(none) }}"
        hvac_action: >-
          {% set m = states('input_select.mode_radiateur_surv') %}
          {% set t = states('input_number.temperature_radiateur_surv') | float(20) %}
          {% set c = states('input_number.consigne_radiateur_surv') | float(20) %}
          {% if m == 'off' %}off{% elif m == 'dry' %}drying{% elif m == 'fan_only' %}fan{% elif m == 'heat' %}{{ 'heating' if t < c else 'idle' }}{% elif m == 'cool' %}{{ 'cooling' if t > c else 'idle' }}{% else %}{{ 'heating' if t < c else 'cooling' if t > c else 'idle' }}{% endif %}
        set_hvac_mode:
          - condition: state
            entity_id: input_boolean.obeit_radiateur_surv
            state: "on"
          - delay:
              seconds: "{{ states('input_number.delai_radiateur_surv') | int(0) }}"
          - action: input_select.select_option
            target:
              entity_id: input_select.mode_radiateur_surv
            data:
              option: "{{ hvac_mode }}"
        set_temperature:
          - condition: state
            entity_id: input_boolean.applique_radiateur_surv
            state: "on"
          - if: "{{ temperature is defined and temperature is not none }}"
            then:
              - action: input_number.set_value
                target:
                  entity_id: input_number.consigne_radiateur_surv
                data:
                  value: "{{ temperature }}"
      - name: CLIM Virtuel (surv)
        unique_id: clim_virtuel_surv
        default_entity_id: climate.clim_virtuel_surv
        # Off: offers no mode but off (a served mode lost, SRC-UNUS-2)
        hvac_modes: >-
          {{ ['off', 'cool'] if is_state('input_boolean.mode_offert_clim_surv', 'on') else ['off'] }}
        # Inconnu: the state is unknown
        hvac_mode: >-
          {{ none if is_state('input_boolean.inconnu_clim_surv', 'on') else states('input_select.mode_clim_surv') }}
        availability: "{{ is_state('input_boolean.dispo_clim_surv', 'on') }}"
        min_temperature: 16
        max_temperature: 30
        current_temperature: "{{ states('input_number.temperature_clim_surv') | float(none) }}"
        target_temperature: "{{ states('input_number.consigne_clim_surv') | float(none) }}"
        hvac_action: >-
          {% set m = states('input_select.mode_clim_surv') %}
          {% set t = states('input_number.temperature_clim_surv') | float(20) %}
          {% set c = states('input_number.consigne_clim_surv') | float(20) %}
          {% if m == 'off' %}off{% elif m == 'dry' %}drying{% elif m == 'fan_only' %}fan{% elif m == 'heat' %}{{ 'heating' if t < c else 'idle' }}{% elif m == 'cool' %}{{ 'cooling' if t > c else 'idle' }}{% else %}{{ 'heating' if t < c else 'cooling' if t > c else 'idle' }}{% endif %}
        fan_modes: >-
          {{ state_attr('input_select.fan_clim_surv', 'options') if is_state('input_boolean.fan_actif_clim_surv', 'on') else [] }}
        fan_mode: >-
          {{ states('input_select.fan_clim_surv') if is_state('input_boolean.fan_actif_clim_surv', 'on') else none }}
        set_hvac_mode:
          - condition: state
            entity_id: input_boolean.obeit_clim_surv
            state: "on"
          - delay:
              seconds: "{{ states('input_number.delai_clim_surv') | int(0) }}"
          - action: input_select.select_option
            target:
              entity_id: input_select.mode_clim_surv
            data:
              option: "{{ hvac_mode }}"
        set_temperature:
          - condition: state
            entity_id: input_boolean.applique_clim_surv
            state: "on"
          - if: "{{ temperature is defined and temperature is not none }}"
            then:
              - action: input_number.set_value
                target:
                  entity_id: input_number.consigne_clim_surv
                data:
                  value: "{{ temperature }}"
        set_fan_mode:
          - condition: state
            entity_id: input_boolean.applique_clim_surv
            state: "on"
          - action: input_select.select_option
            target:
              entity_id: input_select.fan_clim_surv
            data:
              option: "{{ fan_mode }}"
  - sensor:
      - name: Capteur pièce (surv)
        unique_id: capteur_piece_surv
        default_entity_id: sensor.capteur_piece_surv
        device_class: temperature
        unit_of_measurement: "°C"
        state: "{{ states('input_number.temperature_capteur_surv') }}"
        availability: "{{ is_state('input_boolean.dispo_capteur_surv', 'on') }}"

input_select:
  mode_radiateur_surv:
    name: Mode RADIATEUR
    options: ['off', 'heat']
    icon: mdi:hvac
  mode_clim_surv:
    name: Mode CLIM
    options: ['off', 'cool']
    icon: mdi:hvac
  fan_clim_surv:
    name: Fan CLIM
    options: ['auto', 'low', 'high']
    icon: mdi:fan

input_number:
  consigne_radiateur_surv:
    name: Consigne RADIATEUR
    min: 5
    max: 30
    step: 0.1
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:thermometer-check
  temperature_radiateur_surv:
    name: Température RADIATEUR
    min: 0
    max: 40
    step: 0.1
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:home-thermometer
  delai_radiateur_surv:
    name: Délai RADIATEUR
    min: 0
    max: 120
    step: 1
    unit_of_measurement: "s"
    mode: box
    icon: mdi:timer-sand
    initial: 0
  consigne_clim_surv:
    name: Consigne CLIM
    min: 16
    max: 30
    step: 0.1
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:thermometer-check
  temperature_clim_surv:
    name: Température CLIM
    min: 0
    max: 40
    step: 0.1
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:home-thermometer
  delai_clim_surv:
    name: Délai CLIM
    min: 0
    max: 120
    step: 1
    unit_of_measurement: "s"
    mode: box
    icon: mdi:timer-sand
    initial: 0
  temperature_capteur_surv:
    name: Température capteur pièce
    min: 0
    max: 40
    step: 0.1
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:thermometer

input_boolean:
  dispo_radiateur_surv:
    name: RADIATEUR disponible
    initial: true
    icon: mdi:power-plug
  inconnu_radiateur_surv:
    name: RADIATEUR inconnu
    initial: false
    icon: mdi:help-circle-outline
  obeit_radiateur_surv:
    name: RADIATEUR obéit au mode
    initial: true
    icon: mdi:check-circle-outline
  applique_radiateur_surv:
    name: RADIATEUR applique les réglages
    initial: true
    icon: mdi:tune-variant
  mode_offert_radiateur_surv:
    name: RADIATEUR offre ses modes
    initial: true
    icon: mdi:format-list-checks
  dispo_clim_surv:
    name: CLIM disponible
    initial: true
    icon: mdi:power-plug
  inconnu_clim_surv:
    name: CLIM inconnu
    initial: false
    icon: mdi:help-circle-outline
  obeit_clim_surv:
    name: CLIM obéit au mode
    initial: true
    icon: mdi:check-circle-outline
  applique_clim_surv:
    name: CLIM applique les réglages
    initial: true
    icon: mdi:tune-variant
  mode_offert_clim_surv:
    name: CLIM offre ses modes
    initial: true
    icon: mdi:format-list-checks
  fan_actif_clim_surv:
    name: Fan CLIM actif
    initial: true
    icon: mdi:fan
  dispo_capteur_surv:
    name: Capteur pièce disponible
    initial: true
    icon: mdi:power-plug

script:
  reset_sources_test_surv:
    alias: Remettre les sources à zéro (surv)
    icon: mdi:restore
    sequence:
      - action: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.dispo_radiateur_surv
            - input_boolean.obeit_radiateur_surv
            - input_boolean.applique_radiateur_surv
            - input_boolean.mode_offert_radiateur_surv
            - input_boolean.dispo_clim_surv
            - input_boolean.obeit_clim_surv
            - input_boolean.applique_clim_surv
            - input_boolean.mode_offert_clim_surv
            - input_boolean.fan_actif_clim_surv
            - input_boolean.dispo_capteur_surv
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.inconnu_radiateur_surv
            - input_boolean.inconnu_clim_surv
      - action: input_select.select_option
        target:
          entity_id:
            - input_select.mode_radiateur_surv
            - input_select.mode_clim_surv
        data:
          option: "off"
      - action: input_select.select_option
        target:
          entity_id: input_select.fan_clim_surv
        data:
          option: "auto"
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.temperature_radiateur_surv
            - input_number.temperature_clim_surv
            - input_number.temperature_capteur_surv
        data:
          value: 20
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.consigne_radiateur_surv
            - input_number.consigne_clim_surv
        data:
          value: 20
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.delai_radiateur_surv
            - input_number.delai_clim_surv
        data:
          value: 0
