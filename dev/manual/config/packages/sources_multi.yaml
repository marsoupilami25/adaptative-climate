input_select:
  mode_heat_multi:
    name: Mode HEAT
    options: ['off', 'heat']
    icon: mdi:hvac
  fan_heat_multi:
    name: Fan HEAT
    options: ['Auto', 'Low', 'Medium', 'High', 'Turbo']
    icon: mdi:fan
  swing_heat_multi:
    name: Swing HEAT
    options: ['Off', 'On']
    icon: mdi:arrow-oscillating
  swing_horizontal_heat_multi:
    name: Horizontal swing HEAT
    options: ['Off', 'Left', 'Right']
    icon: mdi:arrow-left-right
  mode_cool_multi:
    name: Mode COOL
    options: ['off', 'cool']
    icon: mdi:hvac
  fan_cool_multi:
    name: Fan COOL
    options: ['auto', 'low', 'medium', 'high']
