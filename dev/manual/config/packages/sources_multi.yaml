# Virtual sources of the case "multi" (Tests multi-sources).
# Generated once, then edited by hand. Every entity id ends with _multi.
#
# Each source shows the state of its helpers; the service calls of Home
# Assistant change them, when the source obeys (see dev/manual/README.md).

template:
  - climate:
      - name: HEAT Virtual (multi)
        unique_id: heat_virtual_multi
        default_entity_id: climate.heat_virtual_multi
        # Off: offers no mode but off (a served mode lost, SRC-UNUS-2)
        hvac_modes: >-
          {{ ['off', 'heat'] if is_state('input_boolean.offers_heat_multi', 'on') else ['off'] }}
        # Unknown: the state is unknown
        hvac_mode: >-
          {{ none if is_state('input_boolean.unknown_heat_multi', 'on') else states('input_select.mode_heat_multi') }}
        availability: "{{ is_state('input_boolean.available_heat_multi', 'on') }}"
        min_temperature: 5
        max_temperature: 30
        current_temperature: "{{ states('input_number.temperature_heat_multi') | float(none) }}"
        target_temperature: "{{ states('input_number.target_heat_multi') | float(none) }}"
        hvac_action: >-
          {% set m = states('input_select.mode_heat_multi') %}
          {% set t = states('input_number.temperature_heat_multi') | float(20) %}
          {% set c = states('input_number.target_heat_multi') | float(20) %}
          {% if m == 'off' %}off{% elif m == 'dry' %}drying{% elif m == 'fan_only' %}fan{% elif m == 'heat' %}{{ 'heating' if t < c else 'idle' }}{% elif m == 'cool' %}{{ 'cooling' if t > c else 'idle' }}{% else %}{{ 'heating' if t < c else 'cooling' if t > c else 'idle' }}{% endif %}
        fan_modes: >-
          {{ state_attr('input_select.fan_heat_multi', 'options') if is_state('input_boolean.fan_on_heat_multi', 'on') else [] }}
        fan_mode: >-
          {{ states('input_select.fan_heat_multi') if is_state('input_boolean.fan_on_heat_multi', 'on') else none }}
        swing_modes: >-
          {{ state_attr('input_select.swing_heat_multi', 'options') if is_state('input_boolean.swing_on_heat_multi', 'on') else [] }}
        swing_mode: >-
          {{ states('input_select.swing_heat_multi') if is_state('input_boolean.swing_on_heat_multi', 'on') else none }}
        swing_horizontal_modes: >-
          {{ state_attr('input_select.swing_horizontal_heat_multi', 'options') if is_state('input_boolean.swing_horizontal_on_heat_multi', 'on') else [] }}
        swing_horizontal_mode: >-
          {{ states('input_select.swing_horizontal_heat_multi') if is_state('input_boolean.swing_horizontal_on_heat_multi', 'on') else none }}
        set_hvac_mode:
          - condition: state
            entity_id: input_boolean.obeys_heat_multi
            state: "on"
          - delay:
              seconds: "{{ states('input_number.delay_heat_multi') | int(0) }}"
          - action: input_select.select_option
            target:
              entity_id: input_select.mode_heat_multi
            data:
              option: "{{ hvac_mode }}"
        set_temperature:
          - condition: state
            entity_id: input_boolean.applies_heat_multi
            state: "on"
          - if: "{{ temperature is defined and temperature is not none }}"
            then:
              - action: input_number.set_value
                target:
                  entity_id: input_number.target_heat_multi
                data:
                  value: "{{ temperature }}"
        set_fan_mode:
          - condition: state
            entity_id: input_boolean.applies_heat_multi
            state: "on"
          - action: input_select.select_option
            target:
              entity_id: input_select.fan_heat_multi
            data:
              option: "{{ fan_mode }}"
        set_swing_mode:
          - condition: state
            entity_id: input_boolean.applies_heat_multi
            state: "on"
          - action: input_select.select_option
            target:
              entity_id: input_select.swing_heat_multi
            data:
              option: "{{ swing_mode }}"
        set_swing_horizontal_mode:
