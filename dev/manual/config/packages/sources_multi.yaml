            - input_boolean.fan_actif_auto_multi
            - input_boolean.dispo_capteur_multi
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.inconnu_heat_multi
            - input_boolean.inconnu_cool_multi
            - input_boolean.fan_reduit_cool_multi
            - input_boolean.inconnu_dry_multi
            - input_boolean.inconnu_fan_only_multi
            - input_boolean.inconnu_auto_multi
      - action: input_select.select_option
        target:
          entity_id:
            - input_select.mode_heat_multi
            - input_select.mode_cool_multi
            - input_select.mode_dry_multi
            - input_select.mode_fan_only_multi
            - input_select.mode_auto_multi
        data:
          option: "off"
      - action: input_select.select_option
        target:
          entity_id: input_select.fan_heat_multi
        data:
          option: "Auto"
      - action: input_select.select_option
        target:
          entity_id: input_select.swing_heat_multi
        data:
          option: "Off"
      - action: input_select.select_option
        target:
          entity_id: input_select.swing_horizontal_heat_multi
        data:
          option: "Off"
      - action: input_select.select_option
        target:
          entity_id: input_select.fan_cool_multi
        data:
          option: "auto"
      - action: input_select.select_option
        target:
          entity_id: input_select.swing_cool_multi
        data:
          option: "off"
      - action: input_select.select_option
        target:
          entity_id: input_select.swing_horizontal_cool_multi
        data:
          option: "off"
      - action: input_select.select_option
        target:
          entity_id: input_select.fan_dry_multi
        data:
          option: "AUTO"
      - action: input_select.select_option
        target:
          entity_id: input_select.swing_dry_multi
        data:
          option: "OFF"
      - action: input_select.select_option
        target:
          entity_id: input_select.fan_fan_only_multi
        data:
          option: "auto"
      - action: input_select.select_option
        target:
          entity_id: input_select.fan_auto_multi
        data:
          option: "auto"
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.temperature_heat_multi
            - input_number.temperature_cool_multi
            - input_number.temperature_dry_multi
            - input_number.temperature_fan_only_multi
            - input_number.temperature_auto_multi
            - input_number.temperature_capteur_multi
        data:
          value: 20
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.consigne_heat_multi
            - input_number.consigne_cool_multi
            - input_number.consigne_dry_multi
            - input_number.consigne_auto_multi
        data:
          value: 20
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.delai_heat_multi
