script:
  reset_sources_test_multi:
    alias: Remettre les sources à zéro (multi)
    icon: mdi:restore
    sequence:
      - action: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.dispo_heat_multi
            - input_boolean.obeit_heat_multi
            - input_boolean.applique_heat_multi
            - input_boolean.mode_offert_heat_multi
