            - input_boolean.swing_actif_cool_multi
            - input_boolean.swing_horizontal_actif_cool_multi
            - input_boolean.dispo_dry_multi
            - input_boolean.obeit_dry_multi
            - input_boolean.applique_dry_multi
            - input_boolean.mode_offert_dry_multi
            - input_boolean.fan_actif_dry_multi
            - input_boolean.swing_actif_dry_multi
            - input_boolean.dispo_fan_only_multi
            - input_boolean.obeit_fan_only_multi
            - input_boolean.applique_fan_only_multi
            - input_boolean.mode_offert_fan_only_multi
