script:
  reset_sources_multi:
    alias: Reset the sources (multi)
    icon: mdi:restore
    sequence:
      - action: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.available_heat_multi
            - input_boolean.obeys_heat_multi
            - input_boolean.applies_heat_multi
            - input_boolean.offers_heat_multi
            - input_boolean.fan_on_heat_multi
            - input_boolean.swing_on_heat_multi
            - input_boolean.swing_horizontal_on_heat_multi
            - input_boolean.available_cool_multi
            - input_boolean.obeys_cool_multi
            - input_boolean.applies_cool_multi
            - input_boolean.offers_cool_multi
            - input_boolean.fan_on_cool_multi
            - input_boolean.swing_on_cool_multi
            - input_boolean.swing_horizontal_on_cool_multi
            - input_boolean.available_dry_multi
            - input_boolean.obeys_dry_multi
            - input_boolean.applies_dry_multi
            - input_boolean.offers_dry_multi
            - input_boolean.fan_on_dry_multi
            - input_boolean.swing_on_dry_multi
            - input_boolean.available_fan_only_multi
            - input_boolean.obeys_fan_only_multi
            - input_boolean.applies_fan_only_multi
            - input_boolean.offers_fan_only_multi
            - input_boolean.fan_on_fan_only_multi
            - input_boolean.available_auto_multi
            - input_boolean.obeys_auto_multi
            - input_boolean.applies_auto_multi
            - input_boolean.offers_auto_multi
            - input_boolean.fan_on_auto_multi
            - input_boolean.room_sensor_available_multi
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.unknown_heat_multi
            - input_boolean.unknown_cool_multi
            - input_boolean.fan_reduced_cool_multi
            - input_boolean.unknown_dry_multi
            - input_boolean.unknown_fan_only_multi
            - input_boolean.unknown_auto_multi
      - action: input_select.select_option
        target:
          entity_id:
            - input_select.mode_heat_multi
            - input_select.mode_cool_multi
            - input_select.mode_dry_multi
            - input_select.mode_fan_only_multi
            - input_select.mode_auto_multi
        data:
          option: "off"
      - action: input_select.select_option
        target:
          entity_id: input_select.fan_heat_multi
        data:
          option: "Auto"
      - action: input_select.select_option
        target:
          entity_id: input_select.swing_heat_multi
        data:
          option: "Off"
      - action: input_select.select_option
        target:
          entity_id: input_select.swing_horizontal_heat_multi
        data:
          option: "Off"
      - action: input_select.select_option
        target:
          entity_id: input_select.fan_cool_multi
        data:
          option: "auto"
      - action: input_select.select_option
        target:
          entity_id: input_select.swing_cool_multi
        data:
          option: "off"
      - action: input_select.select_option
        target:
          entity_id: input_select.swing_horizontal_cool_multi
        data:
          option: "off"
      - action: input_select.select_option
        target:
          entity_id: input_select.fan_dry_multi
        data:
          option: "AUTO"
      - action: input_select.select_option
        target:
          entity_id: input_select.swing_dry_multi
        data:
          option: "OFF"
      - action: input_select.select_option
        target:
          entity_id: input_select.fan_fan_only_multi
        data:
          option: "auto"
      - action: input_select.select_option
        target:
          entity_id: input_select.fan_auto_multi
        data:
          option: "auto"
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.temperature_heat_multi
            - input_number.temperature_cool_multi
            - input_number.temperature_dry_multi
            - input_number.temperature_fan_only_multi
            - input_number.temperature_auto_multi
            - input_number.room_temperature_multi
        data:
          value: 20
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.target_heat_multi
            - input_number.target_cool_multi
            - input_number.target_dry_multi
            - input_number.target_auto_multi
        data:
          value: 20
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.delay_heat_multi
            - input_number.delay_cool_multi
            - input_number.delay_dry_multi
            - input_number.delay_fan_only_multi
            - input_number.delay_auto_multi
        data:
          value: 0
