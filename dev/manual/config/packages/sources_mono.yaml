# Virtual sources of the case "mono" (Tests mono).
# Generated once, then edited by hand. Every entity id ends with _mono.
#
# Each source shows the state of its helpers; the service calls of Home
# Assistant change them, when the source obeys (see dev/manual/README.md).

template:
  - climate:
      - name: HEAT Virtuel (mono)
        unique_id: heat_virtuel_mono
        default_entity_id: climate.heat_virtuel_mono
        # Off: offers no mode but off (a served mode lost, SRC-UNUS-2)
        hvac_modes: >-
          {{ ['off', 'heat'] if is_state('input_boolean.mode_offert_heat_mono', 'on') else ['off'] }}
        # Inconnu: the state is unknown
        hvac_mode: >-
          {{ none if is_state('input_boolean.inconnu_heat_mono', 'on') else states('input_select.mode_heat_mono') }}
        availability: "{{ is_state('input_boolean.dispo_heat_mono', 'on') }}"
        min_temperature: 8
        max_temperature: 30
        current_temperature: "{{ states('input_number.temperature_heat_mono') | float(none) }}"
        target_temperature: "{{ states('input_number.consigne_heat_mono') | float(none) }}"
        hvac_action: >-
          {% set m = states('input_select.mode_heat_mono') %}
          {% set t = states('input_number.temperature_heat_mono') | float(20) %}
          {% set c = states('input_number.consigne_heat_mono') | float(20) %}
          {% if m == 'off' %}off{% elif m == 'dry' %}drying{% elif m == 'fan_only' %}fan{% elif m == 'heat' %}{{ 'heating' if t < c else 'idle' }}{% elif m == 'cool' %}{{ 'cooling' if t > c else 'idle' }}{% else %}{{ 'heating' if t < c else 'cooling' if t > c else 'idle' }}{% endif %}
        fan_modes: >-
          {{ state_attr('input_select.fan_heat_mono', 'options') if is_state('input_boolean.fan_actif_heat_mono', 'on') else [] }}
        fan_mode: >-
          {{ states('input_select.fan_heat_mono') if is_state('input_boolean.fan_actif_heat_mono', 'on') else none }}
        set_hvac_mode:
          - condition: state
            entity_id: input_boolean.obeit_heat_mono
            state: "on"
          - delay:
              seconds: "{{ states('input_number.delai_heat_mono') | int(0) }}"
          - action: input_select.select_option
            target:
              entity_id: input_select.mode_heat_mono
            data:
              option: "{{ hvac_mode }}"
        set_temperature:
          - condition: state
            entity_id: input_boolean.applique_heat_mono
            state: "on"
          - if: "{{ temperature is defined and temperature is not none }}"
            then:
              - action: input_number.set_value
                target:
                  entity_id: input_number.consigne_heat_mono
                data:
                  value: "{{ temperature }}"
        set_fan_mode:
          - condition: state
            entity_id: input_boolean.applique_heat_mono
            state: "on"
          - action: input_select.select_option
            target:
              entity_id: input_select.fan_heat_mono
            data:
              option: "{{ fan_mode }}"
