script:
  reset_sources_mono:
    alias: Reset the sources (mono)
    icon: mdi:restore
    sequence:
      - action: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.available_heat_mono
            - input_boolean.obeys_heat_mono
            - input_boolean.applies_heat_mono
            - input_boolean.offers_heat_mono
            - input_boolean.fan_on_heat_mono
            - input_boolean.available_cool_mono
            - input_boolean.obeys_cool_mono
            - input_boolean.applies_cool_mono
            - input_boolean.offers_cool_mono
            - input_boolean.fan_on_cool_mono
            - input_boolean.swing_on_cool_mono
            - input_boolean.available_dehum_mono
            - input_boolean.obeys_dehum_mono
            - input_boolean.applies_dehum_mono
            - input_boolean.offers_dehum_mono
            - input_boolean.fan_on_dehum_mono
            - input_boolean.available_fan_only_mono
            - input_boolean.obeys_fan_only_mono
            - input_boolean.applies_fan_only_mono
            - input_boolean.offers_fan_only_mono
            - input_boolean.fan_on_fan_only_mono
            - input_boolean.available_auto_mono
            - input_boolean.obeys_auto_mono
            - input_boolean.applies_auto_mono
            - input_boolean.offers_auto_mono
            - input_boolean.available_heat_cool_mono
            - input_boolean.obeys_heat_cool_mono
            - input_boolean.applies_heat_cool_mono
            - input_boolean.offers_heat_cool_mono
            - input_boolean.available_heatpump_mono
            - input_boolean.obeys_heatpump_mono
            - input_boolean.applies_heatpump_mono
            - input_boolean.offers_heatpump_mono
            - input_boolean.available_trv_mono
            - input_boolean.obeys_trv_mono
            - input_boolean.applies_trv_mono
            - input_boolean.offers_trv_mono
            - input_boolean.room_sensor_available_mono
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.unknown_heat_mono
            - input_boolean.unknown_cool_mono
            - input_boolean.fan_reduced_cool_mono
            - input_boolean.unknown_dehum_mono
            - input_boolean.unknown_fan_only_mono
            - input_boolean.unknown_auto_mono
            - input_boolean.unknown_heat_cool_mono
            - input_boolean.unknown_heatpump_mono
            - input_boolean.unknown_trv_mono
      - action: input_select.select_option
        target:
          entity_id:
            - input_select.mode_heat_mono
            - input_select.mode_cool_mono
            - input_select.mode_dehum_mono
            - input_select.mode_fan_only_mono
            - input_select.mode_auto_mono
            - input_select.mode_heat_cool_mono
            - input_select.mode_heatpump_mono
            - input_select.mode_trv_mono
        data:
          option: "off"
      - action: input_select.select_option
        target:
          entity_id: input_select.fan_heat_mono
        data:
          option: "low"
      - action: input_select.select_option
        target:
          entity_id: input_select.fan_cool_mono
        data:
          option: "auto"
      - action: input_select.select_option
        target:
          entity_id: input_select.swing_cool_mono
        data:
          option: "off"
      - action: input_select.select_option
        target:
          entity_id: input_select.fan_dehum_mono
        data:
          option: "low"
      - action: input_select.select_option
        target:
          entity_id: input_select.fan_fan_only_mono
        data:
          option: "low"
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.temperature_heat_mono
            - input_number.temperature_cool_mono
            - input_number.temperature_dehum_mono
            - input_number.temperature_fan_only_mono
            - input_number.temperature_auto_mono
            - input_number.temperature_heat_cool_mono
            - input_number.temperature_heatpump_mono
            - input_number.temperature_trv_mono
            - input_number.room_temperature_mono
        data:
          value: 20
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.target_heat_mono
            - input_number.target_cool_mono
            - input_number.target_auto_mono
            - input_number.target_heatpump_mono
            - input_number.target_trv_mono
        data:
          value: 20
      - action: input_number.set_value
        target:
          entity_id: input_number.target_low_heat_cool_mono
        data:
          value: 19
      - action: input_number.set_value
        target:
          entity_id: input_number.target_high_heat_cool_mono
        data:
          value: 25
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.delay_heat_mono
            - input_number.delay_cool_mono
            - input_number.delay_dehum_mono
            - input_number.delay_fan_only_mono
            - input_number.delay_auto_mono
            - input_number.delay_heat_cool_mono
            - input_number.delay_heatpump_mono
            - input_number.delay_trv_mono
        data:
          value: 0
