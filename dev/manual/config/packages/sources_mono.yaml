        fan_modes: >-
          {{ (state_attr('input_select.fan_cool_mono', 'options') | reject('equalto', 'high') | list if is_state('input_boolean.fan_reduced_cool_mono', 'on') else state_attr('input_select.fan_cool_mono', 'options')) if is_state('input_boolean.fan_on_cool_mono', 'on') else [] }}
