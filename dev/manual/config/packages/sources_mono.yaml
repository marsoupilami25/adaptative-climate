script:
  reset_sources_test_mono:
    alias: Remettre les sources à zéro (mono)
    icon: mdi:restore
    sequence:
      - action: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.dispo_heat_mono
            - input_boolean.obeit_heat_mono
            - input_boolean.applique_heat_mono
            - input_boolean.mode_offert_heat_mono
            - input_boolean.fan_actif_heat_mono
            - input_boolean.dispo_cool_mono
            - input_boolean.obeit_cool_mono
            - input_boolean.applique_cool_mono
            - input_boolean.mode_offert_cool_mono
            - input_boolean.fan_actif_cool_mono
            - input_boolean.swing_actif_cool_mono
            - input_boolean.dispo_deshum_mono
            - input_boolean.obeit_deshum_mono
            - input_boolean.applique_deshum_mono
            - input_boolean.mode_offert_deshum_mono
            - input_boolean.fan_actif_deshum_mono
            - input_boolean.dispo_fan_only_mono
            - input_boolean.obeit_fan_only_mono
            - input_boolean.applique_fan_only_mono
            - input_boolean.mode_offert_fan_only_mono
            - input_boolean.fan_actif_fan_only_mono
            - input_boolean.dispo_auto_mono
            - input_boolean.obeit_auto_mono
            - input_boolean.applique_auto_mono
            - input_boolean.mode_offert_auto_mono
            - input_boolean.dispo_heat_cool_mono
            - input_boolean.obeit_heat_cool_mono
            - input_boolean.applique_heat_cool_mono
            - input_boolean.mode_offert_heat_cool_mono
            - input_boolean.dispo_pac_mono
            - input_boolean.obeit_pac_mono
            - input_boolean.applique_pac_mono
            - input_boolean.mode_offert_pac_mono
            - input_boolean.dispo_trv_mono
            - input_boolean.obeit_trv_mono
            - input_boolean.applique_trv_mono
            - input_boolean.mode_offert_trv_mono
            - input_boolean.dispo_capteur_mono
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.inconnu_heat_mono
            - input_boolean.inconnu_cool_mono
            - input_boolean.fan_reduit_cool_mono
            - input_boolean.inconnu_deshum_mono
            - input_boolean.inconnu_fan_only_mono
            - input_boolean.inconnu_auto_mono
            - input_boolean.inconnu_heat_cool_mono
            - input_boolean.inconnu_pac_mono
            - input_boolean.inconnu_trv_mono
      - action: input_select.select_option
        target:
          entity_id:
            - input_select.mode_heat_mono
            - input_select.mode_cool_mono
            - input_select.mode_deshum_mono
            - input_select.mode_fan_only_mono
            - input_select.mode_auto_mono
            - input_select.mode_heat_cool_mono
            - input_select.mode_pac_mono
            - input_select.mode_trv_mono
        data:
          option: "off"
      - action: input_select.select_option
        target:
          entity_id: input_select.fan_heat_mono
        data:
          option: "low"
      - action: input_select.select_option
        target:
          entity_id: input_select.fan_cool_mono
        data:
          option: "auto"
      - action: input_select.select_option
        target:
          entity_id: input_select.swing_cool_mono
        data:
          option: "off"
      - action: input_select.select_option
        target:
          entity_id: input_select.fan_deshum_mono
        data:
          option: "low"
      - action: input_select.select_option
        target:
          entity_id: input_select.fan_fan_only_mono
        data:
          option: "low"
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.temperature_heat_mono
            - input_number.temperature_cool_mono
            - input_number.temperature_deshum_mono
            - input_number.temperature_fan_only_mono
            - input_number.temperature_auto_mono
            - input_number.temperature_heat_cool_mono
            - input_number.temperature_pac_mono
            - input_number.temperature_trv_mono
            - input_number.temperature_capteur_mono
        data:
          value: 20
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.consigne_heat_mono
            - input_number.consigne_cool_mono
            - input_number.consigne_auto_mono
            - input_number.consigne_pac_mono
            - input_number.consigne_trv_mono
        data:
          value: 20
      - action: input_number.set_value
        target:
          entity_id: input_number.consigne_basse_heat_cool_mono
        data:
          value: 19
      - action: input_number.set_value
        target:
          entity_id: input_number.consigne_haute_heat_cool_mono
        data:
          value: 25
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.delai_heat_mono
            - input_number.delai_cool_mono
            - input_number.delai_deshum_mono
            - input_number.delai_fan_only_mono
            - input_number.delai_auto_mono
            - input_number.delai_heat_cool_mono
            - input_number.delai_pac_mono
            - input_number.delai_trv_mono
        data:
          value: 0
