input_select:
  mode_heat_mono:
    name: Mode HEAT
    options: ['off', 'heat']
    icon: mdi:hvac
  fan_heat_mono:
    name: Fan HEAT
    options: ['low', 'high']
    icon: mdi:fan
  mode_cool_mono:
    name: Mode COOL
    options: ['off', 'cool']
    icon: mdi:hvac
  fan_cool_mono:
    name: Fan COOL
    options: ['auto', 'low', 'high']
    icon: mdi:fan
  swing_cool_mono:
    name: Swing COOL
    options: ['off', 'on']
    icon: mdi:arrow-oscillating
  mode_deshum_mono:
    name: Mode DESHUM
    options: ['off', 'dry']
    icon: mdi:hvac
  fan_deshum_mono:
    name: Fan DESHUM
    options: ['low', 'high']
    icon: mdi:fan
  mode_fan_only_mono:
    name: Mode FAN_ONLY
    options: ['off', 'fan_only']
    icon: mdi:hvac
  fan_fan_only_mono:
    name: Fan FAN_ONLY
    options: ['low', 'medium', 'high']
    icon: mdi:fan
  mode_auto_mono:
    name: Mode AUTO
    options: ['off', 'auto']
    icon: mdi:hvac
  mode_heat_cool_mono:
    name: Mode HEAT_COOL
    options: ['off', 'heat_cool']
    icon: mdi:hvac
  mode_pac_mono:
    name: Mode PAC
    options: ['off', 'heat', 'dry']
    icon: mdi:hvac
  mode_trv_mono:
    name: Mode TRV
    options: ['off', 'heat']
    icon: mdi:hvac

input_number:
  consigne_heat_mono:
    name: Consigne HEAT
    min: 8
    max: 30
    step: 0.1
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:thermometer-check
  temperature_heat_mono:
    name: Température HEAT
    min: 0
    max: 40
    step: 0.1
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:home-thermometer
  delai_heat_mono:
    name: Délai HEAT
    min: 0
    max: 120
    step: 1
    unit_of_measurement: "s"
    mode: box
    icon: mdi:timer-sand
    initial: 0
