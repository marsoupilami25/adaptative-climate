  swing_all_manuel:
    name: Swing ALL
    options: ['off', 'on']
    icon: mdi:arrow-oscillating
  swing_horizontal_all_manuel:
    name: Swing horizontal ALL
    options: ['off', 'left', 'right']
    icon: mdi:arrow-left-right

