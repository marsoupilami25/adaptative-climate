script:
  reset_sources_test_manuel:
    alias: Remettre les sources à zéro (manuel)
    icon: mdi:restore
    sequence:
      - action: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.dispo_heat_manuel
            - input_boolean.obeit_heat_manuel
            - input_boolean.applique_heat_manuel
            - input_boolean.mode_offert_heat_manuel
            - input_boolean.fan_actif_heat_manuel
            - input_boolean.dispo_cool_manuel
            - input_boolean.obeit_cool_manuel
            - input_boolean.applique_cool_manuel
            - input_boolean.mode_offert_cool_manuel
            - input_boolean.fan_actif_cool_manuel
            - input_boolean.swing_actif_cool_manuel
            - input_boolean.dispo_dry_manuel
            - input_boolean.obeit_dry_manuel
            - input_boolean.applique_dry_manuel
            - input_boolean.mode_offert_dry_manuel
            - input_boolean.fan_actif_dry_manuel
            - input_boolean.dispo_fan_only_manuel
            - input_boolean.obeit_fan_only_manuel
            - input_boolean.applique_fan_only_manuel
            - input_boolean.mode_offert_fan_only_manuel
            - input_boolean.fan_actif_fan_only_manuel
            - input_boolean.dispo_auto_manuel
            - input_boolean.obeit_auto_manuel
            - input_boolean.applique_auto_manuel
            - input_boolean.mode_offert_auto_manuel
            - input_boolean.dispo_all_manuel
            - input_boolean.obeit_all_manuel
            - input_boolean.applique_all_manuel
            - input_boolean.mode_offert_all_manuel
            - input_boolean.fan_actif_all_manuel
            - input_boolean.swing_actif_all_manuel
            - input_boolean.swing_horizontal_actif_all_manuel
            - input_boolean.dispo_capteur_manuel
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.inconnu_heat_manuel
            - input_boolean.inconnu_cool_manuel
            - input_boolean.inconnu_dry_manuel
            - input_boolean.inconnu_fan_only_manuel
            - input_boolean.inconnu_auto_manuel
            - input_boolean.inconnu_all_manuel
      - action: input_select.select_option
        target:
          entity_id:
            - input_select.mode_heat_manuel
            - input_select.mode_cool_manuel
            - input_select.mode_dry_manuel
            - input_select.mode_fan_only_manuel
            - input_select.mode_auto_manuel
            - input_select.mode_all_manuel
        data:
          option: "off"
      - action: input_select.select_option
        target:
          entity_id: input_select.fan_heat_manuel
        data:
          option: "auto"
      - action: input_select.select_option
        target:
          entity_id: input_select.fan_cool_manuel
        data:
          option: "auto"
      - action: input_select.select_option
        target:
          entity_id: input_select.swing_cool_manuel
        data:
          option: "off"
      - action: input_select.select_option
        target:
          entity_id: input_select.fan_dry_manuel
        data:
          option: "auto"
      - action: input_select.select_option
        target:
          entity_id: input_select.fan_fan_only_manuel
        data:
          option: "auto"
      - action: input_select.select_option
        target:
          entity_id: input_select.fan_all_manuel
        data:
          option: "auto"
      - action: input_select.select_option
        target:
          entity_id: input_select.swing_all_manuel
        data:
          option: "off"
      - action: input_select.select_option
        target:
          entity_id: input_select.swing_horizontal_all_manuel
        data:
          option: "off"
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.temperature_heat_manuel
            - input_number.temperature_cool_manuel
            - input_number.temperature_dry_manuel
            - input_number.temperature_fan_only_manuel
            - input_number.temperature_auto_manuel
            - input_number.temperature_all_manuel
            - input_number.temperature_capteur_manuel
        data:
          value: 20
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.consigne_heat_manuel
            - input_number.consigne_cool_manuel
            - input_number.consigne_dry_manuel
            - input_number.consigne_auto_manuel
            - input_number.consigne_all_manuel
        data:
          value: 20
      - action: input_number.set_value
        target:
          entity_id: input_number.consigne_basse_all_manuel
        data:
          value: 19
      - action: input_number.set_value
        target:
          entity_id: input_number.consigne_haute_all_manuel
        data:
          value: 25
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.delai_heat_manuel
            - input_number.delai_cool_manuel
            - input_number.delai_dry_manuel
            - input_number.delai_fan_only_manuel
            - input_number.delai_auto_manuel
            - input_number.delai_all_manuel
        data:
          value: 0
