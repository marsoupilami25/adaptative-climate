# Virtual sources of the case "manuel" (Tests manuels).
# Generated once, then edited by hand. Every entity id ends with _manuel.
#
# Each source shows the state of its helpers; the service calls of Home
# Assistant change them, when the source obeys (see dev/manual/README.md).

template:
  - climate:
      - name: HEAT Virtuel (manuel)
        unique_id: heat_virtuel_manuel
        default_entity_id: climate.heat_virtuel_manuel
        # Off: offers no mode but off (a served mode lost, SRC-UNUS-2)
        hvac_modes: >-
          {{ ['off', 'heat'] if is_state('input_boolean.mode_offert_heat_manuel', 'on') else ['off'] }}
        # Inconnu: the state is unknown
        hvac_mode: >-
          {{ none if is_state('input_boolean.inconnu_heat_manuel', 'on') else states('input_select.mode_heat_manuel') }}
        availability: "{{ is_state('input_boolean.dispo_heat_manuel', 'on') }}"
        min_temperature: 5
        max_temperature: 30
        current_temperature: "{{ states('input_number.temperature_heat_manuel') | float(none) }}"
        target_temperature: "{{ states('input_number.consigne_heat_manuel') | float(none) }}"
        hvac_action: >-
          {% set m = states('input_select.mode_heat_manuel') %}
          {% set t = states('input_number.temperature_heat_manuel') | float(20) %}
          {% set c = states('input_number.consigne_heat_manuel') | float(20) %}
          {% if m == 'off' %}off{% elif m == 'dry' %}drying{% elif m == 'fan_only' %}fan{% elif m == 'heat' %}{{ 'heating' if t < c else 'idle' }}{% elif m == 'cool' %}{{ 'cooling' if t > c else 'idle' }}{% else %}{{ 'heating' if t < c else 'cooling' if t > c else 'idle' }}{% endif %}
        fan_modes: >-
          {{ state_attr('input_select.fan_heat_manuel', 'options') if is_state('input_boolean.fan_actif_heat_manuel', 'on') else [] }}
        fan_mode: >-
          {{ states('input_select.fan_heat_manuel') if is_state('input_boolean.fan_actif_heat_manuel', 'on') else none }}
        set_hvac_mode:
          - condition: state
            entity_id: input_boolean.obeit_heat_manuel
            state: "on"
          - delay:
              seconds: "{{ states('input_number.delai_heat_manuel') | int(0) }}"
          - action: input_select.select_option
            target:
              entity_id: input_select.mode_heat_manuel
            data:
              option: "{{ hvac_mode }}"
        set_temperature:
          - condition: state
            entity_id: input_boolean.applique_heat_manuel
            state: "on"
          - if: "{{ temperature is defined and temperature is not none }}"
            then:
              - action: input_number.set_value
                target:
                  entity_id: input_number.consigne_heat_manuel
                data:
                  value: "{{ temperature }}"
        set_fan_mode:
          - condition: state
            entity_id: input_boolean.applique_heat_manuel
            state: "on"
          - action: input_select.select_option
            target:
              entity_id: input_select.fan_heat_manuel
            data:
              option: "{{ fan_mode }}"
