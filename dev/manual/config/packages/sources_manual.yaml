script:
  reset_sources_manual:
    alias: Reset the sources (manual)
    icon: mdi:restore
    sequence:
      - action: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.available_heat_manual
            - input_boolean.obeys_heat_manual
            - input_boolean.applies_heat_manual
            - input_boolean.offers_heat_manual
            - input_boolean.fan_on_heat_manual
            - input_boolean.available_cool_manual
            - input_boolean.obeys_cool_manual
            - input_boolean.applies_cool_manual
            - input_boolean.offers_cool_manual
            - input_boolean.fan_on_cool_manual
            - input_boolean.swing_on_cool_manual
            - input_boolean.available_dry_manual
            - input_boolean.obeys_dry_manual
            - input_boolean.applies_dry_manual
            - input_boolean.offers_dry_manual
            - input_boolean.fan_on_dry_manual
            - input_boolean.available_fan_only_manual
            - input_boolean.obeys_fan_only_manual
            - input_boolean.applies_fan_only_manual
            - input_boolean.offers_fan_only_manual
            - input_boolean.fan_on_fan_only_manual
            - input_boolean.available_auto_manual
            - input_boolean.obeys_auto_manual
            - input_boolean.applies_auto_manual
            - input_boolean.offers_auto_manual
            - input_boolean.available_all_manual
            - input_boolean.obeys_all_manual
            - input_boolean.applies_all_manual
            - input_boolean.offers_all_manual
            - input_boolean.fan_on_all_manual
            - input_boolean.swing_on_all_manual
            - input_boolean.swing_horizontal_on_all_manual
            - input_boolean.room_sensor_available_manual
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.unknown_heat_manual
            - input_boolean.unknown_cool_manual
            - input_boolean.unknown_dry_manual
            - input_boolean.unknown_fan_only_manual
            - input_boolean.unknown_auto_manual
            - input_boolean.unknown_all_manual
      - action: input_select.select_option
        target:
          entity_id:
            - input_select.mode_heat_manual
            - input_select.mode_cool_manual
            - input_select.mode_dry_manual
            - input_select.mode_fan_only_manual
            - input_select.mode_auto_manual
            - input_select.mode_all_manual
        data:
          option: "off"
      - action: input_select.select_option
        target:
          entity_id: input_select.fan_heat_manual
        data:
          option: "auto"
      - action: input_select.select_option
        target:
          entity_id: input_select.fan_cool_manual
        data:
          option: "auto"
      - action: input_select.select_option
        target:
          entity_id: input_select.swing_cool_manual
        data:
          option: "off"
      - action: input_select.select_option
        target:
          entity_id: input_select.fan_dry_manual
        data:
          option: "auto"
      - action: input_select.select_option
        target:
          entity_id: input_select.fan_fan_only_manual
        data:
          option: "auto"
      - action: input_select.select_option
        target:
          entity_id: input_select.fan_all_manual
        data:
          option: "auto"
      - action: input_select.select_option
        target:
          entity_id: input_select.swing_all_manual
        data:
          option: "off"
      - action: input_select.select_option
        target:
          entity_id: input_select.swing_horizontal_all_manual
        data:
          option: "off"
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.temperature_heat_manual
            - input_number.temperature_cool_manual
            - input_number.temperature_dry_manual
            - input_number.temperature_fan_only_manual
            - input_number.temperature_auto_manual
            - input_number.temperature_all_manual
            - input_number.room_temperature_manual
        data:
          value: 20
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.target_heat_manual
            - input_number.target_cool_manual
            - input_number.target_dry_manual
            - input_number.target_auto_manual
            - input_number.target_all_manual
        data:
          value: 20
      - action: input_number.set_value
        target:
          entity_id: input_number.target_low_all_manual
        data:
          value: 19
      - action: input_number.set_value
        target:
          entity_id: input_number.target_high_all_manual
        data:
          value: 25
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.delay_heat_manual
            - input_number.delay_cool_manual
            - input_number.delay_dry_manual
            - input_number.delay_fan_only_manual
            - input_number.delay_auto_manual
            - input_number.delay_all_manual
        data:
          value: 0
