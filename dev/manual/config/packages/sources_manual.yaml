  mode_fan_only_manual:
    name: Mode FAN_ONLY
    options: ['off', 'fan_only']
    icon: mdi:hvac
  fan_fan_only_manual:
    name: Fan FAN_ONLY
    options: ['auto', 'low', 'high']
    icon: mdi:fan
  mode_auto_manual:
    name: Mode AUTO
    options: ['off', 'auto']
    icon: mdi:hvac
  mode_all_manual:
    name: Mode ALL
    options: ['off', 'heat', 'cool', 'heat_cool', 'auto', 'dry', 'fan_only']
    icon: mdi:hvac
  fan_all_manual:
    name: Fan ALL
    options: ['auto', 'low', 'medium', 'high']
    icon: mdi:fan
  swing_all_manual:
    name: Swing ALL
    options: ['off', 'on']
    icon: mdi:arrow-oscillating
  swing_horizontal_all_manual:
    name: Horizontal swing ALL
    options: ['off', 'left', 'right']
    icon: mdi:arrow-left-right

