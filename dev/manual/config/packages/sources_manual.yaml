# Virtual sources of the case "manual" (Tests manual).
# Generated once, then edited by hand. Every entity id ends with _manual.
#
# Each source shows the state of its helpers; the service calls of Home
# Assistant change them, when the source obeys (see dev/manual/README.md).

template:
  - climate:
      - name: HEAT Virtual (manual)
        unique_id: heat_virtual_manual
        default_entity_id: climate.heat_virtual_manual
        # Off: offers no mode but off (a served mode lost, SRC-UNUS-2)
        hvac_modes: >-
          {{ ['off', 'heat'] if is_state('input_boolean.offers_heat_manual', 'on') else ['off'] }}
        # Unknown: the state is unknown
        hvac_mode: >-
          {{ none if is_state('input_boolean.unknown_heat_manual', 'on') else states('input_select.mode_heat_manual') }}
        availability: "{{ is_state('input_boolean.available_heat_manual', 'on') }}"
        min_temperature: 5
        max_temperature: 30
        current_temperature: "{{ states('input_number.temperature_heat_manual') | float(none) }}"
        target_temperature: "{{ states('input_number.target_heat_manual') | float(none) }}"
        hvac_action: >-
          {% set m = states('input_select.mode_heat_manual') %}
          {% set t = states('input_number.temperature_heat_manual') | float(20) %}
          {% set c = states('input_number.target_heat_manual') | float(20) %}
          {% if m == 'off' %}off{% elif m == 'dry' %}drying{% elif m == 'fan_only' %}fan{% elif m == 'heat' %}{{ 'heating' if t < c else 'idle' }}{% elif m == 'cool' %}{{ 'cooling' if t > c else 'idle' }}{% else %}{{ 'heating' if t < c else 'cooling' if t > c else 'idle' }}{% endif %}
        fan_modes: >-
          {{ state_attr('input_select.fan_heat_manual', 'options') if is_state('input_boolean.fan_on_heat_manual', 'on') else [] }}
        fan_mode: >-
          {{ states('input_select.fan_heat_manual') if is_state('input_boolean.fan_on_heat_manual', 'on') else none }}
        set_hvac_mode:
          - condition: state
            entity_id: input_boolean.obeys_heat_manual
            state: "on"
          - delay:
              seconds: "{{ states('input_number.delay_heat_manual') | int(0) }}"
          - action: input_select.select_option
            target:
              entity_id: input_select.mode_heat_manual
            data:
              option: "{{ hvac_mode }}"
        set_temperature:
          - condition: state
            entity_id: input_boolean.applies_heat_manual
            state: "on"
          - if: "{{ temperature is defined and temperature is not none }}"
            then:
              - action: input_number.set_value
                target:
                  entity_id: input_number.target_heat_manual
                data:
                  value: "{{ temperature }}"
        set_fan_mode:
          - condition: state
            entity_id: input_boolean.applies_heat_manual
            state: "on"
          - action: input_select.select_option
            target:
              entity_id: input_select.fan_heat_manual
            data:
              option: "{{ fan_mode }}"
