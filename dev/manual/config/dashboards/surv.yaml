      - entity: input_boolean.inconnu_radiateur_surv
        name: Inconnu
      - entity: input_boolean.obeit_radiateur_surv
        name: Obéit au mode
      - entity: input_number.delai_radiateur_surv
        name: Délai avant d'obéir
      - entity: input_boolean.applique_radiateur_surv
