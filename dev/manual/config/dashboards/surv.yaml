  - type: entities
    title: Capteurs
    state_color: true
    entities:
    - entity: sensor.capteur_piece_surv
      name: Capteur pièce
    - entity: input_number.temperature_capteur_surv
      name: Température capteur
    - entity: input_boolean.dispo_capteur_surv
      name: Capteur disponible
  - type: markdown
    view_layout:
      position: sidebar
    content: |-
      ## Monitoring

      Adaptative SURV : RADIATEUR (*heat*), CLIM (*cool*), capteur de la pièce. Délai du monitoring : 30 s ; confirmation d'un mode : 10 s, nouvel essai : 30 s ; écart maximal 2 °C.
      Adaptative FANTOME : une source qui n'existe pas (`climate.fantome_surv`). Partir de **Remettre les sources à zéro** (en haut de la vue Sources). Elle ne touche pas la mémoire des entités testées (consignes, fan/swing) : elle leur appartient.
      Les événements : *Outils de développement > Événements*, écouter `adaptative_climate_problem`.

      1. **Source jamais vue** (MON-SRC-5) : FANTOME, éteint : au bout de 30 s après le démarrage, son voyant *Sources* est rouge ; un événement `started`.
      2. **Source désynchronisée** (MON-SRC-3, SRC-REQ-5, SRC-REQ-6) : couper *Obéit au mode* RADIATEUR, passer SURV en *heat* : au bout de 10 s, voyant *Sources* rouge (pas de délai en plus). Rallumer *Obéit au mode* : au nouvel essai, RADIATEUR passe en *heat*, voyant vert, événement `ended`.
      3. **Réglage non appliqué** (MON-SRC-4) : en *heat*, attendre 12 s, couper *Applique les réglages*, consigne 23 : au bout de 30 s, voyant rouge. Mettre *Consigne* RADIATEUR à 23 : vert.
      4. **Source inutilisable** (MON-SRC-1, MON-SRC-2) : en *heat*, couper *Disponible* RADIATEUR : *Inconnu*, au bout de 30 s, voyant rouge. Éteint, couper *Disponible* CLIM : jamais signalé.
      5. **Écart capteur–source** (MON-TEMP-1, MON-TEMP-3) : éteint, *Température* RADIATEUR 24, capteur 21 : au bout de 30 s, voyant *Températures* rouge ; RADIATEUR à 22 : vert.
      6. **Écart entre sources** (MON-TEMP-1) : *Température* RADIATEUR 19, CLIM 23 : au bout de 30 s, problème entre les deux sources.
      7. **Capteur sans valeur** (MON-TEMP-4) : couper *Capteur disponible* : au bout de 30 s, voyant rouge ; rallumer : vert.
      8. **Un délai par problème** (MON-SENS-3) : couper *Capteur disponible* ; 15 s plus tard, *Température* RADIATEUR 19 et CLIM 23 : les deux problèmes sont signalés à 15 s d'écart.
      9. **Après un redémarrage** (END-2, MON-SEND-3, MON-LIFE-1) : avec un problème signalé, redémarrer : voyant vert, puis rouge 30 s après.
      10. **Journal** (MON-LIFE-2, MON-LIFE-3) : chaque problème signalé : un warning dans le journal, le même texte que le `message` de l'événement ; sa fin : une info.
- title: Sources
  path: sources
  type: sidebar
