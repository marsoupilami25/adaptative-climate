# Case monitor: the monitoring sensors and events.
# YAML dashboard: after editing this file, refresh the page in the browser.
title: Tests monitoring
views:
- title: Monitoring
  path: pilotage
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: thermostat
      entity: climate.adaptative_monitor
      name: Adaptative MONITOR
      features:
      - type: climate-hvac-modes
      - type: climate-fan-modes
      - type: climate-swing-modes
      - type: climate-swing-horizontal-modes
    - type: glance
      title: Adaptative MONITOR monitoring
      show_state: true
      state_color: true
      entities:
      - entity: binary_sensor.adaptative_monitor_monitoring_sources
        name: Monitoring sources
      - entity: binary_sensor.adaptative_monitor_monitoring_temperatures
        name: Monitoring temperatures
    - type: markdown
      text_only: true
      content: |-
        {% set e = 'climate.adaptative_monitor' %}{% set problems = (state_attr('binary_sensor.adaptative_monitor_monitoring_sources', 'problems') or []) + (state_attr('binary_sensor.adaptative_monitor_monitoring_temperatures', 'problems') or []) %}
        **Problems**: {{ 'none' if not problems else '' }}
        {% for p in problems %}
        - {{ p.type }}: {{ p.get('source') or p.get('sources') or p.get('sensor') or '' }}{{ (' ' ~ p.get('setting')) if p.get('setting') else '' }}
        {% endfor %}

        | | |
        |:--|:--|
        | Action | {{ state_attr(e, 'hvac_action') }} |
        | Active source | {{ state_attr(e, 'active_entity_id') }} |
        | Reference temperature | {{ state_attr(e, 'current_temperature') }} |
        | Step | {{ state_attr(e, 'target_temp_step') }} |
        | Target | {{ state_attr(e, 'temperature') }} |
        | Low / high | {{ state_attr(e, 'target_temp_low') }} / {{ state_attr(e, 'target_temp_high') }} |
        | Min gap | {{ state_attr(e, 'min_gap') }} |
        | Min / max | {{ state_attr(e, 'min_temp') }} / {{ state_attr(e, 'max_temp') }} |
        | Phase | {{ state_attr(e, 'phase') }} |
        | Unavailable modes | {{ state_attr(e, 'unavailable_modes') }} |
        | Foreign modes | {{ state_attr(e, 'foreign_modes') }} |
        | Target gaps | {{ state_attr(e, 'target_gaps') }} |
        | Saved targets | {{ state_attr(e, 'saved_targets') }} |
        | Saved fan/swing | {{ state_attr(e, 'saved_settings') }} |
    - type: thermostat
      entity: climate.adaptative_ghost
      name: Adaptative GHOST
      features:
      - type: climate-hvac-modes
      - type: climate-fan-modes
      - type: climate-swing-modes
      - type: climate-swing-horizontal-modes
    - type: glance
      title: Adaptative GHOST monitoring
      show_state: true
      state_color: true
      entities:
      - entity: binary_sensor.adaptative_ghost_monitoring_sources
        name: Monitoring sources
      - entity: binary_sensor.adaptative_ghost_monitoring_temperatures
        name: Monitoring temperatures
    - type: markdown
      text_only: true
      content: |-
        {% set e = 'climate.adaptative_ghost' %}{% set problems = (state_attr('binary_sensor.adaptative_ghost_monitoring_sources', 'problems') or []) + (state_attr('binary_sensor.adaptative_ghost_monitoring_temperatures', 'problems') or []) %}
        **Problems**: {{ 'none' if not problems else '' }}
        {% for p in problems %}
        - {{ p.type }}: {{ p.get('source') or p.get('sources') or p.get('sensor') or '' }}{{ (' ' ~ p.get('setting')) if p.get('setting') else '' }}
        {% endfor %}

        | | |
        |:--|:--|
        | Action | {{ state_attr(e, 'hvac_action') }} |
        | Active source | {{ state_attr(e, 'active_entity_id') }} |
        | Reference temperature | {{ state_attr(e, 'current_temperature') }} |
        | Step | {{ state_attr(e, 'target_temp_step') }} |
        | Target | {{ state_attr(e, 'temperature') }} |
        | Low / high | {{ state_attr(e, 'target_temp_low') }} / {{ state_attr(e, 'target_temp_high') }} |
        | Min / max | {{ state_attr(e, 'min_temp') }} / {{ state_attr(e, 'max_temp') }} |
        | Phase | {{ state_attr(e, 'phase') }} |
        | Unavailable modes | {{ state_attr(e, 'unavailable_modes') }} |
        | Foreign modes | {{ state_attr(e, 'foreign_modes') }} |
        | Target gaps | {{ state_attr(e, 'target_gaps') }} |
        | Saved targets | {{ state_attr(e, 'saved_targets') }} |
        | Saved fan/swing | {{ state_attr(e, 'saved_settings') }} |
  - type: grid
    cards:
    - type: entities
      title: RADIATOR Virtual
      uix:
        style: |
          {% set m = states('climate.radiator_virtual_monitor') %}
          {% set color = {'heat': 'heat', 'cool': 'cool', 'heat_cool': 'heat-cool', 'auto': 'auto', 'dry': 'dry', 'fan_only': 'fan_only'}.get(m) %}
          {% if color %}
          ha-card {
            border: 2px solid var(--state-climate-{{ color }}-color);
            background: color-mix(in srgb, var(--state-climate-{{ color }}-color) 15%, var(--card-background-color));
          }
          {% endif %}
      entities:
      - entity: input_select.mode_radiator_monitor
        name: Mode
      - entity: input_number.target_radiator_monitor
        name: Target
      - entity: input_number.offset_radiator_monitor
        name: Offset (measured = room + offset)
      - entity: input_number.delay_radiator_monitor
        name: Delay before obeying
    - type: markdown
      text_only: true
      content: |-
        {% set e = 'climate.radiator_virtual_monitor' %}
        | Shown by RADIATOR Virtual | |
        |:--|:--|
        | Modes | {{ (state_attr(e, 'hvac_modes') or []) | join(', ') }} |
        | Mode / action | {{ states(e) }} / {{ state_attr(e, 'hvac_action') }} |
        | Temperature | {{ state_attr(e, 'current_temperature') }} |
        | Target | {{ state_attr(e, 'temperature') }} |
        | Min / max / step | {{ state_attr(e, 'min_temp') }} / {{ state_attr(e, 'max_temp') }} / {{ state_attr(e, 'target_temp_step') or '—' }} |
    - type: glance
      columns: 4
      state_color: true
      show_state: true
      entities:
      - entity: input_boolean.available_radiator_monitor
        name: Available
        tap_action:
          action: toggle
      - entity: input_boolean.unknown_radiator_monitor
        name: Unknown
        tap_action:
          action: toggle
      - entity: input_boolean.obeys_radiator_monitor
        name: Obeys the mode
        tap_action:
          action: toggle
      - entity: input_boolean.applies_radiator_monitor
        name: Applies settings
        tap_action:
          action: toggle
      - entity: input_boolean.offers_radiator_monitor
        name: Offers heat
        tap_action:
          action: toggle
    - type: entities
      title: AIRCON Virtual
      uix:
        style: |
          {% set m = states('climate.aircon_virtual_monitor') %}
          {% set color = {'heat': 'heat', 'cool': 'cool', 'heat_cool': 'heat-cool', 'auto': 'auto', 'dry': 'dry', 'fan_only': 'fan_only'}.get(m) %}
          {% if color %}
          ha-card {
            border: 2px solid var(--state-climate-{{ color }}-color);
            background: color-mix(in srgb, var(--state-climate-{{ color }}-color) 15%, var(--card-background-color));
          }
          {% endif %}
      entities:
      - entity: input_select.mode_aircon_monitor
        name: Mode
      - entity: input_number.target_aircon_monitor
        name: Target
      - entity: input_number.offset_aircon_monitor
        name: Offset (measured = room + offset)
      - entity: input_select.fan_aircon_monitor
        name: Fan
      - entity: input_number.delay_aircon_monitor
        name: Delay before obeying
    - type: markdown
      text_only: true
      content: |-
        {% set e = 'climate.aircon_virtual_monitor' %}
        | Shown by AIRCON Virtual | |
        |:--|:--|
        | Modes | {{ (state_attr(e, 'hvac_modes') or []) | join(', ') }} |
        | Mode / action | {{ states(e) }} / {{ state_attr(e, 'hvac_action') }} |
        | Temperature | {{ state_attr(e, 'current_temperature') }} |
        | Target | {{ state_attr(e, 'temperature') }} |
        | Min / max / step | {{ state_attr(e, 'min_temp') }} / {{ state_attr(e, 'max_temp') }} / {{ state_attr(e, 'target_temp_step') or '—' }} |
        | Fan | {{ state_attr(e, 'fan_mode') }} ({{ (state_attr(e, 'fan_modes') or []) | join(', ') }}) |
    - type: glance
      columns: 4
      state_color: true
      show_state: true
      entities:
      - entity: input_boolean.available_aircon_monitor
        name: Available
        tap_action:
          action: toggle
      - entity: input_boolean.unknown_aircon_monitor
        name: Unknown
        tap_action:
          action: toggle
      - entity: input_boolean.obeys_aircon_monitor
        name: Obeys the mode
        tap_action:
          action: toggle
      - entity: input_boolean.applies_aircon_monitor
        name: Applies settings
        tap_action:
          action: toggle
      - entity: input_boolean.offers_aircon_monitor
        name: Offers cool
        tap_action:
          action: toggle
      - entity: input_boolean.fan_on_aircon_monitor
        name: Fan on
        tap_action:
          action: toggle
    - type: entities
      title: Room sensor
      state_color: true
      entities:
      - entity: input_number.room_temperature_monitor
        name: Room temperature
      - entity: input_boolean.room_sensor_available_monitor
        name: Room sensor available
      - entity: sensor.room_sensor_monitor
        name: Read by Adaptative MONITOR
    - type: button
      entity: script.reset_sources_monitor
      name: Reset the sources
      icon: mdi:restore
      tap_action:
        action: toggle
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Monitoring

        - **Adaptative MONITOR**: RADIATOR Virtual for *heat*, AIRCON Virtual for *cool*, the room sensor. Largest gap between temperatures 2 °C.
        - **Adaptative GHOST**: a source that does not exist (`climate.ghost_monitor`).
        - **RADIATOR Virtual**, **AIRCON Virtual**: *Offset*: each one measures the room plus its offset (0 after the reset), compared with the room sensor and with each other.
        - **Room sensor**: the room thermometer, `temperature_sensor` of Adaptative MONITOR. Set its value with *Room temperature*; *Room sensor available* off makes it unavailable; *Read by Adaptative MONITOR* is what the entity sees.

        **Start**: **Reset the sources**: both sources *off*, available, obeying, *Target* 20, *Offset* 0; *Room temperature* 20, room sensor available; then Adaptative MONITOR *off*. Every problem then ends: *Monitoring sources* and *Monitoring temperatures* *OK*. The reset does not touch the memory of the entities under test (targets, fan/swing): it belongs to them; `dev/manual/reset_memory.sh` forgets it (HA stopped, see `dev/manual/README.md`). Delays shortened for the tests (`configuration.yaml`): monitoring 15 s, confirmation of a mode 10 s, next try 30 s, removal confirmation 20 s.

        Events: *Developer tools > Events*, listen to `adaptative_climate_problem`.

        1. **Source never seen** (MON-SRC-5): just after a start of Home Assistant. Adaptative GHOST, *off*: 15 s after the start, its *Monitoring sources* is *Problem*; a `started` event.
        2. **Source out of sync** (MON-SRC-3, SRC-REQ-5, SRC-REQ-6): from **Start**. On RADIATOR Virtual, *Obeys the mode* off; Adaptative MONITOR to *heat*: after 10 s, *Monitoring sources* goes to *Problem* (no extra delay). *Obeys the mode* on: at the next try, RADIATOR Virtual goes to *heat*, back to *OK*, event `ended`.
        3. **Setting not applied** (MON-SRC-4): from **Start**. Adaptative MONITOR to *heat*, wait 12 s. On RADIATOR Virtual, *Applies settings* off; target one degree higher on Adaptative MONITOR: after 30 s (the shortest delay for a setting), *Monitoring sources* goes to *Problem*. On RADIATOR Virtual, *Target* to the same value: back to *OK*.
        4. **Source unusable** (MON-SRC-1, MON-SRC-2): from **Start**. Adaptative MONITOR to *heat*. On RADIATOR Virtual, *Available* off: Adaptative MONITOR *Unknown*; after 15 s, *Monitoring sources* goes to *Problem*. Adaptative MONITOR *off*, on AIRCON Virtual *Available* off: never reported.
        5. **Gap sensor–source** (MON-TEMP-1, MON-TEMP-3): from **Start**. *Offset* of RADIATOR Virtual 2.5, of AIRCON Virtual 1 (they measure 22.5 and 21): after 15 s, *Monitoring temperatures* goes to *Problem*, RADIATOR Virtual only (2.5 from the room sensor; the two sources are 1.5 apart). *Offset* of RADIATOR Virtual 1: back to *OK*.
        6. **Gap between sources** (MON-TEMP-1): from **Start**. *Offset* of RADIATOR Virtual −2, of AIRCON Virtual 2 (they measure 18 and 22): after 15 s, a problem between the two sources only (each one is 2 from the room sensor, not more).
        7. **Sensor without value** (MON-TEMP-4): from **Start**. *Room sensor available* off: after 15 s, *Monitoring temperatures* goes to *Problem*; on: back to *OK*.
        8. **A delay per problem** (MON-SENS-3): from **Start**. *Room sensor available* off; 10 s later, *Offset* of RADIATOR Virtual −2 and of AIRCON Virtual 2: both problems (sensor without value, gap between sources) are reported 10 s apart.
        9. **After a restart** (END-2, MON-SEND-3, MON-LIFE-1): from **Start**. *Offset* of RADIATOR Virtual 3: after 15 s, *Monitoring temperatures* goes to *Problem*. Restart Home Assistant (the offset is kept): *OK*, then *Problem* 15 s later.
        10. **Log** (MON-LIFE-2, MON-LIFE-3): during the steps above, each problem reported: a warning in the log, the same text as the `message` of the event; its end: an info.

        </small>
