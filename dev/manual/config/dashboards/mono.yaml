# Case mono: one entity per mode, each with its own virtual source.
# YAML dashboard: after editing this file, refresh the page in the browser.
title: Tests mono-mode
views:
- title: HEAT
  path: heat
  type: sidebar
  cards:
  - type: vertical-stack
    cards:
    - type: heading
      heading: Adaptative HEAT
    - type: thermostat
      entity: climate.adaptative_heat
      features:
      - type: climate-hvac-modes
      - type: climate-fan-modes
      - type: climate-swing-modes
      - type: climate-swing-horizontal-modes
    - type: markdown
      content: |-
        {% set l = {'on': '🔴', 'off': '🟢'} %}
        {{ l.get(states('binary_sensor.adaptative_heat_monitoring_sources'), '⚪') }} Sources &nbsp;&nbsp;&nbsp;
        {{ l.get(states('binary_sensor.adaptative_heat_monitoring_temperatures'), '⚪') }} Températures
        {% for p in (state_attr('binary_sensor.adaptative_heat_monitoring_sources', 'problems') or []) + (state_attr('binary_sensor.adaptative_heat_monitoring_temperatures', 'problems') or []) %}
        - {{ p.type }} : {{ p.source or p.sources or p.sensor or '' }}{{ (' ' ~ p.setting) if p.setting else '' }}
        {% endfor %}
    - type: entities
      entities:
        - entity: climate.adaptative_heat
          type: attribute
          attribute: hvac_action
          name: Action
        - entity: climate.adaptative_heat
          type: attribute
          attribute: active_entity_id
          name: Source active
        - entity: climate.adaptative_heat
          type: attribute
          attribute: phase
          name: Phase
        - entity: climate.adaptative_heat
          type: attribute
          attribute: current_temperature
          name: Température
        - entity: climate.adaptative_heat
          type: attribute
          attribute: temperature
          name: Consigne
        - entity: climate.adaptative_heat
          type: attribute
          attribute: target_temp_low
          name: Consigne basse
        - entity: climate.adaptative_heat
          type: attribute
          attribute: target_temp_high
          name: Consigne haute
        - entity: climate.adaptative_heat
          type: attribute
          attribute: min_temp
          name: Min
        - entity: climate.adaptative_heat
          type: attribute
          attribute: max_temp
          name: Max
        - entity: climate.adaptative_heat
          type: attribute
          attribute: target_temp_step
          name: Pas
        - entity: climate.adaptative_heat
          type: attribute
          attribute: unavailable_modes
          name: Modes indisponibles
        - entity: climate.adaptative_heat
          type: attribute
          attribute: foreign_modes
          name: Modes étrangers
        - entity: climate.adaptative_heat
          type: attribute
          attribute: target_gaps
          name: Écarts de consigne
        - entity: climate.adaptative_heat
          type: attribute
          attribute: saved_targets
          name: Consignes gardées
        - entity: climate.adaptative_heat
          type: attribute
          attribute: saved_settings
          name: Fan/swing mémorisés
  - type: entities
    title: HEAT Virtuel
    state_color: true
    entities:
      - entity: climate.heat_virtuel_mono
        name: HEAT Virtuel
      - entity: input_select.mode_heat_mono
        name: Mode
      - entity: input_number.consigne_heat_mono
        name: Consigne
      - entity: input_number.temperature_heat_mono
        name: Température
      - entity: input_select.fan_heat_mono
        name: Fan
      - entity: input_boolean.dispo_heat_mono
        name: Disponible
      - entity: input_boolean.inconnu_heat_mono
        name: Inconnu
      - entity: input_boolean.obeit_heat_mono
        name: Obéit au mode
      - entity: input_number.delai_heat_mono
        name: Délai avant d'obéir
      - entity: input_boolean.applique_heat_mono
        name: Applique les réglages
      - entity: input_boolean.mode_offert_heat_mono
        name: Offre heat
      - entity: input_boolean.fan_actif_heat_mono
        name: Fan actif
  - type: markdown
    view_layout:
      position: sidebar
    content: |-
      ## Adaptative HEAT

      HEAT Virtuel : *heat*, 8–30 °C, fan *low*/*high*. `max_temp` 25 ; nouvel essai d'un mode
      au bout d'1 min ; monitoring : 1 min. Partir de **Remettre les sources à zéro** (en haut de la vue Sources). Elle ne touche pas la mémoire des entités testées (consignes, fan/swing) : elle leur appartient.

      1. **Allumer, éteindre** (ENT-STATE-3, SRC-REQ-2) : passer en *heat* : *Mode* de HEAT Virtuel passe à *heat*. Éteindre : *off*.
      2. **Plage et limite** (ENT-RANGE-1, ENT-RANGE-3) : en *heat*, la carte va de 8 à 25 °C (la source va jusqu'à 30, `max_temp` la réduit).
      3. **Consigne** (ENT-TGT-7, SRC-SET-2) : en *heat*, consigne 22 : *Consigne* de la source passe à 22.
      4. **Allumage sur l'appareil** (SRC-STATE-5, SRC-SET-11) : éteint, mettre *Consigne* de la source à 19 puis *Mode* à *heat* : Adaptative HEAT passe en *heat* et affiche 19 ; rien n'est envoyé.
      5. **Consigne changée sur l'appareil** (SRC-SET-11, ENT-TGT-9) : en *heat*, attendre 12 s, mettre *Consigne* à 23 : la carte affiche 23.
      6. **Au-delà de la limite** (ENT-TGT-3, ENT-TGT-12, ENT-TGT-13) : en *heat*, attendre 12 s, mettre *Consigne* à 28 : la carte affiche 25 ; *Écarts de consigne* : gardée 28, montrée 25. Régler 22 sur la carte : l'écart disparaît.
      7. **Valeur propre pendant la stabilisation** (SRC-SET-5, SRC-SET-6, §5.3) : éteint, consigne 21 (éteint, elle règle celle de *heat*). Passer en *heat* puis, dans les 12 s, mettre *Consigne* à 26 : la carte reste à 21 ; au bout des 12 s, *Consigne* revient à 21.
      8. **Fan** (ENT-FANV-5, ENT-FANV-1, ENT-FANV-6) : la première fois en *heat*, la carte prend le fan de la source. Choisir *high*. Éteindre, mettre *Fan* de la source à *low*, repasser en *heat* : *Fan* revient à *high*.
      9. **Source indisponible** (ENT-NOSRC-2, SRC-STATE-7, SRC-STATE-10) : en *heat*, couper *Disponible* : Adaptative HEAT est indisponible (sa seule source). Au bout d'1 min, voyant *Sources* rouge. Mettre *Mode* à *off*, rallumer *Disponible* : *Mode* repasse à *heat* (Home Assistant gagne), Adaptative HEAT aussi, voyant vert.
      10. **Source inconnue** (SRC-STATE-6) : même chose avec *Inconnu*.
      11. **Appareil qui n'obéit pas** (SRC-REQ-5, SRC-REQ-6, MON-SRC-3) : éteint, couper *Obéit au mode*, passer en *heat* : la carte affiche *heat*, *Mode* reste *off*. Au bout de 30 s, voyant *Sources* rouge (désynchronisée). Rallumer *Obéit au mode* : au nouvel essai (au plus 1 min plus tard), *Mode* passe à *heat*, voyant vert.
      12. **Mode perdu** (SRC-UNUS-2, ENT-HVAC-5) : éteint, couper *Offre heat* : au bout de 60 s (confirmation du retrait), Adaptative HEAT est indisponible et une réparation apparaît (*Paramètres > Réparations*). Rallumer *Offre heat* : elle disparaît.
      13. **Redémarrage** (ENT-STATE-1, END-2) : en *heat*, consigne 22 ; redémarrer Home Assistant : *heat* à 22.
