        3. **Range** (ENT-RANGE-1, ENT-RANGE-3): Adaptative OFFSET in *heat*: 8–26 °C (10–30 minus 2, narrowed to 26).
        4. **Takeover** (ENT-TGT-9): wait 12 s. On HEATPUMP Virtual, *Target* 25: Adaptative OFFSET shows 23.
        5. **Same offset in dry** (CFG-SENS-4): Adaptative OFFSET to *dry*, target 20: *Target* of HEATPUMP Virtual goes to 22.

        </small>
