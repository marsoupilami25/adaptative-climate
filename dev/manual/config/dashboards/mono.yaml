# Case mono: one entity per mode, each with its own virtual source.
# YAML dashboard: after editing this file, refresh the page in the browser.
title: Tests mono-mode
views:
- title: HEAT
  path: heat
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: thermostat
      entity: climate.adaptative_heat
      name: Adaptative HEAT
      features:
      - type: climate-hvac-modes
      - type: climate-fan-modes
      - type: climate-swing-modes
      - type: climate-swing-horizontal-modes
    - type: markdown
      text_only: true
      content: |-
        {% set e = 'climate.adaptative_heat' %}{% set l = {'on': '🔴', 'off': '🟢'} %}
        {{ l.get(states('binary_sensor.adaptative_heat_monitoring_sources'), '⚪') }} Sources &nbsp; {{ l.get(states('binary_sensor.adaptative_heat_monitoring_temperatures'), '⚪') }} Temperatures
        {% for p in (state_attr('binary_sensor.adaptative_heat_monitoring_sources', 'problems') or []) + (state_attr('binary_sensor.adaptative_heat_monitoring_temperatures', 'problems') or []) %}
        - {{ p.type }}: {{ p.source or p.sources or p.sensor or '' }}{{ (' ' ~ p.setting) if p.setting else '' }}
        {% endfor %}

        | | |
        |:--|:--|
        | Action | {{ state_attr(e, 'hvac_action') }} |
        | Active source | {{ state_attr(e, 'active_entity_id') }} |
        | Temperature | {{ state_attr(e, 'current_temperature') }} |
        | Step | {{ state_attr(e, 'target_temp_step') }} |
        | Target | {{ state_attr(e, 'temperature') }} |
        | Low / high | {{ state_attr(e, 'target_temp_low') }} / {{ state_attr(e, 'target_temp_high') }} |
        | Min / max | {{ state_attr(e, 'min_temp') }} / {{ state_attr(e, 'max_temp') }} |
        | Phase | {{ state_attr(e, 'phase') }} |
        | Unavailable modes | {{ state_attr(e, 'unavailable_modes') }} |
        | Foreign modes | {{ state_attr(e, 'foreign_modes') }} |
        | Target gaps | {{ state_attr(e, 'target_gaps') }} |
        | Saved targets | {{ state_attr(e, 'saved_targets') }} |
        | Saved fan/swing | {{ state_attr(e, 'saved_settings') }} |
  - type: grid
    cards:
    - type: entities
      title: HEAT Virtual
      entities:
      - entity: input_select.mode_heat_mono
        name: Mode
      - entity: input_number.target_heat_mono
        name: Target
      - entity: input_number.temperature_heat_mono
        name: Temperature
      - entity: input_select.fan_heat_mono
        name: Fan
      - entity: input_number.delay_heat_mono
        name: Delay before obeying
    - type: markdown
      text_only: true
      content: |-
        {% set e = 'climate.heat_virtual_mono' %}
        | Shown by HEAT Virtual | |
        |:--|:--|
        | Modes | {{ (state_attr(e, 'hvac_modes') or []) | join(', ') }} |
        | Mode / action | {{ states(e) }} / {{ state_attr(e, 'hvac_action') }} |
        | Temperature | {{ state_attr(e, 'current_temperature') }} |
        | Target | {{ state_attr(e, 'temperature') }} |
        | Min / max / step | {{ state_attr(e, 'min_temp') }} / {{ state_attr(e, 'max_temp') }} / {{ state_attr(e, 'target_temp_step') or '—' }} |
        | Fan | {{ state_attr(e, 'fan_mode') }} ({{ (state_attr(e, 'fan_modes') or []) | join(', ') }}) |
    - type: glance
      columns: 4
      state_color: true
      show_state: true
      entities:
      - entity: input_boolean.available_heat_mono
        name: Available
        tap_action:
          action: toggle
      - entity: input_boolean.unknown_heat_mono
        name: Unknown
        tap_action:
          action: toggle
      - entity: input_boolean.obeys_heat_mono
        name: Obeys the mode
        tap_action:
          action: toggle
      - entity: input_boolean.applies_heat_mono
        name: Applies settings
        tap_action:
          action: toggle
      - entity: input_boolean.offers_heat_mono
        name: Offers heat
        tap_action:
          action: toggle
      - entity: input_boolean.fan_on_heat_mono
        name: Fan on
        tap_action:
          action: toggle
    - type: button
      entity: script.reset_sources_mono
      name: Reset the sources
      icon: mdi:restore
      tap_action:
        action: toggle
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Adaptative HEAT

        HEAT Virtual: *heat*, 8–30 °C, fan *low*/*high*. Adaptative HEAT: `max_temp` 25; a mode asked
        is sent again after 1 min; monitoring delay 1 min. Start from **Reset the sources**. It does not touch the memory of the entities under test (targets, fan/swing): it belongs to them.

        1. **On, off** (ENT-STATE-3, SRC-REQ-2): Adaptative HEAT to *heat*: on HEAT Virtual, *Mode* goes to *heat*. Adaptative HEAT to *off*: *Mode* goes back to *off*.
        2. **Range and limit** (ENT-RANGE-1, ENT-RANGE-3): Adaptative HEAT in *heat* goes from 8 to 25 °C (HEAT Virtual goes up to 30, `max_temp` narrows it).
        3. **Target** (ENT-TGT-7, SRC-SET-2): Adaptative HEAT in *heat*, target 22: *Target* of HEAT Virtual goes to 22.
        4. **Turned on on the device** (SRC-STATE-5, SRC-SET-11): Adaptative HEAT *off*. On HEAT Virtual, *Target* 19, then *Mode* *heat*: Adaptative HEAT goes to *heat* and shows 19; nothing is sent to HEAT Virtual.
        5. **Target changed on the device** (SRC-SET-11, ENT-TGT-9): Adaptative HEAT in *heat*, wait 12 s. On HEAT Virtual, *Target* 23: Adaptative HEAT shows 23.
        6. **Beyond the limit** (ENT-TGT-3, ENT-TGT-12, ENT-TGT-13): Adaptative HEAT in *heat*, wait 12 s. On HEAT Virtual, *Target* 28: Adaptative HEAT shows 25; *Target gaps*: saved 28, shown 25; *Saved targets*: single 28 (T, the target of *heat*; low and high are not used by Adaptative HEAT). Target 22 on Adaptative HEAT: the gap is gone.
        7. **Own value during the settle time** (SRC-SET-5, SRC-SET-6, §5.3): Adaptative HEAT *off*, target 21 (in *off*, it sets T, the target of *heat*). Adaptative HEAT to *heat*, then within 12 s, on HEAT Virtual, *Target* 26: Adaptative HEAT stays at 21; after the 12 s, *Target* of HEAT Virtual goes back to 21.
        8. **Fan** (ENT-FANV-5, ENT-FANV-1, ENT-FANV-6): the first time in *heat*, Adaptative HEAT takes the fan of HEAT Virtual. Fan *high* on Adaptative HEAT. Adaptative HEAT *off*; on HEAT Virtual, *Fan* *low*; Adaptative HEAT to *heat*: *Fan* of HEAT Virtual goes back to *high*.
        9. **Source unavailable** (ENT-NOSRC-2, SRC-STATE-7, SRC-STATE-10): Adaptative HEAT in *heat*. On HEAT Virtual, turn *Available* off: Adaptative HEAT is unavailable (its only source); after 1 min, light *Sources* red. On HEAT Virtual, *Mode* *off*, then *Available* on: *Mode* goes back to *heat* (Home Assistant wins), Adaptative HEAT too, light green.
        10. **Source unknown** (SRC-STATE-6): as 9, with *Unknown* (on, then off at the end).
        11. **Device that does not obey** (SRC-REQ-5, SRC-REQ-6, MON-SRC-3): Adaptative HEAT *off*. On HEAT Virtual, turn *Obeys the mode* off. Adaptative HEAT to *heat*: it shows *heat*, *Mode* of HEAT Virtual stays *off*. After 30 s, light *Sources* red (out of sync). On HEAT Virtual, *Obeys the mode* on: at the next try (1 min at most), *Mode* goes to *heat*, light green.
        12. **Mode lost** (SRC-UNUS-2, ENT-HVAC-5): Adaptative HEAT *off*. On HEAT Virtual, turn *Offers heat* off: after 60 s (removal confirmation), Adaptative HEAT is unavailable and a repair shows up (*Settings > Repairs*). *Offers heat* on: it is gone.
        13. **Restart** (ENT-STATE-1, END-2): Adaptative HEAT in *heat*, target 22; restart Home Assistant: Adaptative HEAT resumes *heat* at 22.

        </small>
