        <small>

        ## Adaptative COOL

        COOL Virtual: *cool*, 16–32 °C by steps of 1 °C, fan *auto*/*low*/*high*, swing *off*/*on*.

        **Start**: **Reset the sources** (every source of this dashboard): COOL Virtual *off*, *Target* 20, fan *auto*, swing *off*, every option offered; then Adaptative COOL *off*. The reset does not touch the memory of the entities under test (targets, fan/swing): it belongs to them; `dev/manual/reset_memory.sh` forgets it (HA stopped, see `dev/manual/README.md`). Delays shortened for the tests (`configuration.yaml`): monitoring 15 s, confirmation of a mode 10 s, next try 30 s, removal confirmation 20 s.

        1. **Step** (ENT-STEP-1): from **Start**. Adaptative COOL to *cool*: its target moves by steps of 1 °C.
        2. **Fan and swing of the source** (ENT-FANV-5, SRC-SET-12): after 1, on the first *cool* after the memory was forgotten only: Adaptative COOL shows the fan (*auto*) and the swing (*off*) of COOL Virtual.
        3. **Memory** (ENT-FANV-1, ENT-FANV-6): after 1 (*cool*). Fan *low* on Adaptative COOL. Adaptative COOL *off*; on COOL Virtual, *Fan* *high*; Adaptative COOL to *cool*: *Fan* of COOL Virtual goes back to *low*.
        4. **Option removed** (SRC-DATA-10): after 3 (*cool*, fan *low*). On COOL Virtual, turn *Fan without high* on: Adaptative COOL still offers *high* for 20 s, then no longer.
        5. **No option left** (ENT-FAN-2, ENT-FAN-4): from **Start**. Adaptative COOL to *cool*. On COOL Virtual, turn *Swing on* off: Adaptative COOL keeps its swing, with no option; a swing asked from *Developer tools > Actions* is refused. ⚠️ *Swing on* only empties the options: COOL Virtual still has the swing (its `SWING_MODE` feature stays, a template climate cannot drop it), so the swing does not disappear. A setting that disappears is tested in the automated tests.
        6. **Setting not applied** (SRC-SET-9, SRC-SET-10, MON-SRC-4): from **Start**. Adaptative COOL to *cool*, wait 12 s. On COOL Virtual, turn *Applies settings* off. Target one degree higher on Adaptative COOL: it keeps it, *Target* of COOL Virtual does not move. After 30 s (the shortest delay for a setting), *Monitoring sources* goes to *Problem* (setting not applied). On COOL Virtual, *Target* to the same value: back to *OK*.

        </small>
