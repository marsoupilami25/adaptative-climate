        <small>

        ## Adaptative TRV

        A radiator valve measures the temperature next to the radiator, too warm; it can take the room temperature instead, written into it from outside.

        - **TRV Virtual**: the valve, `heat_entity` of Adaptative TRV. *Temperature (measured by the valve)*: its own reading. *External temperature (written by Adaptative TRV)*: the room temperature it gets (`heat_external_sensor`, step 0.5, written again every 60 s).
        - **Room sensor**: the room thermometer, `temperature_sensor` of Adaptative TRV. Set its value with *Room temperature*; *Room sensor available* off makes it unavailable; *Read by Adaptative TRV* is what the entity sees.

        **Start**: **Reset the sources** (every source of this dashboard): TRV Virtual *off*, *Temperature* 20; *Room temperature* 20, room sensor available; then Adaptative TRV *off*. The reset does not touch the memory of the entities under test (targets, fan/swing): it belongs to them; `dev/manual/reset_memory.sh` forgets it (HA stopped, see `dev/manual/README.md`). Delays shortened for the tests (`configuration.yaml`): monitoring 15 s, confirmation of a mode 10 s, next try 30 s, removal confirmation 20 s.

        1. **Write** (ENT-EXT-1, ENT-EXT-2): from **Start**. On Room sensor, *Room temperature* 21.3: on TRV Virtual, *External temperature* goes to 21.5 (the step of the valve), even with Adaptative TRV *off*.
        2. **Reference** (ENT-REF-1): after 1. Adaptative TRV shows 21.3 (*Reference temperature*), the room temperature, not the *Temperature* measured by TRV Virtual.
        3. **Sensor without value** (ENT-EXT-5, MON-TEMP-4, ENT-REF-2): after 2. On Room sensor, turn *Room sensor available* off: *External temperature* no longer changes; Adaptative TRV to *heat*: it shows the *Temperature* measured by TRV Virtual. After 15 s, *Monitoring temperatures* goes to *Problem*. *Room sensor available* on: *External temperature* is written at once, back to *OK*.

        </small>
