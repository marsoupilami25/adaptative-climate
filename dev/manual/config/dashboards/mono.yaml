  - type: markdown
    view_layout:
      position: sidebar
    content: |-
      ## Adaptative COOL

      COOL Virtuel : *cool*, 16–32 °C au pas de 1 °C, fan *auto*/*low*/*high*, swing *off*/*on*. Partir de **Remettre les sources à zéro** (en haut de la vue Sources). Elle ne touche pas la mémoire des entités testées (consignes, fan/swing) : elle leur appartient.

      1. **Pas** (ENT-STEP-1) : passer en *cool* : la carte avance par pas de 1 °C.
      2. **Fan et swing de la source** (ENT-FANV-5, SRC-SET-12) : la première fois, la carte prend le fan (*auto*) et le swing (*off*) de COOL Virtuel.
      3. **Mémoire** (ENT-FANV-1, ENT-FANV-6) : fan *low*. Éteindre, mettre *Fan* de la source à *high*, repasser en *cool* : *Fan* revient à *low*.
      4. **Option retirée** (SRC-DATA-10) : en *cool*, fan *low*, activer *Fan sans high* : la carte propose encore *high* pendant 60 s, puis plus.
      5. **Réglage absent** (ENT-FAN-2, ENT-FAN-4) : couper *Swing actif* : la carte garde le swing, sans option ; un swing choisi depuis *Outils de développement > Actions* est refusé.
      6. **Réglage non appliqué** (SRC-SET-9, SRC-SET-10, MON-SRC-4) : en *cool*, attendre 12 s, couper *Applique les réglages*, consigne 24 : la carte garde 24, *Consigne* de la source ne bouge pas. Au bout d'1 min, voyant *Sources* rouge (réglage non appliqué). Mettre *Consigne* de la source à 24 : vert.
