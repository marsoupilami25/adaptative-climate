  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Adaptative COOL

        COOL Virtual: *cool*, 16–32 °C by steps of 1 °C, fan *auto*/*low*/*high*, swing *off*/*on*. Monitoring delay 1 min. Start from **Reset the sources**. It does not touch the memory of the entities under test (targets, fan/swing): it belongs to them.

        1. **Step** (ENT-STEP-1): Adaptative COOL to *cool*: its target moves by steps of 1 °C.
        2. **Fan and swing of the source** (ENT-FANV-5, SRC-SET-12): the first time in *cool*, Adaptative COOL takes the fan (*auto*) and the swing (*off*) of COOL Virtual.
        3. **Memory** (ENT-FANV-1, ENT-FANV-6): fan *low* on Adaptative COOL. Adaptative COOL *off*; on COOL Virtual, *Fan* *high*; Adaptative COOL to *cool*: *Fan* of COOL Virtual goes back to *low*.
        4. **Option removed** (SRC-DATA-10): Adaptative COOL in *cool*, fan *low*. On COOL Virtual, turn *Fan without high* on: Adaptative COOL still offers *high* for 60 s, then no longer.
        5. **Setting missing** (ENT-FAN-2, ENT-FAN-4): on COOL Virtual, turn *Swing on* off: Adaptative COOL keeps its swing, with no option; a swing asked from *Developer tools > Actions* is refused.
        6. **Setting not applied** (SRC-SET-9, SRC-SET-10, MON-SRC-4): Adaptative COOL in *cool*, wait 12 s. On COOL Virtual, turn *Applies settings* off. Target 24 on Adaptative COOL: it keeps 24, *Target* of COOL Virtual does not move. After 1 min, light *Sources* red (setting not applied). On COOL Virtual, *Target* 24: green.

        </small>
