    content: |-
      ## Adaptative OFFSET

      PAC Virtuel : *heat* et *dry*, 10–30 °C, lit 2 °C de plus que la pièce (`heat_offset` = `dry_offset` = 2). `max_temp` 26. Partir de **Remettre les sources à zéro** (en haut de la vue Sources). Elle ne touche pas la mémoire des entités testées (consignes, fan/swing) : elle leur appartient.

      1. **Lecture** (ENT-REF-5, CFG-SENS-1) : *Température* de la source à 22 : en *heat*, la carte affiche 20.
      2. **Consigne envoyée** (CFG-SENS-1, ENT-TGT-8) : en *heat*, consigne 21 : *Consigne* de la source passe à 23.
      3. **Plage** (ENT-RANGE-1, ENT-RANGE-3) : en *heat*, 8–26 °C (10–30 moins 2, réduit à 26).
      4. **Reprise en main** (ENT-TGT-9) : attendre 12 s, *Consigne* de la source à 25 : la carte affiche 23.
      5. **Même offset en dry** (CFG-SENS-4) : en *dry*, consigne 20 : la source reçoit 22.
