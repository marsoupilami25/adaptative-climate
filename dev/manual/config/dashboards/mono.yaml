        3. **Sensor without value** (ENT-EXT-5, MON-TEMP-4, ENT-REF-2): turn *Room sensor available* off: nothing is written any more; Adaptative TRV to *heat*: it shows the temperature of TRV Virtual. After 1 min, light *Temperatures* red. *Room sensor available* on: written at once, light green.

        </small>
