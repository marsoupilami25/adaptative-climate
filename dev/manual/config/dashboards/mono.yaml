        ## Adaptative HEAT_COOL

        HEAT_COOL Virtual: *heat_cool* with a low/high target, 16–30 °C. Adaptative HEAT_COOL: `min_gap` 2.

        **Start**: **Reset the sources** (every source of this dashboard): HEAT_COOL Virtual *off*, 19–25; then Adaptative HEAT_COOL *off*. The reset does not touch the memory of the entities under test (targets, fan/swing): it belongs to them; `dev/manual/reset_memory.sh` forgets it (HA stopped, see `dev/manual/README.md`). Delays shortened for the tests (`configuration.yaml`): monitoring 15 s, confirmation of a mode 10 s, next try 30 s, removal confirmation 20 s.

        1. **Low and high** (§1.3.4.3): from **Start**. Adaptative HEAT_COOL to *heat_cool*: it shows a range; set 19–24: *Target low* of HEAT_COOL Virtual 19, *Target high* 24.
        2. **Minimum gap** (ENT-TGT-6, §2.2): after 1 (19–24). *Min gap* shows 2. Raise low to 22 (22–24). Raise low to 23: high goes to 25, HEAT_COOL Virtual gets 23–25. Lower high to 24: low goes to 22, HEAT_COOL Virtual gets 22–24. While dragging, the card stops low at high (and high at low): it does not know the gap, and only sends on release; to go from 22–24 to 25–27, raise high first.
        3. **Gap at the end of the range** (ENT-TGT-6, ENT-TGT-7): after 2 (*heat_cool*). Set 28–30 (high first). Raise low to 29: the card goes back to 28–30; again: back to 28–30 again. Set 16–18 (low first), lower high to 17: the card goes back to 16–18.
        4. **Takeover** (ENT-TGT-9): after 3 (*heat_cool*). Set 19–24 (high first), wait 12 s. On HEAT_COOL Virtual, *Target low* 23: Adaptative HEAT_COOL shows 23–25, *Target high* of HEAT_COOL Virtual goes to 25. *Target high* 22: Adaptative HEAT_COOL shows 20–22, *Target low* of HEAT_COOL Virtual goes to 20.
        5. **Takeover at the end of the range** (ENT-TGT-9): after 4 (20–22). On HEAT_COOL Virtual, *Target high* 30, then *Target low* 29.5: Adaptative HEAT_COOL shows 29.5–30 (the source wins, the gap is broken); HEAT_COOL Virtual keeps 29.5–30.

        </small>
