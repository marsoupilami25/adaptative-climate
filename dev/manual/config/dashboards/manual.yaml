# Case manual: an entry created from the UI.
# YAML dashboard: after editing this file, refresh the page in the browser.
title: Tests manual
views:
- title: Adaptative
  path: pilotage
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: thermostat
      entity: climate.adaptative_manual
      name: Adaptative Manual
      features:
      - type: climate-hvac-modes
      - type: climate-fan-modes
      - type: climate-swing-modes
      - type: climate-swing-horizontal-modes
    - type: glance
      title: Adaptative Manual monitoring
      show_state: true
      state_color: true
      entities:
      - entity: binary_sensor.adaptative_manual_monitoring_sources
        name: Monitoring sources
      - entity: binary_sensor.adaptative_manual_monitoring_temperatures
        name: Monitoring temperatures
    - type: markdown
      text_only: true
      content: |-
        {% set e = 'climate.adaptative_manual' %}{% set problems = (state_attr('binary_sensor.adaptative_manual_monitoring_sources', 'problems') or []) + (state_attr('binary_sensor.adaptative_manual_monitoring_temperatures', 'problems') or []) %}
        **Problems**: {{ 'none' if not problems else '' }}
        {% for p in problems %}
        - {{ p.type }}: {{ p.source or p.sources or p.sensor or '' }}{{ (' ' ~ p.setting) if p.setting else '' }}
        {% endfor %}

        | | |
        |:--|:--|
        | Action | {{ state_attr(e, 'hvac_action') }} |
        | Active source | {{ state_attr(e, 'active_entity_id') }} |
        | Reference temperature | {{ state_attr(e, 'current_temperature') }} |
        | Step | {{ state_attr(e, 'target_temp_step') }} |
        | Target | {{ state_attr(e, 'temperature') }} |
        | Low / high | {{ state_attr(e, 'target_temp_low') }} / {{ state_attr(e, 'target_temp_high') }} |
        | Min / max | {{ state_attr(e, 'min_temp') }} / {{ state_attr(e, 'max_temp') }} |
        | Phase | {{ state_attr(e, 'phase') }} |
        | Unavailable modes | {{ state_attr(e, 'unavailable_modes') }} |
        | Foreign modes | {{ state_attr(e, 'foreign_modes') }} |
        | Target gaps | {{ state_attr(e, 'target_gaps') }} |
        | Saved targets | {{ state_attr(e, 'saved_targets') }} |
        | Saved fan/swing | {{ state_attr(e, 'saved_settings') }} |
    - type: entities
      title: Room sensor
      state_color: true
      entities:
      - entity: input_number.room_temperature_manual
        name: Room temperature
      - entity: input_boolean.room_sensor_available_manual
        name: Room sensor available
      - entity: sensor.room_sensor_manual
        name: Read by Adaptative Manual
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Configuration from the UI

        No entity is declared in the YAML: Adaptative Manual is created from the UI.

        - **The sources** (view *Sources*): *Temperature (measured by the source)*: the own reading of each one. HEAT Virtual also shows *External temperature (written by Adaptative Manual)*, the entity *External temperature HEAT*, once it is the `heat_external_sensor` (step 5).
        - **Room sensor**: the room thermometer, the entity *Room sensor (manual)*, added as `temperature_sensor` in step 3. Set its value with *Room temperature*; *Room sensor available* off makes it unavailable; *Read by Adaptative Manual* is what the entity sees.

        Start from **Reset the sources**. It does not touch the memory of the entities under test (targets, fan/swing): it belongs to them. Delays shortened for the tests (`configuration.yaml`): monitoring 15 s, confirmation of a mode 10 s, next try 30 s, removal confirmation 20 s.

        1. **Creation** (§3): *Settings > Devices & services > Helpers > Create helper > Adaptative Climate*, name **Adaptative Manual**, *heat*: HEAT Virtual (manual), *cool*: COOL Virtual (manual), and the delays of the tests above. Adaptative Manual lists *off*, *heat*, *cool*, *heat_cool*.
        2. **Refused** (CFG-CHECK-1): another entry named `adaptative manual`: refused. With *heat*: COOL Virtual: refused (COOL Virtual does not offer *heat*). With an external sensor and no room sensor: refused. With next try 10 s and confirmation 30 s: refused.
        3. **Options** (CFG-YAML-4, ENT-INIT-4): Adaptative Manual in *heat*; open its options, add the room sensor: the entry reloads, Adaptative Manual is *off*, HEAT Virtual goes to *off*.
        4. **Remove a mode** (CFG-YAML-4, ENT-HVAC-1): options, clear *cool*: no more *cool* nor *heat_cool*.
        5. **External sensor** (ENT-EXT-1, CFG-SENS-2): options, *heat_external_sensor*: *External temperature HEAT*, with the room sensor: the *Room temperature* is written to *External temperature* of HEAT Virtual. With `heat_offset` 1 as well: refused.
        6. **One source for several modes** (CFG-SENS-4): options, *heat* and *cool* on ALL Virtual with different offsets: refused, the error names both modes.
        7. **Entries of the YAML** (CFG-YAML-3): the entries declared in the YAML (Adaptative HEAT...) have no options in the UI.
        8. **Reload without change** (ENT-INIT-4): Adaptative Manual in *heat*, *Reload* the entry: it resumes *heat*.
        9. **Deletion** (END-3): Adaptative Manual in *heat*, delete the entry: HEAT Virtual stays in *heat*, nothing drives it any more.

        </small>
- title: Sources
  path: sources
  type: sections
  max_columns: 6
  sections:
  - type: grid
    cards:
    - type: button
      entity: script.reset_sources_manual
      name: Reset the sources
      icon: mdi:restore
      tap_action:
        action: toggle
    - type: entities
      title: HEAT Virtual
      entities:
      - entity: input_select.mode_heat_manual
        name: Mode
      - entity: input_number.target_heat_manual
        name: Target
      - entity: input_number.temperature_heat_manual
        name: Temperature (measured by the source)
      - entity: input_number.external_temperature_manual
        name: External temperature (written by Adaptative Manual)
      - entity: input_select.fan_heat_manual
        name: Fan
      - entity: input_number.delay_heat_manual
        name: Delay before obeying
    - type: markdown
      text_only: true
      content: |-
        {% set e = 'climate.heat_virtual_manual' %}
        | Shown by HEAT Virtual | |
        |:--|:--|
        | Modes | {{ (state_attr(e, 'hvac_modes') or []) | join(', ') }} |
        | Mode / action | {{ states(e) }} / {{ state_attr(e, 'hvac_action') }} |
        | Temperature | {{ state_attr(e, 'current_temperature') }} |
        | Target | {{ state_attr(e, 'temperature') }} |
        | Min / max / step | {{ state_attr(e, 'min_temp') }} / {{ state_attr(e, 'max_temp') }} / {{ state_attr(e, 'target_temp_step') or '—' }} |
        | Fan | {{ state_attr(e, 'fan_mode') }} ({{ (state_attr(e, 'fan_modes') or []) | join(', ') }}) |
    - type: glance
      columns: 4
      state_color: true
      show_state: true
      entities:
      - entity: input_boolean.available_heat_manual
