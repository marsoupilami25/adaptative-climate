  - type: entities
    title: Capteurs
    state_color: true
    entities:
    - entity: sensor.capteur_piece_bi
      name: Capteur pièce
    - entity: input_number.temperature_capteur_bi
      name: Température capteur
    - entity: input_boolean.dispo_capteur_bi
      name: Capteur disponible
  - type: markdown
    view_layout:
      position: sidebar
    content: |-
      ## Bi-source

      Adaptative BI : *heat_cool* sans source propre, RADIATEUR Virtuel (*heat*, 5–30 °C, offre aussi *fan_only*, que BI ne sert pas) et CLIM Virtuel (*cool*, 16–30 °C au pas de 1). `min_gap` 2, hystérésis 1 °C, monitoring : 1 min. Partir de **Remettre les sources à zéro** (en haut de la vue Sources). Elle ne touche pas la mémoire des entités testées (consignes, fan/swing) : elle leur appartient.
      Éteint, régler la plage à 19–24 et *Température capteur* à 21.

      1. **Entrée en heat_cool** (ENT-WANT-1, ENT-TYPE-3) : passer en *heat_cool* : *Phase* `heat`, RADIATEUR passe en *heat* à 19, CLIM reste *off*.
      2. **Bascule avec hystérésis** (ENT-WANT-3, ENT-PHASE-3) : capteur 25 : rien. Capteur 25,5 : *Phase* `cool`, CLIM passe en *cool* à 24, RADIATEUR à *off*.
      3. **Retour** : capteur 18 : rien ; 17,5 : *Phase* `heat`.
      4. **Consignes changées : sans hystérésis** (ENT-PHASE-2, §5.5) : phase `heat`, capteur 22. Régler 17–20 : *Phase* `cool` aussitôt ; RADIATEUR ne reçoit que *off* (sa *Consigne* ne passe pas à 17).
      5. **Après un redémarrage, la phase est choisie à nouveau** (ENT-WANT-1, ENT-PHASE-1) : plage 19–24, phase `heat` à 21, capteur 22 (reste `heat`). Redémarrer : *Phase* `cool` (la consigne la plus proche).
      6. **Sans capteur** (ENT-REF-6, ENT-WANT-2) : couper *Capteur disponible* ; *Température* RADIATEUR 20, CLIM 22 : la carte affiche 21 (la moyenne). Phase `heat` : mettre CLIM à 27 : rien (RADIATEUR, la plus basse, n'est pas au-dessus de 25) ; mettre RADIATEUR à 25,5 : *Phase* `cool`.
      7. **Reprise sur une source de phase** (ENT-TYPE-5) : en *heat_cool* phase `heat`, mettre *Mode* CLIM à *cool* : Adaptative BI passe en *cool*, RADIATEUR à *off*.
      8. **Mode étranger de la source active** (ENT-STATE-5) : en *heat*, attendre 12 s, mettre *Mode* RADIATEUR à *fan_only* : Adaptative BI passe à *off*, *Modes étrangers* liste RADIATEUR ; rien n'est envoyé.
      9. **Mode étranger toléré** (ENT-STATE-5) : en *cool*, mettre *Mode* RADIATEUR à *fan_only* : rien n'est envoyé (toléré). Éteindre : RADIATEUR passe à *off*.
      10. **Source de phase absente** (ENT-PHASE-5) : en *heat_cool* phase `heat`, couper *Disponible* CLIM, capteur 26 : *Phase* `cool`, RADIATEUR à *off*. Rallumer CLIM : elle passe en *cool*.
      11. **Plus de source** (ENT-STATE-6, MON-SRC-1) : couper les deux *Disponible* : Adaptative BI indisponible ; au bout d'1 min, voyant *Sources* rouge (les deux). Rallumer RADIATEUR : retour en *heat_cool*.
      12. **Écart minimal** (ENT-TGT-6) : éteint, régler 22–23 : la haute passe à 24.
