# Case bi.
# YAML dashboard: after editing this file, refresh the page in the browser.
title: Tests bi-source
views:
- title: BI
  path: pilotage
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: thermostat
      entity: climate.adaptative_bi
      name: Adaptative BI
      features:
      - type: climate-hvac-modes
      - type: climate-fan-modes
      - type: climate-swing-modes
      - type: climate-swing-horizontal-modes
    - type: markdown
      text_only: true
      content: |-
        {% set e = 'climate.adaptative_bi' %}{% set l = {'on': '🔴', 'off': '🟢'} %}
        {{ l.get(states('binary_sensor.adaptative_bi_monitoring_sources'), '⚪') }} Sources &nbsp; {{ l.get(states('binary_sensor.adaptative_bi_monitoring_temperatures'), '⚪') }} Temperatures
        {% for p in (state_attr('binary_sensor.adaptative_bi_monitoring_sources', 'problems') or []) + (state_attr('binary_sensor.adaptative_bi_monitoring_temperatures', 'problems') or []) %}
        - {{ p.type }}: {{ p.source or p.sources or p.sensor or '' }}{{ (' ' ~ p.setting) if p.setting else '' }}
        {% endfor %}

        | | |
        |:--|:--|
        | Action | {{ state_attr(e, 'hvac_action') }} |
        | Active source | {{ state_attr(e, 'active_entity_id') }} |
        | Temperature | {{ state_attr(e, 'current_temperature') }} |
        | Step | {{ state_attr(e, 'target_temp_step') }} |
        | Target | {{ state_attr(e, 'temperature') }} |
        | Low / high | {{ state_attr(e, 'target_temp_low') }} / {{ state_attr(e, 'target_temp_high') }} |
        | Min / max | {{ state_attr(e, 'min_temp') }} / {{ state_attr(e, 'max_temp') }} |
        | Phase | {{ state_attr(e, 'phase') }} |
        | Unavailable modes | {{ state_attr(e, 'unavailable_modes') }} |
        | Foreign modes | {{ state_attr(e, 'foreign_modes') }} |
        | Target gaps | {{ state_attr(e, 'target_gaps') }} |
        | Saved targets | {{ state_attr(e, 'saved_targets') }} |
        | Saved fan/swing | {{ state_attr(e, 'saved_settings') }} |
    - type: entities
      title: Sensors
      state_color: true
      entities:
      - entity: sensor.room_sensor_bi
        name: Room sensor
      - entity: input_number.room_temperature_bi
        name: Room temperature
      - entity: input_boolean.room_sensor_available_bi
        name: Room sensor available
  - type: grid
    cards:
    - type: entities
      title: RADIATOR Virtual
      entities:
      - entity: input_select.mode_radiator_bi
        name: Mode
      - entity: input_number.target_radiator_bi
        name: Target
      - entity: input_number.temperature_radiator_bi
        name: Temperature
      - entity: input_number.delay_radiator_bi
        name: Delay before obeying
    - type: markdown
      text_only: true
      content: |-
        {% set e = 'climate.radiator_virtual_bi' %}
        | Shown by RADIATOR Virtual | |
        |:--|:--|
        | Modes | {{ (state_attr(e, 'hvac_modes') or []) | join(', ') }} |
        | Mode / action | {{ states(e) }} / {{ state_attr(e, 'hvac_action') }} |
        | Temperature | {{ state_attr(e, 'current_temperature') }} |
        | Target | {{ state_attr(e, 'temperature') }} |
        | Min / max / step | {{ state_attr(e, 'min_temp') }} / {{ state_attr(e, 'max_temp') }} / {{ state_attr(e, 'target_temp_step') or '—' }} |
    - type: glance
      columns: 4
      state_color: true
      show_state: true
      entities:
      - entity: input_boolean.available_radiator_bi
        name: Available
        tap_action:
          action: toggle
      - entity: input_boolean.unknown_radiator_bi
        name: Unknown
        tap_action:
          action: toggle
      - entity: input_boolean.obeys_radiator_bi
        name: Obeys the mode
        tap_action:
          action: toggle
      - entity: input_boolean.applies_radiator_bi
        name: Applies settings
        tap_action:
          action: toggle
      - entity: input_boolean.offers_radiator_bi
        name: Offers heat/fan_only
        tap_action:
          action: toggle
    - type: entities
      title: AIRCON Virtual
      entities:
      - entity: input_select.mode_aircon_bi
        name: Mode
      - entity: input_number.target_aircon_bi
        name: Target
      - entity: input_number.temperature_aircon_bi
        name: Temperature
      - entity: input_select.fan_aircon_bi
        name: Fan
      - entity: input_number.delay_aircon_bi
        name: Delay before obeying
    - type: markdown
      text_only: true
      content: |-
        {% set e = 'climate.aircon_virtual_bi' %}
        | Shown by AIRCON Virtual | |
        |:--|:--|
        | Modes | {{ (state_attr(e, 'hvac_modes') or []) | join(', ') }} |
        | Mode / action | {{ states(e) }} / {{ state_attr(e, 'hvac_action') }} |
        | Temperature | {{ state_attr(e, 'current_temperature') }} |
        | Target | {{ state_attr(e, 'temperature') }} |
        | Min / max / step | {{ state_attr(e, 'min_temp') }} / {{ state_attr(e, 'max_temp') }} / {{ state_attr(e, 'target_temp_step') or '—' }} |
        | Fan | {{ state_attr(e, 'fan_mode') }} ({{ (state_attr(e, 'fan_modes') or []) | join(', ') }}) |
    - type: glance
      columns: 4
      state_color: true
      show_state: true
      entities:
      - entity: input_boolean.available_aircon_bi
        name: Available
        tap_action:
          action: toggle
      - entity: input_boolean.unknown_aircon_bi
        name: Unknown
        tap_action:
          action: toggle
      - entity: input_boolean.obeys_aircon_bi
        name: Obeys the mode
        tap_action:
          action: toggle
      - entity: input_boolean.applies_aircon_bi
        name: Applies settings
        tap_action:
          action: toggle
      - entity: input_boolean.offers_aircon_bi
        name: Offers cool
        tap_action:
          action: toggle
      - entity: input_boolean.fan_on_aircon_bi
        name: Fan on
        tap_action:
          action: toggle
    - type: button
      entity: script.reset_sources_bi
      name: Reset the sources
      icon: mdi:restore
      tap_action:
        action: toggle
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Bi-source

        Adaptative BI: *heat_cool* with no source of its own: RADIATOR Virtual (*heat*, 5–30 °C; it also offers *fan_only*, which Adaptative BI does not serve) and AIRCON Virtual (*cool*, 16–30 °C by steps of 1). `min_gap` 2, hysteresis 1 °C, monitoring delay 1 min. Start from **Reset the sources**. It does not touch the memory of the entities under test (targets, fan/swing): it belongs to them.
        Adaptative BI *off*: set the range to 19–24 and *Room temperature* to 21.

        1. **Entering heat_cool** (ENT-WANT-1, ENT-TYPE-3): Adaptative BI to *heat_cool*: *Phase* `heat`, RADIATOR Virtual goes to *heat* at 19, AIRCON Virtual stays *off*.
        2. **Switch with hysteresis** (ENT-WANT-3, ENT-PHASE-3): *Room temperature* 25: nothing. 25.5: *Phase* `cool`, AIRCON Virtual goes to *cool* at 24, RADIATOR Virtual to *off*.
        3. **Back**: *Room temperature* 18: nothing; 17.5: *Phase* `heat`.
        4. **Targets changed: no hysteresis** (ENT-PHASE-2, §5.5): *Phase* `heat`, *Room temperature* 22. Set 17–20 on Adaptative BI: *Phase* `cool` at once; RADIATOR Virtual only gets *off* (its *Target* does not go to 17).
        5. **After a restart, the phase is chosen again** (ENT-WANT-1, ENT-PHASE-1): range 19–24, *Phase* `heat` at 21, *Room temperature* 22 (stays `heat`). Restart: *Phase* `cool` (the closest target).
        6. **Without the room sensor** (ENT-REF-6, ENT-WANT-2): turn *Room sensor available* off; *Temperature* of RADIATOR Virtual 20, of AIRCON Virtual 22: Adaptative BI shows 21 (the mean). In *Phase* `heat`: AIRCON Virtual to 27: nothing (the lowest, RADIATOR Virtual, is not above 25); RADIATOR Virtual to 25.5: *Phase* `cool`.
        7. **Takeover on a phase source** (ENT-TYPE-5): Adaptative BI in *heat_cool*, *Phase* `heat`. On AIRCON Virtual, *Mode* *cool*: Adaptative BI goes to *cool*, RADIATOR Virtual to *off*.
        8. **Foreign mode of the active source** (ENT-STATE-5): Adaptative BI in *heat*, wait 12 s. On RADIATOR Virtual, *Mode* *fan_only*: Adaptative BI goes to *off*, *Foreign modes* lists RADIATOR Virtual; nothing is sent.
        9. **Foreign mode tolerated** (ENT-STATE-5): Adaptative BI in *cool*. On RADIATOR Virtual, *Mode* *fan_only*: nothing is sent (tolerated). Adaptative BI to *off*: RADIATOR Virtual goes to *off*.
        10. **Phase source away** (ENT-PHASE-5): Adaptative BI in *heat_cool*, *Phase* `heat`. On AIRCON Virtual, *Available* off; *Room temperature* 26: *Phase* `cool`, RADIATOR Virtual to *off*. AIRCON Virtual *Available* on: it goes to *cool*.
        11. **No source left** (ENT-STATE-6, MON-SRC-1): turn both *Available* off: Adaptative BI is unavailable; after 1 min, light *Sources* red (both). RADIATOR Virtual *Available* on: back to *heat_cool*.
        12. **Minimum gap** (ENT-TGT-6): Adaptative BI *off*, set 22–23: high goes to 24.

        </small>
