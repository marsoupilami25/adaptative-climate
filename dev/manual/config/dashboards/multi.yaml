  - type: entities
    title: Capteurs
    state_color: true
    entities:
    - entity: sensor.capteur_piece_multi
      name: Capteur pièce
    - entity: input_number.temperature_capteur_multi
      name: Température capteur
    - entity: input_boolean.dispo_capteur_multi
      name: Capteur disponible
  - type: markdown
    view_layout:
      position: sidebar
    content: |-
      ## Multi-sources

      Adaptative MULTI : une source par mode, le capteur de la pièce. *heat*, *cool* et *dry* partagent fan et swing ; *heat_cool* bascule entre HEAT et COOL. Monitoring : 1 min, confirmation de retrait : 30 s. Partir de **Remettre les sources à zéro** (en haut de la vue Sources). Elle ne touche pas la mémoire des entités testées (consignes, fan/swing) : elle leur appartient.
      Les options ne s'écrivent pas pareil : HEAT en *Capitales* avec *Turbo* en plus, DRY en *MAJUSCULES* sans *medium*, les autres en minuscules.

      1. **Changement de mode** (ENT-STATE-3) : *heat*, puis *cool* : COOL passe à *cool*, HEAT repasse à *off*.
      2. **Allumage sur un appareil** (ENT-STATE-5, ENT-STATE-3) : éteint, *Mode* HEAT à *heat* : MULTI passe en *heat*. Puis *Mode* COOL à *cool* : MULTI passe en *cool*, HEAT est éteint (la dernière l'emporte).
      3. **Marche** (ENT-STATE-2, ENT-STATE-8) : éteindre, puis le bouton marche : le dernier mode utilisé revient.
      4. **Mode indisponible** (ENT-HVAC-4, ENT-STATE-4) : couper *Disponible* DRY : *dry* est dans *Modes indisponibles* ; le choisir est refusé.
      5. **Attente de la source** (ENT-WAIT-1, ENT-WAIT-2, MON-SRC-1) : en *cool*, couper *Disponible* COOL : MULTI passe à *Inconnu*, garde consignes et bornes ; au bout d'1 min, voyant *Sources* rouge. Consigne 23 : rien n'est envoyé. Rallumer : COOL repasse en *cool* à 23, voyant vert.
      6. **Bornes par mode** (ENT-RANGE-2) : *heat* 5–30, *cool* 16–32, *dry* 18–30, *auto* 10–30, éteint : la plus large.
      7. **Mémoire synchronisée et casse** (ENT-FANV-2, ENT-FAN-5, ENT-FAN-6) : en *cool*, fan *high* ; en *heat* : *Fan* HEAT passe à *High* ; en *dry* : *HIGH*.
      8. **Option propre à une source** (ENT-FANV-3, ENT-FAN-3) : en *heat*, la carte propose *Turbo* ; le choisir : HEAT passe en *Turbo*. Passer en *cool* : le fan revient à *high* (Turbo n'est pas retenu).
      9. **Éteint** (ENT-FAN-3) : *fan_only* et *auto* ne sont pas synchronisés : éteint, la carte n'affiche pas de fan.
      10. **Capteur** (ENT-REF-1, ENT-REF-2) : capteur 21 : la carte affiche 21 ; couper *Capteur disponible* : la carte affiche la température de la source active.
      11. **Écart de température** (MON-TEMP-1) : *Température* HEAT 25, capteur 21 : au bout d'1 min, voyant *Températures* rouge ; remettre HEAT à 21 : vert.
      12. **heat_cool** (ENT-TYPE-3) : plage 19–24, capteur 21, *heat_cool* : HEAT en *heat* ; capteur 26 : COOL en *cool*, HEAT à *off*.
      13. **Redémarrage** (ENT-FANV-1, END-2) : en *cool*, fan *low*, éteindre ; *Fan* HEAT à *Auto* ; redémarrer ; *heat* : *Fan* HEAT passe à *Low*.
