  - type: entities
    title: Capteurs
    state_color: true
    entities:
    - entity: sensor.capteur_piece_manuel
      name: Capteur pièce
    - entity: input_number.temperature_capteur_manuel
      name: Température capteur
    - entity: input_boolean.dispo_capteur_manuel
      name: Capteur disponible
    - entity: input_number.temperature_externe_manuel
      name: Température externe (écrite)
  - type: markdown
    view_layout:
      position: sidebar
    content: |-
      ## Configuration par l'interface

      Partir de **Remettre les sources à zéro** (en haut de la vue Sources). Elle ne touche pas la mémoire des entités testées (consignes, fan/swing) : elle leur appartient.

      1. **Création** (§3) : *Paramètres > Appareils et services > Entrées > Créer une entrée > Adaptative Climate*, nom **Adaptative Manuel**, *heat* : HEAT Virtuel (manuel), *cool* : COOL Virtuel (manuel). L'entité liste *off*, *heat*, *cool*, *heat_cool*.
      2. **Refus** (CFG-CHECK-1) : créer une autre entrée avec le nom `adaptative manuel` : refusé. Avec *heat* : COOL Virtuel : refusé (COOL n'offre pas *heat*). Avec un capteur externe sans capteur de pièce : refusé. Avec nouvel essai 10 s et confirmation 30 s : refusé.
      3. **Options** (CFG-YAML-4, ENT-INIT-4) : en *heat*, ouvrir les options d'Adaptative Manuel, ajouter le capteur de la pièce : l'entrée se recharge, l'entité est *off*, HEAT passe à *off*.
      4. **Retirer un mode** (CFG-YAML-4, ENT-HVAC-1) : options, vider *cool* : la liste n'a plus *cool* ni *heat_cool*.
      5. **Capteur externe** (ENT-EXT-1, CFG-SENS-2) : options, *heat_external_sensor* : la température externe, avec le capteur de la pièce : la valeur du capteur y est écrite. Avec en plus `heat_offset` 1 : refusé.
      6. **Une source pour plusieurs modes** (CFG-SENS-4) : options, *heat* et *cool* sur ALL avec des offsets différents : refusé, l'erreur cite les deux modes.
      7. **Entrées du YAML** (CFG-YAML-3) : les entrées déclarées en YAML (Adaptative HEAT...) n'ont pas d'options dans l'interface.
      8. **Rechargement sans changement** (ENT-INIT-4) : en *heat*, *Recharger* l'entrée : l'entité reprend *heat*.
      9. **Suppression** (END-3) : en *heat*, supprimer l'entrée : HEAT reste en *heat*, plus rien ne la pilote.
