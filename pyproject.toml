[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Let Home Assistant install its httpx alias before respx is imported.
addopts = "-p no:respx"

[tool.coverage.run]
source = ["custom_components.adaptative_climate"]
branch = true

[tool.coverage.report]
show_missing = true
