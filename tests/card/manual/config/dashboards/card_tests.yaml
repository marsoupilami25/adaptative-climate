# The manual tests of the card (documents/CARD_TESTS.md): its configuration and
# its look, on the entities of the manual tests of the integration.
# YAML dashboard: after editing this file, refresh the page in the browser.
#
# Each view fits on one screen: a few scenarios, its own Start. Each scenario:
# From (the state it starts from: Start, or after a scenario of the view),
# Do (the operations), Expect (what to see).
title: Tests card
views:

# --- Configuration ------------------------------------------------------------------
- title: Configuration
  path: configuration
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Not an AC entity
    - type: custom:adaptative-climate-card
      entity: climate.radiator_virtual_bi
      grid_options:
        columns: 6
    - type: custom:adaptative-climate-card
      entity: sensor.room_sensor_bi
      grid_options:
        columns: 6
    - type: heading
      heading: Missing entity
    - type: custom:adaptative-climate-card
      entity: climate.nowhere
    - type: heading
      heading: Wrong option
    - type: custom:adaptative-climate-card
      entity: climate.adaptative_bi
      monitoring: sometimes
    - type: heading
      heading: Wrong feature
    - type: custom:adaptative-climate-card
      entity: climate.adaptative_bi
      features:
      - type: ac-dial
  - type: grid
    cards:
    - type: custom:adaptative-climate-card
      entity: climate.adaptative_bi
      name: Living room
      show_current_as_primary: true
      monitoring: compact
      features:
      - type: ac-device
      - type: ac-hvac-modes
        hvac_modes: [cool, heat, 'off', dry]
      - type: ac-fan-modes
        style: icons
    - type: thermostat
      entity: climate.adaptative_bi
      name: Reference
      show_current_as_primary: true
      features:
      - type: climate-hvac-modes
        hvac_modes: [cool, heat, 'off']
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Configuration

        **Who is who**
        - Under the headings: cards configured wrong on purpose. A configuration the card refuses gets the error card of Home Assistant: on a dashboard, it only says *Configuration error*; the detail shows in the preview of an editor (view *Editor and YAML*).
        - **Living room**: the card on Adaptative BI (`climate.adaptative_bi`, the entity of *Tests bi-source*), with every option set.
        - **Reference**: the thermostat card of Home Assistant, same entity, same options.

        **Start**: on *Living room*, press *off*.

        1. **Errors** (CARD-GEN-1, CARD-GEN-2, CARD-CONF-6)
           - *From*: **Start** (Adaptative BI *off*).
           - *Do*: nothing.
           - *Expect*:
             - *Not an AC entity*: the first card says "climate.radiator_virtual_bi is not an Adaptative Climate entity"; the second (`sensor.room_sensor_bi`, not a climate entity) is the error card: *Configuration error*;
             - *Missing entity*: "Entity not available: climate.nowhere";
             - *Wrong option*, *Wrong feature*: the error card: *Configuration error*.
        2. **Options** (CARD-CONF-1, CARD-CONF-2, CARD-MODE-2, CARD-MON-1)
           - *From*: **Start** (Adaptative BI *off*).
           - *Do*: nothing.
           - *Expect*, on *Living room*:
             - the title *Living room*;
             - the current temperature in large, the target under it, as on *Reference*;
             - one dot at the top left, for the monitoring;
             - the modes *cool*, *heat*, *off*, in that order; no *dry* (Adaptative BI does not have it);
             - the fan greyed out (*off* has no fan).
        3. **Fan as icons** (CARD-CONF-2)
           - *From*: **Start** (Adaptative BI *off*).
           - *Do*: on *Living room*, press *cool*.
           - *Expect*: the fan is a bar of 3 icons: auto, low, high.

        </small>

# --- Editor -----------------------------------------------------------------------
- title: Editor
  path: editor
  type: sections
  max_columns: 1
  sections:
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Editor

        **Who is who**
        - **Card editor**: a dashboard you create once, to test the editor (a YAML dashboard cannot be edited): *Settings > Dashboards > Add dashboard > New dashboard from scratch*, title *Card editor*.

        **Start**: on *Card editor*, delete the cards left by a previous run.

        1. **Add card** (CARD-CONF-3)
           - *From*: **Start** (*Card editor* empty).
           - *Do*: on *Card editor*, edit the dashboard, *Add card*, search "Adaptative", choose *Adaptative Climate*.
           - *Expect*: *Adaptative Climate* is in the list. Its editor opens; the preview shows the card on the first AC entity, with no feature.
        2. **The options** (CARD-CONF-4)
           - *From*: after 1 (the editor of the new card open).
           - *Do*: *Entity*: Adaptative BI; *Name*: "Living room"; *Current temperature in large* on; *Monitoring*: *Compact (a dot)*.
           - *Expect*: *Entity* proposes only AC entities. The preview follows each change.
        3. **The features proposed** (CARD-CONF-4)
           - *From*: after 2 (Adaptative BI, *Living room*, *Compact*, no feature).
           - *Do*: open *Add a feature*.
           - *Expect*: *Device line*, *Modes*, *Presets*, *Fan*, *Swing*, *Horizontal swing*, in that order.
        4. **Each feature once** (CARD-CONF-4)
           - *From*: after 3 (*Add a feature* open).
           - *Do*: add the six features, one after the other.
           - *Expect*: each feature added leaves the list of *Add a feature*. The preview shows them in that order (no presets list: Adaptative BI has none).
        5. **Order and options of the features** (CARD-CONF-4)
           - *From*: after 4 (the six features added).
           - *Do*: move *Fan* up once; remove *Presets*; in *Modes*, *Modes shown*: *heat* and *off*; in *Swing*, *Style*: *Icons*.
           - *Expect*: the preview follows each change: the fan above the mode bar; the mode bar *heat*, *off*.

        </small>

# --- Editor and YAML --------------------------------------------------------------
- title: Editor and YAML
  path: yaml
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: custom:adaptative-climate-card
      entity: climate.adaptative_bi
      name: Living room
      show_current_as_primary: true
      monitoring: compact
      features:
      - type: ac-device
      - type: ac-hvac-modes
        hvac_modes: [cool, heat, 'off', dry]
      - type: ac-fan-modes
        style: icons
    - type: markdown
      text_only: true
      content: |-
        <small>

        The YAML of *Living room*, to paste:

        ```yaml
        type: custom:adaptative-climate-card
        entity: climate.adaptative_bi
        name: Living room
        show_current_as_primary: true
        monitoring: compact
        features:
          - type: ac-device
          - type: ac-hvac-modes
            hvac_modes: [cool, heat, "off", dry]
          - type: ac-fan-modes
            style: icons
        ```

        </small>
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Editor and YAML

        **Who is who**
        - **Living room**: the card configured by the YAML under it.
        - **Card editor**: the dashboard of the view *Editor*.

        **Start**: on *Card editor*, edit the dashboard, *Add card*, choose *Adaptative Climate*: its editor opens.

        1. **YAML to editor** (CARD-CONF-5)
           - *From*: **Start** (the editor of a new card open).
           - *Do*: *Show code editor*; replace the YAML with the one under *Living room*; *Show visual editor*.
           - *Expect*: the editor shows *Living room*, current temperature in large, *Compact*, and the features *Device line*, *Modes*, *Fan* (*Icons*). In *Modes*, *cool*, *heat* and *off* selected, in that order; no *dry*: the editor proposes only the modes of Adaptative BI. The preview looks as *Living room*.
        2. **Editor to YAML** (CARD-CONF-5)
           - *From*: after 1 (the editor shows the YAML pasted).
           - *Do*: in *Fan*, *Style*: *List*; *Show code editor*.
           - *Expect*: the YAML pasted, `dry` included, with one change only: the `style` of `ac-fan-modes` (`dropdown`, or no `style`: the default).
        3. **Saved** (CARD-CONF-5)
           - *From*: after 2 (the code editor shows the YAML, the fan as a list).
           - *Do*: *Save*.
           - *Expect*: the card looks as *Living room*, with the fan as a list.
        4. **Saved YAML** (CARD-CONF-5)
           - *From*: after 3 (the card saved).
           - *Do*: edit the card, *Show code editor*.
           - *Expect*: the YAML of 2.
        5. **A wrong value** (CARD-CONF-6)
           - *From*: after 4 (the code editor of the saved card open).
           - *Do*: in the code editor, change `monitoring: compact` to `monitoring: sometimes`.
           - *Expect*: the preview shows the error card, *Configuration error*, with under it a message that names `monitoring`.

        </small>

# --- Look -------------------------------------------------------------------------
- title: Look
  path: look
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: custom:adaptative-climate-card
      entity: climate.adaptative_multi
      name: Adaptative MULTI
      features: &look_features
      - type: ac-device
      - type: ac-hvac-modes
  - type: grid
    cards:
    - type: thermostat
      entity: climate.adaptative_multi
      name: Reference
      features: &look_reference
      - type: climate-hvac-modes
    - type: button
      entity: script.reset_sources_multi
      name: Reset the sources (multi)
      icon: mdi:restore
      tap_action:
        action: toggle
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Look

        **Who is who**
        - **Adaptative MULTI**: the card under test, on Adaptative MULTI (`climate.adaptative_multi`, the entity of *Tests multi-sources*: one source per mode).
        - **Reference**: the thermostat card of Home Assistant, same entity.

        **Start**: press **Reset the sources (multi)**; on *Adaptative MULTI*, press *off*.

        1. **Each mode as on the thermostat card** (CARD-DIAL-1, CARD-LOOK-3, CARD-MODE-1, CARD-MODE-3)
           - *From*: **Start** (Adaptative MULTI *off*).
           - *Do*: on *Adaptative MULTI*, press each mode in turn: *heat*, *cool*, *heat_cool*, *auto*, *dry*, *fan_only*, *off*.
           - *Expect*, for each mode: the same color of the arc, text of the state, numbers and icons of the modes on both cards. On *Adaptative MULTI*, the button of the current mode filled with its color.
        2. **Order of the parts** (CARD-LOOK-1)
           - *From*: **Start** (Adaptative MULTI *off*).
           - *Do*: nothing.
           - *Expect*: on *Adaptative MULTI*, from top to bottom: the title, the dial, the device line (empty in *off*), the mode bar.
        3. **Buttons of the dial** (CARD-DIAL-1)
           - *From*: **Start** (Adaptative MULTI *off*).
           - *Do*: on *Adaptative MULTI*, press *heat*, then +, then ⋮.
           - *Expect*: + raises the target by one step, on both cards. ⋮ opens the details of Adaptative MULTI, as on *Reference*.
        4. **Mode without target** (CARD-DIAL-2)
           - *From*: **Start** (Adaptative MULTI *off*).
           - *Do*: on *Adaptative MULTI*, press *fan_only*.
           - *Expect*: in the center of *Adaptative MULTI*, "Fan only" is smaller than on *Reference*, centered, inside the circle.

        </small>

# --- Theme and language -----------------------------------------------------------
- title: Theme and language
  path: theme
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: custom:adaptative-climate-card
      entity: climate.adaptative_multi
      name: Adaptative MULTI
      features: *look_features
  - type: grid
    cards:
    - type: thermostat
      entity: climate.adaptative_multi
      name: Reference
      features: *look_reference
    - type: button
      entity: script.reset_sources_multi
      name: Reset the sources (multi)
      icon: mdi:restore
      tap_action:
        action: toggle
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Theme and language

        **Who is who**
        - **Adaptative MULTI**: the card under test, on Adaptative MULTI (`climate.adaptative_multi`, the entity of *Tests multi-sources*).
        - **Reference**: the thermostat card of Home Assistant, same entity.

        **Start**: press **Reset the sources (multi)**; on *Adaptative MULTI*, press *heat*; in your profile (*Settings > Profile*), *Language* English and *Theme* Auto.

        1. **Light theme** (CARD-LOOK-3)
           - *From*: **Start** (Adaptative MULTI *heat*; English, theme *Auto*).
           - *Do*: in your profile, *Theme*: *Light*.
           - *Expect*: both cards light, with the same background, texts and icons; the same orange for *heat*.
        2. **Dark theme** (CARD-LOOK-3)
           - *From*: after 1 (theme *Light*).
           - *Do*: in your profile, *Theme*: *Dark*.
           - *Expect*: both cards dark, with the same background, texts and icons; the same orange for *heat*.
        3. **French** (CARD-LANG-1, CARD-LANG-3)
           - *From*: **Start** (Adaptative MULTI *heat*; English, theme *Auto*).
           - *Do*: in your profile, *Language*: *Français*. On *Adaptative MULTI*, hover *heat*, then the two indicators at the top left.
           - *Expect*: the tooltip of *heat*: "Chauffage · HEAT Virtual (multi)". Those of the indicators: "Les appareils répondent et obéissent", "Les températures concordent". The state and the modes in French, as on *Reference*.
        4. **French, mode without target** (CARD-DIAL-2)
           - *From*: after 3 (French; Adaptative MULTI *heat*).
           - *Do*: on *Adaptative MULTI*, press *fan_only*.
           - *Expect*: "Ventilation uniquement" stays inside the circle of *Adaptative MULTI*. On *Reference*, it fills the dial.
        5. **A language the card does not have** (CARD-LANG-2, CARD-LANG-3)
           - *From*: **Start** (Adaptative MULTI *heat*; English, theme *Auto*).
           - *Do*: in your profile, *Language*: *Deutsch*. On *Adaptative MULTI*, hover *heat*, then the indicators at the top left.
           - *Expect*: the tooltip of *heat* in German, from Home Assistant: "Heizen · HEAT Virtual (multi)". Those of the indicators in English: "The devices respond and obey", "The temperatures agree".

        </small>

# --- UIX --------------------------------------------------------------------------
- title: UIX
  path: uix
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: custom:adaptative-climate-card
      entity: climate.adaptative_multi
      name: Adaptative MULTI
      features: *look_features
      uix:
        style:
          .: &uix_card |
            {% set mode = states(config.entity) | replace('heat_cool', 'heat-cool') %}
            ha-card {
              --state-climate-heat-color: purple;
            {% if mode in ['heat', 'cool', 'heat-cool', 'auto', 'dry', 'fan_only'] %}
              border: 2px solid var(--state-climate-{{ mode }}-color);
              background: color-mix(in srgb, var(--state-climate-{{ mode }}-color) 15%, var(--card-background-color));
            {% endif %}
            }
            .title { font-weight: bold; }
          "ac-features $ ac-hvac-modes-feature $ ac-ha-control-select $": &uix_selected |
            /* Not an outline: the color of the selected button is a layer above it (::before) */
            .option.selected::after {
              content: "";
              position: absolute;
              inset: 4px;
              border: 2px dashed var(--primary-text-color);
              border-radius: 8px;
            }
  - type: grid
    cards:
    - type: thermostat
      entity: climate.adaptative_multi
      name: Reference
      features: *look_reference
      uix:
        style:
          .: *uix_card
          "hui-card-features $ hui-card-feature $ hui-climate-hvac-modes-card-feature $ ha-control-select $": *uix_selected
    - type: button
      entity: script.reset_sources_multi
      name: Reset the sources (multi)
      icon: mdi:restore
      tap_action:
        action: toggle
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## UIX

        **Who is who**
        - **Adaptative MULTI**: the card under test, on Adaptative MULTI (`climate.adaptative_multi`, the entity of *Tests multi-sources*), styled with UIX: the border and background of its mode, *heat* in purple, the title in bold, the button of the current mode framed by dashes.
        - **Reference**: the thermostat card of Home Assistant, same entity, same style: the paths of the thermostat card in the README of the integration (*Style it with UIX*).

        **Start**: press **Reset the sources (multi)**; on *Adaptative MULTI*, press *off*.

        1. **Colored by its mode** (CARD-LOOK-8)
           - *From*: **Start** (Adaptative MULTI *off*).
           - *Do*: on *Adaptative MULTI*, press *cool*, then *dry*, then *off*.
           - *Expect*, on both cards: in *cool*, a blue border and a light blue background; in *dry*, orange; in *off*, no border, the usual background.
        2. **A color of Home Assistant changed** (CARD-LOOK-8)
           - *From*: **Start** (Adaptative MULTI *off*).
           - *Do*: on *Adaptative MULTI*, press *heat*.
           - *Expect*, on both cards: the border, the arc and the *heat* button purple, not orange; the background light purple.
        3. **Inside the card** (CARD-LOOK-8)
           - *From*: after 2 (Adaptative MULTI *heat*).
           - *Do*: nothing.
           - *Expect*, on both cards: the title in bold. On the mode bar, the *heat* button framed by a line of dashes (– – –), in the color of the text, just inside its edge; the other buttons without frame.

        </small>

# --- UIX 2 ------------------------------------------------------------------------
- title: UIX 2
  path: uix-2
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: vertical-stack
      cards:
      - type: markdown
        content: A vertical stack holds this text and the card under it.
      - type: custom:adaptative-climate-card
        entity: climate.adaptative_multi
        name: Adaptative MULTI (stack)
        features:
        - type: ac-hvac-modes
        uix:
          style: |
            .title { font-weight: bold; }
            ha-card { --state-climate-heat-color: crimson; }
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        The YAML to paste in the editor (the simple example of the README):

        ```yaml
        type: custom:adaptative-climate-card
        entity: climate.adaptative_multi
        features:
          - type: ac-hvac-modes
        uix:
          style: |
            .title { font-weight: bold; }
            ha-card { --state-climate-heat-color: crimson; }
        ```

        </small>
    - type: button
      entity: script.reset_sources_multi
      name: Reset the sources (multi)
      icon: mdi:restore
      tap_action:
        action: toggle
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## UIX 2

        **Who is who**
        - **Adaptative MULTI (stack)**: the card under test, on Adaptative MULTI (`climate.adaptative_multi`), inside a vertical stack, styled with UIX: the title in bold, *heat* in crimson.
        - **Card editor**: the dashboard of the view *Editor*.

        **Start**: press **Reset the sources (multi)**; on *Adaptative MULTI (stack)*, press *heat*. On *Card editor*, edit the dashboard, *Add card*, choose *Adaptative Climate*: its editor opens.

        1. **Inside another card** (CARD-LOOK-8)
           - *From*: **Start** (Adaptative MULTI *heat*).
           - *Do*: nothing.
           - *Expect*: on *Adaptative MULTI (stack)*, the title in bold; the arc and the *heat* button crimson, not orange.
        2. **A style in the YAML** (CARD-LOOK-8)
           - *From*: **Start** (Adaptative MULTI *heat*; the editor of a new card open).
           - *Do*: *Show code editor*; replace the YAML with the one to paste.
           - *Expect*: the preview: the title in bold, the arc and the *heat* button crimson. A brush icon (UIX) in the button *Show visual editor*.
        3. **The editor keeps it** (CARD-LOOK-8, CARD-CONF-5)
           - *From*: after 2 (the code editor shows the YAML pasted).
           - *Do*: *Show visual editor*; *Name*: "UIX"; *Show code editor*.
           - *Expect*: the YAML pasted, with `name: UIX` added and the `uix` key unchanged. The preview: the title *UIX* in bold.
        4. **Saved** (CARD-LOOK-8, CARD-CONF-5)
           - *From*: after 3 (the code editor shows the YAML with `name: UIX`).
           - *Do*: *Save*.
           - *Expect*: on *Card editor*, the card *UIX* with its title in bold, the arc and the *heat* button crimson.

        </small>

# --- Expander ---------------------------------------------------------------------
# Expander Card (MelleD/lovelace-expander-card): downloaded by
# tests/card/manual/link_config.sh, loaded by the package card_tests.yaml.
- title: Expander
  path: expander
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: custom:expander-card
      title: Adaptative MULTI (expander)
      cards:
      - type: custom:adaptative-climate-card
        entity: climate.adaptative_multi
        name: Adaptative MULTI
        features: *look_features
  - type: grid
    cards:
    - type: custom:expander-card
      title: Reference (expander)
      cards:
      - type: thermostat
        entity: climate.adaptative_multi
        name: Reference
        features: *look_reference
    - type: button
      entity: script.reset_sources_multi
      name: Reset the sources (multi)
      icon: mdi:restore
      tap_action:
        action: toggle
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Expander

        **Who is who**
        - **Adaptative MULTI (expander)**: an [Expander Card](https://github.com/MelleD/lovelace-expander-card), closed at load. It holds the card under test, **Adaptative MULTI**, on Adaptative MULTI (`climate.adaptative_multi`, the entity of *Tests multi-sources*), with the device line and the mode bar.
        - **Reference (expander)**: an Expander Card, closed at load. It holds **Reference**, the thermostat card of Home Assistant, same entity.
        - Expander Card is installed by `tests/card/manual/link_config.sh` (tests/card/README.md).

        **Start**: refresh the page (both expanders closed); press **Reset the sources (multi)**; open *Reference (expander)*, press *off* on *Reference*, close it.

        1. **Opened** (CARD-LOOK-9, CARD-CONF-7)
           - *From*: **Start** (Adaptative MULTI *off*; both expanders closed).
           - *Do*: open *Adaptative MULTI (expander)*, then *Reference (expander)*.
           - *Expect*: no configuration error. *Adaptative MULTI* in *off*, its dial as large as on *Reference*; under it, the device line (empty) and the mode bar, *off* selected.
        2. **A change while closed** (CARD-LOOK-9)
           - *From*: after 1 (Adaptative MULTI *off*; both expanders open).
           - *Do*: close *Adaptative MULTI (expander)*; on *Reference*, press *heat*; open *Adaptative MULTI (expander)*.
           - *Expect*: *Adaptative MULTI* in *heat* at once: the arc orange, the same target as on *Reference*, *heat* selected on the mode bar, the device line *HEAT Virtual (multi)*. The dial keeps its size.

        </small>

# --- Expander 2 -------------------------------------------------------------------
- title: Expander 2
  path: expander-2
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: custom:expander-card
      title: Adaptative MULTI (opened at load)
      expanded: true
      cards:
      - type: custom:adaptative-climate-card
