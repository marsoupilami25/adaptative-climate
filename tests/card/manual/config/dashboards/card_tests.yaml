# --- Monitoring ---------------------------------------------------------------------
- title: Monitoring
  path: monitoring
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: custom:adaptative-climate-card
      entity: climate.adaptative_monitor
      name: always
      monitoring: always
      grid_options:
        columns: 6
    - type: custom:adaptative-climate-card
      entity: climate.adaptative_monitor
      name: compact
      monitoring: compact
      grid_options:
        columns: 6
    - type: custom:adaptative-climate-card
      entity: climate.adaptative_monitor
      name: errors
      monitoring: errors
      grid_options:
        columns: 6
    - type: custom:adaptative-climate-card
      entity: climate.adaptative_monitor
      name: hidden
      monitoring: hidden
      grid_options:
        columns: 6
    - type: glance
      title: Adaptative MONITOR monitoring
      show_state: true
      state_color: true
      entities:
      - entity: binary_sensor.adaptative_monitor_monitoring_sources
        name: Monitoring sources
      - entity: binary_sensor.adaptative_monitor_monitoring_temperatures
        name: Monitoring temperatures
  - type: grid
    cards:
    - type: custom:adaptative-climate-card
      entity: climate.adaptative_monitor
      name: Adaptative MONITOR
      features:
      - type: ac-device
      - type: ac-hvac-modes
    - type: entities
      title: Monitor helpers
      state_color: true
      entities:
      - entity: input_number.offset_radiator_monitor
        name: Offset RADIATOR
      - entity: input_boolean.available_radiator_monitor
        name: RADIATOR available
    - type: button
      entity: script.reset_sources_monitor
      name: Reset the sources (monitor)
      icon: mdi:restore
      tap_action:
        action: toggle
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Monitoring

        - **always**, **compact**, **errors**, **hidden**: the card on Adaptative MONITOR (`climate.adaptative_monitor`, from the dashboard *Tests monitoring*), with each value of `monitoring`.
        - **Adaptative MONITOR monitoring**: its two monitoring sensors, as Home Assistant shows them.
        - **Adaptative MONITOR**: the same entity, with its device line and its mode bar, to drive it.
        - **Monitor helpers**: helpers of *Tests monitoring*. *Offset RADIATOR*: RADIATOR Virtual measures the room plus its offset; more than 2 °C from the room sensor is a problem. *RADIATOR available* off: RADIATOR Virtual is `unavailable`.
        - **Reset the sources (monitor)**: the reset of *Tests monitoring*.

        **Start**: **Reset the sources (monitor)**, then Adaptative MONITOR *off*: *Monitoring sources* and *Monitoring temperatures* *OK*.

        1. **No problem** (CARD-MON-1, CARD-MON-2, CARD-MON-3, CARD-MON-4): from **Start**. *always*: two green indicators, the sync arrows then the thermometer with a check; their tooltips "The devices respond and obey", "The temperatures agree". *compact*: a green dot, its tooltip "No problem". *errors* and *hidden*: nothing.
        2. **Temperatures** (CARD-MON-1, CARD-MON-2, CARD-MON-3, CARD-MON-4): from **Start**. *Offset RADIATOR* 3: after 15 s, *Monitoring temperatures* goes to *Problem*. *always*: the thermometer with an alert, red; the sync arrows stay green. *compact*: a red dot, its tooltip "The temperatures do not agree". *errors*: the red thermometer alone, on the left. *hidden*: nothing.
        3. **Both** (CARD-MON-1, CARD-MON-4, CARD-DEV-3): after 2. Adaptative MONITOR to *heat*, wait 12 s. *RADIATOR available* off: after 15 s, *Monitoring sources* goes to *Problem*. *always*: both indicators red, the sync alert and the thermometer alert. *errors*: both, the sources first. *compact*: red, its tooltip gives both problems, one per line. On *Adaptative MONITOR*, the device line: *RADIATOR Virtual (monitor)* in red, with the sync alert.
        4. **Details** (CARD-MON-5): after 3. On *always*, press the sync alert: the details of *Monitoring sources* open (its *problems* attribute names the source). The thermometer: *Monitoring temperatures*. The dot of *compact*: *Monitoring sources*, the sources first. *RADIATOR available* on, and wait until *Monitoring sources* is *OK*: the dot opens *Monitoring temperatures*.

        </small>
