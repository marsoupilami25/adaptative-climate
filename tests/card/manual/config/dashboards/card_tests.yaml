        name: Adaptative MULTI
        features: *look_features
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        The YAML to paste in the editor of an *Expander Card* (scenario 2): the expander, with the card under test inside.

        ```yaml
        type: custom:expander-card
        title: Expander (pasted)
        cards:
          - type: custom:adaptative-climate-card
            entity: climate.adaptative_multi
            name: Adaptative MULTI (pasted)
            features:
              - type: ac-hvac-modes
        ```

        </small>
    - type: button
      entity: script.reset_sources_multi
      name: Reset the sources (multi)
      icon: mdi:restore
      tap_action:
        action: toggle
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Expander 2

        **Who is who**
        - **Adaptative MULTI (opened at load)**: an Expander Card, open at load (`expanded: true`). It holds the card under test, **Adaptative MULTI**, on Adaptative MULTI (`climate.adaptative_multi`).
        - **Card editor**: the dashboard of the view *Editor*.

        **Start**: press **Reset the sources (multi)**; on *Adaptative MULTI*, press *off*. On *Card editor*, delete the cards left by a previous run.

        1. **Opened at load** (CARD-LOOK-9)
           - *From*: **Start** (Adaptative MULTI *off*).
           - *Do*: refresh the page.
           - *Expect*: *Adaptative MULTI (opened at load)* open, with *Adaptative MULTI* in it at once: no configuration error, the dial as wide as the column, *off* selected on the mode bar.
        2. **Pasted in the editor** (CARD-CONF-7)
           - *From*: **Start** (Adaptative MULTI *off*; *Card editor* empty).
           - *Do*: on *Card editor*, edit the dashboard, *Add card*, search "Expander", choose *Expander Card* (not *Adaptative Climate*: the card under test goes inside the expander, through the YAML). *Show code editor*; replace the whole YAML of the expander with the one to paste, which starts with `type: custom:expander-card`.
           - *Expect*: the preview shows the expander *Expander (pasted)*, closed, with no configuration error.
        3. **Opened in the preview** (CARD-LOOK-9, CARD-CONF-7)
           - *From*: after 2 (the preview shows *Expander (pasted)* closed).
           - *Do*: in the preview, open *Expander (pasted)*.
           - *Expect*: *Adaptative MULTI (pasted)* in it, in *off*: the dial at its size, the mode bar, no configuration error.
        4. **Saved** (CARD-LOOK-9, CARD-CONF-7)
           - *From*: after 3 (the preview shows *Expander (pasted)* open).
           - *Do*: *Save*; on *Card editor*, open *Expander (pasted)*.
           - *Expect*: *Adaptative MULTI (pasted)* in *off*, the dial at its size, no configuration error.

        </small>

# --- Phase ------------------------------------------------------------------------
- title: Phase
  path: phase
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: custom:adaptative-climate-card
      entity: climate.adaptative_bi
      name: Adaptative BI
      features: &bi_features
      - type: ac-device
      - type: ac-hvac-modes
  - type: grid
    cards:
    - type: thermostat
      entity: climate.adaptative_bi
      name: Reference
      features: &bi_reference
      - type: climate-hvac-modes
    - type: entities
      entities:
      - entity: input_number.room_temperature_bi
        name: Room temperature
    - type: button
      entity: script.reset_sources_bi
      name: Reset the sources (bi)
      icon: mdi:restore
      tap_action:
        action: toggle
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Phase

        **Who is who**
        - **Adaptative BI**: the card under test, on Adaptative BI (`climate.adaptative_bi`, the entity of *Tests bi-source*). Its *heat_cool* runs phase `heat` on RADIATOR Virtual, phase `cool` on AIRCON Virtual. The phase follows the *Room temperature*, with a hysteresis of 1 °C.
        - **Reference**: the thermostat card of Home Assistant, same entity.
        - **Room temperature**: the room sensor of Adaptative BI.

        **Start**: press **Reset the sources (bi)** (*Room temperature* 20). On *Adaptative BI*, press *heat_cool*, set low to 19 and high to 24 on the dial (raise high first if needed), then press *off*: Adaptative BI keeps 19–24 for *heat_cool*.

        1. **Phase heat** (CARD-PHASE-1, CARD-PHASE-2)
           - *From*: **Start** (Adaptative BI *off*; its *heat_cool* range 19–24; *Room temperature* 20).
           - *Do*: on *Adaptative BI*, press *heat_cool*.
           - *Expect*: phase `heat` (20 is closer to 19). The low handle (19) is inverted: its center orange, its ring white. The high handle (24) looks as on *Reference*.
        2. **Phase cool** (CARD-PHASE-1, CARD-PHASE-2)
           - *From*: after 1 (*heat_cool*, range 19–24, phase `heat`; *Room temperature* 20).
           - *Do*: *Room temperature* 25.5.
           - *Expect*: phase `cool` (above 24 + 1). The high handle is inverted, its center blue. The low handle looks as on *Reference*.
        3. **Device in phase cool** (CARD-DEV-1)
           - *From*: after 2 (*heat_cool*, range 19–24, phase `cool`; *Room temperature* 25.5).
           - *Do*: nothing.
           - *Expect*: under the dial, the icon of *heat_cool*, then *AIRCON Virtual (bi)*.
        4. **Device in phase heat** (CARD-DEV-1)
           - *From*: after 3 (*heat_cool*, range 19–24, phase `cool`; *Room temperature* 25.5).
           - *Do*: *Room temperature* 17.5.
           - *Expect*: phase `heat` (below 19 − 1). The line shows *RADIATOR Virtual (bi)*.
        5. **No device** (CARD-LOOK-2)
           - *From*: after 4 (*heat_cool*, range 19–24, phase `heat`; *Room temperature* 17.5).
           - *Do*: on *Adaptative BI*, press *off*.
           - *Expect*: the device line is empty, but keeps its height: the dial and the mode bar do not move.

        </small>

