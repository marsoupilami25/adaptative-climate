        <small>

        ## Dropdown

        **Who is who**
        - **MULTI dropdown**: the card under test, on Adaptative MULTI (`climate.adaptative_multi`, the entity of *Tests multi-sources*), its lists in `dropdown` style. Its fan offers in *heat*: Auto, Low, Medium, High, Turbo; in *cool*: auto, low, medium, high; in *off*: nothing. No presets.
        - **Fan COOL without medium**: on, *medium* leaves the fan of *cool*, after 20 s: Adaptative MULTI keeps an option the source no longer shows for 20 s (removal confirmation).

        **Start**: press **Reset the sources (multi)**. On *MULTI dropdown*, press *heat*, choose the fan *Auto*, then press *off*: Adaptative MULTI keeps the fan *Auto* for *heat*, *cool* and *dry* (it remembers the fan across resets).

        1. **Greyed lists** (CARD-LIST-1, CARD-LIST-5)
           - *From*: **Start** (Adaptative MULTI *off*; fan memory *Auto*).
           - *Do*: hover the fan list, then press it.
           - *Expect*: the fan, swing and horizontal swing lists faded: the icon "fan off" or "oscillation off", "—", no arrow. The tooltip: "Fan mode: not offered in this mode". The press opens nothing. No presets list.
        2. **Closed list** (CARD-LIST-2)
           - *From*: **Start** (Adaptative MULTI *off*; fan memory *Auto*).
           - *Do*: press *heat*; hover the fan list.
           - *Expect*: the fan icon, "Auto" and an arrow. The tooltip: "Fan mode".
        3. **Open list** (CARD-LIST-3)
           - *From*: after 2 (*heat*, fan *Auto*).
           - *Do*: press the fan list.
           - *Expect*: *Auto*, *Low*, *Medium*, *High*, *Turbo*, in that order, each with its icon; *Auto* checked.
        4. **Choosing an option** (CARD-LIST-3, CARD-GEN-5)
           - *From*: after 3 (*heat*, fan *Auto*, the fan list open).
           - *Do*: choose *High*.
           - *Expect*: the list closes and shows *High*.
        5. **Closing without choosing** (CARD-LIST-3)
           - *From*: after 4 (*heat*, fan *High*).
           - *Do*: open the fan list, press outside it; open it again, press Escape.
           - *Expect*: it closes each time, and still shows *High*.
        6. **Option removed** (CARD-LIST-3)
           - *From*: **Start** (Adaptative MULTI *off*; fan memory *Auto*).
           - *Do*: press *cool*; *Fan COOL without medium* on; wait 20 s; open the fan list.
           - *Expect*: *Auto*, *Low*, *High*.

        </small>

