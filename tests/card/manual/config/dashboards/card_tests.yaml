      ## Masonry

      - **Masonry**: the card on Adaptative MULTI (`climate.adaptative_multi`, from the dashboard *Tests multi-sources*) in a masonry view: its height is automatic.
      - **Reference**: the thermostat card of Home Assistant on the same entity, with its features.
      - **Reset the sources (multi)**: the reset of *Tests multi-sources*.

      **Start**: **Reset the sources (multi)**, then Adaptative MULTI *heat* (on *Masonry*).

