    - type: button
      entity: script.reset_sources_bi
      name: Reset the sources (bi)
      icon: mdi:restore
      tap_action:
        action: toggle
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Modes

        **Who is who**
        - **Adaptative BI**: the card under test, on Adaptative BI (`climate.adaptative_bi`, the entity of *Tests bi-source*). *heat* runs on RADIATOR Virtual, *cool* on AIRCON Virtual, *heat_cool* on both.
        - **Reference**: the thermostat card of Home Assistant, same entity.
        - **RADIATOR available**, **AIRCON available**: off, the source is `unavailable`.

        **Start**: press **Reset the sources (bi)**; on *Adaptative BI*, press *off*.

        1. **Tooltips of the modes** (CARD-MODE-5)
           - *From*: **Start** (Adaptative BI *off*; both sources available).
           - *Do*: on *Adaptative BI*, hover *heat*, *cool*, then *heat_cool*.
           - *Expect*: "Heat · RADIATOR Virtual (bi)", "Cool · AIRCON Virtual (bi)", "Heat/Cool · RADIATOR Virtual (bi) · AIRCON Virtual (bi)".
        2. **Mode not available** (CARD-MODE-4)
           - *From*: **Start** (Adaptative BI *off*; both sources available).
           - *Do*: *RADIATOR available* off.
           - *Expect*: on *Adaptative BI*, *heat* is greyed out. *heat_cool* is not: AIRCON Virtual is enough for it.
        3. **Pressing a mode not available** (CARD-MODE-4, CARD-GEN-5)
           - *From*: after 2 (Adaptative BI *off*; RADIATOR Virtual unavailable).
           - *Do*: on *Adaptative BI*, press *heat*.
           - *Expect*: a bubble says "Heat: RADIATOR Virtual (bi) unavailable", then goes away. Adaptative BI stays *off*. No new error in *Settings > System > Logs*.
        4. **Entity unavailable** (CARD-MISS-1)
           - *From*: **Start** (Adaptative BI *off*; both sources available).
           - *Do*: on *Adaptative BI*, press *heat_cool*. *AIRCON available* off, then *RADIATOR available* off.
           - *Expect*: Adaptative BI is `unavailable`. Its dial looks as on *Reference* ("Unavailable"), its mode bar is greyed out, its device line empty. The two indicators still show at the top left.

        </small>

