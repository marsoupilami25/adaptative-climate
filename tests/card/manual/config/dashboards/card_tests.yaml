    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Device line

        **Who is who**
        - **Adaptative BI**: the card under test, on Adaptative BI (`climate.adaptative_bi`, the entity of *Tests bi-source*). *heat* runs on RADIATOR Virtual, *cool* on AIRCON Virtual. RADIATOR Virtual can also run *fan_only*, a mode Adaptative BI does not manage.
        - **Mode RADIATOR**: the remote of RADIATOR Virtual.
        - **RADIATOR available**, **AIRCON available**: off, the source is `unavailable`.

        **Start**: press **Reset the sources (bi)**; on *Adaptative BI*, press *off*.

        1. **Active device unavailable** (CARD-DEV-3, CARD-DEV-5)
           - *From*: **Start** (Adaptative BI *off*; both sources *off* and available).
           - *Do*: on *Adaptative BI*, press *heat*; wait 12 s. *RADIATOR available* off.
           - *Expect*: Adaptative BI waits for its source. The device line shows *RADIATOR Virtual (bi)* and the sync alert icon, in red. The tooltip of the icon: "RADIATOR Virtual (bi) unavailable".
        2. **The reason on a touch screen** (CARD-DEV-6)
           - *From*: after 1 (Adaptative BI waiting in *heat*; RADIATOR Virtual unavailable).
           - *Do*: press the sync alert icon; then press the text that shows.
           - *Expect*: the first press shows "RADIATOR Virtual (bi) unavailable" under the line; the second hides it.
        3. **Foreign mode** (CARD-DEV-3, CARD-DEV-5)
           - *From*: **Start** (Adaptative BI *off*; both sources *off* and available).
           - *Do*: on *Adaptative BI*, press *cool*; wait 12 s. *Mode RADIATOR*: *fan_only*.
           - *Expect*: Adaptative BI stays in *cool*. The device line shows *AIRCON Virtual (bi)* in its usual color, then the remote icon in amber (the name stays neutral: the foreign mode runs on another device). The tooltip of the icon: "RADIATOR Virtual (bi) runs Fan only · not managed".
        4. **Both reasons** (CARD-DEV-4, CARD-DEV-5)
           - *From*: after 3 (Adaptative BI *cool*; RADIATOR Virtual in *fan_only*).
           - *Do*: *AIRCON available* off.
           - *Expect*: the name and the icon turn red; the icon becomes the sync alert. Its tooltip, on two lines: "AIRCON Virtual (bi) unavailable", "RADIATOR Virtual (bi) runs Fan only · not managed".
        5. **No active device** (CARD-DEV-7)
           - *From*: **Start** (Adaptative BI *off*; both sources *off* and available).
           - *Do*: *Mode RADIATOR*: *fan_only*.
           - *Expect*: Adaptative BI stays *off*. The device line shows no name, only the remote icon in amber, with the tooltip of 3.

        </small>

