    cards:
    - type: custom:adaptative-climate-card
      entity: climate.adaptative_monitor
      name: always
      monitoring: always
      grid_options:
        columns: 6
    - type: custom:adaptative-climate-card
      entity: climate.adaptative_monitor
      name: compact
      monitoring: compact
      grid_options:
        columns: 6
    - type: custom:adaptative-climate-card
      entity: climate.adaptative_monitor
      name: errors
      monitoring: errors
      grid_options:
        columns: 6
    - type: custom:adaptative-climate-card
      entity: climate.adaptative_monitor
      name: hidden
      monitoring: hidden
      grid_options:
        columns: 6
    - &monitor_glance
      type: glance
      title: Adaptative MONITOR monitoring
      show_state: true
      state_color: true
      entities:
      - entity: binary_sensor.adaptative_monitor_monitoring_sources
        name: Monitoring sources
      - entity: binary_sensor.adaptative_monitor_monitoring_temperatures
        name: Monitoring temperatures
  - type: grid
    cards: &monitor_controls
    - type: custom:adaptative-climate-card
      entity: climate.adaptative_monitor
      name: Adaptative MONITOR
      features:
      - type: ac-device
      - type: ac-hvac-modes
    - type: entities
      state_color: true
      entities:
      - entity: input_number.offset_aircon_monitor
        name: Offset AIRCON
      - entity: input_boolean.available_radiator_monitor
        name: RADIATOR available
    - type: button
      entity: script.reset_sources_monitor
      name: Reset the sources (monitor)
      icon: mdi:restore
      tap_action:
        action: toggle
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Monitoring

        **Who is who**
        - **always**, **compact**, **errors**, **hidden**: the card under test, on Adaptative MONITOR (`climate.adaptative_monitor`, the entity of *Tests monitoring*), with that value of `monitoring`. The indicators are at the top left.
        - **Adaptative MONITOR monitoring**: its two monitoring sensors, as Home Assistant shows them.
        - **Adaptative MONITOR**: the same entity, to change its mode.
        - **Offset AIRCON**: AIRCON Virtual measures the room plus it; 3 makes a temperature problem. **RADIATOR available** off, in *heat*: a sources problem. The two problems come from two sources: a source `unavailable` measures nothing, so it cannot make a temperature problem.

        **Start**: press **Reset the sources (monitor)**; on *Adaptative MONITOR*, press *off*; wait until both sensors are *OK*.

        1. **No problem** (CARD-MON-1, CARD-MON-2, CARD-MON-3, CARD-MON-4)
           - *From*: **Start** (Adaptative MONITOR *off*; both sensors *OK*).
           - *Do*: hover the indicators of *always*, then the dot of *compact*.
           - *Expect*:
             - *always*: two green icons, the sync arrows and the thermometer with a check; tooltips "The devices respond and obey", "The temperatures agree";
             - *compact*: a green dot, tooltip "No problem";
             - *errors*, *hidden*: nothing.
        2. **A temperature problem** (CARD-MON-1, CARD-MON-2, CARD-MON-3, CARD-MON-4)
           - *From*: **Start** (Adaptative MONITOR *off*; both sensors *OK*).
           - *Do*: *Offset AIRCON* 3; wait until *Monitoring temperatures* is *Problem* (15 s).
           - *Expect*:
             - *always*: the sync arrows green, the thermometer with an alert red;
             - *compact*: a red dot, tooltip "The temperatures do not agree";
             - *errors*: the red thermometer alone;
             - *hidden*: nothing.
        3. **Both problems** (CARD-MON-1, CARD-MON-4, CARD-DEV-3)
           - *From*: after 2 (Adaptative MONITOR *off*; *Monitoring temperatures* *Problem*).
           - *Do*: on *Adaptative MONITOR*, press *heat*; wait 12 s; *RADIATOR available* off; wait until *Monitoring sources* is *Problem* (15 s).
           - *Expect*:
             - *always*: both red, the sync alert and the thermometer alert;
             - *errors*: both, the sync alert first;
             - *compact*: a red dot, its tooltip on two lines: "The devices do not respond or do not obey", "The temperatures do not agree";
             - *Adaptative MONITOR*: the device line *RADIATOR Virtual (monitor)* and the sync alert, in red.

        </small>

