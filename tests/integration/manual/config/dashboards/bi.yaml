      show_state: true
      entities:
      - entity: input_boolean.available_aircon_bi
        name: Available
        tap_action:
          action: toggle
      - entity: input_boolean.unknown_aircon_bi
        name: Unknown
        tap_action:
          action: toggle
      - entity: input_boolean.obeys_aircon_bi
        name: Obeys the mode
        tap_action:
          action: toggle
      - entity: input_boolean.applies_aircon_bi
        name: Applies settings
        tap_action:
          action: toggle
      - entity: input_boolean.offers_aircon_bi
        name: Offers cool
        tap_action:
          action: toggle
      - entity: input_boolean.fan_on_aircon_bi
        name: Fan on
        tap_action:
          action: toggle
    - type: button
      entity: script.reset_sources_bi
      name: Reset the sources
      icon: mdi:restore
      tap_action:
        action: toggle
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Adaptative BI — phase

        **Who is who**
        - **Adaptative BI**: the entity under test, `min_gap` 2. *heat* on RADIATOR Virtual, *cool* on AIRCON Virtual. *heat_cool* has no source of its own: phase `heat` on RADIATOR Virtual, phase `cool` on AIRCON Virtual. Its *Reference temperature* chooses the phase: entering *heat_cool*, the target closest to it (ENT-WANT-1); then a switch only beyond a target plus 1 °C (hysteresis, ENT-WANT-3).
        - **RADIATOR Virtual**: *heat*, 5–30 °C; it also offers *fan_only*, which Adaptative BI does not serve. **AIRCON Virtual**: *cool*, 16–30 °C by steps of 1. Each measures the room plus its *Offset*. In *heat*, a source is *heating* while it measures less than its target; in *cool*, *cooling* while it measures more.
        - **Room sensor**: the room thermometer, `temperature_sensor` of Adaptative BI: its *Reference temperature*. *Room sensor available* off: the reference is the mean of the two sources.

        **Start**
        - Press **Reset the sources**: both sources *off*, available, *Offset* 0; *Room temperature* 20, room sensor available.
        - On *Adaptative BI*, press *heat_cool*, set 19–24 (raise high first if needed), then press *off*.

        Delays of the tests: mode confirmation 10 s, next try 30 s, monitoring 15 s, removal confirmation 20 s.

        1. **Entering heat_cool** (ENT-WANT-1, ENT-TYPE-3)
           - *From*: **Start** (Adaptative BI *off*, its *heat_cool* range 19–24; *Room temperature* 20).
           - *Do*: on *Adaptative BI*, press *heat_cool*.
           - *Expect*: *Phase* `heat` (20 is closer to 19): RADIATOR Virtual *heat* at 19, AIRCON Virtual stays *off*. *Action* `idle` (20 is above 19).
        2. **Hysteresis: no switch** (ENT-WANT-3)
           - *From*: after 1 (*heat_cool*, 19–24, *Phase* `heat`; room 20).
           - *Do*: *Room temperature* 25.
           - *Expect*: nothing changes: 25 is not above 24 + 1.
        3. **Switch to cool** (ENT-WANT-3, ENT-PHASE-3)
           - *From*: after 2 (*Phase* `heat`; room 25).
           - *Do*: *Room temperature* 25.5.
           - *Expect*: *Phase* `cool`: AIRCON Virtual *cool* at 24, RADIATOR Virtual *off*. *Action* `cooling`.
        4. **Hysteresis back: no switch** (ENT-WANT-3)
           - *From*: after 3 (*Phase* `cool`; room 25.5).
           - *Do*: *Room temperature* 18.
           - *Expect*: nothing changes: 18 is not below 19 − 1.
        5. **Switch to heat** (ENT-WANT-3)
           - *From*: after 4 (*Phase* `cool`; room 18).
           - *Do*: *Room temperature* 17.5.
           - *Expect*: *Phase* `heat`: RADIATOR Virtual *heat* at 19, AIRCON Virtual *off*. *Action* `heating`.

        </small>
- title: BI 2
  path: targets-restart
  type: sections
  max_columns: 3
  sections:
  - *bi_1
  - *bi_2
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Adaptative BI — targets changed, restart

        **Who is who**
        - **Adaptative BI**: the entity under test, `min_gap` 2. *heat* on RADIATOR Virtual, *cool* on AIRCON Virtual. *heat_cool* has no source of its own: phase `heat` on RADIATOR Virtual, phase `cool` on AIRCON Virtual. Its *Reference temperature* chooses the phase: entering *heat_cool*, the target closest to it (ENT-WANT-1); then a switch only beyond a target plus 1 °C (hysteresis, ENT-WANT-3).
        - **RADIATOR Virtual**: *heat*, 5–30 °C; it also offers *fan_only*, which Adaptative BI does not serve. **AIRCON Virtual**: *cool*, 16–30 °C by steps of 1. Each measures the room plus its *Offset*. In *heat*, a source is *heating* while it measures less than its target; in *cool*, *cooling* while it measures more.
        - **Room sensor**: the room thermometer, `temperature_sensor` of Adaptative BI: its *Reference temperature*. *Room sensor available* off: the reference is the mean of the two sources.

        **Start**
        - Press **Reset the sources**: both sources *off*, available, *Offset* 0; *Room temperature* 20, room sensor available.
        - On *Adaptative BI*, press *heat_cool*, set 19–24 (raise high first if needed), then press *off*.

        Delays of the tests: mode confirmation 10 s, next try 30 s, monitoring 15 s, removal confirmation 20 s.

        1. **Room between the targets** (ENT-WANT-3)
           - *From*: **Start** (Adaptative BI *off*, its *heat_cool* range 19–24; *Room temperature* 20).
           - *Do*: press *heat_cool*; *Room temperature* 22.
           - *Expect*: *Phase* `heat` (entered at 20); 22 changes nothing.
        2. **Targets changed: no hysteresis** (ENT-PHASE-2, §5.5)
           - *From*: after 1 (*heat_cool*, 19–24, *Phase* `heat`; room 22).
           - *Do*: on *Adaptative BI*, lower high to 20.
           - *Expect*: low goes to 18 (the gap). *Phase* `cool` at once: 22 is above 20, no hysteresis. RADIATOR Virtual only gets *off* (its *Target* does not go to 18); AIRCON Virtual *cool* at 20. *Action* `cooling`.
        3. **Before a restart** (ENT-WANT-1)
           - *From*: **Start** (Adaptative BI *off*, its *heat_cool* range 19–24; *Room temperature* 20).
           - *Do*: press *heat_cool*; *Room temperature* 22.
           - *Expect*: *Phase* `heat`: 22 is not above 24 + 1.
        4. **After a restart, the phase is chosen again** (ENT-WANT-1, ENT-PHASE-1)
           - *From*: after 3 (*heat_cool*, 19–24, *Phase* `heat`; room 22).
           - *Do*: restart Home Assistant.
           - *Expect*: *Phase* `cool`: 22 is closer to 24, and entering has no hysteresis.

        </small>
- title: BI 3
  path: room-sensor
  type: sections
  max_columns: 3
  sections:
  - *bi_1
  - *bi_2
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Adaptative BI — without the room sensor

        **Who is who**
        - **Adaptative BI**: the entity under test, `min_gap` 2. *heat* on RADIATOR Virtual, *cool* on AIRCON Virtual. *heat_cool* has no source of its own: phase `heat` on RADIATOR Virtual, phase `cool` on AIRCON Virtual. Its *Reference temperature* chooses the phase: entering *heat_cool*, the target closest to it (ENT-WANT-1); then a switch only beyond a target plus 1 °C (hysteresis, ENT-WANT-3).
        - **RADIATOR Virtual**: *heat*, 5–30 °C; it also offers *fan_only*, which Adaptative BI does not serve. **AIRCON Virtual**: *cool*, 16–30 °C by steps of 1. Each measures the room plus its *Offset*. In *heat*, a source is *heating* while it measures less than its target; in *cool*, *cooling* while it measures more.
        - **Room sensor**: the room thermometer, `temperature_sensor` of Adaptative BI: its *Reference temperature*. *Room sensor available* off: the reference is the mean of the two sources.

        **Start**
        - Press **Reset the sources**: both sources *off*, available, *Offset* 0; *Room temperature* 20, room sensor available.
        - On *Adaptative BI*, press *heat_cool*, set 19–24 (raise high first if needed), then press *off*.

        Delays of the tests: mode confirmation 10 s, next try 30 s, monitoring 15 s, removal confirmation 20 s.

        1. **Sensor without value** (ENT-REF-6, MON-TEMP-4)
           - *From*: **Start** (Adaptative BI *off*, its *heat_cool* range 19–24; *Room temperature* 20).
           - *Do*: *Room sensor available* off.
           - *Expect*: after 15 s, *Monitoring temperatures* goes to *Problem* (`sensor_without_value`). *Reference temperature* 20, the mean of the two sources.
        2. **Mean of the sources** (ENT-REF-6, MON-TEMP-1)
           - *From*: after 1 (room sensor away; both offsets 0).
           - *Do*: *Offset* of AIRCON Virtual 2 (it measures 22).
           - *Expect*: *Reference temperature* 21, the mean of 20 and 22. The sources are 2 apart: no other problem.
        3. **Phase on the mean** (ENT-WANT-1, ENT-WANT-2)
           - *From*: after 2 (reference 21).
           - *Do*: press *heat_cool*.
           - *Expect*: *Phase* `heat` (21 is closer to 19).
        4. **Phase on the lowest source** (ENT-WANT-2, MON-TEMP-1)
           - *From*: after 3 (*heat_cool*, *Phase* `heat`; RADIATOR Virtual 20, AIRCON Virtual 22).
           - *Do*: *Offset* of AIRCON Virtual 7 (it measures 27).
           - *Expect*: the phase does not change: to switch, the lowest of the two, RADIATOR Virtual at 20, must be above 25. The sources are 7 apart: after 15 s, a second problem, `gap_sources`.
        5. **Both sources above** (ENT-WANT-2, MON-TEMP-1)
           - *From*: after 4 (*Phase* `heat`; RADIATOR Virtual 20, AIRCON Virtual 27).
           - *Do*: *Offset* of RADIATOR Virtual 5.5 (it measures 25.5).
           - *Expect*: *Phase* `cool`, *Action* `cooling`. The sources are 1.5 apart: `gap_sources` ends.
        6. **Sensor back** (MON-TEMP-4)
           - *From*: after 5.
           - *Do*: both *Offsets* 0; *Room sensor available* on.
           - *Expect*: *Monitoring temperatures* back to *OK*.

        </small>
- title: BI 4
  path: foreign
  type: sections
  max_columns: 3
  sections:
  - *bi_1
