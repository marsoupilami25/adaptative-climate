      content: |-
        <small>

        ## Adaptative BI — takeover, foreign modes

        **Who is who**
        - **Adaptative BI**: the entity under test, `min_gap` 2. *heat* on RADIATOR Virtual, *cool* on AIRCON Virtual. *heat_cool* has no source of its own: phase `heat` on RADIATOR Virtual, phase `cool` on AIRCON Virtual. Its *Reference temperature* chooses the phase: entering *heat_cool*, the target closest to it (ENT-WANT-1); then a switch only beyond a target plus 1 °C (hysteresis, ENT-WANT-3).
        - **RADIATOR Virtual**: *heat*, 5–30 °C; it also offers *fan_only*, which Adaptative BI does not serve. **AIRCON Virtual**: *cool*, 16–30 °C by steps of 1. Each measures the room plus its *Offset*. In *heat*, a source is *heating* while it measures less than its target; in *cool*, *cooling* while it measures more.
        - **Room sensor**: the room thermometer, `temperature_sensor` of Adaptative BI: its *Reference temperature*. *Room sensor available* off: the reference is the mean of the two sources.

        **Start**
        - Press **Reset the sources**: both sources *off*, available, *Offset* 0; *Room temperature* 20, room sensor available.
        - On *Adaptative BI*, press *heat_cool*, set 19–24 (raise high first if needed), then press *off*.

        Delays of the tests: mode confirmation 10 s, next try 30 s, monitoring 15 s, removal confirmation 20 s.

        1. **Takeover on a phase source** (ENT-TYPE-5)
           - *From*: **Start** (Adaptative BI *off*, its *heat_cool* range 19–24; *Room temperature* 20).
           - *Do*: press *heat_cool* (*Phase* `heat`); on AIRCON Virtual, *Mode* *cool*.
           - *Expect*: Adaptative BI goes to *cool*, not *heat_cool*. RADIATOR Virtual *off*.
        2. **Foreign mode of the active source** (ENT-STATE-5)
           - *From*: **Start** (Adaptative BI *off*, its *heat_cool* range 19–24; *Room temperature* 20).
           - *Do*: press *heat*, wait 12 s; on RADIATOR Virtual, *Mode* *fan_only*.
           - *Expect*: Adaptative BI goes to *off*; nothing is sent. *Foreign modes* lists RADIATOR Virtual; the device line shows only the remote icon, in amber.
        3. **Foreign mode tolerated** (ENT-STATE-5)
           - *From*: **Start** (Adaptative BI *off*, its *heat_cool* range 19–24; *Room temperature* 20).
           - *Do*: press *cool*; on RADIATOR Virtual, *Mode* *fan_only*.
           - *Expect*: nothing is sent: Adaptative BI stays *cool*, RADIATOR Virtual stays *fan_only*. The device line: *AIRCON Virtual*, then the remote icon in amber.
        4. **Foreign mode turned off** (ENT-STATE-5)
           - *From*: after 3 (Adaptative BI *cool*; RADIATOR Virtual *fan_only*).
           - *Do*: on *Adaptative BI*, press *off*.
           - *Expect*: RADIATOR Virtual goes to *off*.

        </small>
- title: BI 5
  path: away
  type: sections
  max_columns: 3
  sections:
  - *bi_1
  - *bi_2
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Adaptative BI — sources away

        **Who is who**
        - **Adaptative BI**: the entity under test, `min_gap` 2. *heat* on RADIATOR Virtual, *cool* on AIRCON Virtual. *heat_cool* has no source of its own: phase `heat` on RADIATOR Virtual, phase `cool` on AIRCON Virtual. Its *Reference temperature* chooses the phase: entering *heat_cool*, the target closest to it (ENT-WANT-1); then a switch only beyond a target plus 1 °C (hysteresis, ENT-WANT-3).
        - **RADIATOR Virtual**: *heat*, 5–30 °C; it also offers *fan_only*, which Adaptative BI does not serve. **AIRCON Virtual**: *cool*, 16–30 °C by steps of 1. Each measures the room plus its *Offset*. In *heat*, a source is *heating* while it measures less than its target; in *cool*, *cooling* while it measures more.
        - **Room sensor**: the room thermometer, `temperature_sensor` of Adaptative BI: its *Reference temperature*. *Room sensor available* off: the reference is the mean of the two sources.

        **Start**
        - Press **Reset the sources**: both sources *off*, available, *Offset* 0; *Room temperature* 20, room sensor available.
        - On *Adaptative BI*, press *heat_cool*, set 19–24 (raise high first if needed), then press *off*.

        Delays of the tests: mode confirmation 10 s, next try 30 s, monitoring 15 s, removal confirmation 20 s.

        1. **Phase source away** (ENT-PHASE-5, MON-SRC-1)
           - *From*: **Start** (Adaptative BI *off*, its *heat_cool* range 19–24; *Room temperature* 20).
           - *Do*: press *heat_cool* (*Phase* `heat`); on AIRCON Virtual, *Available* off; wait 15 s.
           - *Expect*: nothing reported: AIRCON Virtual serves the other phase. *Monitoring sources* stays *OK*.
        2. **The phase of the source away** (ENT-PHASE-5, MON-SRC-1)
           - *From*: after 1 (*Phase* `heat`; AIRCON Virtual away).
           - *Do*: *Room temperature* 26.
           - *Expect*: *Phase* `cool`; RADIATOR Virtual *off*. After 15 s, *Monitoring sources* goes to *Problem* (AIRCON Virtual). The device line: *AIRCON Virtual* and the sync alert, in red.
        3. **Phase source back** (ENT-PHASE-5)
           - *From*: after 2 (*Phase* `cool`; AIRCON Virtual away).
           - *Do*: on AIRCON Virtual, *Available* on.
           - *Expect*: AIRCON Virtual goes to *cool*. *Monitoring sources* back to *OK*.
        4. **No source left** (ENT-STATE-6, MON-SRC-2)
           - *From*: **Start** (Adaptative BI *off*, its *heat_cool* range 19–24; *Room temperature* 20).
           - *Do*: press *heat_cool*; *Available* off on AIRCON Virtual, then on RADIATOR Virtual.
           - *Expect*: Adaptative BI is unavailable: the dial says so, the mode bar is greyed out. *Monitoring sources* stays *OK*: the unavailable entity says it.
        5. **A source back** (ENT-STATE-6)
           - *From*: after 4 (both sources away).
           - *Do*: on RADIATOR Virtual, *Available* on.
           - *Expect*: Adaptative BI back to *heat_cool*.

        </small>
- title: BI 6
  path: targets
  type: sections
  max_columns: 3
  sections:
  - *bi_1
  - *bi_2
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Adaptative BI — targets

        **Who is who**
        - **Adaptative BI**: the entity under test, `min_gap` 2. *heat* on RADIATOR Virtual, *cool* on AIRCON Virtual. *heat_cool* has no source of its own: phase `heat` on RADIATOR Virtual, phase `cool` on AIRCON Virtual. Its *Reference temperature* chooses the phase: entering *heat_cool*, the target closest to it (ENT-WANT-1); then a switch only beyond a target plus 1 °C (hysteresis, ENT-WANT-3).
        - **RADIATOR Virtual**: *heat*, 5–30 °C; it also offers *fan_only*, which Adaptative BI does not serve. **AIRCON Virtual**: *cool*, 16–30 °C by steps of 1. Each measures the room plus its *Offset*. In *heat*, a source is *heating* while it measures less than its target; in *cool*, *cooling* while it measures more.
        - **Room sensor**: the room thermometer, `temperature_sensor` of Adaptative BI: its *Reference temperature*. *Room sensor available* off: the reference is the mean of the two sources.

        **Start**
        - Press **Reset the sources**: both sources *off*, available, *Offset* 0; *Room temperature* 20, room sensor available.
        - On *Adaptative BI*, press *heat_cool*, set 19–24 (raise high first if needed), then press *off*.

        Delays of the tests: mode confirmation 10 s, next try 30 s, monitoring 15 s, removal confirmation 20 s.

        1. **Low pushes nothing** (ENT-TGT-6)
           - *From*: **Start** (Adaptative BI *off*, its *heat_cool* range 19–24; *Room temperature* 20).
           - *Do*: on *Adaptative BI*, raise low to 22.
           - *Expect*: 22–24: the gap of 2 is kept.
        2. **High pushes low** (ENT-TGT-6)
           - *From*: after 1 (22–24).
           - *Do*: lower high to 23.
           - *Expect*: low goes to 21: 21–23.
        3. **Low pushes high** (ENT-TGT-6)
           - *From*: after 2 (21–23).
           - *Do*: raise low to 22.
           - *Expect*: high goes to 24: 22–24.
        4. **heat sets the shared target** (ENT-FEAT-4)
           - *From*: **Start** (Adaptative BI *off*, its *heat_cool* range 19–24; *Room temperature* 20).
           - *Do*: press *heat*; set the target to 21.
           - *Expect*: RADIATOR Virtual: *Target* 21.
        5. **cool shares it** (ENT-FEAT-4)
           - *From*: after 4 (*heat*, 21).
           - *Do*: press *cool*.
           - *Expect*: Adaptative BI shows 21; AIRCON Virtual: *Target* 21.
        6. **heat_cool keeps its range** (ENT-FEAT-4)
           - *From*: after 5 (*cool*, 21).
