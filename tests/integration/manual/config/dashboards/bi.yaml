# Case bi.
# YAML dashboard: after editing this file, refresh the page in the browser.
title: Tests bi-source
views:
- title: BI 1
  path: pilotage
  type: sections
  max_columns: 3
  sections:
  - &bi_1
    type: grid
    cards:
    - type: custom:adaptative-climate-card
      entity: climate.adaptative_bi
      name: Adaptative BI
      features:
      - type: ac-device
      - type: ac-hvac-modes
      - type: ac-fan-modes
      - type: ac-swing-modes
      - type: ac-swing-horizontal-modes
    - type: glance
      title: Adaptative BI monitoring
      show_state: true
      state_color: true
      entities:
      - entity: binary_sensor.adaptative_bi_monitoring_sources
        name: Monitoring sources
      - entity: binary_sensor.adaptative_bi_monitoring_temperatures
        name: Monitoring temperatures
    - type: markdown
      text_only: true
      content: |-
        {% set e = 'climate.adaptative_bi' %}{% set problems = (state_attr('binary_sensor.adaptative_bi_monitoring_sources', 'problems') or []) + (state_attr('binary_sensor.adaptative_bi_monitoring_temperatures', 'problems') or []) %}
        **Problems**: {{ 'none' if not problems else '' }}
        {% for p in problems %}
        - {{ p.type }}: {{ p.get('source') or p.get('sources') or p.get('sensor') or '' }}{{ (' ' ~ p.get('setting')) if p.get('setting') else '' }}
        {% endfor %}

        | | |
        |:--|:--|
        | Action | {{ state_attr(e, 'hvac_action') }} |
        | Active source | {{ state_attr(e, 'active_entity_id') }} |
        | Reference temperature | {{ state_attr(e, 'current_temperature') }} |
        | Step | {{ state_attr(e, 'target_temp_step') }} |
        | Target | {{ state_attr(e, 'temperature') }} |
        | Low / high | {{ state_attr(e, 'target_temp_low') }} / {{ state_attr(e, 'target_temp_high') }} |
        | Min gap | {{ state_attr(e, 'min_gap') }} |
        | Min / max | {{ state_attr(e, 'min_temp') }} / {{ state_attr(e, 'max_temp') }} |
        | Phase | {{ state_attr(e, 'phase') }} |
        | Unavailable modes | {{ state_attr(e, 'unavailable_modes') }} |
        | Foreign modes | {{ state_attr(e, 'foreign_modes') }} |
        | Target gaps | {{ state_attr(e, 'target_gaps') }} |
        | Saved targets | {{ state_attr(e, 'saved_targets') }} |
        | Saved fan/swing | {{ state_attr(e, 'saved_settings') }} |
    - type: entities
      title: Room sensor
      state_color: true
      entities:
      - entity: input_number.room_temperature_bi
        name: Room temperature
      - entity: input_boolean.room_sensor_available_bi
        name: Room sensor available
      - entity: sensor.room_sensor_bi
        name: Read by Adaptative BI
  - &bi_2
    type: grid
    cards:
    - type: entities
      title: RADIATOR Virtual
      uix:
        style: |
          {% set m = states('climate.radiator_virtual_bi') %}
          {% set color = {'heat': 'heat', 'cool': 'cool', 'heat_cool': 'heat-cool', 'auto': 'auto', 'dry': 'dry', 'fan_only': 'fan_only'}.get(m) %}
          {% if color %}
          ha-card {
            border: 2px solid var(--state-climate-{{ color }}-color);
            background: color-mix(in srgb, var(--state-climate-{{ color }}-color) 15%, var(--card-background-color));
          }
          {% endif %}
      entities:
      - entity: input_select.mode_radiator_bi
