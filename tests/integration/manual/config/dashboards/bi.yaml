      - entity: input_number.target_radiator_bi
        name: Target
      - entity: input_number.offset_radiator_bi
        name: Offset (measured = room + offset)
      - entity: input_number.delay_radiator_bi
        name: Delay before obeying
    - type: markdown
      text_only: true
      content: |-
        {% set e = 'climate.radiator_virtual_bi' %}
        | Shown by RADIATOR Virtual | |
        |:--|:--|
        | Modes | {{ (state_attr(e, 'hvac_modes') or []) | join(', ') }} |
        | Mode / action | {{ states(e) }} / {{ state_attr(e, 'hvac_action') }} |
        | Temperature | {{ state_attr(e, 'current_temperature') }} |
        | Target | {{ state_attr(e, 'temperature') }} |
        | Min / max / step | {{ state_attr(e, 'min_temp') }} / {{ state_attr(e, 'max_temp') }} / {{ state_attr(e, 'target_temp_step') or '—' }} |
    - type: glance
      columns: 4
      state_color: true
      show_state: true
      entities:
      - entity: input_boolean.available_radiator_bi
        name: Available
        tap_action:
          action: toggle
      - entity: input_boolean.unknown_radiator_bi
        name: Unknown
        tap_action:
          action: toggle
      - entity: input_boolean.obeys_radiator_bi
        name: Obeys the mode
        tap_action:
          action: toggle
      - entity: input_boolean.applies_radiator_bi
        name: Applies settings
        tap_action:
          action: toggle
      - entity: input_boolean.offers_radiator_bi
        name: Offers heat/fan_only
        tap_action:
          action: toggle
    - type: entities
      title: AIRCON Virtual
      uix:
        style: |
          {% set m = states('climate.aircon_virtual_bi') %}
          {% set color = {'heat': 'heat', 'cool': 'cool', 'heat_cool': 'heat-cool', 'auto': 'auto', 'dry': 'dry', 'fan_only': 'fan_only'}.get(m) %}
          {% if color %}
          ha-card {
            border: 2px solid var(--state-climate-{{ color }}-color);
            background: color-mix(in srgb, var(--state-climate-{{ color }}-color) 15%, var(--card-background-color));
          }
          {% endif %}
      entities:
      - entity: input_select.mode_aircon_bi
        name: Mode
      - entity: input_number.target_aircon_bi
        name: Target
      - entity: input_number.offset_aircon_bi
        name: Offset (measured = room + offset)
      - entity: input_select.fan_aircon_bi
        name: Fan
      - entity: input_number.delay_aircon_bi
        name: Delay before obeying
    - type: markdown
      text_only: true
      content: |-
        {% set e = 'climate.aircon_virtual_bi' %}
        | Shown by AIRCON Virtual | |
        |:--|:--|
        | Modes | {{ (state_attr(e, 'hvac_modes') or []) | join(', ') }} |
        | Mode / action | {{ states(e) }} / {{ state_attr(e, 'hvac_action') }} |
        | Temperature | {{ state_attr(e, 'current_temperature') }} |
        | Target | {{ state_attr(e, 'temperature') }} |
        | Min / max / step | {{ state_attr(e, 'min_temp') }} / {{ state_attr(e, 'max_temp') }} / {{ state_attr(e, 'target_temp_step') or '—' }} |
        | Fan | {{ state_attr(e, 'fan_mode') }} ({{ (state_attr(e, 'fan_modes') or []) | join(', ') }}) |
    - type: glance
