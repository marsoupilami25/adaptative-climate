  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Multi-sources

        **Synchronized modes** (`sync_modes`): *heat*, *cool* and *dry* share one fan/swing memory; *fan_only* and *auto* each have their own.

        - **Adaptative MULTI**: one source per mode. *heat_cool* has no source of its own: phase `heat` on HEAT Virtual, phase `cool` on COOL Virtual, chosen on its *Reference temperature* (hysteresis 1 °C).
        - **The sources** (view *Sources*): HEAT, COOL, DRY, FAN_ONLY and AUTO Virtual. *Offset*: each one measures the room plus its offset (0 after the reset); a source in *heat* is *heating* while it measures less than its target, in *cool* *cooling* while it measures more.
        - **Room sensor**: the room thermometer, `temperature_sensor` of Adaptative MULTI, its reference temperature. Set its value with *Room temperature*; *Room sensor available* off makes it unavailable (the reference is then the temperature measured by the active source); *Read by Adaptative MULTI* is what the entity sees.

        **Start**: **Reset the sources**: every source *off*, *Target* 20, *Offset* 0, fans *auto*, swings *off*; *Room temperature* 20, room sensor available; then Adaptative MULTI *off*. The reset does not touch the memory of the entities under test (targets, fan/swing): it belongs to them; `tests/integration/manual/reset_memory.sh` forgets it (HA stopped, see `tests/integration/manual/README.md`). Delays shortened for the tests (`configuration.yaml`): monitoring 15 s, confirmation of a mode 10 s, next try 30 s, removal confirmation 20 s.

        Ranges: HEAT Virtual 5–30, COOL Virtual 16–32, DRY Virtual 18–30, AUTO Virtual 10–30. Fan options, written differently on purpose: HEAT Virtual *Auto, Low, Medium, High, Turbo*; COOL Virtual *auto, low, medium, high*; DRY Virtual *AUTO, LOW, HIGH* (no *medium*). The sources are on the view *Sources*.

        1. **Mode change** (ENT-STATE-3): from **Start**. Adaptative MULTI to *heat*, then *cool*: COOL Virtual goes to *cool*, HEAT Virtual back to *off*.
        2. **Turned on on a device** (ENT-STATE-5, ENT-STATE-3): from **Start**. On HEAT Virtual, *Mode* *heat*: Adaptative MULTI goes to *heat*. Then on COOL Virtual, *Mode* *cool*: Adaptative MULTI goes to *cool*, HEAT Virtual is turned off (the last one wins).
        3. **Turn on** (ENT-STATE-2, ENT-STATE-8): after 2 (*cool*). Adaptative MULTI *off*, then the button **Turn on (last used mode)** (`climate.turn_on`, without mode): *cool*, the last used mode, comes back.
        4. **Mode unavailable** (ENT-HVAC-4, ENT-STATE-4): from **Start**. On DRY Virtual, *Available* off: *dry* is in *Unavailable modes*; Adaptative MULTI to *dry* is refused.
        5. **Waiting for the source** (ENT-WAIT-1, ENT-WAIT-2, MON-SRC-1): from **Start**. Adaptative MULTI to *cool*. On COOL Virtual, *Available* off: Adaptative MULTI goes to *Unknown*, keeps its targets and range; after 15 s, *Monitoring sources* goes to *Problem*. Target 23 on Adaptative MULTI (24 if it already shows 23): nothing is sent. *Available* on: COOL Virtual goes back to *cool* at that target, *Monitoring sources* back to *OK*.
        6. **Range per mode** (ENT-RANGE-1, ENT-RANGE-2): each mode takes the range of its source; *off* shows the widest of the modes with a target. From **Start**. Adaptative MULTI to *heat*: *Min / max* 5 / 30; to *cool*: 16 / 32; to *dry*: 18 / 30; to *auto*: 10 / 30; to *heat_cool*: 5 / 32 (the minimum of HEAT Virtual, the maximum of COOL Virtual); *off*: 5 / 32, the widest of the modes with a target (*fan_only* has none: its 7–35 does not count); to *fan_only*: 7 / 35, its own.
        7. **Shared memory, options written differently** (ENT-FANV-2, ENT-FAN-5, ENT-FAN-6): *heat*, *cool* and *dry* share one fan memory; each source gets the value written its way (the case does not count). From **Start**. Adaptative MULTI to *cool*, fan *high*: *Fan* of COOL Virtual goes to *high*. To *heat*: *Fan* of HEAT Virtual goes to *High*, Adaptative MULTI shows *High*. To *dry*: *Fan* of DRY Virtual goes to *HIGH*.
        8. **Option of one source only** (ENT-FANV-3, ENT-FAN-3): an option only one synchronized source has can be chosen in its mode, but is not remembered. After 7 (shared fan *high*). Adaptative MULTI to *heat*: its fan offers *Turbo* (only HEAT Virtual has it); choose it: *Fan* of HEAT Virtual goes to *Turbo*. To *cool*: *Fan* of COOL Virtual is *high*, the shared memory. Back to *heat*: *Fan* of HEAT Virtual goes back to *High*, not *Turbo*.
        9. **No fan in off** (ENT-FAN-3, ENT-FAN-4): a fan chosen in *off* must go to one memory, so in *off* the entity shows fan and swing only when all its modes share one memory (or with a single mode). Here *fan_only* and *auto* each have their own. From **Start** (Adaptative MULTI *off*): its fan and swing show no option, and a fan asked from *Developer tools > Actions* is refused.
        10. **Room sensor** (ENT-REF-1, ENT-REF-2, MON-TEMP-4): the reference temperature is the room sensor; without it, what the active source measures. From **Start**. Adaptative MULTI to *heat*; on HEAT Virtual, *Offset* 1 (it measures the room + 1). *Room temperature* 21: *Reference temperature* 21, the room sensor. *Room sensor available* off: *Reference temperature* 22, what HEAT Virtual measures; after 15 s, *Monitoring temperatures* goes to *Problem* (`sensor_without_value`).
        11. **Temperature gap** (MON-TEMP-1): the monitoring compares the room sensor with each source, and the sources with each other; more than 2 °C apart is a problem. From **Start** (room 20). On HEAT Virtual, *Offset* 4 (it measures 24): after 15 s, *Monitoring temperatures* goes to *Problem*: HEAT Virtual is 4 from the room sensor (`gap_sensor_source`) and from the other sources (`gap_sources`). *Offset* 0: back to *OK*.
        12. **heat_cool on two sources** (ENT-TYPE-3, ENT-WANT-1, ENT-WANT-3): from **Start**. On Adaptative MULTI (*off*), range 19–24 (raise high first if needed); *Room temperature* 21. Adaptative MULTI to *heat_cool*: *Phase* `heat` (21 is closer to 19): HEAT Virtual in *heat* at 19. *Room temperature* 26 (above 24 + 1): *Phase* `cool`: COOL Virtual in *cool* at 24, HEAT Virtual *off*; *Action* `cooling` (COOL Virtual measures 26).
        13. **Memory kept across a restart** (ENT-FANV-1, END-2): from **Start**. Adaptative MULTI to *cool*, fan *low*, then *off*. On HEAT Virtual, *Fan* *Auto* (a value the memory does not hold). Restart Home Assistant. Adaptative MULTI to *heat*: *Fan* of HEAT Virtual goes to *Low*, the shared memory, written its way.
        14. **One target for the single-target modes** (ENT-FEAT-4): *heat*, *cool*, *dry* and *auto* have a single target: they share T; *heat_cool* uses low/high. From **Start**. Adaptative MULTI to *heat*, target 21 (22 if it already shows 21): HEAT Virtual gets it. To *cool*, *dry*, *auto*: Adaptative MULTI shows the same target, and COOL, DRY, AUTO Virtual get it in turn. To *heat_cool*: it shows its low/high range instead.

        </small>
- title: Sources
