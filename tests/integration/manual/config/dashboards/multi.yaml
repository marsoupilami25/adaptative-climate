    - type: markdown
      text_only: true
      content: |-
        {% set e = 'climate.adaptative_multi' %}{% set problems = (state_attr('binary_sensor.adaptative_multi_monitoring_sources', 'problems') or []) + (state_attr('binary_sensor.adaptative_multi_monitoring_temperatures', 'problems') or []) %}
        **Problems**: {{ 'none' if not problems else '' }}
        {% for p in problems %}
        - {{ p.type }}: {{ p.get('source') or p.get('sources') or p.get('sensor') or '' }}{{ (' ' ~ p.get('setting')) if p.get('setting') else '' }}
        {% endfor %}

        | | |
        |:--|:--|
        | Action | {{ state_attr(e, 'hvac_action') }} |
        | Active source | {{ state_attr(e, 'active_entity_id') }} |
        | Reference temperature | {{ state_attr(e, 'current_temperature') }} |
