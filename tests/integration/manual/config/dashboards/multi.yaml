# Case multi.
# YAML dashboard: after editing this file, refresh the page in the browser.
title: Tests multi-sources
views:
- title: MULTI 1
  path: pilotage
  type: sections
  max_columns: 2
  sections:
  - &multi_1
    type: grid
    cards:
    - type: custom:adaptative-climate-card
      entity: climate.adaptative_multi
      name: Adaptative MULTI
      features:
      - type: ac-device
      - type: ac-hvac-modes
      - type: ac-fan-modes
      - type: ac-swing-modes
      - type: ac-swing-horizontal-modes
    - type: entities
      entities:
      - type: button
        name: Turn on (last used mode)
        icon: mdi:power
        action_name: Turn on
        tap_action:
          action: perform-action
          perform_action: climate.turn_on
          target:
            entity_id: climate.adaptative_multi
    - type: glance
      title: Adaptative MULTI monitoring
      show_state: true
      state_color: true
      entities:
      - entity: binary_sensor.adaptative_multi_monitoring_sources
        name: Monitoring sources
      - entity: binary_sensor.adaptative_multi_monitoring_temperatures
        name: Monitoring temperatures
    - type: markdown
      text_only: true
      content: |-
        {% set e = 'climate.adaptative_multi' %}{% set problems = (state_attr('binary_sensor.adaptative_multi_monitoring_sources', 'problems') or []) + (state_attr('binary_sensor.adaptative_multi_monitoring_temperatures', 'problems') or []) %}
        **Problems**: {{ 'none' if not problems else '' }}
        {% for p in problems %}
        - {{ p.type }}: {{ p.get('source') or p.get('sources') or p.get('sensor') or '' }}{{ (' ' ~ p.get('setting')) if p.get('setting') else '' }}
        {% endfor %}

        | | |
        |:--|:--|
        | Action | {{ state_attr(e, 'hvac_action') }} |
        | Active source | {{ state_attr(e, 'active_entity_id') }} |
        | Reference temperature | {{ state_attr(e, 'current_temperature') }} |
        | Step | {{ state_attr(e, 'target_temp_step') }} |
        | Target | {{ state_attr(e, 'temperature') }} |
        | Low / high | {{ state_attr(e, 'target_temp_low') }} / {{ state_attr(e, 'target_temp_high') }} |
        | Min gap | {{ state_attr(e, 'min_gap') }} |
        | Min / max | {{ state_attr(e, 'min_temp') }} / {{ state_attr(e, 'max_temp') }} |
        | Phase | {{ state_attr(e, 'phase') }} |
        | Unavailable modes | {{ state_attr(e, 'unavailable_modes') }} |
        | Foreign modes | {{ state_attr(e, 'foreign_modes') }} |
        | Target gaps | {{ state_attr(e, 'target_gaps') }} |
        | Saved targets | {{ state_attr(e, 'saved_targets') }} |
        | Saved fan/swing | {{ state_attr(e, 'saved_settings') }} |
    - type: entities
      title: Room sensor
      state_color: true
      entities:
      - entity: input_number.room_temperature_multi
        name: Room temperature
      - entity: input_boolean.room_sensor_available_multi
        name: Room sensor available
      - entity: sensor.room_sensor_multi
        name: Read by Adaptative MULTI
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Adaptative MULTI — modes

        **Who is who**
        - **Adaptative MULTI**: the entity under test, one source per mode. *heat_cool* has no source of its own: phase `heat` on HEAT Virtual, phase `cool` on COOL Virtual, chosen on its *Reference temperature* (hysteresis 1 °C). Synchronized modes (`sync_modes`): *heat*, *cool* and *dry* share one fan/swing memory; *fan_only* and *auto* each have their own.
        - **The sources**, on the view *Sources*: HEAT, COOL, DRY, FAN_ONLY and AUTO Virtual. Each measures the room plus its *Offset*. Ranges: HEAT 5–30, COOL 16–32, DRY 18–30, AUTO 10–30. Fans, written differently on purpose: HEAT *Auto, Low, Medium, High, Turbo*; COOL *auto, low, medium, high*; DRY *AUTO, LOW, HIGH*.
        - **Room sensor**: the room thermometer, `temperature_sensor` of Adaptative MULTI: its *Reference temperature*. *Room sensor available* off: the reference is what the active source measures.

        **Start**
        - On the view *Sources*, press **Reset the sources**: every source *off*, available, *Target* 20, *Offset* 0, fans *auto*, swings *off*; *Room temperature* 20.
        - On *Adaptative MULTI*: press *heat*, set the target to 20 and the fan to *Auto*; press *heat_cool*, set 19–24 (raise high first if needed); press *off*.

        Delays of the tests: mode confirmation 10 s, next try 30 s, monitoring 15 s, removal confirmation 20 s.

        1. **Mode asked** (ENT-STATE-3)
           - *From*: **Start** (Adaptative MULTI *off*; target 20, *heat_cool* range 19–24, shared fan *Auto*; room 20).
           - *Do*: on *Adaptative MULTI*, press *heat*.
           - *Expect*: HEAT Virtual goes to *heat*.
        2. **Mode changed** (ENT-STATE-3)
           - *From*: after 1 (*heat*).
           - *Do*: press *cool*.
           - *Expect*: COOL Virtual goes to *cool*, HEAT Virtual back to *off*.
        3. **Turned on on a device** (ENT-STATE-5)
           - *From*: **Start** (Adaptative MULTI *off*; target 20, *heat_cool* range 19–24, shared fan *Auto*; room 20).
           - *Do*: on HEAT Virtual, *Mode* *heat*.
           - *Expect*: Adaptative MULTI goes to *heat*.
        4. **The last device wins** (ENT-STATE-5, ENT-STATE-3)
           - *From*: after 3 (*heat*).
           - *Do*: on COOL Virtual, *Mode* *cool*.
           - *Expect*: Adaptative MULTI goes to *cool*; HEAT Virtual is turned *off*.
        5. **Turn on** (ENT-STATE-2, ENT-STATE-8)
           - *From*: after 4 (*cool*).
           - *Do*: press *off*; then the button **Turn on (last used mode)** (`climate.turn_on`, without mode).
           - *Expect*: *cool*, the last used mode, comes back.

        </small>
- title: MULTI 2
  path: waiting
  type: sections
  max_columns: 2
  sections:
  - *multi_1
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Adaptative MULTI — mode unavailable, waiting

        **Who is who**
        - **Adaptative MULTI**: the entity under test, one source per mode. *heat_cool* has no source of its own: phase `heat` on HEAT Virtual, phase `cool` on COOL Virtual, chosen on its *Reference temperature* (hysteresis 1 °C). Synchronized modes (`sync_modes`): *heat*, *cool* and *dry* share one fan/swing memory; *fan_only* and *auto* each have their own.
        - **The sources**, on the view *Sources*: HEAT, COOL, DRY, FAN_ONLY and AUTO Virtual. Each measures the room plus its *Offset*. Ranges: HEAT 5–30, COOL 16–32, DRY 18–30, AUTO 10–30. Fans, written differently on purpose: HEAT *Auto, Low, Medium, High, Turbo*; COOL *auto, low, medium, high*; DRY *AUTO, LOW, HIGH*.
        - **Room sensor**: the room thermometer, `temperature_sensor` of Adaptative MULTI: its *Reference temperature*. *Room sensor available* off: the reference is what the active source measures.

        **Start**
        - On the view *Sources*, press **Reset the sources**: every source *off*, available, *Target* 20, *Offset* 0, fans *auto*, swings *off*; *Room temperature* 20.
        - On *Adaptative MULTI*: press *heat*, set the target to 20 and the fan to *Auto*; press *heat_cool*, set 19–24 (raise high first if needed); press *off*.

        Delays of the tests: mode confirmation 10 s, next try 30 s, monitoring 15 s, removal confirmation 20 s.

        1. **Mode unavailable** (ENT-HVAC-4)
           - *From*: **Start** (Adaptative MULTI *off*; target 20, *heat_cool* range 19–24, shared fan *Auto*; room 20).
           - *Do*: on DRY Virtual, *Available* off.
           - *Expect*: *dry* is in *Unavailable modes*; on the card, *dry* is greyed out.
        2. **Mode unavailable refused** (ENT-STATE-4)
           - *From*: after 1 (DRY Virtual away).
           - *Do*: from *Developer tools > Actions*, `climate.set_hvac_mode` *dry* on Adaptative MULTI.
           - *Expect*: refused, with an error. Adaptative MULTI stays *off*.
        3. **Waiting for the source** (ENT-WAIT-1, ENT-WAIT-2, MON-SRC-1)
           - *From*: **Start** (Adaptative MULTI *off*; target 20, *heat_cool* range 19–24, shared fan *Auto*; room 20).
           - *Do*: press *cool*; on COOL Virtual, *Available* off.
           - *Expect*: Adaptative MULTI goes to *Unknown*, keeps its targets and range. After 15 s, *Monitoring sources* goes to *Problem*. The device line: *COOL Virtual* and the sync alert, in red.
        4. **Nothing sent while waiting** (ENT-WAIT-2)
           - *From*: after 3 (waiting for COOL Virtual; target 20).
           - *Do*: set the target to 23.
           - *Expect*: Adaptative MULTI shows 23; nothing is sent.
        5. **Source back** (ENT-WAIT-1)
           - *From*: after 4 (waiting; target 23).
           - *Do*: on COOL Virtual, *Available* on.
           - *Expect*: COOL Virtual goes back to *cool* at 23. *Monitoring sources* back to *OK*.

        </small>
- title: MULTI 3
  path: ranges
  type: sections
  max_columns: 2
  sections:
  - *multi_1
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Adaptative MULTI — ranges and targets

        **Who is who**
        - **Adaptative MULTI**: the entity under test, one source per mode. *heat_cool* has no source of its own: phase `heat` on HEAT Virtual, phase `cool` on COOL Virtual, chosen on its *Reference temperature* (hysteresis 1 °C). Synchronized modes (`sync_modes`): *heat*, *cool* and *dry* share one fan/swing memory; *fan_only* and *auto* each have their own.
        - **The sources**, on the view *Sources*: HEAT, COOL, DRY, FAN_ONLY and AUTO Virtual. Each measures the room plus its *Offset*. Ranges: HEAT 5–30, COOL 16–32, DRY 18–30, AUTO 10–30. Fans, written differently on purpose: HEAT *Auto, Low, Medium, High, Turbo*; COOL *auto, low, medium, high*; DRY *AUTO, LOW, HIGH*.
        - **Room sensor**: the room thermometer, `temperature_sensor` of Adaptative MULTI: its *Reference temperature*. *Room sensor available* off: the reference is what the active source measures.

        **Start**
        - On the view *Sources*, press **Reset the sources**: every source *off*, available, *Target* 20, *Offset* 0, fans *auto*, swings *off*; *Room temperature* 20.
        - On *Adaptative MULTI*: press *heat*, set the target to 20 and the fan to *Auto*; press *heat_cool*, set 19–24 (raise high first if needed); press *off*.

        Delays of the tests: mode confirmation 10 s, next try 30 s, monitoring 15 s, removal confirmation 20 s.

        1. **Range per mode** (ENT-RANGE-1, ENT-RANGE-2)
           - *From*: **Start** (Adaptative MULTI *off*; target 20, *heat_cool* range 19–24, shared fan *Auto*; room 20).
           - *Do*: press in turn *heat*, *cool*, *dry*, *auto*, *heat_cool*, *off*, *fan_only*.
           - *Expect*, *Min / max*:
             - *heat* 5 / 30, *cool* 16 / 32, *dry* 18 / 30, *auto* 10 / 30: the range of each source;
             - *heat_cool* 5 / 32: the minimum of HEAT Virtual, the maximum of COOL Virtual;
             - *off* 5 / 32: the widest of the modes with a target (the 7–35 of *fan_only* does not count);
             - *fan_only* 7 / 35: its own.
        2. **One target for the single-target modes** (ENT-FEAT-4)
           - *From*: **Start** (Adaptative MULTI *off*; target 20, *heat_cool* range 19–24, shared fan *Auto*; room 20).
           - *Do*: press *heat*; set the target to 21.
           - *Expect*: HEAT Virtual gets 21.
        3. **Shared by cool, dry and auto** (ENT-FEAT-4)
           - *From*: after 2 (*heat*, 21).
           - *Do*: press in turn *cool*, *dry*, *auto*.
           - *Expect*: each time, Adaptative MULTI shows 21, and COOL, DRY, AUTO Virtual get 21 in turn.
        4. **heat_cool keeps its range** (ENT-FEAT-4)
           - *From*: after 3 (*auto*, 21).
           - *Do*: press *heat_cool*.
           - *Expect*: its range 19–24 instead.

        </small>
- title: MULTI 4
  path: fan
  type: sections
  max_columns: 2
  sections:
  - *multi_1
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Adaptative MULTI — fan memory

        **Who is who**
        - **Adaptative MULTI**: the entity under test, one source per mode. *heat_cool* has no source of its own: phase `heat` on HEAT Virtual, phase `cool` on COOL Virtual, chosen on its *Reference temperature* (hysteresis 1 °C). Synchronized modes (`sync_modes`): *heat*, *cool* and *dry* share one fan/swing memory; *fan_only* and *auto* each have their own.
        - **The sources**, on the view *Sources*: HEAT, COOL, DRY, FAN_ONLY and AUTO Virtual. Each measures the room plus its *Offset*. Ranges: HEAT 5–30, COOL 16–32, DRY 18–30, AUTO 10–30. Fans, written differently on purpose: HEAT *Auto, Low, Medium, High, Turbo*; COOL *auto, low, medium, high*; DRY *AUTO, LOW, HIGH*.
        - **Room sensor**: the room thermometer, `temperature_sensor` of Adaptative MULTI: its *Reference temperature*. *Room sensor available* off: the reference is what the active source measures.

        **Start**
        - On the view *Sources*, press **Reset the sources**: every source *off*, available, *Target* 20, *Offset* 0, fans *auto*, swings *off*; *Room temperature* 20.
        - On *Adaptative MULTI*: press *heat*, set the target to 20 and the fan to *Auto*; press *heat_cool*, set 19–24 (raise high first if needed); press *off*.

        Delays of the tests: mode confirmation 10 s, next try 30 s, monitoring 15 s, removal confirmation 20 s.

        1. **Fan set in cool** (ENT-FANV-2, ENT-FAN-5)
           - *From*: **Start** (Adaptative MULTI *off*; target 20, *heat_cool* range 19–24, shared fan *Auto*; room 20).
           - *Do*: press *cool*; fan *high*.
           - *Expect*: COOL Virtual: *Fan* *high*.
        2. **Shared with heat, written its way** (ENT-FANV-2, ENT-FAN-6)
           - *From*: after 1 (*cool*, shared fan *high*).
           - *Do*: press *heat*.
           - *Expect*: HEAT Virtual: *Fan* *High*. Adaptative MULTI shows *High*.
        3. **Shared with dry** (ENT-FANV-2, ENT-FAN-6)
           - *From*: after 2 (*heat*, shared fan *high*).
           - *Do*: press *dry*.
           - *Expect*: DRY Virtual: *Fan* *HIGH*.
        4. **Option of one source only** (ENT-FANV-3, ENT-FAN-3)
           - *From*: after 3 (shared fan *high*).
           - *Do*: press *heat*; fan *Turbo* (only HEAT Virtual has it).
           - *Expect*: HEAT Virtual: *Fan* *Turbo*.
        5. **Not remembered** (ENT-FANV-3)
           - *From*: after 4 (*heat*, *Turbo*; shared fan *high*).
           - *Do*: press *cool*.
           - *Expect*: COOL Virtual: *Fan* *high*, the shared memory.
        6. **Back in heat** (ENT-FANV-3)
           - *From*: after 5 (*cool*, *high*).
           - *Do*: press *heat*.
           - *Expect*: HEAT Virtual: *Fan* back to *High*, not *Turbo*.

        </small>
- title: MULTI 5
  path: fan-off
  type: sections
  max_columns: 2
  sections:
  - *multi_1
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Adaptative MULTI — fan in off, restart

        **Who is who**
        - **Adaptative MULTI**: the entity under test, one source per mode. *heat_cool* has no source of its own: phase `heat` on HEAT Virtual, phase `cool` on COOL Virtual, chosen on its *Reference temperature* (hysteresis 1 °C). Synchronized modes (`sync_modes`): *heat*, *cool* and *dry* share one fan/swing memory; *fan_only* and *auto* each have their own.
        - **The sources**, on the view *Sources*: HEAT, COOL, DRY, FAN_ONLY and AUTO Virtual. Each measures the room plus its *Offset*. Ranges: HEAT 5–30, COOL 16–32, DRY 18–30, AUTO 10–30. Fans, written differently on purpose: HEAT *Auto, Low, Medium, High, Turbo*; COOL *auto, low, medium, high*; DRY *AUTO, LOW, HIGH*.
        - **Room sensor**: the room thermometer, `temperature_sensor` of Adaptative MULTI: its *Reference temperature*. *Room sensor available* off: the reference is what the active source measures.

        **Start**
        - On the view *Sources*, press **Reset the sources**: every source *off*, available, *Target* 20, *Offset* 0, fans *auto*, swings *off*; *Room temperature* 20.
        - On *Adaptative MULTI*: press *heat*, set the target to 20 and the fan to *Auto*; press *heat_cool*, set 19–24 (raise high first if needed); press *off*.

        Delays of the tests: mode confirmation 10 s, next try 30 s, monitoring 15 s, removal confirmation 20 s.

        1. **No fan in off** (ENT-FAN-3, ENT-FAN-4)
           - *From*: **Start** (Adaptative MULTI *off*; target 20, *heat_cool* range 19–24, shared fan *Auto*; room 20).
           - *Do*: from *Developer tools > Actions*, `climate.set_fan_mode` *auto* on Adaptative MULTI.
           - *Expect*: refused. In *off*, the fan and swing lists of the card are greyed out: a fan chosen in *off* must go to one memory, and *fan_only* and *auto* each have their own.
        2. **Memory kept across a restart** (ENT-FANV-1, END-2)
           - *From*: **Start** (Adaptative MULTI *off*; target 20, *heat_cool* range 19–24, shared fan *Auto*; room 20).
           - *Do*: press *cool*, fan *low*, press *off*; on HEAT Virtual, *Fan* *Auto*; restart Home Assistant; on *Adaptative MULTI*, press *heat*.
           - *Expect*: HEAT Virtual: *Fan* *Low*, the shared memory, written its way.

        </small>
- title: MULTI 6
  path: room-sensor
  type: sections
  max_columns: 2
  sections:
  - *multi_1
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Adaptative MULTI — room sensor, heat_cool

        **Who is who**
        - **Adaptative MULTI**: the entity under test, one source per mode. *heat_cool* has no source of its own: phase `heat` on HEAT Virtual, phase `cool` on COOL Virtual, chosen on its *Reference temperature* (hysteresis 1 °C). Synchronized modes (`sync_modes`): *heat*, *cool* and *dry* share one fan/swing memory; *fan_only* and *auto* each have their own.
        - **The sources**, on the view *Sources*: HEAT, COOL, DRY, FAN_ONLY and AUTO Virtual. Each measures the room plus its *Offset*. Ranges: HEAT 5–30, COOL 16–32, DRY 18–30, AUTO 10–30. Fans, written differently on purpose: HEAT *Auto, Low, Medium, High, Turbo*; COOL *auto, low, medium, high*; DRY *AUTO, LOW, HIGH*.
        - **Room sensor**: the room thermometer, `temperature_sensor` of Adaptative MULTI: its *Reference temperature*. *Room sensor available* off: the reference is what the active source measures.

        **Start**
        - On the view *Sources*, press **Reset the sources**: every source *off*, available, *Target* 20, *Offset* 0, fans *auto*, swings *off*; *Room temperature* 20.
        - On *Adaptative MULTI*: press *heat*, set the target to 20 and the fan to *Auto*; press *heat_cool*, set 19–24 (raise high first if needed); press *off*.

        Delays of the tests: mode confirmation 10 s, next try 30 s, monitoring 15 s, removal confirmation 20 s.

        1. **Room sensor** (ENT-REF-1)
           - *From*: **Start** (Adaptative MULTI *off*; target 20, *heat_cool* range 19–24, shared fan *Auto*; room 20).
           - *Do*: press *heat*; on HEAT Virtual, *Offset* 1; *Room temperature* 21.
           - *Expect*: *Reference temperature* 21: the room sensor, not HEAT Virtual (22).
        2. **Without the room sensor** (ENT-REF-2, MON-TEMP-4)
           - *From*: after 1 (*heat*; room 21; HEAT Virtual measures 22).
           - *Do*: *Room sensor available* off.
           - *Expect*: *Reference temperature* 22, what HEAT Virtual measures. After 15 s, *Monitoring temperatures* goes to *Problem* (`sensor_without_value`).
        3. **Temperature gap** (MON-TEMP-1)
           - *From*: **Start** (Adaptative MULTI *off*; target 20, *heat_cool* range 19–24, shared fan *Auto*; room 20).
           - *Do*: on HEAT Virtual, *Offset* 4 (it measures 24).
           - *Expect*: after 15 s, *Monitoring temperatures* goes to *Problem*: HEAT Virtual is 4 from the room sensor (`gap_sensor_source`) and from the other sources (`gap_sources`).
        4. **Gap gone** (MON-TEMP-1)
           - *From*: after 3.
           - *Do*: on HEAT Virtual, *Offset* 0.
           - *Expect*: *Monitoring temperatures* back to *OK*.
        5. **heat_cool on two sources** (ENT-TYPE-3, ENT-WANT-1)
           - *From*: **Start** (Adaptative MULTI *off*; target 20, *heat_cool* range 19–24, shared fan *Auto*; room 20).
           - *Do*: *Room temperature* 21; press *heat_cool*.
           - *Expect*: *Phase* `heat` (21 is closer to 19): HEAT Virtual *heat* at 19.
        6. **Phase cool** (ENT-WANT-3)
           - *From*: after 5 (*heat_cool*, 19–24, *Phase* `heat`; room 21).
           - *Do*: *Room temperature* 26.
           - *Expect*: *Phase* `cool` (above 24 + 1): COOL Virtual *cool* at 24, HEAT Virtual *off*. *Action* `cooling`: COOL Virtual measures 26.

        </small>
- title: Sources
  path: sources
  type: sections
  max_columns: 5
  sections:
  - type: grid
    cards:
    - type: button
      entity: script.reset_sources_multi
      name: Reset the sources
      icon: mdi:restore
      tap_action:
        action: toggle
    - type: entities
      title: HEAT Virtual
      uix:
        style: |
          {% set m = states('climate.heat_virtual_multi') %}
          {% set color = {'heat': 'heat', 'cool': 'cool', 'heat_cool': 'heat-cool', 'auto': 'auto', 'dry': 'dry', 'fan_only': 'fan_only'}.get(m) %}
          {% if color %}
          ha-card {
            border: 2px solid var(--state-climate-{{ color }}-color);
            background: color-mix(in srgb, var(--state-climate-{{ color }}-color) 15%, var(--card-background-color));
          }
          {% endif %}
      entities:
      - entity: input_select.mode_heat_multi
        name: Mode
      - entity: input_number.target_heat_multi
        name: Target
      - entity: input_number.offset_heat_multi
        name: Offset (measured = room + offset)
      - entity: input_select.fan_heat_multi
        name: Fan
      - entity: input_select.swing_heat_multi
        name: Swing
      - entity: input_select.swing_horizontal_heat_multi
        name: Horizontal swing
      - entity: input_number.delay_heat_multi
        name: Delay before obeying
    - type: markdown
      text_only: true
      content: |-
        {% set e = 'climate.heat_virtual_multi' %}
        | Shown by HEAT Virtual | |
        |:--|:--|
        | Modes | {{ (state_attr(e, 'hvac_modes') or []) | join(', ') }} |
        | Mode / action | {{ states(e) }} / {{ state_attr(e, 'hvac_action') }} |
        | Temperature | {{ state_attr(e, 'current_temperature') }} |
        | Target | {{ state_attr(e, 'temperature') }} |
        | Min / max / step | {{ state_attr(e, 'min_temp') }} / {{ state_attr(e, 'max_temp') }} / {{ state_attr(e, 'target_temp_step') or '—' }} |
        | Fan | {{ state_attr(e, 'fan_mode') }} ({{ (state_attr(e, 'fan_modes') or []) | join(', ') }}) |
        | Swing | {{ state_attr(e, 'swing_mode') }} ({{ (state_attr(e, 'swing_modes') or []) | join(', ') }}) |
        | Horizontal swing | {{ state_attr(e, 'swing_horizontal_mode') }} ({{ (state_attr(e, 'swing_horizontal_modes') or []) | join(', ') }}) |
    - type: glance
      columns: 4
      state_color: true
      show_state: true
      entities:
      - entity: input_boolean.available_heat_multi
        name: Available
        tap_action:
          action: toggle
      - entity: input_boolean.unknown_heat_multi
        name: Unknown
        tap_action:
          action: toggle
      - entity: input_boolean.obeys_heat_multi
        name: Obeys the mode
        tap_action:
          action: toggle
      - entity: input_boolean.applies_heat_multi
        name: Applies settings
        tap_action:
          action: toggle
      - entity: input_boolean.offers_heat_multi
        name: Offers heat
        tap_action:
          action: toggle
      - entity: input_boolean.fan_on_heat_multi
        name: Fan on
        tap_action:
          action: toggle
      - entity: input_boolean.swing_on_heat_multi
        name: Swing on
        tap_action:
          action: toggle
      - entity: input_boolean.swing_horizontal_on_heat_multi
        name: Horiz. swing on
        tap_action:
          action: toggle
  - type: grid
    cards:
    - type: entities
      title: COOL Virtual
      uix:
        style: |
          {% set m = states('climate.cool_virtual_multi') %}
          {% set color = {'heat': 'heat', 'cool': 'cool', 'heat_cool': 'heat-cool', 'auto': 'auto', 'dry': 'dry', 'fan_only': 'fan_only'}.get(m) %}
          {% if color %}
          ha-card {
            border: 2px solid var(--state-climate-{{ color }}-color);
            background: color-mix(in srgb, var(--state-climate-{{ color }}-color) 15%, var(--card-background-color));
          }
          {% endif %}
      entities:
      - entity: input_select.mode_cool_multi
        name: Mode
      - entity: input_number.target_cool_multi
