# Case unique.
# YAML dashboard: after editing this file, refresh the page in the browser.
title: Tests single source
views:
- title: ALL 1
  path: pilotage
  type: sections
  max_columns: 3
  sections:
  - &all_1
    type: grid
    cards:
    - type: custom:adaptative-climate-card
      entity: climate.adaptative_all
      name: Adaptative ALL
      features:
      - type: ac-device
      - type: ac-hvac-modes
      - type: ac-fan-modes
      - type: ac-swing-modes
      - type: ac-swing-horizontal-modes
    - type: glance
      title: Adaptative ALL monitoring
      show_state: true
      state_color: true
      entities:
      - entity: binary_sensor.adaptative_all_monitoring_sources
        name: Monitoring sources
      - entity: binary_sensor.adaptative_all_monitoring_temperatures
        name: Monitoring temperatures
    - type: markdown
      text_only: true
      content: |-
        {% set e = 'climate.adaptative_all' %}{% set problems = (state_attr('binary_sensor.adaptative_all_monitoring_sources', 'problems') or []) + (state_attr('binary_sensor.adaptative_all_monitoring_temperatures', 'problems') or []) %}
        **Problems**: {{ 'none' if not problems else '' }}
        {% for p in problems %}
        - {{ p.type }}: {{ p.get('source') or p.get('sources') or p.get('sensor') or '' }}{{ (' ' ~ p.get('setting')) if p.get('setting') else '' }}
        {% endfor %}

        | | |
        |:--|:--|
        | Action | {{ state_attr(e, 'hvac_action') }} |
        | Active source | {{ state_attr(e, 'active_entity_id') }} |
        | Reference temperature | {{ state_attr(e, 'current_temperature') }} |
        | Step | {{ state_attr(e, 'target_temp_step') }} |
        | Target | {{ state_attr(e, 'temperature') }} |
        | Low / high | {{ state_attr(e, 'target_temp_low') }} / {{ state_attr(e, 'target_temp_high') }} |
        | Min gap | {{ state_attr(e, 'min_gap') }} |
        | Min / max | {{ state_attr(e, 'min_temp') }} / {{ state_attr(e, 'max_temp') }} |
        | Phase | {{ state_attr(e, 'phase') }} |
        | Unavailable modes | {{ state_attr(e, 'unavailable_modes') }} |
        | Foreign modes | {{ state_attr(e, 'foreign_modes') }} |
        | Target gaps | {{ state_attr(e, 'target_gaps') }} |
        | Saved targets | {{ state_attr(e, 'saved_targets') }} |
        | Saved fan/swing | {{ state_attr(e, 'saved_settings') }} |
  - &all_2
    type: grid
    cards:
    - type: entities
      title: ALL Virtual
      uix:
        style: |
          {% set m = states('climate.all_virtual_unique') %}
          {% set color = {'heat': 'heat', 'cool': 'cool', 'heat_cool': 'heat-cool', 'auto': 'auto', 'dry': 'dry', 'fan_only': 'fan_only'}.get(m) %}
          {% if color %}
          ha-card {
            border: 2px solid var(--state-climate-{{ color }}-color);
            background: color-mix(in srgb, var(--state-climate-{{ color }}-color) 15%, var(--card-background-color));
          }
          {% endif %}
      entities:
      - entity: input_select.mode_all_unique
        name: Mode
      - entity: input_number.target_all_unique
        name: Target
      - entity: input_number.target_low_all_unique
        name: Target low
      - entity: input_number.target_high_all_unique
        name: Target high
      - entity: input_number.temperature_all_unique
        name: Temperature
      - entity: input_select.fan_all_unique
        name: Fan
      - entity: input_select.swing_all_unique
        name: Swing
      - entity: input_select.swing_horizontal_all_unique
        name: Horizontal swing
      - entity: input_number.delay_all_unique
        name: Delay before obeying
    - type: markdown
      text_only: true
      content: |-
        {% set e = 'climate.all_virtual_unique' %}
        | Shown by ALL Virtual | |
        |:--|:--|
        | Modes | {{ (state_attr(e, 'hvac_modes') or []) | join(', ') }} |
        | Mode / action | {{ states(e) }} / {{ state_attr(e, 'hvac_action') }} |
        | Temperature | {{ state_attr(e, 'current_temperature') }} |
        | Target | {{ state_attr(e, 'temperature') }} |
        | Low / high | {{ state_attr(e, 'target_temp_low') }} / {{ state_attr(e, 'target_temp_high') }} |
        | Min / max / step | {{ state_attr(e, 'min_temp') }} / {{ state_attr(e, 'max_temp') }} / {{ state_attr(e, 'target_temp_step') or '—' }} |
        | Fan | {{ state_attr(e, 'fan_mode') }} ({{ (state_attr(e, 'fan_modes') or []) | join(', ') }}) |
        | Swing | {{ state_attr(e, 'swing_mode') }} ({{ (state_attr(e, 'swing_modes') or []) | join(', ') }}) |
        | Horizontal swing | {{ state_attr(e, 'swing_horizontal_mode') }} ({{ (state_attr(e, 'swing_horizontal_modes') or []) | join(', ') }}) |
    - type: glance
      columns: 4
      state_color: true
      show_state: true
      entities:
      - entity: input_boolean.available_all_unique
        name: Available
        tap_action:
          action: toggle
      - entity: input_boolean.unknown_all_unique
        name: Unknown
        tap_action:
          action: toggle
      - entity: input_boolean.obeys_all_unique
        name: Obeys the mode
        tap_action:
          action: toggle
      - entity: input_boolean.applies_all_unique
        name: Applies settings
        tap_action:
          action: toggle
      - entity: input_boolean.offers_all_unique
        name: Offers heat/cool/heat_cool/auto/dry/fan_only
        tap_action:
          action: toggle
      - entity: input_boolean.fan_on_all_unique
        name: Fan on
        tap_action:
          action: toggle
      - entity: input_boolean.swing_on_all_unique
        name: Swing on
        tap_action:
          action: toggle
      - entity: input_boolean.swing_horizontal_on_all_unique
        name: Horiz. swing on
        tap_action:
          action: toggle
    - type: button
      entity: script.reset_sources_unique
      name: Reset the sources
      icon: mdi:restore
      tap_action:
        action: toggle
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Adaptative ALL — one device

        **Who is who**
        - **Adaptative ALL**: the entity under test, every mode on one source, ALL Virtual. Synchronized modes (`sync_modes`): *heat*, *cool* and *dry* share one fan/swing memory; *fan_only*, *auto* and *heat_cool* each have their own.
        - **ALL Virtual**: every mode; a single target, and a low/high target in *heat_cool* and *auto*. Its helpers play its remote and its failures.

        **Start**
        - Press **Reset the sources**: ALL Virtual *off*, *Target* 20, low/high 19–25, fan *auto*, swings *off*, *Delay before obeying* 0.
        - On *Adaptative ALL*: press *heat*, set the target to 20 and the fan to *auto*; press *heat_cool*, set 19–24 (raise high first if needed); press *off*.

        Delays of the tests: mode confirmation 10 s, next try 30 s, monitoring 15 s, removal confirmation 20 s.

        1. **One device** (ENT-TYPE-2)
           - *From*: **Start** (Adaptative ALL *off*; target 20, low/high 19–24, shared fan *auto*).
           - *Do*: on *Adaptative ALL*, press *heat*.
           - *Expect*: ALL Virtual: *Mode* *heat*.
        2. **Mode changed on the same device** (ENT-TYPE-2)
           - *From*: after 1 (*heat*).
           - *Do*: press *cool*.
           - *Expect*: ALL Virtual: *Mode* *cool*. Nothing is turned *off* first.
        3. **Mode taken over on the device** (§5.2)
           - *From*: **Start** (Adaptative ALL *off*; target 20, low/high 19–24, shared fan *auto*).
           - *Do*: press *cool*; on ALL Virtual, *Mode* *dry* and *Target* 22.
           - *Expect*: Adaptative ALL goes to *dry* and shows 22.
        4. **Restart, device changed meanwhile** (SRC-STATE-10, §5.6)
           - *From*: **Start** (Adaptative ALL *off*; target 20, low/high 19–24, shared fan *auto*).
           - *Do*: press *cool*, fan *low*, wait 12 s. On ALL Virtual, *Available* off, then *Fan* *auto* (not seen: the source is away). Restart Home Assistant (*Available* is back on at start).
           - *Expect*: ALL Virtual: *Fan* back to *low*. The mode is not sent again.

        </small>
- title: ALL 2
  path: targets
  type: sections
  max_columns: 3
  sections:
  - *all_1
  - *all_2
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Adaptative ALL — targets per mode

        **Who is who**
        - **Adaptative ALL**: the entity under test, every mode on one source, ALL Virtual. Synchronized modes (`sync_modes`): *heat*, *cool* and *dry* share one fan/swing memory; *fan_only*, *auto* and *heat_cool* each have their own.
        - **ALL Virtual**: every mode; a single target, and a low/high target in *heat_cool* and *auto*. Its helpers play its remote and its failures.

        **Start**
        - Press **Reset the sources**: ALL Virtual *off*, *Target* 20, low/high 19–25, fan *auto*, swings *off*, *Delay before obeying* 0.
        - On *Adaptative ALL*: press *heat*, set the target to 20 and the fan to *auto*; press *heat_cool*, set 19–24 (raise high first if needed); press *off*.

        Delays of the tests: mode confirmation 10 s, next try 30 s, monitoring 15 s, removal confirmation 20 s.

        1. **heat and cool share one target** (ENT-FEAT-4)
           - *From*: **Start** (Adaptative ALL *off*; target 20, low/high 19–24, shared fan *auto*).
           - *Do*: press *heat*, then *cool*.
           - *Expect*: *cool* shows 20 too: *heat*, *cool* and *dry* share one target.
        2. **Changed in cool, seen in heat** (ENT-FEAT-4)
           - *From*: after 1 (*cool*, 20).
           - *Do*: set the target to 26; press *heat*.
           - *Expect*: *heat* shows 26.
        3. **auto shares the range of heat_cool** (§1.3.4.3)
           - *From*: after 2 (*heat*, 26; low/high 19–24).
           - *Do*: press *auto*.
           - *Expect*: Adaptative ALL shows 19–24; ALL Virtual gets 19 / 24.
        4. **dry keeps the single target** (ENT-FEAT-4)
           - *From*: after 3 (*auto*, 19–24).
           - *Do*: press *dry*.
           - *Expect*: 26.

        </small>
- title: ALL 3
  path: first-start
  type: sections
  max_columns: 3
  sections:
  - *all_1
  - *all_2
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Adaptative ALL — first start, mode discovered

        **Who is who**
        - **Adaptative ALL**: the entity under test, every mode on one source, ALL Virtual. Synchronized modes (`sync_modes`): *heat*, *cool* and *dry* share one fan/swing memory; *fan_only*, *auto* and *heat_cool* each have their own.
        - **ALL Virtual**: every mode; a single target, and a low/high target in *heat_cool* and *auto*. Its helpers play its remote and its failures.

        **Start**
        - Press **Reset the sources**: ALL Virtual *off*, *Target* 20, low/high 19–25, fan *auto*, swings *off*, *Delay before obeying* 0.
        - On *Adaptative ALL*: press *heat*, set the target to 20 and the fan to *auto*; press *heat_cool*, set 19–24 (raise high first if needed); press *off*.

        Delays of the tests: mode confirmation 10 s, next try 30 s, monitoring 15 s, removal confirmation 20 s.

        1. **First start** (ENT-CAP-4, SRC-DATA-13)
           - *From*: **Start** (Adaptative ALL *off*; target 20, low/high 19–24, shared fan *auto*).
           - *Do*: stop Home Assistant; `tests/integration/manual/reset_memory.sh "Adaptative ALL"`; start Home Assistant.
           - *Expect*: no mode ran yet. Adaptative ALL, *off*, already shows a target and the range 8–32: what ALL Virtual shows, *off* (provisional).
        2. **Target before any mode** (ENT-TGT-7)
           - *From*: after 1 (no mode ran yet).
           - *Do*: set the target to 23.
           - *Expect*: kept; nothing is sent: ALL Virtual *Target* stays 20.
        3. **Mode discovered** (ENT-CAP-5, ENT-CAP-6, §5.4)
           - *From*: after 2 (no mode ran yet; target 23).
           - *Do*: on ALL Virtual, *Delay before obeying* 5; on *Adaptative ALL*, press *dry*.
           - *Expect*:
             - at once, Adaptative ALL shows *dry* and 23;
             - for 5 s, ALL Virtual stays *off* with *Target* 20: only the mode is sent;
             - then ALL Virtual goes to *dry* (*dry* is discovered): its *Target* goes to 23, and Adaptative ALL shows the fan of ALL Virtual, *auto* (nothing remembered yet).

        </small>
- title: ALL 4
  path: fan
  type: sections
  max_columns: 3
  sections:
  - *all_1
  - *all_2
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Adaptative ALL — fan memory

        **Who is who**
        - **Adaptative ALL**: the entity under test, every mode on one source, ALL Virtual. Synchronized modes (`sync_modes`): *heat*, *cool* and *dry* share one fan/swing memory; *fan_only*, *auto* and *heat_cool* each have their own.
        - **ALL Virtual**: every mode; a single target, and a low/high target in *heat_cool* and *auto*. Its helpers play its remote and its failures.

        **Start**
        - Press **Reset the sources**: ALL Virtual *off*, *Target* 20, low/high 19–25, fan *auto*, swings *off*, *Delay before obeying* 0.
        - On *Adaptative ALL*: press *heat*, set the target to 20 and the fan to *auto*; press *heat_cool*, set 19–24 (raise high first if needed); press *off*.

        Delays of the tests: mode confirmation 10 s, next try 30 s, monitoring 15 s, removal confirmation 20 s.

        1. **Own memory of fan_only** (ENT-FANV-2)
           - *From*: **Start** (Adaptative ALL *off*; target 20, low/high 19–24, shared fan *auto*).
           - *Do*: press *fan_only*; fan *low*.
           - *Expect*: ALL Virtual: *Fan* *low*.
        2. **Fan set in cool** (ENT-FANV-2)
           - *From*: after 1 (*fan_only*, *low*).
           - *Do*: press *cool*; fan *high*.
           - *Expect*: ALL Virtual: *Fan* *high*.
        3. **Shared by heat and dry** (ENT-FANV-2)
           - *From*: after 2 (*cool*, shared fan *high*).
           - *Do*: press *heat*, then *dry*.
           - *Expect*: each time, *high*: the shared memory.
        4. **fan_only keeps its own** (ENT-FANV-2)
           - *From*: after 3 (*dry*, *high*).
           - *Do*: press *fan_only*.
           - *Expect*: ALL Virtual: *Fan* back to *low*, its own memory.
        5. **No fan in off** (ENT-FAN-3, ENT-FAN-4)
           - *From*: **Start** (Adaptative ALL *off*; target 20, low/high 19–24, shared fan *auto*).
           - *Do*: from *Developer tools > Actions*, `climate.set_fan_mode` *auto* on Adaptative ALL.
           - *Expect*: refused. In *off*, the fan and swing lists of the card are greyed out: a fan chosen in *off* must go to one memory, and *fan_only*, *auto* and *heat_cool* each have their own.

        </small>
