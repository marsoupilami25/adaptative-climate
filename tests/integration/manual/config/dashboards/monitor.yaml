# Case monitor: the monitoring sensors and events.
# YAML dashboard: after editing this file, refresh the page in the browser.
title: Tests monitoring
views:
- title: Monitoring 1
  path: pilotage
  type: sections
  max_columns: 3
  sections:
  - &monitoring_1
    type: grid
    cards:
    - type: custom:adaptative-climate-card
      entity: climate.adaptative_monitor
      name: Adaptative MONITOR
      features:
      - type: ac-device
      - type: ac-hvac-modes
      - type: ac-fan-modes
      - type: ac-swing-modes
      - type: ac-swing-horizontal-modes
    - type: glance
      title: Adaptative MONITOR monitoring
      show_state: true
      state_color: true
      entities:
      - entity: binary_sensor.adaptative_monitor_monitoring_sources
        name: Monitoring sources
      - entity: binary_sensor.adaptative_monitor_monitoring_temperatures
        name: Monitoring temperatures
    - type: markdown
      text_only: true
      content: |-
        {% set e = 'climate.adaptative_monitor' %}{% set problems = (state_attr('binary_sensor.adaptative_monitor_monitoring_sources', 'problems') or []) + (state_attr('binary_sensor.adaptative_monitor_monitoring_temperatures', 'problems') or []) %}
        **Problems**: {{ 'none' if not problems else '' }}
        {% for p in problems %}
        - {{ p.type }}: {{ p.get('source') or p.get('sources') or p.get('sensor') or '' }}{{ (' ' ~ p.get('setting')) if p.get('setting') else '' }}
        {% endfor %}

        | | |
        |:--|:--|
        | Action | {{ state_attr(e, 'hvac_action') }} |
        | Active source | {{ state_attr(e, 'active_entity_id') }} |
        | Reference temperature | {{ state_attr(e, 'current_temperature') }} |
        | Step | {{ state_attr(e, 'target_temp_step') }} |
        | Target | {{ state_attr(e, 'temperature') }} |
        | Low / high | {{ state_attr(e, 'target_temp_low') }} / {{ state_attr(e, 'target_temp_high') }} |
        | Min gap | {{ state_attr(e, 'min_gap') }} |
        | Min / max | {{ state_attr(e, 'min_temp') }} / {{ state_attr(e, 'max_temp') }} |
        | Phase | {{ state_attr(e, 'phase') }} |
        | Unavailable modes | {{ state_attr(e, 'unavailable_modes') }} |
        | Foreign modes | {{ state_attr(e, 'foreign_modes') }} |
        | Target gaps | {{ state_attr(e, 'target_gaps') }} |
        | Saved targets | {{ state_attr(e, 'saved_targets') }} |
        | Saved fan/swing | {{ state_attr(e, 'saved_settings') }} |
    - type: custom:adaptative-climate-card
      entity: climate.adaptative_ghost
      name: Adaptative GHOST
      features:
      - type: ac-device
      - type: ac-hvac-modes
      - type: ac-fan-modes
      - type: ac-swing-modes
      - type: ac-swing-horizontal-modes
    - type: glance
      title: Adaptative GHOST monitoring
      show_state: true
      state_color: true
      entities:
      - entity: binary_sensor.adaptative_ghost_monitoring_sources
        name: Monitoring sources
      - entity: binary_sensor.adaptative_ghost_monitoring_temperatures
        name: Monitoring temperatures
    - type: markdown
      text_only: true
      content: |-
        {% set e = 'climate.adaptative_ghost' %}{% set problems = (state_attr('binary_sensor.adaptative_ghost_monitoring_sources', 'problems') or []) + (state_attr('binary_sensor.adaptative_ghost_monitoring_temperatures', 'problems') or []) %}
        **Problems**: {{ 'none' if not problems else '' }}
        {% for p in problems %}
        - {{ p.type }}: {{ p.get('source') or p.get('sources') or p.get('sensor') or '' }}{{ (' ' ~ p.get('setting')) if p.get('setting') else '' }}
        {% endfor %}

        | | |
        |:--|:--|
        | Action | {{ state_attr(e, 'hvac_action') }} |
        | Active source | {{ state_attr(e, 'active_entity_id') }} |
        | Reference temperature | {{ state_attr(e, 'current_temperature') }} |
        | Step | {{ state_attr(e, 'target_temp_step') }} |
        | Target | {{ state_attr(e, 'temperature') }} |
        | Low / high | {{ state_attr(e, 'target_temp_low') }} / {{ state_attr(e, 'target_temp_high') }} |
        | Min / max | {{ state_attr(e, 'min_temp') }} / {{ state_attr(e, 'max_temp') }} |
        | Phase | {{ state_attr(e, 'phase') }} |
        | Unavailable modes | {{ state_attr(e, 'unavailable_modes') }} |
        | Foreign modes | {{ state_attr(e, 'foreign_modes') }} |
        | Target gaps | {{ state_attr(e, 'target_gaps') }} |
        | Saved targets | {{ state_attr(e, 'saved_targets') }} |
        | Saved fan/swing | {{ state_attr(e, 'saved_settings') }} |
  - &monitoring_2
    type: grid
    cards:
    - type: entities
      title: RADIATOR Virtual
      uix:
        style: |
          {% set m = states('climate.radiator_virtual_monitor') %}
          {% set color = {'heat': 'heat', 'cool': 'cool', 'heat_cool': 'heat-cool', 'auto': 'auto', 'dry': 'dry', 'fan_only': 'fan_only'}.get(m) %}
          {% if color %}
          ha-card {
            border: 2px solid var(--state-climate-{{ color }}-color);
            background: color-mix(in srgb, var(--state-climate-{{ color }}-color) 15%, var(--card-background-color));
          }
          {% endif %}
      entities:
      - entity: input_select.mode_radiator_monitor
        name: Mode
      - entity: input_number.target_radiator_monitor
        name: Target
      - entity: input_number.offset_radiator_monitor
        name: Offset (measured = room + offset)
      - entity: input_number.delay_radiator_monitor
        name: Delay before obeying
    - type: markdown
      text_only: true
      content: |-
        {% set e = 'climate.radiator_virtual_monitor' %}
        | Shown by RADIATOR Virtual | |
        |:--|:--|
        | Modes | {{ (state_attr(e, 'hvac_modes') or []) | join(', ') }} |
        | Mode / action | {{ states(e) }} / {{ state_attr(e, 'hvac_action') }} |
        | Temperature | {{ state_attr(e, 'current_temperature') }} |
        | Target | {{ state_attr(e, 'temperature') }} |
        | Min / max / step | {{ state_attr(e, 'min_temp') }} / {{ state_attr(e, 'max_temp') }} / {{ state_attr(e, 'target_temp_step') or '—' }} |
    - type: glance
      columns: 4
      state_color: true
      show_state: true
      entities:
      - entity: input_boolean.available_radiator_monitor
        name: Available
        tap_action:
          action: toggle
      - entity: input_boolean.unknown_radiator_monitor
        name: Unknown
        tap_action:
          action: toggle
      - entity: input_boolean.obeys_radiator_monitor
        name: Obeys the mode
        tap_action:
          action: toggle
      - entity: input_boolean.applies_radiator_monitor
        name: Applies settings
        tap_action:
          action: toggle
      - entity: input_boolean.offers_radiator_monitor
        name: Offers heat
        tap_action:
          action: toggle
    - type: entities
      title: AIRCON Virtual
      uix:
        style: |
          {% set m = states('climate.aircon_virtual_monitor') %}
          {% set color = {'heat': 'heat', 'cool': 'cool', 'heat_cool': 'heat-cool', 'auto': 'auto', 'dry': 'dry', 'fan_only': 'fan_only'}.get(m) %}
          {% if color %}
          ha-card {
            border: 2px solid var(--state-climate-{{ color }}-color);
            background: color-mix(in srgb, var(--state-climate-{{ color }}-color) 15%, var(--card-background-color));
          }
          {% endif %}
      entities:
      - entity: input_select.mode_aircon_monitor
        name: Mode
      - entity: input_number.target_aircon_monitor
        name: Target
      - entity: input_number.offset_aircon_monitor
        name: Offset (measured = room + offset)
      - entity: input_select.fan_aircon_monitor
        name: Fan
      - entity: input_number.delay_aircon_monitor
        name: Delay before obeying
    - type: markdown
      text_only: true
      content: |-
        {% set e = 'climate.aircon_virtual_monitor' %}
        | Shown by AIRCON Virtual | |
        |:--|:--|
        | Modes | {{ (state_attr(e, 'hvac_modes') or []) | join(', ') }} |
        | Mode / action | {{ states(e) }} / {{ state_attr(e, 'hvac_action') }} |
        | Temperature | {{ state_attr(e, 'current_temperature') }} |
        | Target | {{ state_attr(e, 'temperature') }} |
        | Min / max / step | {{ state_attr(e, 'min_temp') }} / {{ state_attr(e, 'max_temp') }} / {{ state_attr(e, 'target_temp_step') or '—' }} |
        | Fan | {{ state_attr(e, 'fan_mode') }} ({{ (state_attr(e, 'fan_modes') or []) | join(', ') }}) |
    - type: glance
      columns: 4
      state_color: true
      show_state: true
      entities:
      - entity: input_boolean.available_aircon_monitor
        name: Available
        tap_action:
          action: toggle
      - entity: input_boolean.unknown_aircon_monitor
        name: Unknown
        tap_action:
          action: toggle
      - entity: input_boolean.obeys_aircon_monitor
        name: Obeys the mode
        tap_action:
          action: toggle
      - entity: input_boolean.applies_aircon_monitor
        name: Applies settings
        tap_action:
          action: toggle
      - entity: input_boolean.offers_aircon_monitor
        name: Offers cool
        tap_action:
          action: toggle
      - entity: input_boolean.fan_on_aircon_monitor
        name: Fan on
        tap_action:
          action: toggle
    - type: entities
      title: Room sensor
      state_color: true
      entities:
      - entity: input_number.room_temperature_monitor
        name: Room temperature
      - entity: input_boolean.room_sensor_available_monitor
        name: Room sensor available
      - entity: sensor.room_sensor_monitor
        name: Read by Adaptative MONITOR
    - type: button
      entity: script.reset_sources_monitor
      name: Reset the sources
      icon: mdi:restore
      tap_action:
        action: toggle
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Monitoring — sources

        **Who is who**
        - **Adaptative MONITOR**: the entity under test. RADIATOR Virtual for *heat*, AIRCON Virtual for *cool*, the room sensor. Largest gap between temperatures: 2 °C.
        - **Adaptative GHOST**: a source that does not exist (`climate.ghost_monitor`).
        - **RADIATOR Virtual**, **AIRCON Virtual**: each measures the room plus its *Offset*, compared with the room sensor and with each other.
        - **Room sensor**: the room thermometer, `temperature_sensor` of Adaptative MONITOR. *Room sensor available* off makes it unavailable.
        - **Events**: *Developer tools > Events*, listen to `adaptative_climate_problem`.
        - **In every scenario** (MON-LIFE-2, MON-LIFE-3): each problem reported writes a warning in the log, with the text of the `message` of its event; its end, an info.

        **Start**
        - Press **Reset the sources**: both sources *off*, available, obeying, *Target* 20, *Offset* 0; *Room temperature* 20, room sensor available.
        - On *Adaptative MONITOR*, press *off*. Wait until *Monitoring sources* and *Monitoring temperatures* are *OK*.

        Delays of the tests: mode confirmation 10 s, next try 30 s, monitoring 15 s, removal confirmation 20 s.

        1. **Source never seen** (MON-SRC-5)
           - *From*: Home Assistant stopped.
           - *Do*: start Home Assistant; at once, listen to the events; wait 15 s.
           - *Expect*: Adaptative GHOST, *off*: its *Monitoring sources* goes to *Problem*; a `started` event.
        2. **Source out of sync** (MON-SRC-3, SRC-REQ-5)
           - *From*: **Start** (Adaptative MONITOR *off*; both sensors *OK*; offsets 0, room 20).
           - *Do*: on RADIATOR Virtual, *Obeys the mode* off; on *Adaptative MONITOR*, press *heat*.
           - *Expect*: after 10 s, *Monitoring sources* goes to *Problem*, with no extra delay.
        3. **Back in sync** (SRC-REQ-6)
           - *From*: after 2 (*Problem*).
           - *Do*: on RADIATOR Virtual, *Obeys the mode* on.
           - *Expect*: at the next try, RADIATOR Virtual goes to *heat*. *Monitoring sources* back to *OK*; an `ended` event.
        4. **Setting not applied** (MON-SRC-4)
           - *From*: **Start** (Adaptative MONITOR *off*; both sensors *OK*; offsets 0, room 20).
           - *Do*: press *heat*, wait 12 s; on RADIATOR Virtual, *Applies settings* off; on *Adaptative MONITOR*, press + once.
           - *Expect*: after 30 s (the shortest delay for a setting), *Monitoring sources* goes to *Problem*.
        5. **Setting applied on the device** (MON-SRC-4)
           - *From*: after 4 (*Problem*; Adaptative MONITOR one step above RADIATOR Virtual).
           - *Do*: on RADIATOR Virtual, *Target* to the value of Adaptative MONITOR.
           - *Expect*: *Monitoring sources* back to *OK*.

        </small>
- title: Monitoring 2
  path: away
  type: sections
  max_columns: 3
  sections:
  - *monitoring_1
  - *monitoring_2
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Monitoring — source away, sensor away

        **Who is who**
        - **Adaptative MONITOR**: the entity under test. RADIATOR Virtual for *heat*, AIRCON Virtual for *cool*, the room sensor. Largest gap between temperatures: 2 °C.
        - **Adaptative GHOST**: a source that does not exist (`climate.ghost_monitor`).
        - **RADIATOR Virtual**, **AIRCON Virtual**: each measures the room plus its *Offset*, compared with the room sensor and with each other.
        - **Room sensor**: the room thermometer, `temperature_sensor` of Adaptative MONITOR. *Room sensor available* off makes it unavailable.
        - **Events**: *Developer tools > Events*, listen to `adaptative_climate_problem`.
        - **In every scenario** (MON-LIFE-2, MON-LIFE-3): each problem reported writes a warning in the log, with the text of the `message` of its event; its end, an info.

        **Start**
        - Press **Reset the sources**: both sources *off*, available, obeying, *Target* 20, *Offset* 0; *Room temperature* 20, room sensor available.
        - On *Adaptative MONITOR*, press *off*. Wait until *Monitoring sources* and *Monitoring temperatures* are *OK*.

        Delays of the tests: mode confirmation 10 s, next try 30 s, monitoring 15 s, removal confirmation 20 s.

        1. **Source unusable** (MON-SRC-1)
           - *From*: **Start** (Adaptative MONITOR *off*; both sensors *OK*; offsets 0, room 20).
           - *Do*: press *heat*; on RADIATOR Virtual, *Available* off.
           - *Expect*: Adaptative MONITOR goes to *Unknown*: it waits for its source. After 15 s, *Monitoring sources* goes to *Problem*.
        2. **Source back** (MON-SRC-1)
           - *From*: after 1 (waiting; *Problem*).
           - *Do*: on RADIATOR Virtual, *Available* on.
           - *Expect*: Adaptative MONITOR back to *heat*. *Monitoring sources* back to *OK*.
        3. **Not reported in off** (MON-SRC-2)
           - *From*: **Start** (Adaptative MONITOR *off*; both sensors *OK*; offsets 0, room 20).
           - *Do*: on AIRCON Virtual, *Available* off; wait 15 s. Keep RADIATOR Virtual available: with both sources away, Adaptative MONITOR would have no source left and be unavailable (ENT-STATE-6).
           - *Expect*: *cool* is in *Unavailable modes*, but *Monitoring sources* stays *OK*: in *off*, nothing is asked of AIRCON Virtual.
        4. **Sensor without value** (MON-TEMP-4)
           - *From*: **Start** (Adaptative MONITOR *off*; both sensors *OK*; offsets 0, room 20).
           - *Do*: *Room sensor available* off.
           - *Expect*: after 15 s, *Monitoring temperatures* goes to *Problem*.
        5. **Sensor back** (MON-TEMP-4)
           - *From*: after 4 (*Problem*).
           - *Do*: *Room sensor available* on.
           - *Expect*: *Monitoring temperatures* back to *OK*.

        </small>
- title: Monitoring 3
  path: gaps
  type: sections
  max_columns: 3
  sections:
  - *monitoring_1
  - *monitoring_2
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Monitoring — temperature gaps

        **Who is who**
        - **Adaptative MONITOR**: the entity under test. RADIATOR Virtual for *heat*, AIRCON Virtual for *cool*, the room sensor. Largest gap between temperatures: 2 °C.
        - **Adaptative GHOST**: a source that does not exist (`climate.ghost_monitor`).
        - **RADIATOR Virtual**, **AIRCON Virtual**: each measures the room plus its *Offset*, compared with the room sensor and with each other.
        - **Room sensor**: the room thermometer, `temperature_sensor` of Adaptative MONITOR. *Room sensor available* off makes it unavailable.
        - **Events**: *Developer tools > Events*, listen to `adaptative_climate_problem`.
        - **In every scenario** (MON-LIFE-2, MON-LIFE-3): each problem reported writes a warning in the log, with the text of the `message` of its event; its end, an info.

        **Start**
        - Press **Reset the sources**: both sources *off*, available, obeying, *Target* 20, *Offset* 0; *Room temperature* 20, room sensor available.
        - On *Adaptative MONITOR*, press *off*. Wait until *Monitoring sources* and *Monitoring temperatures* are *OK*.

        Delays of the tests: mode confirmation 10 s, next try 30 s, monitoring 15 s, removal confirmation 20 s.

        1. **Gap sensor–source** (MON-TEMP-1, MON-TEMP-3)
           - *From*: **Start** (Adaptative MONITOR *off*; both sensors *OK*; offsets 0, room 20).
           - *Do*: *Offset* of RADIATOR Virtual 2.5, of AIRCON Virtual 1 (they measure 22.5 and 21).
           - *Expect*: after 15 s, *Monitoring temperatures* goes to *Problem*, for RADIATOR Virtual only: 2.5 from the room sensor; the two sources are 1.5 apart.
        2. **Gap gone** (MON-TEMP-1)
           - *From*: after 1 (*Problem*).
           - *Do*: *Offset* of RADIATOR Virtual 1.
           - *Expect*: *Monitoring temperatures* back to *OK*.
        3. **Gap between sources** (MON-TEMP-1)
           - *From*: **Start** (Adaptative MONITOR *off*; both sensors *OK*; offsets 0, room 20).
           - *Do*: *Offset* of RADIATOR Virtual −2, of AIRCON Virtual 2 (they measure 18 and 22).
           - *Expect*: after 15 s, a problem between the two sources only: each one is 2 from the room sensor, not more.
        4. **A delay per problem** (MON-SENS-3)
           - *From*: **Start** (Adaptative MONITOR *off*; both sensors *OK*; offsets 0, room 20).
           - *Do*: *Room sensor available* off; 10 s later, *Offset* of RADIATOR Virtual −2 and of AIRCON Virtual 2.
           - *Expect*: both problems (sensor without value, gap between sources) are reported, 10 s apart.
        5. **Problem before a restart** (MON-TEMP-1)
           - *From*: **Start** (Adaptative MONITOR *off*; both sensors *OK*; offsets 0, room 20).
           - *Do*: *Offset* of RADIATOR Virtual 3.
           - *Expect*: after 15 s, *Monitoring temperatures* goes to *Problem*.
        6. **After a restart** (END-2, MON-SEND-3, MON-LIFE-1)
           - *From*: after 5 (*Problem*; offset 3).
           - *Do*: restart Home Assistant (the offset is kept).
           - *Expect*: *Monitoring temperatures* *OK*, then *Problem* 15 s later.

        </small>
