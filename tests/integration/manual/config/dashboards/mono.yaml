        action: toggle
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Adaptative OFFSET

        **Who is who**
        - **Adaptative OFFSET**: the entity under test, `heat_offset` = `dry_offset` = 2, `max_temp` 26. Its source: HEATPUMP Virtual, in *heat* and *dry*.
        - **HEATPUMP Virtual**: *heat* and *dry*, 10–30 °C. It reads 2 °C warmer than the room: Adaptative OFFSET shows its temperature minus 2, and sends its targets plus 2.

        **Start**
        - Press **Reset the sources**: HEATPUMP Virtual *off*, *Target* 20, *Temperature* 20.
        - On *Adaptative OFFSET*, press *heat*, set the target to 20, then press *off*.

        Delays of the tests: mode confirmation 10 s, next try 30 s, monitoring 15 s, removal confirmation 20 s.

        1. **Reading and range** (ENT-REF-5, CFG-SENS-1, ENT-RANGE-1, ENT-RANGE-3)
           - *From*: **Start** (Adaptative OFFSET *off*, target 20).
           - *Do*: on HEATPUMP Virtual, *Temperature* 22; on *Adaptative OFFSET*, press *heat*.
           - *Expect*: Adaptative OFFSET shows 20 as current temperature. *Min / max* 8 / 26: 10–30 minus 2, narrowed to 26.
        2. **Target sent** (CFG-SENS-1, ENT-TGT-8)
           - *From*: after 1 (*heat*, target 20).
           - *Do*: set the target to 21.
           - *Expect*: HEATPUMP Virtual: *Target* 23.
        3. **Takeover** (ENT-TGT-9)
           - *From*: after 2 (*heat*, 21).
           - *Do*: wait 12 s; on HEATPUMP Virtual, *Target* 25.
           - *Expect*: Adaptative OFFSET shows 23.
        4. **Same offset in dry** (CFG-SENS-4)
           - *From*: after 3 (*heat*, 23).
           - *Do*: press *dry*; set the target to 20.
           - *Expect*: HEATPUMP Virtual: *Target* 22.

        </small>
