        ## Adaptative HEAT_COOL — takeover

        **Who is who**
        - **Adaptative HEAT_COOL**: the entity under test, `min_gap` 2. Its source: HEAT_COOL Virtual.
        - **HEAT_COOL Virtual**: *heat_cool* with a low/high target, 16–30 °C.

        **Start**
        - Press **Reset the sources**: HEAT_COOL Virtual *off*, *Target low* 19, *Target high* 25.
        - On *Adaptative HEAT_COOL*, press *heat_cool*, set 19–24 (raise high first if needed), then press *off*.

        Delays of the tests: mode confirmation 10 s, next try 30 s, monitoring 15 s, removal confirmation 20 s.

        The card only knows the gap on release: while dragging, it stops low at high, and high at low.

        1. **Low changed on the device** (ENT-TGT-9)
           - *From*: **Start** (Adaptative HEAT_COOL *off*, range 19–24).
           - *Do*: press *heat_cool*, wait 12 s; on HEAT_COOL Virtual, *Target low* 23.
           - *Expect*: Adaptative HEAT_COOL shows 23–25. HEAT_COOL Virtual: *Target high* goes to 25.
        2. **High changed on the device** (ENT-TGT-9)
           - *From*: after 1 (*heat_cool*, 23–25).
           - *Do*: on HEAT_COOL Virtual, *Target high* 22.
           - *Expect*: Adaptative HEAT_COOL shows 20–22. HEAT_COOL Virtual: *Target low* goes to 20.
        3. **Takeover at the end of the range** (ENT-TGT-9)
           - *From*: after 2 (*heat_cool*, 20–22).
           - *Do*: on HEAT_COOL Virtual, *Target high* 30, then *Target low* 29.5.
           - *Expect*: Adaptative HEAT_COOL shows 29.5–30: the source wins, the gap is broken. HEAT_COOL Virtual keeps 29.5–30.

        </small>
