        <small>

        ## Adaptative COOL — step, fan, swing

        **Who is who**
        - **Adaptative COOL**: the entity under test. Its source: COOL Virtual.
        - **COOL Virtual**: *cool*, 16–32 °C by steps of 1 °C, fan *auto*/*low*/*high*, swing *off*/*on*. Its helpers play its remote and its failures; *Fan without high* on: *high* leaves its fan; *Swing on* off: its swing has no option.

        **Start**
        - Press **Reset the sources**: COOL Virtual *off*, *Target* 20, fan *auto*, swing *off*, every option offered.
        - On *Adaptative COOL*, press *cool*, set the target to 20, the fan to *auto* and the swing to *off*, then press *off*.

        Delays of the tests: mode confirmation 10 s, next try 30 s, monitoring 15 s, removal confirmation 20 s.

        1. **Step** (ENT-STEP-1)
           - *From*: **Start** (Adaptative COOL *off*, target 20, fan *auto*, swing *off*; COOL Virtual *off*).
           - *Do*: press *cool*; press + once.
           - *Expect*: the target goes from 20 to 21: steps of 1 °C.
        2. **Fan and swing of the source** (ENT-FANV-5, SRC-SET-12)
           - *From*: **Start** (Adaptative COOL *off*, target 20, fan *auto*, swing *off*; COOL Virtual *off*).
           - *Do*: stop Home Assistant; `tests/integration/manual/reset_memory.sh cool`; start Home Assistant; on *Adaptative COOL*, press *cool*.
           - *Expect*: nothing remembered: Adaptative COOL shows the fan (*auto*) and the swing (*off*) of COOL Virtual.
        3. **Fan remembered** (ENT-FANV-1, ENT-FANV-6)
           - *From*: **Start** (Adaptative COOL *off*, target 20, fan *auto*, swing *off*; COOL Virtual *off*).
           - *Do*: press *cool*, fan *low*; press *off*; on COOL Virtual, *Fan* *high*; on *Adaptative COOL*, press *cool*.
           - *Expect*: COOL Virtual: *Fan* back to *low*.
        4. **Option removed** (SRC-DATA-10)
           - *From*: after 3 (*cool*, fan *low*).
           - *Do*: on COOL Virtual, *Fan without high* on.
           - *Expect*: Adaptative COOL still offers *high* for 20 s, then no longer.

        </small>
