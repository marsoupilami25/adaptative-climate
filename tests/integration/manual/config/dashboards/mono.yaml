  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Adaptative COOL — no option, setting not applied

        **Who is who**
        - **Adaptative COOL**: the entity under test. Its source: COOL Virtual.
        - **COOL Virtual**: *cool*, 16–32 °C by steps of 1 °C, fan *auto*/*low*/*high*, swing *off*/*on*. Its helpers play its remote and its failures; *Fan without high* on: *high* leaves its fan; *Swing on* off: its swing has no option.

        **Start**
        - Press **Reset the sources**: COOL Virtual *off*, *Target* 20, fan *auto*, swing *off*, every option offered.
        - On *Adaptative COOL*, press *cool*, set the target to 20, the fan to *auto* and the swing to *off*, then press *off*.

        Delays of the tests: mode confirmation 10 s, next try 30 s, monitoring 15 s, removal confirmation 20 s.

        1. **No option left** (ENT-FAN-2, ENT-FAN-4)
           - *From*: **Start** (Adaptative COOL *off*, target 20, fan *auto*, swing *off*; COOL Virtual *off*).
           - *Do*: press *cool*; on COOL Virtual, *Swing on* off; wait 20 s. From *Developer tools > Actions*, ask a swing of Adaptative COOL.
           - *Expect*: Adaptative COOL keeps its swing, greyed out, with no option. The swing asked is refused.
           - ⚠️ *Swing on* only empties the options: a template climate cannot drop its swing. A setting that disappears is tested in the automated tests.
        2. **Setting not applied** (SRC-SET-9, SRC-SET-10, MON-SRC-4)
           - *From*: **Start** (Adaptative COOL *off*, target 20, fan *auto*, swing *off*; COOL Virtual *off*).
           - *Do*: press *cool*, wait 12 s; on COOL Virtual, *Applies settings* off; on *Adaptative COOL*, press + once.
           - *Expect*: Adaptative COOL keeps 21; COOL Virtual: *Target* stays 20. After 30 s (the shortest delay for a setting), *Monitoring sources* goes to *Problem* (setting not applied).
        3. **Setting applied on the device** (MON-SRC-4)
           - *From*: after 2 (*Monitoring sources* *Problem*).
           - *Do*: on COOL Virtual, *Target* 21.
           - *Expect*: *Monitoring sources* back to *OK*.

        </small>
