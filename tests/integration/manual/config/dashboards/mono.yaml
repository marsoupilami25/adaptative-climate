        tap_action:
          action: toggle
      - entity: input_boolean.applies_heat_cool_mono
        name: Applies settings
        tap_action:
          action: toggle
      - entity: input_boolean.offers_heat_cool_mono
        name: Offers heat_cool
        tap_action:
          action: toggle
    - type: button
      entity: script.reset_sources_mono
      name: Reset the sources
      icon: mdi:restore
      tap_action:
        action: toggle
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Adaptative HEAT_COOL — low and high, minimum gap

        **Who is who**
        - **Adaptative HEAT_COOL**: the entity under test, `min_gap` 2. Its source: HEAT_COOL Virtual.
        - **HEAT_COOL Virtual**: *heat_cool* with a low/high target, 16–30 °C.

        **Start**
        - Press **Reset the sources**: HEAT_COOL Virtual *off*, *Target low* 19, *Target high* 25.
        - On *Adaptative HEAT_COOL*, press *heat_cool*, set 19–24 (raise high first if needed), then press *off*.

        Delays of the tests: mode confirmation 10 s, next try 30 s, monitoring 15 s, removal confirmation 20 s.

        The card only knows the gap on release: while dragging, it stops low at high, and high at low.

        1. **Low and high** (§1.3.4.3)
           - *From*: **Start** (Adaptative HEAT_COOL *off*, range 19–24).
           - *Do*: press *heat_cool*.
           - *Expect*: a range, 19–24. HEAT_COOL Virtual: *Target low* 19, *Target high* 24.
        2. **Gap kept by low** (ENT-TGT-6, §2.2)
           - *From*: after 1 (*heat_cool*, 19–24).
           - *Do*: raise low to 22, then to 23.
           - *Expect*: *Min gap* 2. At 23, high goes to 25: 23–25; HEAT_COOL Virtual gets 23–25.
        3. **Gap kept by high** (ENT-TGT-6)
           - *From*: after 2 (*heat_cool*, 23–25).
           - *Do*: lower high to 24.
           - *Expect*: low goes to 22: 22–24; HEAT_COOL Virtual gets 22–24.
        4. **Gap at the top of the range** (ENT-TGT-6, ENT-TGT-7)
           - *From*: after 3 (*heat_cool*, 22–24).
           - *Do*: set 28–30 (high first); raise low to 29.
           - *Expect*: the card goes back to 28–30.
        5. **Gap at the bottom of the range** (ENT-TGT-6, ENT-TGT-7)
           - *From*: after 4 (*heat_cool*, 28–30).
           - *Do*: set 16–18 (low first); lower high to 17.
           - *Expect*: the card goes back to 16–18.

        </small>
