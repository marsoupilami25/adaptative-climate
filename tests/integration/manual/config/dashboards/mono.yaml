    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Adaptative TRV

        **Who is who**
        - **Adaptative TRV**: the entity under test. Its source: TRV Virtual, a radiator valve; it measures next to the radiator, too warm.
        - **TRV Virtual**: *Temperature (measured by the valve)*: its own reading. *External temperature (written by Adaptative TRV)*: the room temperature Adaptative TRV writes into it (`heat_external_sensor`, step 0.5, written again every 60 s).
        - **Room sensor**: the room thermometer, `temperature_sensor` of Adaptative TRV. *Room temperature* sets it; *Room sensor available* off makes it unavailable; *Read by Adaptative TRV*: what the entity sees.

        **Start**
        - Press **Reset the sources**: TRV Virtual *off*, *Temperature* 20; *Room temperature* 20, room sensor available.
        - On *Adaptative TRV*, press *off*.

        Delays of the tests: mode confirmation 10 s, next try 30 s, monitoring 15 s, removal confirmation 20 s.

        1. **Written** (ENT-EXT-1, ENT-EXT-2)
           - *From*: **Start** (Adaptative TRV *off*; room 20).
           - *Do*: *Room temperature* 21.3.
           - *Expect*: TRV Virtual: *External temperature* 21.5 (the step of the valve), even with Adaptative TRV *off*.
        2. **Reference** (ENT-REF-1)
           - *From*: after 1 (room 21.3).
           - *Do*: nothing.
           - *Expect*: Adaptative TRV shows 21.3 as current temperature (*Reference temperature*): the room, not the valve.
        3. **Sensor without value** (ENT-EXT-5, MON-TEMP-4, ENT-REF-2)
           - *From*: after 2 (room 21.3).
           - *Do*: *Room sensor available* off; on *Adaptative TRV*, press *heat*.
           - *Expect*: *External temperature* no longer changes. Adaptative TRV shows the *Temperature* measured by TRV Virtual. After 15 s, *Monitoring temperatures* goes to *Problem*.
        4. **Sensor back** (ENT-EXT-1, MON-TEMP-4)
           - *From*: after 3 (*heat*; room sensor unavailable).
           - *Do*: *Room sensor available* on.
           - *Expect*: *External temperature* is written at once. *Monitoring temperatures* back to *OK*.

        </small>
