  - *heat_1
  - *heat_2
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Adaptative HEAT — source away, restart

        **Who is who**
        - **Adaptative HEAT**: the entity under test, `max_temp` 25. Its source: HEAT Virtual.
        - **HEAT Virtual**: *heat*, 8–30 °C, fan *low*/*high*. Its helpers play its remote (*Mode*, *Target*, *Fan*) and its failures (*Available*, *Unknown*, *Obeys the mode*, *Applies settings*, *Offers heat*).

        **Start**
        - Press **Reset the sources**: HEAT Virtual *off*, *Target* 20, *Temperature* 20, fan *low*, every switch back to normal.
        - On *Adaptative HEAT*, press *heat*, set the target to 20 and the fan to *low*, then press *off*.

        Delays of the tests: mode confirmation 10 s, next try 30 s, monitoring 15 s, removal confirmation 20 s.

        1. **Source unavailable** (ENT-NOSRC-2, MON-SRC-2)
           - *From*: **Start** (Adaptative HEAT *off*, target 20, fan *low*; HEAT Virtual *off*, *Target* 20, fan *low*).
           - *Do*: press *heat*; on HEAT Virtual, *Available* off.
           - *Expect*: Adaptative HEAT is unavailable: its only source is away. *Monitoring sources* stays *OK*: the unavailable entity already says it.
        2. **Source back** (SRC-STATE-7, SRC-STATE-10)
           - *From*: after 1 (Adaptative HEAT unavailable; HEAT Virtual unavailable).
           - *Do*: on HEAT Virtual, *Mode* *off*, then *Available* on.
           - *Expect*: HEAT Virtual: *Mode* back to *heat* (Home Assistant wins). Adaptative HEAT back to *heat*.
        3. **Source unknown** (SRC-STATE-6)
           - *From*: **Start** (Adaptative HEAT *off*, target 20, fan *low*; HEAT Virtual *off*, *Target* 20, fan *low*).
           - *Do*: press *heat*; on HEAT Virtual, *Unknown* on.
           - *Expect*: Adaptative HEAT is unavailable. *Monitoring sources* stays *OK*.
        4. **Source known again** (SRC-STATE-7, SRC-STATE-10)
           - *From*: after 3 (Adaptative HEAT unavailable; HEAT Virtual unknown).
           - *Do*: on HEAT Virtual, *Mode* *off*, then *Unknown* off.
           - *Expect*: HEAT Virtual: *Mode* back to *heat*. Adaptative HEAT back to *heat*.
        5. **Restart** (ENT-STATE-1, END-2)
           - *From*: **Start** (Adaptative HEAT *off*, target 20, fan *low*; HEAT Virtual *off*, *Target* 20, fan *low*).
           - *Do*: press *heat*, set the target to 22; restart Home Assistant.
           - *Expect*: Adaptative HEAT resumes *heat* at 22.

        </small>
- title: HEAT 5
  path: heat-5
  type: sections
  max_columns: 3
  sections:
  - *heat_1
  - *heat_2
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Adaptative HEAT — device that fails

        **Who is who**
        - **Adaptative HEAT**: the entity under test, `max_temp` 25. Its source: HEAT Virtual.
        - **HEAT Virtual**: *heat*, 8–30 °C, fan *low*/*high*. Its helpers play its remote (*Mode*, *Target*, *Fan*) and its failures (*Available*, *Unknown*, *Obeys the mode*, *Applies settings*, *Offers heat*).

        **Start**
        - Press **Reset the sources**: HEAT Virtual *off*, *Target* 20, *Temperature* 20, fan *low*, every switch back to normal.
        - On *Adaptative HEAT*, press *heat*, set the target to 20 and the fan to *low*, then press *off*.

        Delays of the tests: mode confirmation 10 s, next try 30 s, monitoring 15 s, removal confirmation 20 s.

        1. **Device that does not obey** (SRC-REQ-5, MON-SRC-3)
           - *From*: **Start** (Adaptative HEAT *off*, target 20, fan *low*; HEAT Virtual *off*, *Target* 20, fan *low*).
           - *Do*: on HEAT Virtual, *Obeys the mode* off; on *Adaptative HEAT*, press *heat*.
           - *Expect*: Adaptative HEAT shows *heat*; HEAT Virtual: *Mode* stays *off*. After 10 s, *Monitoring sources* goes to *Problem* (out of sync).
        2. **Next try** (SRC-REQ-6)
           - *From*: after 1 (*Monitoring sources* *Problem*).
           - *Do*: on HEAT Virtual, *Obeys the mode* on.
           - *Expect*: at the next try (30 s at most), HEAT Virtual: *Mode* *heat*. *Monitoring sources* back to *OK*.
        3. **Mode lost** (SRC-UNUS-2, ENT-HVAC-5)
           - *From*: **Start** (Adaptative HEAT *off*, target 20, fan *low*; HEAT Virtual *off*, *Target* 20, fan *low*).
           - *Do*: on HEAT Virtual, *Offers heat* off; wait 20 s (removal confirmation).
           - *Expect*: Adaptative HEAT is unavailable. A repair shows up (*Settings > Repairs*), with a warning in the log.
        4. **Mode back** (ENT-HVAC-5)
           - *From*: after 3 (the repair shown).
           - *Do*: on HEAT Virtual, *Offers heat* on.
           - *Expect*: the repair is gone, with an info in the log: `Repairs issue mode_not_supported resolved`.

        </small>
