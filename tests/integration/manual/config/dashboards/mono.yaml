# Case mono: one entity per mode, each with its own virtual source.
# YAML dashboard: after editing this file, refresh the page in the browser.
title: Tests mono-mode
views:
- title: HEAT 1
  path: heat
  type: sections
  max_columns: 3
  sections:
  - &heat_1
    type: grid
    cards:
    - type: custom:adaptative-climate-card
      entity: climate.adaptative_heat
      name: Adaptative HEAT
      features:
      - type: ac-device
      - type: ac-hvac-modes
      - type: ac-fan-modes
      - type: ac-swing-modes
      - type: ac-swing-horizontal-modes
    - type: glance
      title: Adaptative HEAT monitoring
      show_state: true
      state_color: true
      entities:
      - entity: binary_sensor.adaptative_heat_monitoring_sources
        name: Monitoring sources
      - entity: binary_sensor.adaptative_heat_monitoring_temperatures
        name: Monitoring temperatures
    - type: markdown
      text_only: true
      content: |-
        {% set e = 'climate.adaptative_heat' %}{% set problems = (state_attr('binary_sensor.adaptative_heat_monitoring_sources', 'problems') or []) + (state_attr('binary_sensor.adaptative_heat_monitoring_temperatures', 'problems') or []) %}
        **Problems**: {{ 'none' if not problems else '' }}
        {% for p in problems %}
        - {{ p.type }}: {{ p.get('source') or p.get('sources') or p.get('sensor') or '' }}{{ (' ' ~ p.get('setting')) if p.get('setting') else '' }}
        {% endfor %}

        | | |
        |:--|:--|
        | Action | {{ state_attr(e, 'hvac_action') }} |
        | Active source | {{ state_attr(e, 'active_entity_id') }} |
        | Reference temperature | {{ state_attr(e, 'current_temperature') }} |
        | Step | {{ state_attr(e, 'target_temp_step') }} |
        | Target | {{ state_attr(e, 'temperature') }} |
        | Low / high | {{ state_attr(e, 'target_temp_low') }} / {{ state_attr(e, 'target_temp_high') }} |
        | Min / max | {{ state_attr(e, 'min_temp') }} / {{ state_attr(e, 'max_temp') }} |
        | Phase | {{ state_attr(e, 'phase') }} |
        | Unavailable modes | {{ state_attr(e, 'unavailable_modes') }} |
        | Foreign modes | {{ state_attr(e, 'foreign_modes') }} |
        | Target gaps | {{ state_attr(e, 'target_gaps') }} |
        | Saved targets | {{ state_attr(e, 'saved_targets') }} |
        | Saved fan/swing | {{ state_attr(e, 'saved_settings') }} |
  - &heat_2
    type: grid
    cards:
    - type: entities
      title: HEAT Virtual
      uix:
        style: |
          {% set m = states('climate.heat_virtual_mono') %}
          {% set color = {'heat': 'heat', 'cool': 'cool', 'heat_cool': 'heat-cool', 'auto': 'auto', 'dry': 'dry', 'fan_only': 'fan_only'}.get(m) %}
          {% if color %}
          ha-card {
            border: 2px solid var(--state-climate-{{ color }}-color);
            background: color-mix(in srgb, var(--state-climate-{{ color }}-color) 15%, var(--card-background-color));
          }
          {% endif %}
      entities:
      - entity: input_select.mode_heat_mono
        name: Mode
      - entity: input_number.target_heat_mono
        name: Target
      - entity: input_number.temperature_heat_mono
        name: Temperature
      - entity: input_select.fan_heat_mono
        name: Fan
      - entity: input_number.delay_heat_mono
        name: Delay before obeying
    - type: markdown
      text_only: true
      content: |-
        {% set e = 'climate.heat_virtual_mono' %}
        | Shown by HEAT Virtual | |
        |:--|:--|
        | Modes | {{ (state_attr(e, 'hvac_modes') or []) | join(', ') }} |
        | Mode / action | {{ states(e) }} / {{ state_attr(e, 'hvac_action') }} |
        | Temperature | {{ state_attr(e, 'current_temperature') }} |
        | Target | {{ state_attr(e, 'temperature') }} |
        | Min / max / step | {{ state_attr(e, 'min_temp') }} / {{ state_attr(e, 'max_temp') }} / {{ state_attr(e, 'target_temp_step') or '—' }} |
        | Fan | {{ state_attr(e, 'fan_mode') }} ({{ (state_attr(e, 'fan_modes') or []) | join(', ') }}) |
    - type: glance
      columns: 4
      state_color: true
      show_state: true
      entities:
      - entity: input_boolean.available_heat_mono
        name: Available
        tap_action:
          action: toggle
      - entity: input_boolean.unknown_heat_mono
        name: Unknown
        tap_action:
          action: toggle
      - entity: input_boolean.obeys_heat_mono
        name: Obeys the mode
        tap_action:
          action: toggle
      - entity: input_boolean.applies_heat_mono
        name: Applies settings
        tap_action:
          action: toggle
      - entity: input_boolean.offers_heat_mono
        name: Offers heat
        tap_action:
          action: toggle
      - entity: input_boolean.fan_on_heat_mono
        name: Fan on
        tap_action:
          action: toggle
    - type: button
      entity: script.reset_sources_mono
      name: Reset the sources
      icon: mdi:restore
      tap_action:
        action: toggle
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Adaptative HEAT — on, off, target

        **Who is who**
        - **Adaptative HEAT**: the entity under test, `max_temp` 25. Its source: HEAT Virtual.
        - **HEAT Virtual**: *heat*, 8–30 °C, fan *low*/*high*. Its helpers play its remote (*Mode*, *Target*, *Fan*) and its failures (*Available*, *Unknown*, *Obeys the mode*, *Applies settings*, *Offers heat*).

        **Start**
        - Press **Reset the sources**: HEAT Virtual *off*, *Target* 20, *Temperature* 20, fan *low*, every switch back to normal.
        - On *Adaptative HEAT*, press *heat*, set the target to 20 and the fan to *low*, then press *off*.

        Delays of the tests: mode confirmation 10 s, next try 30 s, monitoring 15 s, removal confirmation 20 s.

        1. **On** (ENT-STATE-3, SRC-REQ-2)
           - *From*: **Start** (Adaptative HEAT *off*, target 20, fan *low*; HEAT Virtual *off*, *Target* 20, fan *low*).
           - *Do*: on *Adaptative HEAT*, press *heat*.
           - *Expect*: HEAT Virtual: *Mode* *heat*. The device line of *Adaptative HEAT*: *HEAT Virtual*.
        2. **Off** (ENT-STATE-3)
           - *From*: after 1 (Adaptative HEAT *heat*).
           - *Do*: press *off*.
           - *Expect*: HEAT Virtual: *Mode* *off*.
        3. **Range and limit** (ENT-RANGE-1, ENT-RANGE-3)
           - *From*: **Start** (Adaptative HEAT *off*, target 20, fan *low*; HEAT Virtual *off*, *Target* 20, fan *low*).
           - *Do*: press *heat*.
           - *Expect*: *Min / max* 8 / 25: HEAT Virtual goes up to 30, `max_temp` narrows it.
        4. **Target** (ENT-TGT-7, SRC-SET-2)
           - *From*: after 3 (*heat*, target 20).
           - *Do*: set the target to 22.
           - *Expect*: HEAT Virtual: *Target* 22.
        5. **Own value during the settle time** (SRC-SET-5, SRC-SET-6, §5.3)
           - *From*: **Start** (Adaptative HEAT *off*, target 20, fan *low*; HEAT Virtual *off*, *Target* 20, fan *low*).
           - *Do*: set the target to 21 (in *off*, it sets the target of *heat*). Press *heat*; within 12 s, on HEAT Virtual, *Target* 26.
           - *Expect*: Adaptative HEAT stays at 21. After the 12 s, HEAT Virtual: *Target* back to 21.

        </small>
- title: HEAT 2
  path: heat-2
  type: sections
  max_columns: 3
  sections:
  - *heat_1
  - *heat_2
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Adaptative HEAT — takeover on the device

        **Who is who**
        - **Adaptative HEAT**: the entity under test, `max_temp` 25. Its source: HEAT Virtual.
        - **HEAT Virtual**: *heat*, 8–30 °C, fan *low*/*high*. Its helpers play its remote (*Mode*, *Target*, *Fan*) and its failures (*Available*, *Unknown*, *Obeys the mode*, *Applies settings*, *Offers heat*).

        **Start**
        - Press **Reset the sources**: HEAT Virtual *off*, *Target* 20, *Temperature* 20, fan *low*, every switch back to normal.
        - On *Adaptative HEAT*, press *heat*, set the target to 20 and the fan to *low*, then press *off*.

        Delays of the tests: mode confirmation 10 s, next try 30 s, monitoring 15 s, removal confirmation 20 s.

        1. **Turned on on the device** (SRC-STATE-5, SRC-SET-11)
           - *From*: **Start** (Adaptative HEAT *off*, target 20, fan *low*; HEAT Virtual *off*, *Target* 20, fan *low*).
           - *Do*: on HEAT Virtual, *Target* 19, then *Mode* *heat*.
           - *Expect*: Adaptative HEAT goes to *heat* and shows 19. Nothing is sent to HEAT Virtual.
        2. **Target changed on the device** (SRC-SET-11, ENT-TGT-9)
           - *From*: after 1 (*heat*, 19).
           - *Do*: wait 12 s; on HEAT Virtual, *Target* 23.
           - *Expect*: Adaptative HEAT shows 23.
        3. **Beyond the limit** (ENT-TGT-3, ENT-TGT-12, ENT-TGT-13)
           - *From*: after 2 (*heat*, 23).
           - *Do*: on HEAT Virtual, *Target* 28.
           - *Expect*: Adaptative HEAT shows 25. *Target gaps*: saved 28, shown 25. *Saved targets*: single 28 (T, the target of *heat*; Adaptative HEAT uses no low/high).
        4. **Gap gone** (ENT-TGT-13)
           - *From*: after 3 (*heat*, 25 shown, 28 saved).
           - *Do*: on *Adaptative HEAT*, set the target to 22.
           - *Expect*: *Target gaps* empty. HEAT Virtual: *Target* 22.

        </small>
- title: HEAT 3
  path: heat-3
  type: sections
  max_columns: 3
  sections:
  - *heat_1
  - *heat_2
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Adaptative HEAT — fan

        **Who is who**
        - **Adaptative HEAT**: the entity under test, `max_temp` 25. Its source: HEAT Virtual.
        - **HEAT Virtual**: *heat*, 8–30 °C, fan *low*/*high*. Its helpers play its remote (*Mode*, *Target*, *Fan*) and its failures (*Available*, *Unknown*, *Obeys the mode*, *Applies settings*, *Offers heat*).

        **Start**
        - Press **Reset the sources**: HEAT Virtual *off*, *Target* 20, *Temperature* 20, fan *low*, every switch back to normal.
        - On *Adaptative HEAT*, press *heat*, set the target to 20 and the fan to *low*, then press *off*.

        Delays of the tests: mode confirmation 10 s, next try 30 s, monitoring 15 s, removal confirmation 20 s.

        1. **Fan of the source** (ENT-FANV-5)
           - *From*: **Start** (Adaptative HEAT *off*, target 20, fan *low*; HEAT Virtual *off*, *Target* 20, fan *low*).
           - *Do*: stop Home Assistant; `tests/integration/manual/reset_memory.sh heat`; start Home Assistant; on *Adaptative HEAT*, press *heat*.
           - *Expect*: nothing remembered: Adaptative HEAT takes the fan of HEAT Virtual, *low*.
        2. **Fan remembered** (ENT-FANV-1, ENT-FANV-6)
           - *From*: after 1 (*heat*, fan *low*).
           - *Do*: fan *high*; press *off*; on HEAT Virtual, *Fan* *low*; on *Adaptative HEAT*, press *heat*.
           - *Expect*: HEAT Virtual: *Fan* back to *high*.
        3. **Fan of the device ignored in off** (ENT-FAN-3)
           - *From*: **Start** (Adaptative HEAT *off*, target 20, fan *low*; HEAT Virtual *off*, *Target* 20, fan *low*).
           - *Do*: on HEAT Virtual, *Fan* *high*.
           - *Expect*: ignored: Adaptative HEAT, *off*, still shows the fan *low* (the fan of *heat*, its only mode).
        4. **Fan chosen in off** (ENT-FAN-3, ENT-FANV-9)
           - *From*: after 3 (Adaptative HEAT *off*, fan *low*; HEAT Virtual fan *high*).
           - *Do*: on HEAT Virtual, *Fan* *low*; on *Adaptative HEAT*, fan *high*.
           - *Expect*: Adaptative HEAT shows *high*. Nothing is sent: HEAT Virtual stays *low*.
        5. **Sent with the mode** (ENT-FANV-9)
           - *From*: after 4 (Adaptative HEAT *off*, fan *high*; HEAT Virtual fan *low*).
           - *Do*: press *heat*.
           - *Expect*: HEAT Virtual: *Fan* *high*.

        </small>
- title: HEAT 4
  path: heat-4
  type: sections
  max_columns: 3
