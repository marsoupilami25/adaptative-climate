# Case manual: an entry created from the UI.
# YAML dashboard: after editing this file, refresh the page in the browser.
title: Tests manual
views:
- title: Creation
  path: pilotage
  type: sections
  max_columns: 2
  sections:
  - &adaptative_1
    type: grid
    cards:
    - type: custom:adaptative-climate-card
      entity: climate.adaptative_manual
      name: Adaptative Manual
      features:
      - type: ac-device
      - type: ac-hvac-modes
      - type: ac-fan-modes
      - type: ac-swing-modes
      - type: ac-swing-horizontal-modes
    - type: glance
      title: Adaptative Manual monitoring
      show_state: true
      state_color: true
      entities:
      - entity: binary_sensor.adaptative_manual_monitoring_sources
        name: Monitoring sources
      - entity: binary_sensor.adaptative_manual_monitoring_temperatures
        name: Monitoring temperatures
    - type: markdown
      text_only: true
      content: |-
        {% set e = 'climate.adaptative_manual' %}{% set problems = (state_attr('binary_sensor.adaptative_manual_monitoring_sources', 'problems') or []) + (state_attr('binary_sensor.adaptative_manual_monitoring_temperatures', 'problems') or []) %}
        **Problems**: {{ 'none' if not problems else '' }}
        {% for p in problems %}
        - {{ p.type }}: {{ p.get('source') or p.get('sources') or p.get('sensor') or '' }}{{ (' ' ~ p.get('setting')) if p.get('setting') else '' }}
        {% endfor %}

        | | |
        |:--|:--|
        | Action | {{ state_attr(e, 'hvac_action') }} |
        | Active source | {{ state_attr(e, 'active_entity_id') }} |
        | Reference temperature | {{ state_attr(e, 'current_temperature') }} |
        | Step | {{ state_attr(e, 'target_temp_step') }} |
        | Target | {{ state_attr(e, 'temperature') }} |
        | Low / high | {{ state_attr(e, 'target_temp_low') }} / {{ state_attr(e, 'target_temp_high') }} |
        | Min gap | {{ state_attr(e, 'min_gap') }} |
        | Min / max | {{ state_attr(e, 'min_temp') }} / {{ state_attr(e, 'max_temp') }} |
        | Phase | {{ state_attr(e, 'phase') }} |
        | Unavailable modes | {{ state_attr(e, 'unavailable_modes') }} |
        | Foreign modes | {{ state_attr(e, 'foreign_modes') }} |
        | Target gaps | {{ state_attr(e, 'target_gaps') }} |
        | Saved targets | {{ state_attr(e, 'saved_targets') }} |
        | Saved fan/swing | {{ state_attr(e, 'saved_settings') }} |
    - type: entities
      title: Room sensor
      state_color: true
      entities:
      - entity: input_number.room_temperature_manual
        name: Room temperature
      - entity: input_boolean.room_sensor_available_manual
        name: Room sensor available
      - entity: sensor.room_sensor_manual
        name: Read by Adaptative Manual
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Creation

        **Who is who**
        - **Adaptative Manual**: the entity under test, created from the UI: no entity is declared in the YAML.
        - **The sources**, on the view *Sources*: each measures the room (*Room temperature*) plus its *Offset*. HEAT Virtual also shows *External temperature (written by Adaptative Manual)*: the entity *External temperature HEAT*, once it is the `heat_external_sensor`.
        - **Room sensor**: the room thermometer, the entity *Room sensor (manual)*. *Room sensor available* off makes it unavailable; *Read by Adaptative Manual*: what the entity sees.

        **Start**
        - On the view *Sources*, press **Reset the sources**: every source *off*, *Target* 20, *Offset* 0; *Room temperature* 20, room sensor available.
        - Adaptative Manual does not exist: never created, or deleted (view *Reload and deletion*, 2).

        Delays of the tests: mode confirmation 10 s, next try 30 s, monitoring 15 s, removal confirmation 20 s.

        1. **Creation** (§3)
           - *From*: **Start** (no Adaptative Manual).
           - *Do*: *Settings > Devices & services > Helpers > Create helper > Adaptative Climate*: name **Adaptative Manual**; *heat*: HEAT Virtual (manual); *cool*: COOL Virtual (manual); the delays of the tests (above).
           - *Expect*: Adaptative Manual lists *off*, *heat*, *cool*, *heat_cool*.
        2. **Refused** (CFG-CHECK-1)
           - *From*: after 1 (Adaptative Manual exists).
           - *Do*: create another entry, in turn: named `adaptative manual`; with *heat*: COOL Virtual; with an external sensor and no room sensor; with next try 10 s and confirmation 30 s.
           - *Expect*: each one is refused (COOL Virtual does not offer *heat*).
        3. **Options** (CFG-YAML-4, ENT-INIT-4)
           - *From*: after 1 (Adaptative Manual *off*).
           - *Do*: on *Adaptative Manual*, press *heat*; open its options, add the room sensor (*Room sensor (manual)*).
           - *Expect*: the entry reloads: Adaptative Manual is *off*, HEAT Virtual goes to *off*.
        4. **Remove a mode** (CFG-YAML-4, ENT-HVAC-1)
           - *From*: after 3 (with the room sensor).
           - *Do*: in its options, clear *cool*.
           - *Expect*: no more *cool* nor *heat_cool*.

        </small>
- title: Options
  path: options
  type: sections
  max_columns: 2
  sections:
  - *adaptative_1
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## External sensor, other entries

        **Who is who**
        - **Adaptative Manual**: the entity under test, created from the UI: no entity is declared in the YAML.
        - **The sources**, on the view *Sources*: each measures the room (*Room temperature*) plus its *Offset*. HEAT Virtual also shows *External temperature (written by Adaptative Manual)*: the entity *External temperature HEAT*, once it is the `heat_external_sensor`.
        - **Room sensor**: the room thermometer, the entity *Room sensor (manual)*. *Room sensor available* off makes it unavailable; *Read by Adaptative Manual*: what the entity sees.

        **Start**
        - On the view *Sources*, press **Reset the sources**: every source *off*, *Target* 20, *Offset* 0; *Room temperature* 20, room sensor available.
        - Adaptative Manual does not exist: never created, or deleted (view *Reload and deletion*, 2).

        Delays of the tests: mode confirmation 10 s, next try 30 s, monitoring 15 s, removal confirmation 20 s.

        1. **External sensor** (ENT-EXT-1, CFG-SENS-2)
           - *From*: Adaptative Manual created (view *Creation*, 1): *heat* on HEAT Virtual, *cool* on COOL Virtual, with the room sensor (view *Creation*, 3).
           - *Do*: in the options of Adaptative Manual, `heat_external_sensor` (*Heat external sensor*): *External temperature HEAT*; save.
           - *Expect*: accepted. An external sensor is an entity of the device into which Adaptative Manual writes the room temperature, so that the device regulates on the room.
        2. **Room temperature written** (ENT-EXT-1)
           - *From*: after 1 (the external sensor set).
           - *Do*: *Room temperature* 21.3.
           - *Expect*: HEAT Virtual: *External temperature* 21.5 (its step, 0.5).
        3. **No offset with an external sensor** (CFG-SENS-2)
           - *From*: after 2.
           - *Do*: in the options, `heat_offset` (*Heat offset*) 1, the external sensor kept; save.
           - *Expect*: refused: an offset would have no effect.
        4. **One source for several modes** (CFG-SENS-4)
           - *From*: Adaptative Manual created (view *Creation*, 1): *heat* on HEAT Virtual, *cool* on COOL Virtual.
           - *Do*: in the options, *heat* and *cool* on ALL Virtual, with different offsets; save.
           - *Expect*: refused; the error names both modes.
        5. **The YAML entries cannot be changed from the UI** (CFG-YAML-3)
           - *From*: Adaptative Manual created (view *Creation*, 1): *heat* on HEAT Virtual, *cool* on COOL Virtual.
           - *Do*: *Settings > Devices & services > Adaptative Climate*.
           - *Expect*: Adaptative Manual has a *Configure* button (its options); Adaptative HEAT has none: `configuration.yaml` is its reference, a change made in the UI would be overwritten at the next start.

        </small>
- title: Reload and deletion
  path: reload
  type: sections
  max_columns: 2
  sections:
  - *adaptative_1
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |-
        <small>

        ## Reload and deletion

        **Who is who**
        - **Adaptative Manual**: the entity under test, created from the UI: no entity is declared in the YAML.
        - **The sources**, on the view *Sources*: each measures the room (*Room temperature*) plus its *Offset*. HEAT Virtual also shows *External temperature (written by Adaptative Manual)*: the entity *External temperature HEAT*, once it is the `heat_external_sensor`.
        - **Room sensor**: the room thermometer, the entity *Room sensor (manual)*. *Room sensor available* off makes it unavailable; *Read by Adaptative Manual*: what the entity sees.

        **Start**
        - On the view *Sources*, press **Reset the sources**: every source *off*, *Target* 20, *Offset* 0; *Room temperature* 20, room sensor available.
        - Adaptative Manual does not exist: never created, or deleted (view *Reload and deletion*, 2).

        Delays of the tests: mode confirmation 10 s, next try 30 s, monitoring 15 s, removal confirmation 20 s.

        1. **Reload without change** (ENT-INIT-4)
           - *From*: Adaptative Manual created (view *Creation*, 1): *heat* on HEAT Virtual, *cool* on COOL Virtual, *off*.
           - *Do*: on *Adaptative Manual*, press *heat*; then *Settings > Devices & services > Adaptative Climate*, the ⋮ menu of Adaptative Manual, *Reload*.
           - *Expect*: it comes back in *heat*; HEAT Virtual stays in *heat*. Without a change of its options, a reload is a restart: the mode is resumed (an options change starts it *off*: view *Creation*, 3).
        2. **Deletion** (END-3)
           - *From*: after 1 (*heat*).
           - *Do*: delete the entry.
           - *Expect*: HEAT Virtual stays in *heat*: nothing drives it any more. The **Start** of the view *Creation* holds again.

        </small>
