# Home Assistant configuration for the manual tests of Adaptative Climate.
# Linked into a dev config folder by tests/integration/manual/link_config.sh (see tests/integration/manual/README.md).

# Loads default set of integrations. Do not remove.
default_config:

homeassistant:
  # Virtual source entities and their helpers, one package per case.
  packages: !include_dir_named packages

lovelace:
  dashboards:
    tests-mono:
      mode: yaml
      filename: dashboards/mono.yaml
      title: Tests mono-mode
      icon: mdi:numeric-1-box-outline
      show_in_sidebar: true
    tests-bi:
      mode: yaml
      filename: dashboards/bi.yaml
      title: Tests bi-source
      icon: mdi:sun-snowflake-variant
      show_in_sidebar: true
    tests-multi:
      mode: yaml
      filename: dashboards/multi.yaml
      title: Tests multi-sources
      icon: mdi:view-grid-outline
      show_in_sidebar: true
    tests-unique:
      mode: yaml
      filename: dashboards/unique.yaml
      title: Tests single source
      icon: mdi:checkbox-blank-outline
      show_in_sidebar: true
    tests-monitor:
      mode: yaml
      filename: dashboards/monitor.yaml
      title: Tests monitoring
      icon: mdi:alert-circle-outline
      show_in_sidebar: true
    tests-manual:
      mode: yaml
      filename: dashboards/manual.yaml
      title: Tests manual
      icon: mdi:hand-back-right-outline
      show_in_sidebar: true

# Entities under test, imported as config entries at startup (spec §3.2).
# Each case has its own virtual sources (packages/sources_<case>.yaml).
# Every entry shares the short delays of the manual tests (anchor `test_delays`).
adaptative_climate:
  # --- Case mono: one entity per mode, each with its own source ----------------------
  - name: Adaptative HEAT
    heat_entity: climate.heat_virtual_mono
    max_temp: 25
    # Delays of the manual tests, instead of the defaults (monitoring 900 s,
    # confirmation of a mode 30 s, next try 300 s, removal confirmation 60 s).
    # A setting not applied still waits 30 s at least (spec MON-SRC-4).
    <<: &test_delays
      monitoring_delay_timer: 15
      request_confirmation_timer: 10
      request_retry_timer: 30
      removal_confirmation_timer: 20
  - name: Adaptative COOL
    cool_entity: climate.cool_virtual_mono
    <<: *test_delays
  - name: Adaptative DEHUM
    dry_entity: climate.dehum_virtual_mono
    <<: *test_delays
  - name: Adaptative FAN_ONLY
    fan_only_entity: climate.fan_only_virtual_mono
    <<: *test_delays
  - name: Adaptative AUTO
    auto_entity: climate.auto_virtual_mono
    <<: *test_delays
  - name: Adaptative HEAT_COOL
    heat_cool_entity: climate.heat_cool_virtual_mono
    min_gap: 2
    <<: *test_delays
  # The heat pump reads 2 degrees warmer than the room, in both modes (CFG-SENS-4).
  - name: Adaptative OFFSET
    heat_entity: climate.heatpump_virtual_mono
    dry_entity: climate.heatpump_virtual_mono
    heat_offset: 2
    dry_offset: 2
    max_temp: 26
    <<: *test_delays
  # The valve gets the room temperature (its offset is then 0, CFG-SENS-2).
  - name: Adaptative TRV
    heat_entity: climate.trv_virtual_mono
    temperature_sensor: sensor.room_sensor_mono
    heat_external_sensor: input_number.external_temperature_mono
    external_sensor_resend_timer: 60
    <<: *test_delays

  # --- Case bi: heat_cool on two sources -------------------------------------------
  - name: Adaptative BI
    heat_entity: climate.radiator_virtual_bi
    cool_entity: climate.aircon_virtual_bi
    temperature_sensor: sensor.room_sensor_bi
    min_gap: 2
    <<: *test_delays

  # --- Case multi: one source per mode ----------------------------------------------
  - name: Adaptative MULTI
    heat_entity: climate.heat_virtual_multi
    cool_entity: climate.cool_virtual_multi
    dry_entity: climate.dry_virtual_multi
    fan_only_entity: climate.fan_only_virtual_multi
    auto_entity: climate.auto_virtual_multi
    temperature_sensor: sensor.room_sensor_multi
    sync_modes: [heat, cool, dry]
    <<: *test_delays

  # --- Case unique: every mode on one source ------------------------------------------
  - name: Adaptative ALL
    heat_entity: climate.all_virtual_unique
    cool_entity: climate.all_virtual_unique
    heat_cool_entity: climate.all_virtual_unique
    auto_entity: climate.all_virtual_unique
    dry_entity: climate.all_virtual_unique
    fan_only_entity: climate.all_virtual_unique
    sync_modes: [heat, cool, dry]
    <<: *test_delays

  # --- Case monitor: the monitoring --------------------------------------------------
  - name: Adaptative MONITOR
    heat_entity: climate.radiator_virtual_monitor
    cool_entity: climate.aircon_virtual_monitor
    temperature_sensor: sensor.room_sensor_monitor
    <<: *test_delays
  # A source that never exists (MON-SRC-5).
  - name: Adaptative GHOST
    heat_entity: climate.ghost_monitor
    <<: *test_delays

  # --- Case manual: created from the UI (dashboard "Tests manual") ------------------

logger:
  default: warning
  logs:
    custom_components.adaptative_climate: debug

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
