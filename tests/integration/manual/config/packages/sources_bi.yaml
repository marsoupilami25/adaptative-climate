# Virtual sources of the case "bi" (Tests bi-source).
# Generated once, then edited by hand. Every entity id ends with _bi.
#
# Each source shows the state of its helpers; the service calls of Home
# Assistant change them, when the source obeys (see tests/integration/manual/README.md).

template:
  - climate:
      - name: RADIATOR Virtual (bi)
        unique_id: radiator_virtual_bi
        default_entity_id: climate.radiator_virtual_bi
        # Off: offers no mode but off (a served mode lost, SRC-UNUS-2)
        hvac_modes: >-
          {{ ['off', 'heat', 'fan_only'] if is_state('input_boolean.offers_radiator_bi', 'on') else ['off'] }}
        # Unknown: the state is unknown
        hvac_mode: >-
          {{ none if is_state('input_boolean.unknown_radiator_bi', 'on') else states('input_select.mode_radiator_bi') }}
        availability: "{{ is_state('input_boolean.available_radiator_bi', 'on') }}"
        min_temperature: 5
        max_temperature: 30
        current_temperature: "{% set r = states('input_number.room_temperature_bi') | float(none) %}{{ none if r is none else (r + states('input_number.offset_radiator_bi') | float(0)) | round(1) }}"
        target_temperature: "{{ states('input_number.target_radiator_bi') | float(none) }}"
        hvac_action: >-
          {% set m = states('input_select.mode_radiator_bi') %}
          {% set t = states('input_number.room_temperature_bi') | float(20) + states('input_number.offset_radiator_bi') | float(0) %}
          {% set c = states('input_number.target_radiator_bi') | float(20) %}
          {% if m == 'off' %}off{% elif m == 'dry' %}drying{% elif m == 'fan_only' %}fan{% elif m == 'heat' %}{{ 'heating' if t < c else 'idle' }}{% elif m == 'cool' %}{{ 'cooling' if t > c else 'idle' }}{% else %}{{ 'heating' if t < c else 'cooling' if t > c else 'idle' }}{% endif %}
        set_hvac_mode:
          - condition: state
            entity_id: input_boolean.obeys_radiator_bi
            state: "on"
          - delay:
              seconds: "{{ states('input_number.delay_radiator_bi') | int(0) }}"
          - action: input_select.select_option
            target:
              entity_id: input_select.mode_radiator_bi
            data:
              option: "{{ hvac_mode }}"
        set_temperature:
          - condition: state
            entity_id: input_boolean.applies_radiator_bi
            state: "on"
          - if: "{{ temperature is defined and temperature is not none }}"
            then:
              - action: input_number.set_value
                target:
                  entity_id: input_number.target_radiator_bi
                data:
                  value: "{{ temperature }}"
      - name: AIRCON Virtual (bi)
        unique_id: aircon_virtual_bi
        default_entity_id: climate.aircon_virtual_bi
        # Off: offers no mode but off (a served mode lost, SRC-UNUS-2)
        hvac_modes: >-
          {{ ['off', 'cool'] if is_state('input_boolean.offers_aircon_bi', 'on') else ['off'] }}
        # Unknown: the state is unknown
        hvac_mode: >-
          {{ none if is_state('input_boolean.unknown_aircon_bi', 'on') else states('input_select.mode_aircon_bi') }}
        availability: "{{ is_state('input_boolean.available_aircon_bi', 'on') }}"
        min_temperature: 16
        max_temperature: 30
        target_temperature_step: 1
        current_temperature: "{% set r = states('input_number.room_temperature_bi') | float(none) %}{{ none if r is none else (r + states('input_number.offset_aircon_bi') | float(0)) | round(1) }}"
        target_temperature: "{{ states('input_number.target_aircon_bi') | float(none) }}"
        hvac_action: >-
          {% set m = states('input_select.mode_aircon_bi') %}
          {% set t = states('input_number.room_temperature_bi') | float(20) + states('input_number.offset_aircon_bi') | float(0) %}
          {% set c = states('input_number.target_aircon_bi') | float(20) %}
          {% if m == 'off' %}off{% elif m == 'dry' %}drying{% elif m == 'fan_only' %}fan{% elif m == 'heat' %}{{ 'heating' if t < c else 'idle' }}{% elif m == 'cool' %}{{ 'cooling' if t > c else 'idle' }}{% else %}{{ 'heating' if t < c else 'cooling' if t > c else 'idle' }}{% endif %}
        fan_modes: >-
          {{ state_attr('input_select.fan_aircon_bi', 'options') if is_state('input_boolean.fan_on_aircon_bi', 'on') else [] }}
        fan_mode: >-
          {{ states('input_select.fan_aircon_bi') if is_state('input_boolean.fan_on_aircon_bi', 'on') else none }}
        set_hvac_mode:
          - condition: state
            entity_id: input_boolean.obeys_aircon_bi
            state: "on"
          - delay:
              seconds: "{{ states('input_number.delay_aircon_bi') | int(0) }}"
          - action: input_select.select_option
            target:
              entity_id: input_select.mode_aircon_bi
            data:
              option: "{{ hvac_mode }}"
        set_temperature:
          - condition: state
            entity_id: input_boolean.applies_aircon_bi
            state: "on"
          - if: "{{ temperature is defined and temperature is not none }}"
            then:
              - action: input_number.set_value
                target:
                  entity_id: input_number.target_aircon_bi
                data:
                  value: "{{ temperature }}"
        set_fan_mode:
          - condition: state
            entity_id: input_boolean.applies_aircon_bi
            state: "on"
          - action: input_select.select_option
            target:
              entity_id: input_select.fan_aircon_bi
            data:
              option: "{{ fan_mode }}"
  - sensor:
      - name: Room sensor (bi)
        unique_id: room_sensor_bi
        default_entity_id: sensor.room_sensor_bi
        device_class: temperature
        unit_of_measurement: "°C"
        state: "{{ states('input_number.room_temperature_bi') }}"
        availability: "{{ is_state('input_boolean.room_sensor_available_bi', 'on') }}"

input_select:
  mode_radiator_bi:
    name: Mode RADIATOR
    options: ['off', 'heat', 'fan_only']
    icon: mdi:hvac
  mode_aircon_bi:
    name: Mode AIRCON
    options: ['off', 'cool']
    icon: mdi:hvac
  fan_aircon_bi:
    name: Fan AIRCON
    options: ['auto', 'low', 'high']
    icon: mdi:fan

input_number:
  target_radiator_bi:
    name: Target RADIATOR
    min: 5
    max: 30
    step: 0.5
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:thermometer-check
  offset_radiator_bi:
    name: Offset RADIATOR
    min: -10
    max: 10
    step: 0.1
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:thermometer-plus
  delay_radiator_bi:
    name: Delay RADIATOR
    min: 0
    max: 120
    step: 1
    unit_of_measurement: "s"
    mode: box
    icon: mdi:timer-sand
    initial: 0
  target_aircon_bi:
    name: Target AIRCON
    min: 16
    max: 30
    step: 1
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:thermometer-check
  offset_aircon_bi:
    name: Offset AIRCON
    min: -10
    max: 10
    step: 0.1
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:thermometer-plus
  delay_aircon_bi:
    name: Delay AIRCON
    min: 0
    max: 120
    step: 1
    unit_of_measurement: "s"
    mode: box
    icon: mdi:timer-sand
    initial: 0
  room_temperature_bi:
    name: Room temperature
    min: 0
    max: 40
    step: 0.1
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:thermometer

input_boolean:
  available_radiator_bi:
    name: RADIATOR available
    initial: true
    icon: mdi:power-plug
  unknown_radiator_bi:
    name: RADIATOR unknown
    initial: false
    icon: mdi:help-circle-outline
  obeys_radiator_bi:
    name: RADIATOR obeys the mode
    initial: true
    icon: mdi:check-circle-outline
  applies_radiator_bi:
    name: RADIATOR applies the settings
    initial: true
    icon: mdi:tune-variant
  offers_radiator_bi:
    name: RADIATOR offers its modes
    initial: true
    icon: mdi:format-list-checks
  available_aircon_bi:
    name: AIRCON available
    initial: true
    icon: mdi:power-plug
  unknown_aircon_bi:
    name: AIRCON unknown
    initial: false
    icon: mdi:help-circle-outline
  obeys_aircon_bi:
    name: AIRCON obeys the mode
    initial: true
    icon: mdi:check-circle-outline
  applies_aircon_bi:
    name: AIRCON applies the settings
    initial: true
    icon: mdi:tune-variant
  offers_aircon_bi:
    name: AIRCON offers its modes
    initial: true
    icon: mdi:format-list-checks
  fan_on_aircon_bi:
    name: Fan AIRCON on
    initial: true
    icon: mdi:fan
  room_sensor_available_bi:
    name: Room sensor available
    initial: true
    icon: mdi:power-plug

script:
  reset_sources_bi:
    alias: Reset the sources (bi)
    icon: mdi:restore
    sequence:
      - action: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.available_radiator_bi
            - input_boolean.obeys_radiator_bi
            - input_boolean.applies_radiator_bi
            - input_boolean.offers_radiator_bi
            - input_boolean.available_aircon_bi
            - input_boolean.obeys_aircon_bi
            - input_boolean.applies_aircon_bi
            - input_boolean.offers_aircon_bi
            - input_boolean.fan_on_aircon_bi
            - input_boolean.room_sensor_available_bi
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.unknown_radiator_bi
            - input_boolean.unknown_aircon_bi
      - action: input_select.select_option
        target:
          entity_id:
            - input_select.mode_radiator_bi
            - input_select.mode_aircon_bi
        data:
          option: "off"
      - action: input_select.select_option
        target:
          entity_id: input_select.fan_aircon_bi
        data:
          option: "auto"
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.room_temperature_bi
        data:
          value: 20
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.offset_radiator_bi
            - input_number.offset_aircon_bi
        data:
          value: 0
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.target_radiator_bi
            - input_number.target_aircon_bi
        data:
          value: 20
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.delay_radiator_bi
            - input_number.delay_aircon_bi
        data:
          value: 0
